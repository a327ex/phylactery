.uHud.value = p.hud;\r\n    hud_tex.needsUpdate = true;\r\n    pass(final_mat, rt_final);\r\n    // upscale to the canvas\r\n    resize();\r\n    renderer.setRenderTarget(null);\r\n    renderer.setViewport(0, 0, view.bw, view.bh);\r\n    renderer.setClearColor(0x000000, 1);\r\n    renderer.clear(true, false, false);\r\n    renderer.setViewport(view.x, view.y, view.w, view.h);\r\n    up_mat.uniforms.uOut.value.set(view.w, view.h);\r\n    up_mat.uniforms.uSharp.value = p.upscale === 'nearest' ? 0 : 1;\r\n    quad.material = up_mat;\r\n    renderer.autoClear = false;\r\n    renderer.render(pass_scene, pass_cam);\r\n    renderer.autoClear = true;\r\n    renderer.setViewport(0, 0, view.bw, view.bh);\r\n  }\r\n\r\n  // window pixel -> game pixel (for anything that needs it)\r\n  function to_game_px(cx, cy) {\r\n    const dpr = window.devicePixelRatio || 1;\r\n    return [((cx*dpr - view.x)/view.w)*W, ((cy*dpr - view.y)/view.h)*H];\r\n  }\r\n\r\n  return {\r\n    renderer, canvas, W, H, world_scene, world_camera, view_scene, view_camera,\r\n    hud_canvas, hud_tex, params, hooks, hook_uniforms, rebuild, render, resize, view, to_game_px,\r\n    set_shadow_light(l) { params.shafts.light = l; },\r\n    targets: { rt_world, rt_view, rt_final },\r\n  };\r\n}\r\n","game/snakes.js":"// snakes.js -- PLACEHOLDER snakes for round 1 (the look and the camera are being judged, not the\r\n// snakes). Each snake is a chain of spheres following its head's trail (SNKRX's follow rule),\r\n// slithering from the cave's edge toward the egg; within reach of the lich it shrinks away and\r\n// a new one comes out of the dark. No attacks are drawn yet.\r\nimport * as THREE from 'three';\r\nimport { make_rng, clamp } from 'game/util.js';\r\nimport * as TX from 'game/textures.js';\r\nimport { gi_dynamic } from 'game/gi.js';\r\n\r\nconst SEGS = 32, SPACING = 0.14, MAX_R = 0.19;\r\nconst radius_at = i => {\r\n  const t = i/(SEGS - 1);\r\n  return MAX_R*(t \u003c 0.18 ? 0.8 + t/0.18*0.2 : 1 - Math.pow((t - 0.18)/0.82, 1.4)*0.8);\r\n};\r\n\r\nexport function create_snakes(R, cave, get_lich_pos, count = 9, seed = 5) {\r\n  const rng = make_rng(seed);\r\n  const mat = new THREE.MeshLambertMaterial({ map: TX.scales(41), color: 0xffffff });\r\n  // a faint warm rim so a body reads against the black when little light reaches it\r\n  mat.onBeforeCompile = (sh) => {\r\n    sh.fragmentShader = sh.fragmentShader.replace('#include \u003cemissivemap_fragment>', `#include \u003cemissivemap_fragment>\r\n      totalEmissiveRadiance += vec3(0.09, 0.062, 0.034)*pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.5);`);\r\n  };\r\n  if (cave.GU) gi_dynamic(mat, cave.GU);\r\n  const body_geo = new THREE.SphereGeometry(1, 10, 7);\r\n  const body = new THREE.InstancedMesh(body_geo, mat, count*SEGS);\r\n  body.castShadow = true; body.receiveShadow = true;\r\n  const head_geo = new THREE.SphereGeometry(1, 10, 7);\r\n  const heads = new THREE.InstancedMesh(head_geo, mat, count);\r\n  heads.castShadow = true; heads.receiveShadow = true;\r\n  const eye_mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.0, 1.1) });\r\n  const eyes = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 5, 4), eye_mat, count*2);\r\n  for (const m of [body, heads, eyes]) { m.frustumCulled = false; R.world_scene.add(m); }\r\n\r\n  const S = [];\r\n  const spawn = (s, delay) => {\r\n    // out of the dark at the chamber's edge, anywhere but the tunnel mouth\r\n    let th;\r\n    do th = rng.float(0, Math.PI*2); while (Math.abs(Math.atan2(Math.sin(th + Math.PI/2), Math.cos(th + Math.PI/2))) \u003c 0.5);\r\n    const r = rng.float(14.5, 16.0);\r\n    s.x = Math.cos(th)*r; s.z = Math.sin(th)*r;\r\n    s.dir = Math.atan2(-s.z, -s.x) + rng.spread(0.4);\r\n    s.phase = rng.float(0, 6.28); s.speed = rng.float(1.3, 1.9); s.freq = rng.float(2.2, 3.0);\r\n    s.trail = [];\r\n    for (let i = 0; i \u003c SEGS*SPACING/0.02 + 2; i++) s.trail.push([s.x - Math.cos(s.dir)*i*0.02, s.z - Math.sin(s.dir)*i*0.02]);\r\n    s.dying = -1; s.delay = delay; s.scale = 1;\r\n  };\r\n  for (let i = 0; i \u003c count; i++) { const s = {}; spawn(s, i*0.9); S.push(s); }\r\n\r\n  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);\r\n  const egg = cave.egg.position;\r\n\r\n  function update(t, dt) {\r\n    const L = get_lich_pos();\r\n    for (const s of S) {\r\n      if (s.delay > 0) { s.delay -= dt; continue; }\r\n      if (s.dying >= 0) {\r\n        s.dying += dt;\r\n        s.scale = clamp(1 - s.dying/0.4, 0, 1);\r\n        if (s.dying > 0.4) spawn(s, rng.float(0.2, 1.4));\r\n        continue;\r\n      }\r\n      // steer toward the egg with a slither\r\n      const want = Math.atan2(egg.z - s.z, egg.x - s.x) + Math.sin(t*s.freq + s.phase)*0.75;\r\n      let d = want - s.dir; d = Math.atan2(Math.sin(d), Math.cos(d));\r\n      s.dir += clamp(d, -3.2*dt, 3.2*dt);\r\n      s.x += Math.cos(s.dir)*s.speed*dt; s.z += Math.sin(s.dir)*s.speed*dt;\r\n      s.trail.unshift([s.x, s.z]);\r\n      if (s.trail.length > 400) s.trail.length = 400;\r\n      // the placeholder \"attack\": anything within reach of the lich, or at the egg, dissolves\r\n      const dl = Math.hypot(s.x - L.x, s.z - L.z), de = Math.hypot(s.x - egg.x, s.z - egg.z);\r\n      if (dl \u003c 3.4 || de \u003c 2.4) s.dying = 0;\r\n    }\r\n    // draw\r\n    let bi = 0;\r\n    for (let k = 0; k \u003c S.length; k++) {\r\n      const s = S[k];\r\n      const hide = s.delay > 0;\r\n      // walk the trail by arc length\r\n      let acc = 0, ti = 0;\r\n      const pts = [];\r\n      let prev = s.trail[0];\r\n      pts.push(prev);\r\n      for (let i = 1; i \u003c SEGS; i++) {\r\n        const target = i*SPACING;\r\n        while (ti \u003c s.trail.length - 1) {\r\n          const a = s.trail[ti], b = s.trail[ti + 1];\r\n          const l = Math.hypot(b[0] - a[0], b[1] - a[1]);\r\n          if (acc + l >= target) { const f = (target - acc)/(l || 1); pts.push([a[0] + (b[0] - a[0])*f, a[1] + (b[1] - a[1])*f]); break; }\r\n          acc += l; ti++;\r\n        }\r\n        if (pts.length \u003c= i) pts.push(s.trail[s.trail.length - 1]);\r\n      }\r\n      for (let i = 0; i \u003c SEGS; i++) {\r\n        const r = radius_at(i)*s.scale*(hide ? 0 : 1);\r\n        const [x, z] = pts[i];\r\n        p.set(x, cave.ground_y(x, z) + r*0.85, z);\r\n        sc.set(r, r*0.9, r);\r\n        m4.compose(p, q.identity(), sc);\r\n        body.setMatrixAt(bi++, m4);\r\n      }\r\n      // head: an elongated wedge pointing along the travel direction, eyes on top\r\n      const [hx, hz] = pts[0];\r\n      const yaw = Math.atan2(hx - pts[2][0], hz - pts[2][1]);\r\n      const hr = MAX_R*1.05*s.scale*(hide ? 0 : 1);\r\n      const hy = cave.ground_y(hx, hz) + hr*1.0;\r\n      q.setFromAxisAngle(up, yaw);\r\n      p.set(hx + Math.sin(yaw)*0.1, hy, hz + Math.cos(yaw)*0.1);\r\n      sc.set(hr*0.95, hr*0.7, hr*1.6);\r\n      m4.compose(p, q, sc);\r\n      heads.setMatrixAt(k, m4);\r\n      for (const e of [-1, 1]) {\r\n        const ex = hx + Math.sin(yaw)*0.2 + Math.cos(yaw)*e*hr*0.55, ez = hz + Math.cos(yaw)*0.2 - Math.sin(yaw)*e*hr*0.55;\r\n        p.set(ex, hy + hr*0.35, ez);\r\n        const er = 0.038*s.scale*(hide ? 0 : 1);\r\n        m4.compose(p, q.identity(), sc.set(er, er, er));\r\n        eyes.setMatrixAt(k*2 + (e > 0 ? 1 : 0), m4);\r\n      }\r\n    }\r\n    body.instanceMatrix.needsUpdate = true; heads.instanceMatrix.needsUpdate = true; eyes.instanceMatrix.needsUpdate = true;\r\n  }\r\n  return { update, S };\r\n}\r\n","game/textures.js":"// textures.js -- every texture is generated here (canvas), no files.\r\n//\r\n// TEXEL DENSITY RULE (Sun Court, retro-shooter/STYLE.md): world surfaces use 32 texels per metre,\r\n// world-space UVs (cave.js projects every face onto its dominant axis), NearestMipmapNearest.\r\n// Tones are quantized into a few flat steps so surfaces read as painted pixels, never noise.\r\n//\r\n// Palette: the It Follows egg cover (/artifacts, it-follows-3.jpg) -- near-black cool rock,\r\n// brown-grey slabs whose edges catch warm bronze, a cream-yellow pool of light, a pale egg,\r\n// dark bronze snakes.\r\nimport * as THREE from 'three';\r\n\r\nexport const TEXELS_PER_METER = 32;\r\n\r\nexport function finish(canvas, { srgb = true, repeat = true, mips = true } = {}) {\r\n  const t = new THREE.CanvasTexture(canvas);\r\n  t.magFilter = THREE.NearestFilter;\r\n  t.minFilter = mips ? THREE.NearestMipmapNearestFilter : THREE.NearestFilter;\r\n  t.generateMipmaps = mips;\r\n  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;\r\n  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;\r\n  t.anisotropy = 1;\r\n  t.needsUpdate = true;\r\n  return t;\r\n}\r\n\r\nfunction painter(w, h) {\r\n  const c = document.createElement('canvas');\r\n  c.width = w; c.height = h;\r\n  const g = c.getContext('2d');\r\n  const img = g.createImageData(w, h);\r\n  const d = img.data;\r\n  const cl = v => (v \u003c 0 ? 0 : v > 255 ? 255 : v | 0);\r\n  return {\r\n    w, h,\r\n    set(x, y, rgb) {\r\n      x = ((x % w) + w) % w; y = ((y % h) + h) % h;\r\n      const i = (y*w + x)*4;\r\n      d[i] = cl(rgb[0]); d[i + 1] = cl(rgb[1]); d[i + 2] = cl(rgb[2]); d[i + 3] = 255;\r\n    },\r\n    get(x, y) {\r\n      x = ((x % w) + w) % w; y = ((y % h) + h) % h;\r\n      const i = (y*w + x)*4;\r\n      return [d[i], d[i + 1], d[i + 2]];\r\n    },\r\n    done(opts) { g.putImageData(img, 0, 0); return finish(c, opts); },\r\n  };\r\n}\r\n\r\nconst mix = (a, b, t) => [a[0] + (b[0] - a[0])*t, a[1] + (b[1] - a[1])*t, a[2] + (b[2] - a[2])*t];\r\nconst mul = (a, k) => [a[0]*k, a[1]*k, a[2]*k];\r\n\r\nfunction lattice_hash(ix, iy, seed) {\r\n  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 1442695041);\r\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\r\n  h ^= h >>> 16;\r\n  return (h >>> 0)/4294967296;\r\n}\r\nfunction vnoise(x, y, px, py, seed) {\r\n  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;\r\n  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy);\r\n  const m = (a, p) => ((a % p) + p) % p;\r\n  const a = lattice_hash(m(ix, px), m(iy, py), seed), b = lattice_hash(m(ix + 1, px), m(iy, py), seed);\r\n  const c = lattice_hash(m(ix, px), m(iy + 1, py), seed), d = lattice_hash(m(ix + 1, px), m(iy + 1, py), seed);\r\n  return (a + (b - a)*u) + ((c + (d - c)*u) - (a + (b - a)*u))*v;\r\n}\r\n// tileable fbm over a w x h texture; cells = lattice cells across the width at octave 0\r\nfunction fbm(x, y, w, h, cells, seed, oct = 3) {\r\n  let s = 0, amp = 1, tot = 0, f = 1;\r\n  for (let o = 0; o \u003c oct; o++) {\r\n    const cx = cells*f, cy = Math.max(1, Math.round(cells*f*h/w));\r\n    s += amp*vnoise(x/w*cx, y/h*cy, cx, cy, seed + o*101);\r\n    tot += amp; amp *= 0.5; f *= 2;\r\n  }\r\n  return s/tot;\r\n}\r\n// tileable cellular (nearest point) noise: returns [d1, d2, cell id]\r\nfunction cells2(x, y, w, h, n, seed) {\r\n  const gx = x/w*n, gy = y/h*n;\r\n  const ix = Math.floor(gx), iy = Math.floor(gy);\r\n  let d1 = 9, d2 = 9, id = 0;\r\n  for (let j = -1; j \u003c= 1; j++) for (let i = -1; i \u003c= 1; i++) {\r\n    const cx = ix + i, cy = iy + j;\r\n    const wx = ((cx % n) + n) % n, wy = ((cy % n) + n) % n;\r\n    const px = cx + lattice_hash(wx, wy, seed), py = cy + lattice_hash(wx, wy, seed + 7);\r\n    const d = Math.hypot(gx - px, gy - py);\r\n    if (d \u003c d1) { d2 = d1; d1 = d; id = lattice_hash(wx, wy, seed + 13); } else if (d \u003c d2) d2 = d;\r\n  }\r\n  return [d1, d2, id];\r\n}\r\n\r\nexport const PAL = {\r\n  // albedo of real cave rock (the darkness comes from the light, round 2): ~0.12-0.35 linear\r\n  rock_hi: [168, 150, 126], rock: [136, 121, 103], rock_mid: [114, 102, 89], rock_lo: [90, 81, 72], rock_deep: [64, 58, 53],\r\n  bronze: [186, 146, 96],\r\n  floor_hi: [164, 142, 110], floor: [132, 114, 90], floor_lo: [104, 90, 74], floor_deep: [76, 67, 57],\r\n  egg_hi: [246, 238, 216], egg: [232, 220, 192], egg_lo: [206, 192, 162], egg_spot: [150, 128, 100],\r\n  bone: [236, 228, 212],\r\n  scale_hi: [104, 84, 56], scale: [62, 50, 36], scale_lo: [38, 31, 24], scale_belly: [120, 100, 70],\r\n};\r\n\r\n// Rock: broad chipped facets (cellular patches), each a flat tone, a pale chip edge where two\r\n// patches meet on the lit side -- the cover's palette-knife slabs, at 32 texels/m.\r\nexport function rock(seed = 11, S = 64) {\r\n  const P = painter(S, S);\r\n  const tones = [PAL.rock_deep, PAL.rock_lo, PAL.rock_mid, PAL.rock, PAL.rock_hi];\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const [d1, d2, id] = cells2(x + 0.5, y + 0.5, S, S, 5, seed);\r\n    const n = fbm(x, y, S, S, 4, seed + 3, 2);\r\n    let k = Math.floor(id*3.2 + n*1.6);               // 0..4 flat tone per patch\r\n    k = Math.max(0, Math.min(4, k));\r\n    let c = tones[k];\r\n    const edge = d2 - d1;\r\n    if (edge \u003c 0.07) c = tones[Math.max(0, k - 2)];    // dark crack between facets\r\n    else if (edge \u003c 0.13 && ((x + y) & 1) === 0 && id > 0.55) c = mix(tones[Math.min(4, k + 1)], PAL.bronze, 0.25);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n\r\n// Floor: packed grit and flat stones, darker, one or two tones per stone, gritty speckle.\r\nexport function floor(seed = 21, S = 64) {\r\n  const P = painter(S, S);\r\n  const tones = [PAL.floor_deep, PAL.floor_lo, PAL.floor, PAL.floor_hi];\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const [d1, d2, id] = cells2(x + 0.5, y + 0.5, S, S, 8, seed);\r\n    const n = fbm(x, y, S, S, 6, seed + 5, 3);\r\n    let k = Math.floor(n*2.4 + id*1.4);\r\n    k = Math.max(0, Math.min(3, k));\r\n    let c = tones[k];\r\n    if (d2 - d1 \u003c 0.08) c = PAL.floor_deep;\r\n    const grit = lattice_hash(x, y, seed + 99);\r\n    if (grit > 0.93) c = tones[Math.min(3, k + 1)];\r\n    else if (grit \u003c 0.06) c = PAL.floor_deep;\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n\r\n// Egg shell: pale cream, a few sparse brown speckles, slightly cooler toward one pole.\r\nexport function egg_shell(seed = 31, S = 64) {\r\n  const P = painter(S, S);\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const n = fbm(x, y, S, S, 4, seed, 2);\r\n    let c = n > 0.62 ? PAL.egg_hi : n \u003c 0.4 ? PAL.egg_lo : PAL.egg;\r\n    const h = lattice_hash(x, y, seed + 17);\r\n    if (h > 0.985) c = PAL.egg_spot;\r\n    else if (h > 0.97) c = mix(PAL.egg_lo, PAL.egg_spot, 0.4);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done({ repeat: true });\r\n}\r\n\r\n// Snake: overlapping diamond scales along the body (u = around, v = along), a paler belly band,\r\n// dark seams. The texture wraps around one body segment.\r\nexport function scales(seed = 41, W = 32, H = 16) {\r\n  const P = painter(W, H);\r\n  for (let y = 0; y \u003c H; y++) for (let x = 0; x \u003c W; x++) {\r\n    const u = x/W, v = y/H;\r\n    const sx = (x + (Math.floor(y/4) % 2)*2) % 4, sy = y % 4;\r\n    const dia = Math.abs(sx - 1.5) + Math.abs(sy - 1.5);\r\n    let c = dia \u003c 1.2 ? PAL.scale_hi : dia \u003c 2.2 ? PAL.scale : PAL.scale_lo;\r\n    const belly = Math.abs(u - 0.75) \u003c 0.12;\r\n    if (belly) c = (y % 3 === 0) ? PAL.scale_lo : PAL.scale_belly;\r\n    if (lattice_hash(x, y, seed) > 0.9 && !belly) c = mul(c, 0.8);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n","game/util.js":"// util.js -- seeded rng, math helpers, springs, and the collision / raycast geometry that\r\n// player, enemy and weapon all share. Pure functions over plain numbers; no three.js here.\r\n//\r\n// COLLIDER FORMAT (what room.js exports as room.colliders):\r\n//   { x0, y0, z0, x1, y1, z1 }                  solid axis-aligned box, x0\u003cx1 etc (use box())\r\n//   { ..., ramp: '+x'|'-x'|'+z'|'-z' }           wedge inside that box whose top rises from y0 at\r\n//                                                 the low edge to y1 at the edge named by `ramp`\r\n//                                                 (use ramp()); walkable, blocks from the sides\r\n//   optional flags: no_ray (bullets pass), no_walk (bodies pass), no_floor (never chosen as a\r\n//                   spawn/teleport floor or nav surface: lids, clip ceilings), color (hex, used for\r\n//                   impact debris), tag (any string)\r\n// Bodies (player, enemy) are vertical capsules: feet at y, radius r, height h.\r\n\r\nexport const DT = 1 / 60;\r\nexport const DEG = Math.PI / 180;\r\n\r\n// ---------------------------------------------------------------- rng\r\nfunction splitmix(seed) {\r\n  let s = seed >>> 0;\r\n  return () => {\r\n    s = (s + 0x9e3779b9) >>> 0;\r\n    let z = s;\r\n    z = Math.imul(z ^ (z >>> 16), 0x85ebca6b);\r\n    z = Math.imul(z ^ (z >>> 13), 0xc2b2ae35);\r\n    return (z ^ (z >>> 16)) >>> 0;\r\n  };\r\n}\r\n\r\nexport function hash_str(str) {\r\n  let h = 2166136261 >>> 0;\r\n  for (let i = 0; i \u003c str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);\r\n  return h >>> 0;\r\n}\r\n\r\n// sfc32 seeded through splitmix32. rng.next() in [0,1).\r\nexport function make_rng(seed = 1) {\r\n  const sm = splitmix(seed);\r\n  let a = sm(), b = sm(), c = sm(), d = sm();\r\n  const next = () => {\r\n    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;\r\n    let t = (a + b) | 0;\r\n    a = b ^ (b >>> 9);\r\n    b = (c + (c \u003c\u003c 3)) | 0;\r\n    c = (c \u003c\u003c 21) | (c >>> 11);\r\n    d = (d + 1) | 0;\r\n    t = (t + d) | 0;\r\n    c = (c + t) | 0;\r\n    return (t >>> 0) / 4294967296;\r\n  };\r\n  for (let i = 0; i \u003c 12; i++) next();\r\n  const rng = {\r\n    seed,\r\n    next,\r\n    float: (lo = 0, hi = 1) => lo + (hi - lo)*next(),\r\n    int: (lo, hi) => lo + Math.floor(next()*(hi - lo + 1)),     // inclusive\r\n    chance: p => next() \u003c p,\r\n    sign: () => (next() \u003c 0.5 ? -1 : 1),\r\n    pick: arr => arr[Math.floor(next()*arr.length)],\r\n    spread: s => (next()*2 - 1)*s,                                // symmetric in [-s, s]\r\n    // a new independent stream derived from this seed + a tag\r\n    fork: tag => make_rng((seed ^ hash_str(String(tag))) >>> 0),\r\n  };\r\n  return rng;\r\n}\r\n\r\n// ---------------------------------------------------------------- math\r\nexport const clamp = (x, a, b) => (x \u003c a ? a : x > b ? b : x);\r\nexport const lerp = (a, b, t) => a + (b - a)*t;\r\nexport const inv_lerp = (a, b, x) => (x - a)/(b - a);\r\nexport const remap = (x, a, b, c, d) => c + (d - c)*clamp((x - a)/(b - a), 0, 1);\r\nexport const smoothstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };\r\nexport const approach = (x, target, step) => (x \u003c target ? Math.min(x + step, target) : Math.max(x - step, target));\r\n// frame-rate independent exponential smoothing: rate = 1/time-constant\r\nexport const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate*dt));\r\nexport const ease_out_cubic = t => 1 - Math.pow(1 - t, 3);\r\nexport const ease_in_cubic = t => t*t*t;\r\nexport const ease_out_back = (t, k = 1.7) => 1 + (k + 1)*Math.pow(t - 1, 3) + k*Math.pow(t - 1, 2);\r\nexport const wrap_deg = a => { a = (a + 180) % 360; if (a \u003c 0) a += 360; return a - 180; };\r\nexport const len2 = (x, z) => Math.sqrt(x*x + z*z);\r\nexport const len3 = (x, y, z) => Math.sqrt(x*x + y*y + z*z);\r\n\r\n// compass heading convention used by the whole game and the GAME API:\r\n// yaw 0 looks at -z, yaw 90 looks at +x. pitch > 0 looks up.\r\nexport const yaw_to = (x0, z0, x1, z1) => Math.atan2(x1 - x0, -(z1 - z0))/DEG;\r\nexport const forward_of = (yaw_deg, pitch_deg = 0) => {\r\n  const y = yaw_deg*DEG, p = pitch_deg*DEG, cp = Math.cos(p);\r\n  return [Math.sin(y)*cp, Math.sin(p), -Math.cos(y)*cp];\r\n};\r\n\r\n// damped spring (semi-implicit Euler, stable at 60 Hz for freq up to ~40 rad/s)\r\n// s = {x, v}; omega = angular frequency (rad/s), zeta = damping ratio (1 = critical)\r\nexport function spring(s, target, omega, zeta, dt) {\r\n  const a = -2*zeta*omega*s.v - omega*omega*(s.x - target);\r\n  s.v += a*dt;\r\n  s.x += s.v*dt;\r\n  return s.x;\r\n}\r\nexport const make_spring = (x = 0) => ({ x, v: 0 });\r\n\r\n// smooth 1D value noise in [-1, 1], deterministic\r\nexport function noise1(x, seed = 0) {\r\n  const i = Math.floor(x), f = x - i;\r\n  const h = n => {\r\n    let v = Math.imul((n + seed*7919) | 0, 0x27d4eb2d);\r\n    v ^= v >>> 15; v = Math.imul(v, 0x85ebca6b); v ^= v >>> 13;\r\n    return ((v >>> 0)/4294967296)*2 - 1;\r\n  };\r\n  const u = f*f*(3 - 2*f);\r\n  return lerp(h(i), h(i + 1), u);\r\n}\r\n\r\n// ---------------------------------------------------------------- colliders\r\nexport function box(x0, y0, z0, x1, y1, z1, extra) {\r\n  const c = {\r\n    x0: Math.min(x0, x1), y0: Math.min(y0, y1), z0: Math.min(z0, z1),\r\n    x1: Math.max(x0, x1), y1: Math.max(y0, y1), z1: Math.max(z0, z1),\r\n  };\r\n  return extra ? Object.assign(c, extra) : c;\r\n}\r\n\r\n// wedge: rises from y0 at the low edge to y1 at the side named by dir\r\nexport function ramp(x0, y0, z0, x1, y1, z1, dir, extra) {\r\n  const c = box(x0, y0, z0, x1, y1, z1, extra);\r\n  c.ramp = dir;\r\n  c.H = c.y1 - c.y0;\r\n  c.gx = 0; c.gz = 0; c.ax = 0; c.az = 0;\r\n  if (dir === '+x') { c.gx = 1/(c.x1 - c.x0); c.ax = c.x0; }\r\n  else if (dir === '-x') { c.gx = -1/(c.x1 - c.x0); c.ax = c.x1; }\r\n  else if (dir === '+z') { c.gz = 1/(c.z1 - c.z0); c.az = c.z0; }\r\n  else if (dir === '-z') { c.gz = -1/(c.z1 - c.z0); c.az = c.z1; }\r\n  else throw new Error('ramp dir must be +x -x +z -z');\r\n  return c;\r\n}\r\n\r\n// top surface height of a collider at (x, z) (clamped into its footprint)\r\nexport function surface_y(c, x, z) {\r\n  if (!c.ramp) return c.y1;\r\n  const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n  const u = clamp(c.gx*(px - c.ax) + c.gz*(pz - c.az), 0, 1);\r\n  return c.y0 + c.H*u;\r\n}\r\n\r\n// does a circle (x, z, r) overlap the collider's footprint (strictly)?\r\nexport function circle_hits(c, x, z, r) {\r\n  const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n  const dx = x - px, dz = z - pz;\r\n  return dx*dx + dz*dz \u003c r*r;\r\n}\r\n\r\nexport function point_inside(c, x, y, z) {\r\n  if (x \u003c= c.x0 || x >= c.x1 || z \u003c= c.z0 || z >= c.z1 || y \u003c= c.y0) return false;\r\n  return y \u003c surface_y(c, x, z);\r\n}\r\n\r\n// highest walkable surface under a circle, not above max_y. -Infinity when nothing.\r\nexport function ground_at(cols, x, z, r, max_y = Infinity) {\r\n  let g = -Infinity;\r\n  for (const c of cols) {\r\n    if (c.no_walk || !circle_hits(c, x, z, r)) continue;\r\n    const top = surface_y(c, x, z);\r\n    if (top \u003c= max_y && top > g) g = top;\r\n  }\r\n  return g;\r\n}\r\n\r\n// floor under a point for teleports / spawns: the highest surface with headroom h above it\r\nexport function resolve_floor_y(cols, x, z, h = 1.8, r = 0.05) {\r\n  const tops = [];\r\n  for (const c of cols) if (!c.no_walk && !c.no_floor && circle_hits(c, x, z, r)) tops.push(surface_y(c, x, z));\r\n  tops.sort((a, b) => b - a);\r\n  for (const top of tops) {\r\n    let clear = true;\r\n    for (const c of cols) {\r\n      if (c.no_walk || !circle_hits(c, x, z, r)) continue;\r\n      if (c.y0 \u003c top + h - 0.01 && surface_y(c, x, z) > top + 0.01) { clear = false; break; }\r\n    }\r\n    if (clear) return top;\r\n  }\r\n  return tops.length ? tops[tops.length - 1] : 0;\r\n}\r\n\r\nfunction headroom_ok(cols, x, z, r, y_new, h, y_now) {\r\n  for (const c of cols) {\r\n    if (c.no_walk) continue;\r\n    if (c.y0 \u003c y_new + h && c.y0 >= y_now + h - 0.02 && circle_hits(c, x, z, r - 0.01)) return false;\r\n  }\r\n  return true;\r\n}\r\n\r\n// horizontal circle push-out against every collider that is a wall at this height.\r\n// Colliders whose top at the contact point is within step_allow of the feet are left for the\r\n// vertical pass (that is the step-up). Returns true if a wall was touched.\r\nexport function push_out(b, cols, step_allow) {\r\n  let touched = false;\r\n  for (let pass = 0; pass \u003c 4; pass++) {\r\n    let moved = false;\r\n    for (const c of cols) {\r\n      if (c.no_walk) continue;\r\n      if (c.y0 >= b.y + b.h - 0.01) continue;                    // entirely above the head\r\n      const px = clamp(b.x, c.x0, c.x1), pz = clamp(b.z, c.z0, c.z1);\r\n      const ddx = b.x - px, ddz = b.z - pz, d2 = ddx*ddx + ddz*ddz;\r\n      if (d2 >= b.r*b.r) continue;\r\n      const top = surface_y(c, px, pz);\r\n      if (top \u003c= b.y + 0.001) continue;                            // below the feet\r\n      if (top \u003c= b.y + step_allow && headroom_ok(cols, b.x, b.z, b.r, top, b.h, b.y)) continue;\r\n      let nx, nz, pen;\r\n      if (d2 > 1e-12) {\r\n        const d = Math.sqrt(d2);\r\n        nx = ddx/d; nz = ddz/d; pen = b.r - d;\r\n      } else {                                                     // centre inside: nearest side\r\n        const l = b.x - c.x0, rr = c.x1 - b.x, bk = b.z - c.z0, f = c.z1 - b.z;\r\n        const m = Math.min(l, rr, bk, f);\r\n        if (m === l) { nx = -1; nz = 0; pen = l + b.r; }\r\n        else if (m === rr) { nx = 1; nz = 0; pen = rr + b.r; }\r\n        else if (m === bk) { nx = 0; nz = -1; pen = bk + b.r; }\r\n        else { nx = 0; nz = 1; pen = f + b.r; }\r\n      }\r\n      b.x += nx*(pen + 1e-5); b.z += nz*(pen + 1e-5);\r\n      const vn = b.vx*nx + b.vz*nz;\r\n      if (vn \u003c 0) { b.vx -= vn*nx; b.vz -= vn*nz; }\r\n      touched = moved = true;\r\n    }\r\n    if (!moved) break;\r\n  }\r\n  return touched;\r\n}\r\n\r\n// Kinematic capsule mover shared by player and enemy.\r\n//   b = {x, y, z, vx, vy, vz, r, h, grounded}  (y = feet). Gravity is the caller's job.\r\n//   o = {step, air_step, snap}\r\n// Returns events: {landed: impact speed or 0, step_dy: vertical snap while grounded, wall, ceiling}\r\nexport function move_body(b, cols, dt, o) {\r\n  const ev = { landed: 0, step_dy: 0, wall: false, ceiling: false };\r\n  const y_before = b.y, was_grounded = b.grounded;\r\n  const dx = b.vx*dt, dz = b.vz*dt;\r\n  const n = Math.max(1, Math.ceil(Math.hypot(dx, dz)/(b.r*0.45)));\r\n  const allow = was_grounded ? o.step : o.air_step;\r\n  for (let i = 0; i \u003c n; i++) {\r\n    b.x += dx/n; b.z += dz/n;\r\n    if (push_out(b, cols, allow)) ev.wall = true;\r\n  }\r\n  const vy_before = b.vy;\r\n  b.y += b.vy*dt;\r\n  // ceiling: colliders that were above the head before this move\r\n  const rr = b.r - 0.01;\r\n  if (b.vy > 0) {\r\n    let ceil = Infinity;\r\n    for (const c of cols) {\r\n      if (c.no_walk || c.y0 \u003c y_before + b.h - 0.02 || !circle_hits(c, b.x, b.z, rr)) continue;\r\n      if (c.y0 \u003c ceil) ceil = c.y0;\r\n    }\r\n    if (b.y + b.h > ceil) { b.y = ceil - b.h; b.vy = 0; ev.ceiling = true; }\r\n  }\r\n  // ground: highest surface under the circle that is not a ceiling\r\n  let ground = -Infinity;\r\n  for (const c of cols) {\r\n    if (c.no_walk || !circle_hits(c, b.x, b.z, rr)) continue;\r\n    if (c.y0 >= y_before + b.h - 0.02) continue;\r\n    const top = surface_y(c, b.x, b.z);\r\n    if (top \u003c= Math.max(y_before, b.y) + allow + 0.001 && top > ground) ground = top;\r\n  }\r\n  b.grounded = false;\r\n  if (b.vy \u003c= 0) {\r\n    if (b.y \u003c= ground) { b.y = ground; b.vy = 0; b.grounded = true; }\r\n    else if (was_grounded && b.y - ground \u003c= o.snap) { b.y = ground; b.vy = 0; b.grounded = true; }\r\n  } else if (b.y \u003c ground) {\r\n    b.y = ground;\r\n  }\r\n  if (b.grounded && !was_grounded) ev.landed = Math.max(0, -vy_before);\r\n  if (b.grounded && was_grounded) ev.step_dy = b.y - y_before;\r\n  return ev;\r\n}\r\n\r\n// ---------------------------------------------------------------- raycasts\r\n// ray vs one collider; returns {t, nx, ny, nz} of the entry point or null (origin inside = miss)\r\nexport function ray_collider(c, ox, oy, oz, dx, dy, dz, max_t) {\r\n  let tmin = -Infinity, tmax = Infinity, nx = 0, ny = 0, nz = 0;\r\n  // slabs\r\n  const slab = (o, d, lo, hi, ax) => {\r\n    if (Math.abs(d) \u003c 1e-12) return o > lo && o \u003c hi;\r\n    let t1 = (lo - o)/d, t2 = (hi - o)/d, s = -1;\r\n    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; s = 1; }\r\n    if (t1 > tmin) { tmin = t1; nx = ny = nz = 0; if (ax === 0) nx = s; else if (ax === 1) ny = s; else nz = s; }\r\n    if (t2 \u003c tmax) tmax = t2;\r\n    return tmin \u003c= tmax;\r\n  };\r\n  if (!slab(ox, dx, c.x0, c.x1, 0) || !slab(oy, dy, c.y0, c.y1, 1) || !slab(oz, dz, c.z0, c.z1, 2)) return null;\r\n  if (c.ramp) {\r\n    // inside: y - y0 - H*u(x,z) \u003c= 0, u = gx*(x-ax) + gz*(z-az)\r\n    const gxw = -c.H*c.gx, gzw = -c.H*c.gz;\r\n    const f0 = oy - c.y0 + gxw*(ox - c.ax) + gzw*(oz - c.az);\r\n    const fd = dy + gxw*dx + gzw*dz;\r\n    if (Math.abs(fd) \u003c 1e-12) { if (f0 > 0) return null; }\r\n    else {\r\n      const ts = -f0/fd;\r\n      if (fd \u003c 0) {\r\n        if (ts > tmin) { tmin = ts; const l = Math.hypot(gxw, 1, gzw); nx = gxw/l; ny = 1/l; nz = gzw/l; }\r\n      } else if (ts \u003c tmax) tmax = ts;\r\n      if (tmin > tmax) return null;\r\n    }\r\n  }\r\n  if (tmax \u003c 0 || tmin \u003c 0 || tmin > max_t) return null;\r\n  return { t: tmin, nx, ny, nz };\r\n}\r\n\r\n// nearest hit along a ray against the collider list (dir need not be unit; t is in dir units)\r\nexport function raycast(cols, ox, oy, oz, dx, dy, dz, max_t = 1e9) {\r\n  let best = null, bt = max_t;\r\n  for (const c of cols) {\r\n    if (c.no_ray) continue;\r\n    const r = ray_collider(c, ox, oy, oz, dx, dy, dz, bt);\r\n    if (r && r.t \u003c bt) { bt = r.t; best = r; best.c = c; }\r\n  }\r\n  if (best) { best.x = ox + dx*bt; best.y = oy + dy*bt; best.z = oz + dz*bt; }\r\n  return best;\r\n}\r\n\r\n// clear line between two points?\r\nexport function line_clear(cols, ax, ay, az, bx, by, bz) {\r\n  return !raycast(cols, ax, ay, az, bx - ax, by - ay, bz - az, 1);\r\n}\r\n\r\n// ray vs vertical capsule (segment (cx,y0,cz)-(cx,y1,cz), radius r). returns t or Infinity\r\nexport function ray_capsule(ox, oy, oz, dx, dy, dz, cx, y0, y1, cz, r) {\r\n  let best = Infinity;\r\n  // cylinder side\r\n  const px = ox - cx, pz = oz - cz;\r\n  const a = dx*dx + dz*dz;\r\n  if (a > 1e-12) {\r\n    const bq = 2*(px*dx + pz*dz), cq = px*px + pz*pz - r*r;\r\n    const disc = bq*bq - 4*a*cq;\r\n    if (disc >= 0) {\r\n      const t = (-bq - Math.sqrt(disc))/(2*a);\r\n      const y = oy + dy*t;\r\n      if (t >= 0 && y >= y0 && y \u003c= y1) best = t;\r\n    }\r\n  }\r\n  // end spheres\r\n  const sph = (sy) => {\r\n    const qx = ox - cx, qy = oy - sy, qz = oz - cz;\r\n    const A = dx*dx + dy*dy + dz*dz, B = 2*(qx*dx + qy*dy + qz*dz), C = qx*qx + qy*qy + qz*qz - r*r;\r\n    const D = B*B - 4*A*C;\r\n    if (D \u003c 0) return;\r\n    const t = (-B - Math.sqrt(D))/(2*A);\r\n    if (t >= 0 && t \u003c best) best = t;\r\n  };\r\n  sph(y0); sph(y1);\r\n  return best;\r\n}\r\n\r\n// sphere overlap vs colliders -> the first collider touched, or null\r\nexport function sphere_hits(cols, x, y, z, r) {\r\n  for (const c of cols) {\r\n    if (c.no_ray) continue;\r\n    const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n    const top = surface_y(c, px, pz);\r\n    const py = clamp(y, c.y0, top);\r\n    const dx = x - px, dy = y - py, dz = z - pz;\r\n    if (dx*dx + dy*dy + dz*dz \u003c r*r) return c;\r\n  }\r\n  return null;\r\n}\r\n\r\n// distance from a point to a vertical segment (for capsule overlap tests)\r\nexport function dist_to_vseg(x, y, z, cx, y0, y1, cz) {\r\n  const cy = clamp(y, y0, y1);\r\n  return len3(x - cx, y - cy, z - cz);\r\n}\r\n"}</script>
