 rx, ry, rz) {\r\n  const px = (x - cx)/rx, py = (y - cy)/ry, pz = (z - cz)/rz;\r\n  const k0 = Math.hypot(px, py, pz);\r\n  const k1 = Math.hypot(px/rx, py/ry, pz/rz);\r\n  return k1 \u003c 1e-9 ? -Math.min(rx, ry, rz) : k0*(k0 - 1)/k1;\r\n}\r\n\r\n// capsule between a and b with radius ra at a and rb at b (a \"round cone\" when they differ)\r\nexport function cone(x, y, z, ax, ay, az, bx, by, bz, ra, rb) {\r\n  const px = x - ax, py = y - ay, pz = z - az;\r\n  const dx = bx - ax, dy = by - ay, dz = bz - az;\r\n  const L2 = dx*dx + dy*dy + dz*dz;\r\n  let t = L2 > 0 ? (px*dx + py*dy + pz*dz)/L2 : 0;\r\n  t = t \u003c 0 ? 0 : t > 1 ? 1 : t;\r\n  const qx = px - dx*t, qy = py - dy*t, qz = pz - dz*t;\r\n  return Math.hypot(qx, qy, qz) - (ra + (rb - ra)*t);\r\n}\r\nexport const capsule = (x, y, z, ax, ay, az, bx, by, bz, r) => cone(x, y, z, ax, ay, az, bx, by, bz, r, r);\r\n\r\nexport function rbox(x, y, z, cx, cy, cz, hx, hy, hz, r) {\r\n  const qx = Math.abs(x - cx) - hx + r, qy = Math.abs(y - cy) - hy + r, qz = Math.abs(z - cz) - hz + r;\r\n  const ox = Math.max(qx, 0), oy = Math.max(qy, 0), oz = Math.max(qz, 0);\r\n  return Math.hypot(ox, oy, oz) + Math.min(Math.max(qx, qy, qz), 0) - r;\r\n}\r\n\r\n// a chain of round cones through points [[x,y,z,r], ...] (smooth-unioned with k)\r\nexport function chain(x, y, z, P, k = 0) {\r\n  let d = Infinity;\r\n  for (let i = 0; i \u003c P.length - 1; i++) {\r\n    const a = P[i], b = P[i + 1];\r\n    const e = cone(x, y, z, a[0], a[1], a[2], b[0], b[1], b[2], a[3], b[3]);\r\n    d = k > 0 ? smin(d, e, k) : Math.min(d, e);\r\n  }\r\n  return d;\r\n}\r\n\r\n// ---------------------------------------------------------------- combinators\r\nexport function smin(a, b, k) {\r\n  if (!isFinite(a)) return b;\r\n  const h = Math.max(k - Math.abs(a - b), 0)/k;\r\n  return Math.min(a, b) - h*h*k*0.25;\r\n}\r\nexport function smax(a, b, k) { return -smin(-a, -b, k); }\r\nexport const sub = (a, b, k = 0) => (k > 0 ? smax(a, -b, k) : Math.max(a, -b));\r\n\r\n// ---------------------------------------------------------------- meshing\r\n// f: the field; box: [x0, y0, z0, x1, y1, z1]; h: voxel size. Returns a BufferGeometry (indexed)\r\nexport function mesh_sdf(f, box, h) {\r\n  const pad = 2*h;\r\n  const x0 = box[0] - pad, y0 = box[1] - pad, z0 = box[2] - pad;\r\n  const nx = Math.ceil((box[3] + pad - x0)/h) + 1, ny = Math.ceil((box[4] + pad - y0)/h) + 1, nz = Math.ceil((box[5] + pad - z0)/h) + 1;\r\n  const F = new Float32Array(nx*ny*nz);\r\n  const I = (i, j, k) => (k*ny + j)*nx + i;\r\n  // narrow band: sample a lattice 4x coarser first; a fine point is evaluated only when the\r\n  // nearest coarse sample is close to the surface (the fields here are only roughly metric, so\r\n  // the band is generous); elsewhere the coarse value stands in (its sign is all that matters)\r\n  const Q = 4, cq = Q*h, band = cq*2.2;\r\n  const mx = Math.ceil((nx - 1)/Q) + 1, my = Math.ceil((ny - 1)/Q) + 1, mz = Math.ceil((nz - 1)/Q) + 1;\r\n  const Cs = new Float32Array(mx*my*mz);\r\n  for (let k = 0; k \u003c mz; k++) for (let j = 0; j \u003c my; j++) for (let i = 0; i \u003c mx; i++) Cs[(k*my + j)*mx + i] = f(x0 + i*cq, y0 + j*cq, z0 + k*cq);\r\n  for (let k = 0; k \u003c nz; k++) for (let j = 0; j \u003c ny; j++) for (let i = 0; i \u003c nx; i++) {\r\n    const c = Cs[(Math.min(mz - 1, Math.round(k/Q))*my + Math.min(my - 1, Math.round(j/Q)))*mx + Math.min(mx - 1, Math.round(i/Q))];\r\n    F[I(i, j, k)] = Math.abs(c) > band ? c : f(x0 + i*h, y0 + j*h, z0 + k*h);\r\n  }\r\n  const vid = new Int32Array((nx - 1)*(ny - 1)*(nz - 1)).fill(-1);\r\n  const C = (i, j, k) => (k*(ny - 1) + j)*(nx - 1) + i;\r\n  const pos = [];\r\n  const EDGES = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];\r\n  const corner = new Float32Array(8);\r\n  for (let k = 0; k \u003c nz - 1; k++) for (let j = 0; j \u003c ny - 1; j++) for (let i = 0; i \u003c nx - 1; i++) {\r\n    let mask = 0;\r\n    for (let c = 0; c \u003c 8; c++) {\r\n      const v = F[I(i + (c & 1), j + ((c >> 1) & 1), k + ((c >> 2) & 1))];\r\n      corner[c] = v;\r\n      if (v \u003c 0) mask |= 1 \u003c\u003c c;\r\n    }\r\n    if (mask === 0 || mask === 255) continue;\r\n    let sx = 0, sy = 0, sz = 0, n = 0;\r\n    for (const [a, b] of EDGES) {\r\n      const va = corner[a], vb = corner[b];\r\n      if ((va \u003c 0) === (vb \u003c 0)) continue;\r\n      const t = va/(va - vb);\r\n      sx += (a & 1) + (((b & 1) - (a & 1))*t);\r\n      sy += ((a >> 1) & 1) + ((((b >> 1) & 1) - ((a >> 1) & 1))*t);\r\n      sz += ((a >> 2) & 1) + ((((b >> 2) & 1) - ((a >> 2) & 1))*t);\r\n      n++;\r\n    }\r\n    vid[C(i, j, k)] = pos.length/3;\r\n    pos.push(x0 + (i + sx/n)*h, y0 + (j + sy/n)*h, z0 + (k + sz/n)*h);\r\n  }\r\n  const idx = [];\r\n  const quad = (a, b, c, d, flip) => {\r\n    if (a \u003c 0 || b \u003c 0 || c \u003c 0 || d \u003c 0) return;\r\n    if (flip) idx.push(a, c, b, a, d, c); else idx.push(a, b, c, a, c, d);\r\n  };\r\n  for (let k = 1; k \u003c nz - 1; k++) for (let j = 1; j \u003c ny - 1; j++) for (let i = 1; i \u003c nx - 1; i++) {\r\n    const v0 = F[I(i, j, k)] \u003c 0;\r\n    // x edge (i,j,k)-(i+1,j,k): cells around it share j-1..j, k-1..k\r\n    if (i \u003c nx - 1 && v0 !== (F[I(i + 1, j, k)] \u003c 0)) quad(vid[C(i, j - 1, k - 1)], vid[C(i, j, k - 1)], vid[C(i, j, k)], vid[C(i, j - 1, k)], !v0);\r\n    if (j \u003c ny - 1 && v0 !== (F[I(i, j + 1, k)] \u003c 0)) quad(vid[C(i - 1, j, k - 1)], vid[C(i - 1, j, k)], vid[C(i, j, k)], vid[C(i, j, k - 1)], !v0);\r\n    if (k \u003c nz - 1 && v0 !== (F[I(i, j, k + 1)] \u003c 0)) quad(vid[C(i - 1, j - 1, k)], vid[C(i, j - 1, k)], vid[C(i, j, k)], vid[C(i - 1, j, k)], !v0);\r\n  }\r\n  const g = new THREE.BufferGeometry();\r\n  const P = new Float32Array(pos);\r\n  g.setAttribute('position', new THREE.BufferAttribute(P, 3));\r\n  g.setIndex(idx);\r\n  // normals from the field's gradient\r\n  const N = new Float32Array(P.length), e = h*0.5;\r\n  for (let v = 0; v \u003c P.length; v += 3) {\r\n    const x = P[v], y = P[v + 1], z = P[v + 2];\r\n    let gx = f(x + e, y, z) - f(x - e, y, z), gy = f(x, y + e, z) - f(x, y - e, z), gz = f(x, y, z + e) - f(x, y, z - e);\r\n    const l = Math.hypot(gx, gy, gz) || 1;\r\n    N[v] = gx/l; N[v + 1] = gy/l; N[v + 2] = gz/l;\r\n  }\r\n  g.setAttribute('normal', new THREE.BufferAttribute(N, 3));\r\n  return g;\r\n}\r\n\r\n// ---------------------------------------------------------------- swept tubes\r\n// A tube along a polyline of points [[x,y,z], ...] with an elliptical section (w across the\r\n// curve's `up` side, t across the other), radii scaled per point by prof(s) (s = 0..1).\r\n// `up` is a fixed direction the section's wide axis aligns to (a rib's flat side faces it).\r\nexport function sweep(pts, w, t, prof, up, sides = 8) {\r\n  const n = pts.length;\r\n  const P = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));\r\n  const pos = [], nor = [], idx = [];\r\n  const U = new THREE.Vector3(...up).normalize();\r\n  for (let i = 0; i \u003c n; i++) {\r\n    const T = new THREE.Vector3().subVectors(P[Math.min(n - 1, i + 1)], P[Math.max(0, i - 1)]).normalize();\r\n    const B = new THREE.Vector3().crossVectors(T, U).normalize();\r\n    const Nn = new THREE.Vector3().crossVectors(B, T).normalize();\r\n    const s = i/(n - 1), k = prof(s);\r\n    for (let j = 0; j \u003c sides; j++) {\r\n      const a = j/sides*Math.PI*2;\r\n      const ca = Math.cos(a), sa = Math.sin(a);\r\n      const ox = Nn.x*ca*w*k + B.x*sa*t*k, oy = Nn.y*ca*w*k + B.y*sa*t*k, oz = Nn.z*ca*w*k + B.z*sa*t*k;\r\n      pos.push(P[i].x + ox, P[i].y + oy, P[i].z + oz);\r\n      const nx = Nn.x*ca/w + B.x*sa/t, ny = Nn.y*ca/w + B.y*sa/t, nz = Nn.z*ca/w + B.z*sa/t;\r\n      const l = Math.hypot(nx, ny, nz) || 1;\r\n      nor.push(nx/l, ny/l, nz/l);\r\n    }\r\n  }\r\n  for (let i = 0; i \u003c n - 1; i++) for (let j = 0; j \u003c sides; j++) {\r\n    const a = i*sides + j, b = i*sides + (j + 1)%sides, c = (i + 1)*sides + (j + 1)%sides, d = (i + 1)*sides + j;\r\n    idx.push(a, b, c, a, c, d);\r\n  }\r\n  // caps\r\n  for (const end of [0, n - 1]) {\r\n    const c = pos.length/3;\r\n    const p = P[end], T = new THREE.Vector3().subVectors(P[end === 0 ? 1 : n - 1], P[end === 0 ? 0 : n - 2]).normalize();\r\n    pos.push(p.x, p.y, p.z); nor.push(end === 0 ? -T.x : T.x, end === 0 ? -T.y : T.y, end === 0 ? -T.z : T.z);\r\n    for (let j = 0; j \u003c sides; j++) {\r\n      const a = end*sides + j, b = end*sides + (j + 1)%sides;\r\n      if (end === 0) idx.push(c, b, a); else idx.push(c, a, b);\r\n    }\r\n  }\r\n  const g = new THREE.BufferGeometry();\r\n  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));\r\n  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));\r\n  g.setIndex(idx);\r\n  return g;\r\n}\r\n","game/skeleton.js":"// skeleton.js -- a realistic human skeleton, sculpted (round 3; owner: \"the lich model itself\r\n// should be way more realistic\"; target: Astra's lich 07, reference/astra-r02/lich/07.png).\r\n//\r\n// Every bone is built in the frame of the joint it hangs from (see RIG below), so the lich can\r\n// be posed by rotating joints. Rounded bones (skull, jaw, pelvis, vertebrae, scapulae, sternum,\r\n// long bones, carpals, tarsals) are signed distance fields meshed by sdf.js; the thin flat ones\r\n// (ribs, costal cartilage, clavicles) are swept tubes with a flattened section.\r\n//\r\n// Units: metres. Frame: +y up, +z forward (the way the lich faces), s = +1 / -1 for the two\r\n// sides (x). A 1.8 m adult.\r\nimport * as THREE from 'three';\r\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\r\nimport { sphere, ellipsoid, cone, capsule, rbox, chain, smin, smax, sub, mesh_sdf, sweep } from 'game/sdf.js';\r\n\r\nconst cyl = (x, y, z, cx, cy, cz, r, hh, k) => {\r\n  const dx = Math.hypot(x - cx, z - cz) - r + k, dy = Math.abs(y - cy) - hh + k;\r\n  return Math.min(Math.max(dx, dy), 0) + Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) - k;\r\n};\r\nconst lerp = (a, b, t) => a + (b - a)*t;\r\n\r\n// ------------------------------------------------------------------ the rig (joint offsets)\r\n// parent-relative positions of every joint; the skeleton hangs from them\r\nexport const RIG = {\r\n  spine: [0, 0.10, -0.062],        // from the pelvis (hip-joint line) to the top of the sacrum\r\n  chest: [0, 0.18, 0.0],           // from the spine node to T12\r\n  neck: [0, 0.285, 0.004],         // from the chest node to C7\r\n  head: [0, 0.118, 0.014],         // from the neck node to the atlas\r\n  jaw: [0, 0.004, 0.008],          // from the head node to the jaw hinge\r\n  shoulder: [0.172, 0.248, -0.006],  // from the chest node (x times s)\r\n  elbow: [0, -0.305, 0],\r\n  wrist: [0, -0.262, 0.004],\r\n  hip: [0.088, 0, 0],              // from the pelvis (x times s)\r\n  knee: [-0.03, -0.44, 0.004],     // the femur angles in: knees closer than hips (x times s)\r\n  ankle: [0, -0.405, -0.004],\r\n};\r\n\r\n// ------------------------------------------------------------------ bone fields\r\nfunction skull(x, y, z) {\r\n  // proportions from the foramen magnum (origin): orbits ~4 cm above it and ~8 cm in front,\r\n  // the vertex ~14 cm up, the occiput ~10 cm behind\r\n  let d = ellipsoid(x, y, z, 0, 0.072, -0.016, 0.067, 0.07, 0.097);                      // cranium\r\n  d = smin(d, ellipsoid(x, y, z, 0, 0.078, 0.03, 0.056, 0.052, 0.06), 0.018);             // forehead\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.008, 0.064, 0.037, 0.036, 0.036), 0.014);        // maxilla, taller\r\n  for (const s of [-1, 1]) {\r\n    d = smin(d, ellipsoid(x, y, z, s*0.05, 0.018, 0.064, 0.02, 0.016, 0.019), 0.009);   // cheekbone\r\n    d = smin(d, capsule(x, y, z, s*0.055, 0.018, 0.058, s*0.064, 0.022, 0.0, 0.006), 0.007);  // arch\r\n    d = smin(d, ellipsoid(x, y, z, s*0.056, -0.012, -0.024, 0.011, 0.016, 0.013), 0.009); // mastoid\r\n  }\r\n  d = smin(d, capsule(x, y, z, -0.045, 0.058, 0.08, 0.045, 0.058, 0.08, 0.0095), 0.012);  // brow ridge\r\n  for (const s of [-1, 1]) {\r\n    d = smax(d, -ellipsoid(x, y, z, s*0.032, 0.037, 0.094, 0.0165, 0.0155, 0.03), 0.004);  // orbit: smaller, deep\r\n    d = smax(d, -ellipsoid(x, y, z, s*0.073, 0.045, 0.018, 0.011, 0.02, 0.026), 0.009);  // temple\r\n  }\r\n  d = smax(d, -ellipsoid(x, y, z, 0, 0.004, 0.099, 0.0095, 0.018, 0.02), 0.003);       // nasal opening\r\n  d = smax(d, -ellipsoid(x, y, z, 0, -0.045, -0.03, 0.05, 0.03, 0.05), 0.012);         // skull base\r\n  for (let i = 0; i \u003c 12; i++) {                                                        // upper teeth\r\n    const a = lerp(-1.25, 1.25, i/11);\r\n    const tx = Math.sin(a)*0.033, tz = 0.052 + Math.cos(a)*0.035;\r\n    d = smin(d, capsule(x, y, z, tx, -0.03, tz, tx, -0.043, tz, 0.0042 - Math.abs(a)*0.0006), 0.002);\r\n  }\r\n  return d;\r\n}\r\nfunction mandible(x, y, z) {\r\n  // jaw-hinge frame: condyles at the origin's sides, the chin ~7.5 cm down-forward\r\n  const P = [];\r\n  for (let i = 0; i \u003c= 10; i++) {\r\n    const a = lerp(-1.5, 1.5, i/10);\r\n    P.push([Math.sin(a)*0.046, -0.072 + Math.abs(Math.sin(a))*0.01, 0.018 + Math.cos(a)*0.05, 0.0088]);\r\n  }\r\n  let d = chain(x, y, z, P, 0.006);\r\n  for (const s of [-1, 1]) {\r\n    d = smin(d, cone(x, y, z, s*0.046, -0.066, 0.004, s*0.05, -0.004, -0.004, 0.011, 0.008), 0.008);   // ramus\r\n    d = smin(d, sphere(x, y, z, s*0.05, -0.002, -0.005, 0.0075), 0.004);                 // condyle\r\n    d = smin(d, cone(x, y, z, s*0.049, -0.03, 0.004, s*0.046, 0.002, 0.016, 0.006, 0.003), 0.005);   // coronoid\r\n  }\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.08, 0.064, 0.014, 0.012, 0.009), 0.008);           // chin\r\n  for (let i = 0; i \u003c 12; i++) {                                                         // lower teeth\r\n    const a = lerp(-1.2, 1.2, i/11);\r\n    const tx = Math.sin(a)*0.039, tz = 0.018 + Math.cos(a)*0.044;\r\n    d = smin(d, capsule(x, y, z, tx, -0.061, tz, tx, -0.049, tz, 0.0042), 0.002);\r\n  }\r\n  return d;\r\n}\r\n// a vertebra at height yc, depth zc: body, pedicles, spinous and transverse processes\r\nfunction vertebra(x, y, z, yc, zc, R, hh, spL, spDrop, trL) {\r\n  let d = cyl(x, y, z, 0, yc, zc + R*0.1, R, hh, hh*0.6);\r\n  d = smin(d, capsule(x, y, z, -R*0.5, yc + hh*0.3, zc - R*0.8, R*0.5, yc + hh*0.3, zc - R*0.8, R*0.28), R*0.3);\r\n  d = smin(d, cone(x, y, z, 0, yc + hh*0.3, zc - R*0.9, 0, yc - spDrop, zc - R - spL, R*0.32, R*0.2), R*0.25);\r\n  for (const s of [-1, 1]) d = smin(d, cone(x, y, z, s*R*0.5, yc + hh*0.4, zc - R*0.8, s*(R*0.5 + trL), yc + hh*0.5, zc - R*0.95, R*0.25, R*0.16), R*0.2);\r\n  return d;\r\n}\r\nfunction pelvis(x, y, z) {\r\n  let d = Infinity;\r\n  for (const s of [-1, 1]) {\r\n    // iliac blade: a thin broad fan facing out and forward, thick at its crest\r\n    const cx = s*0.088, cy = 0.085, cz = -0.012;\r\n    const a = s*0.55, ca = Math.cos(a), sa = Math.sin(a);\r\n    const lx = (x - cx)*ca - (z - cz)*sa, lz = (x - cx)*sa + (z - cz)*ca, ly = y - cy;\r\n    // bent so its edges curl medially: the iliac fossa is a bowl, the gluteal side convex\r\n    let blade = ellipsoid(lx + 3.2*(lz*lz + (ly - 0.01)*(ly - 0.01)), ly, lz, 0, 0, 0, 0.0075, 0.07, 0.078);\r\n    blade = smax(blade, -(ly + 0.045), 0.01);\r\n    d = smin(d, blade, 0.01);\r\n    const crest = [];\r\n    for (let i = 0; i \u003c= 8; i++) {\r\n      const t = lerp(-1.25, 1.25, i/8);\r\n      const px = Math.sin(t)*0.077, py = Math.cos(t)*0.064;\r\n      // the crest traced in the blade's plane, back in pelvis space\r\n      const bend = -3.2*(px*px + (py - 0.014)*(py - 0.014));      // follow the blade's curl\r\n      crest.push([cx + bend*ca + px*sa, cy + py - 0.004, cz - bend*sa + px*ca, 0.0075]);\r\n    }\r\n    d = smin(d, chain(x, y, z, crest, 0.006), 0.008);\r\n    // body of the ilium down to the socket, the socket, the ischium and its tuberosity\r\n    d = smin(d, cone(x, y, z, s*0.084, 0.05, -0.012, s*0.08, 0.004, -0.002, 0.021, 0.024), 0.014);\r\n    const sock = sphere(x, y, z, s*0.078, 0, 0, 0.029);\r\n    d = smin(d, sock, 0.012);\r\n    d = smax(d, -sphere(x, y, z, s*0.093, 0, 0, 0.025), 0.004);                      // acetabulum\r\n    d = smin(d, cone(x, y, z, s*0.072, -0.02, -0.012, s*0.058, -0.085, -0.03, 0.017, 0.014), 0.01);\r\n    // the pelvic ring: arcuate line to the pubis, pubic rami, the obturator loop\r\n    d = smin(d, chain(x, y, z, [[s*0.035, 0.07, -0.062, 0.011], [s*0.062, 0.04, -0.03, 0.01], [s*0.066, 0.008, 0.022, 0.011], [s*0.036, -0.018, 0.058, 0.011], [s*0.012, -0.03, 0.066, 0.012]], 0.006), 0.008);\r\n    d = smin(d, chain(x, y, z, [[s*0.012, -0.056, 0.058, 0.009], [s*0.034, -0.078, 0.028, 0.008], [s*0.056, -0.088, -0.018, 0.011]], 0.005), 0.006);\r\n    d = smin(d, capsule(x, y, z, s*0.012, -0.03, 0.066, s*0.012, -0.058, 0.058, 0.01), 0.006);\r\n  }\r\n  // sacrum: a curved wedge between the blades at the back, and the coccyx\r\n  const sac = [];\r\n  for (let i = 0; i \u003c= 5; i++) { const t = i/5; sac.push([0, lerp(0.1, -0.02, t), -0.066 - Math.sin(t*2.6)*0.016 + t*0.01, lerp(0.034, 0.012, t)]); }\r\n  let sd = chain(x, y, z, sac, 0.01);\r\n  sd = smax(sd, Math.abs(z + 0.07 + (y - 0.04)*0.25) - 0.022, 0.008);          // flatten front-to-back\r\n  d = smin(d, sd, 0.012);\r\n  d = smin(d, chain(x, y, z, [[0, -0.02, -0.06, 0.009], [0, -0.042, -0.05, 0.006], [0, -0.056, -0.038, 0.004]], 0.003), 0.004);\r\n  return d;\r\n}\r\n// long bones, each hanging from its joint (local y down)\r\nfunction humerus(x, y, z, s) {\r\n  let d = sphere(x, y, z, -s*0.006, -0.012, -0.006, 0.024);\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.018, 0.004, 0.016), 0.01);                   // tubercles\r\n  d = smin(d, chain(x, y, z, [[0, -0.03, 0, 0.014], [s*0.004, -0.1, 0.002, 0.012], [s*0.002, -0.2, 0, 0.010], [0, -0.27, 0, 0.011]], 0.01), 0.012);\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.288, -0.002, 0.031, 0.012, 0.014), 0.01);          // epicondyles\r\n  d = smin(d, sphere(x, y, z, -s*0.01, -0.298, 0.006, 0.011), 0.006);\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.297, 0.006, 0.01), 0.006);\r\n  return d;\r\n}\r\nfunction forearm(x, y, z, s) {\r\n  // ulna (inner, with the olecranon hooked up behind the elbow) and radius (outer)\r\n  let d = cone(x, y, z, -s*0.009, 0.014, -0.012, -s*0.01, -0.03, -0.004, 0.012, 0.011);\r\n  d = smin(d, chain(x, y, z, [[-s*0.01, -0.03, -0.004, 0.0105], [-s*0.011, -0.14, -0.002, 0.008], [-s*0.012, -0.245, 0, 0.0065]], 0.006), 0.008);\r\n  d = smin(d, sphere(x, y, z, -s*0.012, -0.25, 0.0, 0.0085), 0.004);\r\n  let r = cyl(x, y, z, s*0.012, -0.012, 0.004, 0.01, 0.006, 0.003);\r\n  r = smin(r, chain(x, y, z, [[s*0.012, -0.016, 0.004, 0.007], [s*0.016, -0.13, 0.006, 0.0075], [s*0.016, -0.235, 0.006, 0.011], [s*0.012, -0.252, 0.006, 0.013]], 0.006), 0.006);\r\n  return Math.min(d, r);\r\n}\r\nfunction femur(x, y, z, s) {\r\n  let d = sphere(x, y, z, 0, 0, 0, 0.025);                                             // head\r\n  d = smin(d, cone(x, y, z, 0, 0, 0, s*0.038, -0.036, -0.002, 0.016, 0.018), 0.01);     // neck\r\n  d = smin(d, sphere(x, y, z, s*0.046, -0.028, -0.008, 0.019), 0.012);                   // greater trochanter\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.065, -0.012, 0.01), 0.008);                    // lesser\r\n  d = smin(d, chain(x, y, z, [[s*0.036, -0.05, -0.002, 0.016], [s*0.022, -0.16, 0.008, 0.0145], [s*0.004, -0.3, 0.008, 0.0145], [-s*0.022, -0.405, 0.0, 0.019]], 0.012), 0.014);\r\n  for (const k of [-1, 1]) d = smin(d, ellipsoid(x, y, z, -s*0.03 + k*0.021, -0.425, -0.006, 0.019, 0.021, 0.028), 0.012);\r\n  return d;\r\n}\r\nfunction shin(x, y, z, s) {\r\n  let d = ellipsoid(x, y, z, 0, -0.016, -0.002, 0.037, 0.016, 0.03);                    // plateau\r\n  d = smin(d, sphere(x, y, z, 0, -0.05, 0.022, 0.011), 0.01);                            // tuberosity\r\n  d = smin(d, chain(x, y, z, [[0, -0.035, 0.004, 0.019], [0, -0.14, 0.008, 0.0135], [-s*0.002, -0.3, 0.004, 0.012], [-s*0.004, -0.38, 0, 0.016]], 0.012), 0.014);\r\n  d = smin(d, sphere(x, y, z, -s*0.016, -0.397, 0.001, 0.0115), 0.008);                  // medial malleolus\r\n  let f = chain(x, y, z, [[s*0.03, -0.035, -0.012, 0.01], [s*0.03, -0.2, -0.01, 0.0065], [s*0.028, -0.38, -0.008, 0.008]], 0.004);\r\n  f = smin(f, sphere(x, y, z, s*0.029, -0.405, -0.006, 0.011), 0.006);                   // lateral malleolus\r\n  return Math.min(d, f);\r\n}\r\nfunction patella(x, y, z) { return ellipsoid(x, y, z, 0, 0.018, 0.036, 0.021, 0.025, 0.011); }\r\nfunction foot(x, y, z, s) {\r\n  let d = ellipsoid(x, y, z, 0, -0.016, 0.0, 0.02, 0.016, 0.022);                        // talus\r\n  d = smin(d, ellipsoid(x, y, z, s*0.004, -0.038, -0.038, 0.017, 0.022, 0.034), 0.012);  // calcaneus\r\n  d = smin(d, ellipsoid(x, y, z, -s*0.004, -0.032, 0.03, 0.028, 0.014, 0.02), 0.01);     // tarsals\r\n  const toes = [[-s*0.022, 1.0], [-s*0.006, 0.82], [s*0.008, 0.78], [s*0.02, 0.72], [s*0.031, 0.64]];\r\n  for (let i = 0; i \u003c 5; i++) {\r\n    const [tx, L] = toes[i], r = i === 0 ? 0.009 : 0.0058;\r\n    const bx = tx*0.8, bz = 0.045;\r\n    const mz = bz + 0.072*L, tz = mz + (i === 0 ? 0.052 : 0.045)*L;\r\n    d = smin(d, chain(x, y, z, [[bx, -0.036, bz, r*1.1], [tx, -0.05, mz, r], [tx, -0.055, mz + 0.01, r*0.95], [tx, -0.056, tz, r*0.75]], 0.004), 0.006);\r\n  }\r\n  return d;\r\n}\r\nfunction carpals(x, y, z, s) {\r\n  let d = Infinity;\r\n  for (let i = 0; i \u003c 4; i++) for (let row = 0; row \u003c 2; row++) {\r\n    const zz = lerp(0.016, -0.018, i/3), yy = -0.008 - row*0.013;\r\n    d = smin(d, sphere(x, y, z, 0, yy, zz, 0.0082 - row*0.0006), 0.006);\r\n  }\r\n  return d;\r\n}\r\n// fingers: z offsets across the hanging hand (palm toward the body), index at the front\r\nconst FINGERS = [\r\n  { z: 0.018, meta: 0.064, ph: [0.04, 0.024, 0.018] },\r\n  { z: 0.005, meta: 0.062, ph: [0.044, 0.027, 0.019] },\r\n  { z: -0.008, meta: 0.058, ph: [0.041, 0.026, 0.018] },\r\n  { z: -0.02, meta: 0.052, ph: [0.033, 0.019, 0.016] },\r\n];\r\n\r\n// ------------------------------------------------------------------ ribs (swept)\r\n// chest-node frame. Rib k (0 = first) hangs from thoracic vertebra T(k+1).\r\nconst T_Y = k => 0.268 - k*0.0223;                           // thoracic vertebra heights (T1 top)\r\nconst T_Z = y => -0.026*Math.sin(Math.PI*y/0.29);            // the thoracic curve (kyphosis)\r\nconst RIB = {\r\n  halfw: [0.058, 0.082, 0.098, 0.11, 0.12, 0.127, 0.131, 0.132, 0.128, 0.12, 0.104, 0.086],\r\n  depth: [0.118, 0.148, 0.168, 0.182, 0.192, 0.196, 0.196, 0.188, 0.172, 0.148, 0.098, 0.066],\r\n  drop: [0.028, 0.048, 0.066, 0.082, 0.092, 0.098, 0.102, 0.102, 0.098, 0.088, 0.06, 0.04],\r\n  end: [0.84, 0.86, 0.86, 0.86, 0.85, 0.84, 0.83, 0.79, 0.75, 0.71, 0.55, 0.47],\r\n};\r\nconst STERNUM = { top: [0, 0.228, 0.118], bot: [0, 0.07, 0.186] };\r\nconst sternum_at = t => [0, lerp(STERNUM.top[1], STERNUM.bot[1], t), lerp(STERNUM.top[2], STERNUM.bot[2], t)];\r\n\r\nfunction rib_points(k, s) {\r\n  const y0 = T_Y(k), z0 = T_Z(y0);\r\n  const hw = RIB.halfw[k], dp = RIB.depth[k], dr = RIB.drop[k];\r\n  const pts = [[s*0.024, y0, z0 - 0.012]];\r\n  const back = 0.035;                                         // the rib's angle, behind the spine\r\n  const N = 18;\r\n  for (let i = 0; i \u003c= N; i++) {\r\n    const th = lerp(0.16, RIB.end[k]*Math.PI, i/N);\r\n    const x = s*hw*Math.sin(th)*(1 - 0.08*Math.sin(th*2));\r\n    const z = z0 - back + (dp*0.5 + back)*(1 - Math.cos(th)) - 0.01;\r\n    const y = y0 - dr*(1 - Math.cos(th))/2;\r\n    pts.push([x, y, z]);\r\n  }\r\n  return pts;\r\n}\r\nfunction cartilage_points(k, s, rib_end) {\r\n  // ribs 1-7 reach the sternum; 8-10 join the cartilage above; 11-12 float\r\n  if (k >= 10) return null;\r\n  const e = rib_end;\r\n  let tgt;\r\n  if (k \u003c 7) tgt = sternum_at([0.02, 0.1, 0.25, 0.4, 0.55, 0.7, 0.82][k]);\r\n  else tgt = [s*(0.06 - (k - 7)*0.004), T_Y(6) - RIB.drop[6] - 0.012 - (k - 7)*0.018, 0.17 - (k - 7)*0.012];\r\n  const tx = k \u003c 7 ? s*0.016 : tgt[0];\r\n  const pts = [];\r\n  for (let i = 0; i \u003c= 8; i++) {\r\n    const t = i/8;\r\n    // bend upward toward the sternum (the costal margin), more for the lower ribs\r\n    const lift = Math.sin(t*Math.PI*0.5)*(k > 4 ? 0.025 + (k - 4)*0.006 : 0.004);\r\n    pts.push([lerp(e[0], tx, t), lerp(e[1], tgt[1], t) + lift*(1 - t)*0.8, lerp(e[2], tgt[2], t)]);\r\n  }\r\n  return pts;\r\n}\r\n\r\n// ------------------------------------------------------------------ build all meshes\r\n// Returns { node_name: [geometries...] } in each node's own frame, plus the finger segments.\r\nexport function build_skeleton_geometry(res = 1) {\r\n  const H = h => h*res;\r\n  const G = {};\r\n  const add = (node, g) => { (G[node] = G[node] || []).push(g); };\r\n  // skull and jaw (head / jaw nodes)\r\n  add('head', mesh_sdf(skull, [-0.085, -0.06, -0.125, 0.085, 0.155, 0.13], H(0.0028)*0.8));\r\n  add('jaw', mesh_sdf(mandible, [-0.065, -0.1, -0.025, 0.065, 0.015, 0.09], H(0.0024)*0.85));\r\n  // spine: lumbar (spine node), thoracic (chest), cervical (neck)\r\n  add('spine', mesh_sdf((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let i = 0; i \u003c 5; i++) { const yc = 0.015 + i*0.034; d = Math.min(d, vertebra(x, y, z, yc, 0.014*Math.sin(Math.PI*yc/0.18), 0.021 - i*0.0008, 0.0115, 0.028, 0.004, 0.028)); }\r\n    return d;\r\n  }, [-0.06, -0.01, -0.075, 0.06, 0.2, 0.04], H(0.0024)));\r\n  add('chest', mesh_sdf((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let k = 0; k \u003c 12; k++) { const yc = T_Y(k); d = Math.min(d, vertebra(x, y, z, yc, T_Z(yc), 0.0125 + k*0.0006, 0.0085, 0.03, 0.02 - Math.abs(k - 6)*0.001, 0.024)); }\r\n    return d;\r\n  }, [-0.05, -0.03, -0.1, 0.05, 0.29, 0.03], H(0.0022)));\r\n  add('neck', mesh_sdf((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let i = 0; i \u003c 7; i++) { const yc = 0.008 + i*0.0165; d = Math.min(d, vertebra(x, y, z, yc, 0.012*Math.sin(Math.PI*yc/0.12), 0.0105 - i*0.0003, 0.006, i === 0 ? 0.03 : 0.014, 0.006, 0.02)); }\r\n    return d;\r\n  }, [-0.045, -0.01, -0.07, 0.045, 0.13, 0.03], H(0.002)));\r\n  // pelvis and sacrum\r\n  add('pelvis', mesh_sdf(pelvis, [-0.18, -0.11, -0.12, 0.18, 0.17, 0.09], H(0.0028)*1.15));\r\n  // ribcage: ribs, costal cartilage, sternum, scapulae, clavicles (chest node)\r\n  for (const s of [-1, 1]) for (let k = 0; k \u003c 12; k++) {\r\n    const rp = rib_points(k, s);\r\n    add('chest', sweep(rp, 0.0062, 0.0031, t => (t \u003c 0.08 ? 0.75 + t*3 : 1 - Math.max(0, t - 0.7)*0.6), [0, 1, 0], 8));\r\n    const cp = cartilage_points(k, s, rp[rp.length - 1]);\r\n    if (cp) add('chest', sweep(cp, 0.0048, 0.0028, () => 1, [0, 1, 0], 6));\r\n  }\r\n  add('chest', mesh_sdf((x, y, z) => {\r\n    // sternum: manubrium, body, xiphoid, tilted with the chest\r\n    let d = Infinity;\r\n    const P = [0, 0.08, 0.3, 0.55, 0.8, 0.95, 1.05].map(t => { const p = sternum_at(Math.min(t, 1)); return [p[0], p[1] - (t > 1 ? 0.012 : 0), p[2] + (t > 1 ? 0.005 : 0), t \u003c 0.15 ? 0.022 : t > 1 ? 0.006 : 0.014]; });\r\n    d = chain(x, y, z, P, 0.01);\r\n    d = smax(d, Math.abs((z - lerp(0.118, 0.186, (0.228 - y)/0.158))) - 0.0065, 0.004);   // flatten front-to-back\r\n    // scapulae: thin triangular blades on the back, the spine ridge, the acromion\r\n    for (const s of [-1, 1]) {\r\n      const cx = s*0.095, cy = 0.165, cz = -0.078;\r\n      const a = s*0.42, ca = Math.cos(a), sa = Math.sin(a);\r\n      const lx = (x - cx)*ca + (z - cz)*sa, lz = -(x - cx)*sa + (z - cz)*ca, ly = y - cy;\r\n      let b = ellipsoid(lx, ly, lz, 0, 0, 0, 0.052, 0.072, 0.006);\r\n      b = smax(b, (ly + 0.9*(Math.abs(lx) - 0.01)*s*0) - 0.06, 0.01);\r\n      b = smin(b, chain(lx, ly, lz, [[-0.045, 0.035, -0.004, 0.005], [0.03, 0.05, -0.012, 0.007], [0.065, 0.06, 0.005, 0.009]], 0.004), 0.006);\r\n      d = smin(d, b, 0.004);\r\n      d = smin(d, sphere(x, y, z, s*0.168, 0.248, -0.012, 0.014), 0.012);                  // glenoid rim / acromion\r\n    }\r\n    return d;\r\n  }, [-0.22, 0.03, -0.12, 0.22, 0.29, 0.21], H(0.0026)));\r\n  for (const s of [-1, 1]) {\r\n    const cl = [[s*0.016, 0.232, 0.118], [s*0.06, 0.242, 0.122], [s*0.11, 0.25, 0.09], [s*0.15, 0.256, 0.03], [s*0.166, 0.255, -0.004]];\r\n    const pts = [];\r\n    for (let i = 0; i \u003c= 12; i++) {\r\n      const t = i/12*(cl.length - 1), a = Math.floor(Math.min(t, cl.length - 2)), f = t - a;\r\n      pts.push([0, 1, 2].map(c => lerp(cl[a][c], cl[a + 1][c], f)));\r\n    }\r\n    add('chest', sweep(pts, 0.0075, 0.0055, t => 1 + 0.25*Math.abs(t - 0.5)*2, [0, 1, 0], 8));\r\n  }\r\n  // limbs, per side\r\n  for (const s of [-1, 1]) {\r\n    const S = s > 0 ? 'L' : 'R';\r\n    add('upper' + S, mesh_sdf((x, y, z) => humerus(x, y, z, s), [-0.045, -0.32, -0.04, 0.045, 0.02, 0.04], H(0.0026)*1.3));\r\n    add('fore' + S, mesh_sdf((x, y, z) => forearm(x, y, z, s), [-0.035, -0.27, -0.03, 0.035, 0.03, 0.03], H(0.0022)*1.25));\r\n    add('hand' + S, mesh_sdf((x, y, z) => carpals(x, y, z, s), [-0.015, -0.035, -0.03, 0.015, 0.005, 0.03], H(0.0016)));\r\n    add('thigh' + S, mesh_sdf((x, y, z) => femur(x, y, z, s), [-0.08, -0.46, -0.05, 0.08, 0.035, 0.05], H(0.003)*1.3));\r\n    add('shin' + S, mesh_sdf((x, y, z) => shin(x, y, z, s), [-0.055, -0.42, -0.04, 0.055, 0.005, 0.045], H(0.0027)*1.3));\r\n    add('knee' + S, mesh_sdf(patella, [-0.025, -0.01, 0.02, 0.025, 0.045, 0.05], H(0.002)));\r\n    add('foot' + S, mesh_sdf((x, y, z) => foot(x, y, z, s), [-0.05, -0.07, -0.08, 0.05, 0.005, 0.17], H(0.0021)));\r\n    // metacarpals (rigid with the hand) and the finger segments (each its own joint)\r\n    add('hand' + S, mesh_sdf((x, y, z) => {\r\n      let d = Infinity;\r\n      for (const f of FINGERS) d = Math.min(d, cone(x, y, z, 0, -0.028, f.z*0.8, 0, -0.028 - f.meta, f.z, 0.0058, 0.0052), smin(d, sphere(x, y, z, 0, -0.028 - f.meta, f.z, 0.0064), 0.003));\r\n      // thumb metacarpal, angled out toward the front\r\n      d = Math.min(d, cone(x, y, z, 0, -0.02, 0.022, s*0.012, -0.055, 0.046, 0.0065, 0.0058));\r\n      return d;\r\n    }, [-0.02, -0.1, -0.03, 0.02, -0.01, 0.06], H(0.0016)));\r\n    FINGERS.forEach((f, i) => f.ph.forEach((L, j) => {\r\n      const r = (0.0052 - j*0.0009)*(i === 3 ? 0.85 : 1);\r\n      add(`finger${S}${i}_${j}`, mesh_sdf((x, y, z) => smin(cone(x, y, z, 0, 0, 0, 0, -L, 0, r, r*0.82), sphere(x, y, z, 0, -L, 0, r*0.95), 0.002), [-0.009, -L - 0.008, -0.009, 0.009, 0.008, 0.009], H(0.0014)));\r\n    }));\r\n    [0.034, 0.026].forEach((L, j) => {\r\n      const r = 0.006 - j*0.001;\r\n      add(`thumb${S}_${j}`, mesh_sdf((x, y, z) => smin(cone(x, y, z, 0, 0, 0, 0, -L, 0, r, r*0.85), sphere(x, y, z, 0, -L, 0, r), 0.002), [-0.01, -L - 0.008, -0.01, 0.01, 0.008, 0.01], H(0.0014)));\r\n    });\r\n  }\r\n  // merge each node's pieces\r\n  const out = {};\r\n  for (const k in G) {\r\n    const gs = G[k].map(g => { const n = g.index ? g : g; if (!n.attributes.uv) n.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(n.attributes.position.count*2), 2)); return n; });\r\n    out[k] = gs.length === 1 ? gs[0] : mergeGeometries(gs, false);\r\n  }\r\n  return out;\r\n}\r\nexport { FINGERS };\r\n","game/snakes.js":"// snakes.js -- the snakes (round 3; owner: \"the ones in the game have the wrong shape ... snake\r\n// 03 feels fine, it's not an issue of species, it's just general shape\"). Astra's snake 03 (a\r\n// mamba-like build): long and slender, one continuous body lying in wide smooth S-curves, the\r\n// neck lifted off the ground in a curve so the narrow, elongated head rides level above it, a\r\n// long thin tail.\r\n//\r\n// Each snake is one tube mesh rebuilt every frame along its head's trail (serpentine\r\n// locomotion: the body follows exactly where the head went). The front of the body rises\r\n// off the ground; the head is part of the same tube, shaped by the radius profile and a\r\n// flatter section. Glossy scales, a paler belly, dark glassy eyes.\r\n//\r\n// Behaviour is still a placeholder: they come out of the dark toward the egg; within reach of\r\n// the lich they shrink away and another comes (no attacks drawn yet).\r\nimport * as THREE from 'three';\r\nimport { make_rng, clamp, smoothstep, lerp } from 'game/util.js';\r\nimport { gi_dynamic } from 'game/gi.js';\r\n\r\nconst LEN = 4.4, R0 = 0.08;                   // body length and body radius, metres (03 build, dream-sized: readable from the room camera)\r\nconst RINGS = 72, SIDES = 12;\r\nconst RAISE = 0.34, RAISE_LEN = 1.1;           // the head rides this high; the neck curve spans this much body\r\n// rings crowd toward the snout (about 14 in the first 20 cm) so the head has a shape\r\nconst S_AT = i => LEN*Math.pow(i/(RINGS - 1), 1.6);\r\nconst I_AT = sl => (RINGS - 1)*Math.pow(sl/LEN, 1/1.6);\r\n\r\n// radius profile along the body, s = 0 at the snout, in body radii; and the section's height\r\nfunction radius_at(s) {\r\n  if (s \u003c 0.012) return lerp(0.18, 0.45, s/0.012);\r\n  if (s \u003c 0.05) return lerp(0.45, 0.82, (s - 0.012)/0.038);\r\n  if (s \u003c 0.085) return lerp(0.82, 0.95, (s - 0.05)/0.035);        // the head's widest, at the jaw\r\n  if (s \u003c 0.115) return lerp(0.95, 0.68, (s - 0.085)/0.03);        // the neck\r\n  if (s \u003c 0.3) return lerp(0.68, 0.98, smoothstep(0.115, 0.3, s));\r\n  const tail0 = LEN*0.62;\r\n  if (s \u003c tail0) return 1.0;\r\n  return lerp(1.0, 0.07, Math.pow((s - tail0)/(LEN - tail0), 0.85));\r\n}\r\nconst flat_at = s => (s \u003c 0.11 ? 0.62 : lerp(0.62, 0.84, smoothstep(0.11, 0.3, s)));   // head flatter than body\r\n\r\n// scale texture: dark olive-bronze back with overlapping scale rows, pale belly\r\nfunction scale_texture() {\r\n  const W = 64, H = 256;\r\n  const c = document.createElement('canvas'); c.width = W; c.height = H;\r\n  const g = c.getContext('2d');\r\n  const img = g.createImageData(W, H), d = img.data;\r\n  for (let y = 0; y \u003c H; y++) for (let x = 0; x \u003c W; x++) {\r\n    const u = x/W;                                                // around: 0.5 = back, 0/1 = belly\r\n    const back = Math.cos((u - 0.5)*Math.PI*2)*0.5 + 0.5;         // 1 on the back, 0 on the belly\r\n    const row = (y + (Math.floor(x/4) % 2)*2) % 4, col = x % 4;\r\n    const dia = Math.abs(col - 1.5) + Math.abs(row - 1.5);\r\n    let k = dia \u003c 1.4 ? 1.0 : dia \u003c 2.4 ? 0.86 : 0.7;\r\n    const belly = smoothstep(0.35, 0.1, back);\r\n    const top = [60, 56, 44], side = [84, 78, 59], bel = [140, 130, 100];      // dark olive-bronze: a silhouette on the brown floor\r\n    let col3 = back > 0.6 ? top : side;\r\n    col3 = col3.map((v, i) => lerp(v, bel[i], belly));\r\n    if (belly > 0.5) k = (y % 6 === 0) ? 0.78 : 1.0;             // belly plates\r\n    const i = (y*W + x)*4;\r\n    d[i] = col3[0]*k; d[i + 1] = col3[1]*k; d[i + 2] = col3[2]*k; d[i + 3] = 255;\r\n  }\r\n  g.putImageData(img, 0, 0);\r\n  const t = new THREE.CanvasTexture(c);\r\n  t.colorSpace = THREE.SRGBColorSpace;\r\n  t.wrapS = t.wrapT = THREE.RepeatWrapping;\r\n  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;\r\n  return t;\r\n}\r\n\r\nexport function create_snakes(R, cave, get_lich_pos, count = 9, seed = 5) {\r\n  const rng = make_rng(seed);\r\n  const mat = new THREE.MeshStandardMaterial({ map: scale_texture(), roughness: 0.3, metalness: 0.0 });\r\n  if (cave.GU) gi_dynamic(mat, cave.GU);\r\n  // scales are glossy: their edges catch whatever light is around (the bounce light included),\r\n  // which draws the body's outline against the floor\r\n  {\r\n    const prev = mat.onBeforeCompile;\r\n    mat.onBeforeCompile = (sh, r) => {\r\n      prev(sh, r);\r\n      sh.fragmentShader = sh.fragmentShader.replace('#include \u003clights_fragment_end>', `#include \u003clights_fragment_end>\r\n  {\r\n    float rim = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.6);\r\n    vec3 amb = reflectedLight.indirectDiffuse/max(diffuseColor.rgb, vec3(0.05)) + reflectedLight.directDiffuse/max(diffuseColor.rgb, vec3(0.05));\r\n    reflectedLight.indirectSpecular += rim*amb*0.55;\r\n  }`);\r\n    };\r\n    mat.customProgramCacheKey = () => 'snake_gi_rim';\r\n  }\r\n  const eye_mat = new THREE.MeshStandardMaterial({ color: 0x0b0a08, roughness: 0.08, metalness: 0.0 });\r\n  const eye_geo = new THREE.SphereGeometry(1, 8, 6);\r\n  const egg = cave.egg.position;\r\n  const S = [];\r\n\r\n  // one tube geometry per snake, rewritten each frame\r\n  const make_mesh = () => {\r\n    const n = RINGS*SIDES + 2;\r\n    const g = new THREE.BufferGeometry();\r\n    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3), 3));\r\n    g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(n*3), 3));\r\n    const uv = new Float32Array(n*2);\r\n    for (let i = 0; i \u003c RINGS; i++) for (let j = 0; j \u003c SIDES; j++) { const o = (i*SIDES + j)*2; uv[o] = j/SIDES; uv[o + 1] = S_AT(i)*4; }\r\n    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));\r\n    const idx = [];\r\n    for (let i = 0; i \u003c RINGS - 1; i++) for (let j = 0; j \u003c SIDES; j++) {\r\n      const a = i*SIDES + j, b = i*SIDES + (j + 1)%SIDES, c = (i + 1)*SIDES + (j + 1)%SIDES, d = (i + 1)*SIDES + j;\r\n      idx.push(a, d, c, a, c, b);\r\n    }\r\n    const tip = RINGS*SIDES, end = tip + 1;\r\n    for (let j = 0; j \u003c SIDES; j++) { idx.push(tip, (j + 1)%SIDES, j); idx.push(end, (RINGS - 1)*SIDES + j, (RINGS - 1)*SIDES + (j + 1)%SIDES); }\r\n    g.setIndex(idx);\r\n    const m = new THREE.Mesh(g, mat);\r\n    m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;\r\n    R.world_scene.add(m);\r\n    const eyes = [0, 1].map(() => { const e = new THREE.Mesh(eye_geo, eye_mat); e.castShadow = false; R.world_scene.add(e); return e; });\r\n    return { m, eyes };\r\n  };\r\n\r\n  const spawn = (s, delay) => {\r\n    let th;\r\n    do th = rng.float(0, Math.PI*2); while (Math.abs(Math.atan2(Math.sin(th + Math.PI/2), Math.cos(th + Math.PI/2))) \u003c 0.5);\r\n    const r = rng.float(14.0, 15.8);\r\n    s.x = Math.cos(th)*r; s.z = Math.sin(th)*r;\r\n    s.dir = Math.atan2(-s.z, -s.x) + rng.spread(0.3);\r\n    s.phase = rng.float(0, 6.28); s.speed = rng.float(1.0, 1.35);\r\n    s.wave = rng.float(0.95, 1.2);                               // wavelength of the S, metres\r\n    s.amp = rng.float(0.55, 0.75);                                // heading swing, radians\r\n    s.trail = [];\r\n    for (let i = 0; i \u003c 400; i++) s.trail.push([s.x - Math.cos(s.dir)*i*0.01, s.z - Math.sin(s.dir)*i*0.01]);\r\n    s.dying = -1; s.delay = delay; s.scale = 1; s.dist = 0;\r\n  };\r\n  for (let i = 0; i \u003c count; i++) { const s = make_mesh(); spawn(s, i*0.9); S.push(s); }\r\n\r\n  const P = [], T = new THREE.Vector3(), Nn = new THREE.Vector3(), Bn = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);\r\n  for (let i = 0; i \u003c RINGS; i++) P.push(new THREE.Vector3());\r\n\r\n  function update(t, dt) {\r\n    const L = get_lich_pos();\r\n    for (const s of S) {\r\n      if (s.delay > 0) { s.delay -= dt; s.m.visible = false; s.eyes.forEach(e => (e.visible = false)); continue; }\r\n      s.m.visible = true; s.eyes.forEach(e => (e.visible = true));\r\n      if (s.dying >= 0) {\r\n        s.dying += dt;\r\n        s.scale = clamp(1 - s.dying/0.5, 0, 1);\r\n        if (s.dying > 0.5) spawn(s, rng.float(0.2, 1.4));\r\n      } else {\r\n        // serpentine: steer at the egg, swinging the heading so the path is a steady S\r\n        s.dist += s.speed*dt;\r\n        const want = Math.atan2(egg.z - s.z, egg.x - s.x) + Math.sin(s.dist/s.wave*Math.PI*2 + s.phase)*s.amp;\r\n        let d = want - s.dir; d = Math.atan2(Math.sin(d), Math.cos(d));\r\n        s.dir += clamp(d, -5*dt, 5*dt);\r\n        s.x += Math.cos(s.dir)*s.speed*dt; s.z += Math.sin(s.dir)*s.speed*dt;\r\n        const last = s.trail[0];\r\n        if (Math.hypot(s.x - last[0], s.z - last[1]) > 0.01) s.trail.unshift([s.x, s.z]);\r\n        if (s.trail.length > 600) s.trail.length = 600;\r\n        const dl = Math.hypot(s.x - L.x, s.z - L.z), de = Math.hypot(s.x - egg.x, s.z - egg.z);\r\n        if (dl \u003c 1.5 || de \u003c 1.1) s.dying = 0;          // placeholder: they reach the light, then dissolve\r\n      }\r\n      build(s);\r\n    }\r\n  }\r\n\r\n  // the spine: points along the trail by arc length, the front raised into a neck curve\r\n  function build(s) {\r\n    let acc = 0, ti = 0;\r\n    const sc = s.scale;\r\n    for (let i = 0; i \u003c RINGS; i++) {\r\n      const target = S_AT(i);\r\n      let x = s.trail[s.trail.length - 1][0], z = s.trail[s.trail.length - 1][1];\r\n      while (ti \u003c s.trail.length - 1) {\r\n        const a = s.trail[ti], b = s.trail[ti + 1];\r\n        const l = Math.hypot(b[0] - a[0], b[1] - a[1]);\r\n        if (acc + l >= target) { const f = (target - acc)/(l || 1); x = a[0] + (b[0] - a[0])*f; z = a[1] + (b[1] - a[1])*f; break; }\r\n        acc += l; ti++;\r\n      }\r\n      const r = R0*radius_at(target)*sc;\r\n      // the neck lifts the head: a smooth rise over the front RAISE_LEN metres\r\n      const lift = RAISE*smoothstep(RAISE_LEN, 0.05, target)*sc;\r\n      P[i].set(x, cave.ground_y(x, z) + r*flat_at(target) + lift, z);\r\n    }\r\n    const pos = s.m.geometry.attributes.position.array, nor = s.m.geometry.attributes.normal.array;\r\n    for (let i = 0; i \u003c RINGS; i++) {\r\n      const a = P[Math.max(0, i - 1)], b = P[Math.min(RINGS - 1, i + 1)];\r\n      T.subVectors(a, b).normalize();                             // pointing toward the head\r\n      Bn.crossVectors(T, UP).normalize();                         // sideways\r\n      Nn.crossVectors(Bn, T).normalize();                         // up, square to the body\r\n      const target = S_AT(i);\r\n      const r = R0*radius_at(target)*sc, fl = flat_at(target);\r\n      for (let j = 0; j \u003c SIDES; j++) {\r\n        const ang = j/SIDES*Math.PI*2;                            // 0 = belly, pi = back\r\n        const cx = Math.sin(ang), cy = -Math.cos(ang);\r\n        const fy = cy \u003c 0 ? fl*0.8 : fl;                          // a flatter belly\r\n        const o = (i*SIDES + j)*3;\r\n        pos[o] = P[i].x + Bn.x*cx*r + Nn.x*cy*r*fy;\r\n        pos[o + 1] = P[i].y + Bn.y*cx*r + Nn.y*cy*r*fy;\r\n        pos[o + 2] = P[i].z + Bn.z*cx*r + Nn.z*cy*r*fy;\r\n        const nx = Bn.x*cx + Nn.x*cy/fy, ny = Bn.y*cx + Nn.y*cy/fy, nz = Bn.z*cx + Nn.z*cy/fy;\r\n        const l = Math.hypot(nx, ny, nz) || 1;\r\n        nor[o] = nx/l; nor[o + 1] = ny/l; nor[o + 2] = nz/l;\r\n      }\r\n    }\r\n    // snout tip and tail tip\r\n    const tip = RINGS*SIDES*3, end = tip + 3;\r\n    T.subVectors(P[0], P[1]).normalize();\r\n    pos[tip] = P[0].x + T.x*R0*0.25*sc; pos[tip + 1] = P[0].y + T.y*R0*0.25*sc; pos[tip + 2] = P[0].z + T.z*R0*0.25*sc;\r\n    nor[tip] = T.x; nor[tip + 1] = T.y; nor[tip + 2] = T.z;\r\n    pos[end] = P[RINGS - 1].x; pos[end + 1] = P[RINGS - 1].y; pos[end + 2] = P[RINGS - 1].z;\r\n    nor[end] = -T.x; nor[end + 1] = 0; nor[end + 2] = -T.z;\r\n    s.m.geometry.attributes.position.needsUpdate = true;\r\n    s.m.geometry.attributes.normal.needsUpdate = true;\r\n    // eyes: on the sides of the head, a little up, near the front of the widest part\r\n    const ei = Math.round(I_AT(0.055));\r\n    const a = P[Math.max(0, ei - 1)], b = P[ei + 1];\r\n    T.subVectors(a, b).normalize(); Bn.crossVectors(T, UP).normalize(); Nn.crossVectors(Bn, T).normalize();\r\n    const rr = R0*radius_at(0.055)*sc;\r\n    s.eyes.forEach((e, k) => {\r\n      const side = k ? 1 : -1;\r\n      e.position.copy(P[ei]).addScaledVector(Bn, side*rr*0.8).addScaledVector(Nn, rr*0.18);   // set into the side of the head\r\n      e.scale.setScalar(R0*0.12*sc);\r\n    });\r\n  }\r\n  return { update, S };\r\n}\r\n","game/textures.js":"// textures.js -- every texture is generated here (canvas), no files.\r\n//\r\n// TEXEL DENSITY RULE (Sun Court, retro-shooter/STYLE.md): world surfaces use 32 texels per metre,\r\n// world-space UVs (cave.js projects every face onto its dominant axis), NearestMipmapNearest.\r\n// Tones are quantized into a few flat steps so surfaces read as painted pixels, never noise.\r\n//\r\n// Palette: the It Follows egg cover (/artifacts, it-follows-3.jpg) -- near-black cool rock,\r\n// brown-grey slabs whose edges catch warm bronze, a cream-yellow pool of light, a pale egg,\r\n// dark bronze snakes.\r\nimport * as THREE from 'three';\r\n\r\nexport const TEXELS_PER_METER = 32;\r\n\r\nexport function finish(canvas, { srgb = true, repeat = true, mips = true } = {}) {\r\n  const t = new THREE.CanvasTexture(canvas);\r\n  t.magFilter = THREE.NearestFilter;\r\n  t.minFilter = mips ? THREE.NearestMipmapNearestFilter : THREE.NearestFilter;\r\n  t.generateMipmaps = mips;\r\n  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;\r\n  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;\r\n  t.anisotropy = 1;\r\n  t.needsUpdate = true;\r\n  return t;\r\n}\r\n\r\nfunction painter(w, h) {\r\n  const c = document.createElement('canvas');\r\n  c.width = w; c.height = h;\r\n  const g = c.getContext('2d');\r\n  const img = g.createImageData(w, h);\r\n  const d = img.data;\r\n  const cl = v => (v \u003c 0 ? 0 : v > 255 ? 255 : v | 0);\r\n  return {\r\n    w, h,\r\n    set(x, y, rgb) {\r\n      x = ((x % w) + w) % w; y = ((y % h) + h) % h;\r\n      const i = (y*w + x)*4;\r\n      d[i] = cl(rgb[0]); d[i + 1] = cl(rgb[1]); d[i + 2] = cl(rgb[2]); d[i + 3] = 255;\r\n    },\r\n    get(x, y) {\r\n      x = ((x % w) + w) % w; y = ((y % h) + h) % h;\r\n      const i = (y*w + x)*4;\r\n      return [d[i], d[i + 1], d[i + 2]];\r\n    },\r\n    done(opts) { g.putImageData(img, 0, 0); return finish(c, opts); },\r\n  };\r\n}\r\n\r\nconst mix = (a, b, t) => [a[0] + (b[0] - a[0])*t, a[1] + (b[1] - a[1])*t, a[2] + (b[2] - a[2])*t];\r\nconst mul = (a, k) => [a[0]*k, a[1]*k, a[2]*k];\r\n\r\nfunction lattice_hash(ix, iy, seed) {\r\n  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 1442695041);\r\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\r\n  h ^= h >>> 16;\r\n  return (h >>> 0)/4294967296;\r\n}\r\nfunction vnoise(x, y, px, py, seed) {\r\n  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;\r\n  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy);\r\n  const m = (a, p) => ((a % p) + p) % p;\r\n  const a = lattice_hash(m(ix, px), m(iy, py), seed), b = lattice_hash(m(ix + 1, px), m(iy, py), seed);\r\n  const c = lattice_hash(m(ix, px), m(iy + 1, py), seed), d = lattice_hash(m(ix + 1, px), m(iy + 1, py), seed);\r\n  return (a + (b - a)*u) + ((c + (d - c)*u) - (a + (b - a)*u))*v;\r\n}\r\n// tileable fbm over a w x h texture; cells = lattice cells across the width at octave 0\r\nfunction fbm(x, y, w, h, cells, seed, oct = 3) {\r\n  let s = 0, amp = 1, tot = 0, f = 1;\r\n  for (let o = 0; o \u003c oct; o++) {\r\n    const cx = cells*f, cy = Math.max(1, Math.round(cells*f*h/w));\r\n    s += amp*vnoise(x/w*cx, y/h*cy, cx, cy, seed + o*101);\r\n    tot += amp; amp *= 0.5; f *= 2;\r\n  }\r\n  return s/tot;\r\n}\r\n// tileable cellular (nearest point) noise: returns [d1, d2, cell id]\r\nfunction cells2(x, y, w, h, n, seed) {\r\n  const gx = x/w*n, gy = y/h*n;\r\n  const ix = Math.floor(gx), iy = Math.floor(gy);\r\n  let d1 = 9, d2 = 9, id = 0;\r\n  for (let j = -1; j \u003c= 1; j++) for (let i = -1; i \u003c= 1; i++) {\r\n    const cx = ix + i, cy = iy + j;\r\n    const wx = ((cx % n) + n) % n, wy = ((cy % n) + n) % n;\r\n    const px = cx + lattice_hash(wx, wy, seed), py = cy + lattice_hash(wx, wy, seed + 7);\r\n    const d = Math.hypot(gx - px, gy - py);\r\n    if (d \u003c d1) { d2 = d1; d1 = d; id = lattice_hash(wx, wy, seed + 13); } else if (d \u003c d2) d2 = d;\r\n  }\r\n  return [d1, d2, id];\r\n}\r\n\r\nexport const PAL = {\r\n  // albedo of real cave rock (the darkness comes from the light, round 2): ~0.12-0.35 linear\r\n  rock_hi: [168, 150, 126], rock: [136, 121, 103], rock_mid: [114, 102, 89], rock_lo: [90, 81, 72], rock_deep: [64, 58, 53],\r\n  bronze: [186, 146, 96],\r\n  floor_hi: [164, 142, 110], floor: [132, 114, 90], floor_lo: [104, 90, 74], floor_deep: [76, 67, 57],\r\n  egg_hi: [222, 212, 190], egg: [204, 192, 167], egg_lo: [178, 165, 138], egg_spot: [128, 108, 84],\r\n  bone: [236, 228, 212],\r\n  scale_hi: [104, 84, 56], scale: [62, 50, 36], scale_lo: [38, 31, 24], scale_belly: [120, 100, 70],\r\n};\r\n\r\n// Rock: broad chipped facets (cellular patches), each a flat tone, a pale chip edge where two\r\n// patches meet on the lit side -- the cover's palette-knife slabs, at 32 texels/m.\r\nexport function rock(seed = 11, S = 64) {\r\n  const P = painter(S, S);\r\n  const tones = [PAL.rock_deep, PAL.rock_lo, PAL.rock_mid, PAL.rock, PAL.rock_hi];\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const [d1, d2, id] = cells2(x + 0.5, y + 0.5, S, S, 5, seed);\r\n    const n = fbm(x, y, S, S, 4, seed + 3, 2);\r\n    let k = Math.floor(id*3.2 + n*1.6);               // 0..4 flat tone per patch\r\n    k = Math.max(0, Math.min(4, k));\r\n    let c = tones[k];\r\n    const edge = d2 - d1;\r\n    if (edge \u003c 0.07) c = tones[Math.max(0, k - 2)];    // dark crack between facets\r\n    else if (edge \u003c 0.13 && ((x + y) & 1) === 0 && id > 0.55) c = mix(tones[Math.min(4, k + 1)], PAL.bronze, 0.25);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n\r\n// Floor: packed grit and flat stones, darker, one or two tones per stone, gritty speckle.\r\nexport function floor(seed = 21, S = 64) {\r\n  const P = painter(S, S);\r\n  const tones = [PAL.floor_deep, PAL.floor_lo, PAL.floor, PAL.floor_hi];\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const [d1, d2, id] = cells2(x + 0.5, y + 0.5, S, S, 8, seed);\r\n    const n = fbm(x, y, S, S, 6, seed + 5, 3);\r\n    let k = Math.floor(n*2.4 + id*1.4);\r\n    k = Math.max(0, Math.min(3, k));\r\n    let c = tones[k];\r\n    if (d2 - d1 \u003c 0.08) c = PAL.floor_deep;\r\n    const grit = lattice_hash(x, y, seed + 99);\r\n    if (grit > 0.93) c = tones[Math.min(3, k + 1)];\r\n    else if (grit \u003c 0.06) c = PAL.floor_deep;\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n\r\n// Egg shell: pale cream, a few sparse brown speckles, slightly cooler toward one pole.\r\nexport function egg_shell(seed = 31, S = 64) {\r\n  const P = painter(S, S);\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const n = fbm(x, y, S, S, 4, seed, 2);\r\n    let c = n > 0.62 ? PAL.egg_hi : n \u003c 0.4 ? PAL.egg_lo : PAL.egg;\r\n    const h = lattice_hash(x, y, seed + 17);\r\n    if (h > 0.985) c = PAL.egg_spot;\r\n    else if (h > 0.97) c = mix(PAL.egg_lo, PAL.egg_spot, 0.4);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done({ repeat: true });\r\n}\r\n\r\n// Snake: overlapping diamond scales along the body (u = around, v = along), a paler belly band,\r\n// dark seams. The texture wraps around one body segment.\r\nexport function scales(seed = 41, W = 32, H = 16) {\r\n  const P = painter(W, H);\r\n  for (let y = 0; y \u003c H; y++) for (let x = 0; x \u003c W; x++) {\r\n    const u = x/W, v = y/H;\r\n    const sx = (x + (Math.floor(y/4) % 2)*2) % 4, sy = y % 4;\r\n    const dia = Math.abs(sx - 1.5) + Math.abs(sy - 1.5);\r\n    let c = dia \u003c 1.2 ? PAL.scale_hi : dia \u003c 2.2 ? PAL.scale : PAL.scale_lo;\r\n    const belly = Math.abs(u - 0.75) \u003c 0.12;\r\n    if (belly) c = (y % 3 === 0) ? PAL.scale_lo : PAL.scale_belly;\r\n    if (lattice_hash(x, y, seed) > 0.9 && !belly) c = mul(c, 0.8);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n","game/util.js":"// util.js -- seeded rng, math helpers, springs, and the collision / raycast geometry that\r\n// player, enemy and weapon all share. Pure functions over plain numbers; no three.js here.\r\n//\r\n// COLLIDER FORMAT (what room.js exports as room.colliders):\r\n//   { x0, y0, z0, x1, y1, z1 }                  solid axis-aligned box, x0\u003cx1 etc (use box())\r\n//   { ..., ramp: '+x'|'-x'|'+z'|'-z' }           wedge inside that box whose top rises from y0 at\r\n//                                                 the low edge to y1 at the edge named by `ramp`\r\n//                                                 (use ramp()); walkable, blocks from the sides\r\n//   optional flags: no_ray (bullets pass), no_walk (bodies pass), no_floor (never chosen as a\r\n//                   spawn/teleport floor or nav surface: lids, clip ceilings), color (hex, used for\r\n//                   impact debris), tag (any string)\r\n// Bodies (player, enemy) are vertical capsules: feet at y, radius r, height h.\r\n\r\nexport const DT = 1 / 60;\r\nexport const DEG = Math.PI / 180;\r\n\r\n// ---------------------------------------------------------------- rng\r\nfunction splitmix(seed) {\r\n  let s = seed >>> 0;\r\n  return () => {\r\n    s = (s + 0x9e3779b9) >>> 0;\r\n    let z = s;\r\n    z = Math.imul(z ^ (z >>> 16), 0x85ebca6b);\r\n    z = Math.imul(z ^ (z >>> 13), 0xc2b2ae35);\r\n    return (z ^ (z >>> 16)) >>> 0;\r\n  };\r\n}\r\n\r\nexport function hash_str(str) {\r\n  let h = 2166136261 >>> 0;\r\n  for (let i = 0; i \u003c str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);\r\n  return h >>> 0;\r\n}\r\n\r\n// sfc32 seeded through splitmix32. rng.next() in [0,1).\r\nexport function make_rng(seed = 1) {\r\n  const sm = splitmix(seed);\r\n  let a = sm(), b = sm(), c = sm(), d = sm();\r\n  const next = () => {\r\n    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;\r\n    let t = (a + b) | 0;\r\n    a = b ^ (b >>> 9);\r\n    b = (c + (c \u003c\u003c 3)) | 0;\r\n    c = (c \u003c\u003c 21) | (c >>> 11);\r\n    d = (d + 1) | 0;\r\n    t = (t + d) | 0;\r\n    c = (c + t) | 0;\r\n    return (t >>> 0) / 4294967296;\r\n  };\r\n  for (let i = 0; i \u003c 12; i++) next();\r\n  const rng = {\r\n    seed,\r\n    next,\r\n    float: (lo = 0, hi = 1) => lo + (hi - lo)*next(),\r\n    int: (lo, hi) => lo + Math.floor(next()*(hi - lo + 1)),     // inclusive\r\n    chance: p => next() \u003c p,\r\n    sign: () => (next() \u003c 0.5 ? -1 : 1),\r\n    pick: arr => arr[Math.floor(next()*arr.length)],\r\n    spread: s => (next()*2 - 1)*s,                                // symmetric in [-s, s]\r\n    // a new independent stream derived from this seed + a tag\r\n    fork: tag => make_rng((seed ^ hash_str(String(tag))) >>> 0),\r\n  };\r\n  return rng;\r\n}\r\n\r\n// ---------------------------------------------------------------- math\r\nexport const clamp = (x, a, b) => (x \u003c a ? a : x > b ? b : x);\r\nexport const lerp = (a, b, t) => a + (b - a)*t;\r\nexport const inv_lerp = (a, b, x) => (x - a)/(b - a);\r\nexport const remap = (x, a, b, c, d) => c + (d - c)*clamp((x - a)/(b - a), 0, 1);\r\nexport const smoothstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };\r\nexport const approach = (x, target, step) => (x \u003c target ? Math.min(x + step, target) : Math.max(x - step, target));\r\n// frame-rate independent exponential smoothing: rate = 1/time-constant\r\nexport const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate*dt));\r\nexport const ease_out_cubic = t => 1 - Math.pow(1 - t, 3);\r\nexport const ease_in_cubic = t => t*t*t;\r\nexport const ease_out_back = (t, k = 1.7) => 1 + (k + 1)*Math.pow(t - 1, 3) + k*Math.pow(t - 1, 2);\r\nexport const wrap_deg = a => { a = (a + 180) % 360; if (a \u003c 0) a += 360; return a - 180; };\r\nexport const len2 = (x, z) => Math.sqrt(x*x + z*z);\r\nexport const len3 = (x, y, z) => Math.sqrt(x*x + y*y + z*z);\r\n\r\n// compass heading convention used by the whole game and the GAME API:\r\n// yaw 0 looks at -z, yaw 90 looks at +x. pitch > 0 looks up.\r\nexport const yaw_to = (x0, z0, x1, z1) => Math.atan2(x1 - x0, -(z1 - z0))/DEG;\r\nexport const forward_of = (yaw_deg, pitch_deg = 0) => {\r\n  const y = yaw_deg*DEG, p = pitch_deg*DEG, cp = Math.cos(p);\r\n  return [Math.sin(y)*cp, Math.sin(p), -Math.cos(y)*cp];\r\n};\r\n\r\n// damped spring (semi-implicit Euler, stable at 60 Hz for freq up to ~40 rad/s)\r\n// s = {x, v}; omega = angular frequency (rad/s), zeta = damping ratio (1 = critical)\r\nexport function spring(s, target, omega, zeta, dt) {\r\n  const a = -2*zeta*omega*s.v - omega*omega*(s.x - target);\r\n  s.v += a*dt;\r\n  s.x += s.v*dt;\r\n  return s.x;\r\n}\r\nexport const make_spring = (x = 0) => ({ x, v: 0 });\r\n\r\n// smooth 1D value noise in [-1, 1], deterministic\r\nexport function noise1(x, seed = 0) {\r\n  const i = Math.floor(x), f = x - i;\r\n  const h = n => {\r\n    let v = Math.imul((n + seed*7919) | 0, 0x27d4eb2d);\r\n    v ^= v >>> 15; v = Math.imul(v, 0x85ebca6b); v ^= v >>> 13;\r\n    return ((v >>> 0)/4294967296)*2 - 1;\r\n  };\r\n  const u = f*f*(3 - 2*f);\r\n  return lerp(h(i), h(i + 1), u);\r\n}\r\n\r\n// ---------------------------------------------------------------- colliders\r\nexport function box(x0, y0, z0, x1, y1, z1, extra) {\r\n  const c = {\r\n    x0: Math.min(x0, x1), y0: Math.min(y0, y1), z0: Math.min(z0, z1),\r\n    x1: Math.max(x0, x1), y1: Math.max(y0, y1), z1: Math.max(z0, z1),\r\n  };\r\n  return extra ? Object.assign(c, extra) : c;\r\n}\r\n\r\n// wedge: rises from y0 at the low edge to y1 at the side named by dir\r\nexport function ramp(x0, y0, z0, x1, y1, z1, dir, extra) {\r\n  const c = box(x0, y0, z0, x1, y1, z1, extra);\r\n  c.ramp = dir;\r\n  c.H = c.y1 - c.y0;\r\n  c.gx = 0; c.gz = 0; c.ax = 0; c.az = 0;\r\n  if (dir === '+x') { c.gx = 1/(c.x1 - c.x0); c.ax = c.x0; }\r\n  else if (dir === '-x') { c.gx = -1/(c.x1 - c.x0); c.ax = c.x1; }\r\n  else if (dir === '+z') { c.gz = 1/(c.z1 - c.z0); c.az = c.z0; }\r\n  else if (dir === '-z') { c.gz = -1/(c.z1 - c.z0); c.az = c.z1; }\r\n  else throw new Error('ramp dir must be +x -x +z -z');\r\n  return c;\r\n}\r\n\r\n// top surface height of a collider at (x, z) (clamped into its footprint)\r\nexport function surface_y(c, x, z) {\r\n  if (!c.ramp) return c.y1;\r\n  const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n  const u = clamp(c.gx*(px - c.ax) + c.gz*(pz - c.az), 0, 1);\r\n  return c.y0 + c.H*u;\r\n}\r\n\r\n// does a circle (x, z, r) overlap the collider's footprint (strictly)?\r\nexport function circle_hits(c, x, z, r) {\r\n  const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n  const dx = x - px, dz = z - pz;\r\n  return dx*dx + dz*dz \u003c r*r;\r\n}\r\n\r\nexport function point_inside(c, x, y, z) {\r\n  if (x \u003c= c.x0 || x >= c.x1 || z \u003c= c.z0 || z >= c.z1 || y \u003c= c.y0) return false;\r\n  return y \u003c surface_y(c, x, z);\r\n}\r\n\r\n// highest walkable surface under a circle, not above max_y. -Infinity when nothing.\r\nexport function ground_at(cols, x, z, r, max_y = Infinity) {\r\n  let g = -Infinity;\r\n  for (const c of cols) {\r\n    if (c.no_walk || !circle_hits(c, x, z, r)) continue;\r\n    const top = surface_y(c, x, z);\r\n    if (top \u003c= max_y && top > g) g = top;\r\n  }\r\n  return g;\r\n}\r\n\r\n// floor under a point for teleports / spawns: the highest surface with headroom h above it\r\nexport function resolve_floor_y(cols, x, z, h = 1.8, r = 0.05) {\r\n  const tops = [];\r\n  for (const c of cols) if (!c.no_walk && !c.no_floor && circle_hits(c, x, z, r)) tops.push(surface_y(c, x, z));\r\n  tops.sort((a, b) => b - a);\r\n  for (const top of tops) {\r\n    let clear = true;\r\n    for (const c of cols) {\r\n      if (c.no_walk || !circle_hits(c, x, z, r)) continue;\r\n      if (c.y0 \u003c top + h - 0.01 && surface_y(c, x, z) > top + 0.01) { clear = false; break; }\r\n    }\r\n    if (clear) return top;\r\n  }\r\n  return tops.length ? tops[tops.length - 1] : 0;\r\n}\r\n\r\nfunction headroom_ok(cols, x, z, r, y_new, h, y_now) {\r\n  for (const c of cols) {\r\n    if (c.no_walk) continue;\r\n    if (c.y0 \u003c y_new + h && c.y0 >= y_now + h - 0.02 && circle_hits(c, x, z, r - 0.01)) return false;\r\n  }\r\n  return true;\r\n}\r\n\r\n// horizontal circle push-out against every collider that is a wall at this height.\r\n// Colliders whose top at the contact point is within step_allow of the feet are left for the\r\n// vertical pass (that is the step-up). Returns true if a wall was touched.\r\nexport function push_out(b, cols, step_allow) {\r\n  let touched = false;\r\n  for (let pass = 0; pass \u003c 4; pass++) {\r\n    let moved = false;\r\n    for (const c of cols) {\r\n      if (c.no_walk) continue;\r\n      if (c.y0 >= b.y + b.h - 0.01) continue;                    // entirely above the head\r\n      const px = clamp(b.x, c.x0, c.x1), pz = clamp(b.z, c.z0, c.z1);\r\n      const ddx = b.x - px, ddz = b.z - pz, d2 = ddx*ddx + ddz*ddz;\r\n      if (d2 >= b.r*b.r) continue;\r\n      const top = surface_y(c, px, pz);\r\n      if (top \u003c= b.y + 0.001) continue;                            // below the feet\r\n      if (top \u003c= b.y + step_allow && headroom_ok(cols, b.x, b.z, b.r, top, b.h, b.y)) continue;\r\n      let nx, nz, pen;\r\n      if (d2 > 1e-12) {\r\n        const d = Math.sqrt(d2);\r\n        nx = ddx/d; nz = ddz/d; pen = b.r - d;\r\n      } else {                                                     // centre inside: nearest side\r\n        const l = b.x - c.x0, rr = c.x1 - b.x, bk = b.z - c.z0, f = c.z1 - b.z;\r\n        const m = Math.min(l, rr, bk, f);\r\n        if (m === l) { nx = -1; nz = 0; pen = l + b.r; }\r\n        else if (m === rr) { nx = 1; nz = 0; pen = rr + b.r; }\r\n        else if (m === bk) { nx = 0; nz = -1; pen = bk + b.r; }\r\n        else { nx = 0; nz = 1; pen = f + b.r; }\r\n      }\r\n      b.x += nx*(pen + 1e-5); b.z += nz*(pen + 1e-5);\r\n      const vn = b.vx*nx + b.vz*nz;\r\n      if (vn \u003c 0) { b.vx -= vn*nx; b.vz -= vn*nz; }\r\n      touched = moved = true;\r\n    }\r\n    if (!moved) break;\r\n  }\r\n  return touched;\r\n}\r\n\r\n// Kinematic capsule mover shared by player and enemy.\r\n//   b = {x, y, z, vx, vy, vz, r, h, grounded}  (y = feet). Gravity is the caller's job.\r\n//   o = {step, air_step, snap}\r\n// Returns events: {landed: impact speed or 0, step_dy: vertical snap while grounded, wall, ceiling}\r\nexport function move_body(b, cols, dt, o) {\r\n  const ev = { landed: 0, step_dy: 0, wall: false, ceiling: false };\r\n  const y_before = b.y, was_grounded = b.grounded;\r\n  const dx = b.vx*dt, dz = b.vz*dt;\r\n  const n = Math.max(1, Math.ceil(Math.hypot(dx, dz)/(b.r*0.45)));\r\n  const allow = was_grounded ? o.step : o.air_step;\r\n  for (let i = 0; i \u003c n; i++) {\r\n    b.x += dx/n; b.z += dz/n;\r\n    if (push_out(b, cols, allow)) ev.wall = true;\r\n  }\r\n  const vy_before = b.vy;\r\n  b.y += b.vy*dt;\r\n  // ceiling: colliders that were above the head before this move\r\n  const rr = b.r - 0.01;\r\n  if (b.vy > 0) {\r\n    let ceil = Infinity;\r\n    for (const c of cols) {\r\n      if (c.no_walk || c.y0 \u003c y_before + b.h - 0.02 || !circle_hits(c, b.x, b.z, rr)) continue;\r\n      if (c.y0 \u003c ceil) ceil = c.y0;\r\n    }\r\n    if (b.y + b.h > ceil) { b.y = ceil - b.h; b.vy = 0; ev.ceiling = true; }\r\n  }\r\n  // ground: highest surface under the circle that is not a ceiling\r\n  let ground = -Infinity;\r\n  for (const c of cols) {\r\n    if (c.no_walk || !circle_hits(c, b.x, b.z, rr)) continue;\r\n    if (c.y0 >= y_before + b.h - 0.02) continue;\r\n    const top = surface_y(c, b.x, b.z);\r\n    if (top \u003c= Math.max(y_before, b.y) + allow + 0.001 && top > ground) ground = top;\r\n  }\r\n  b.grounded = false;\r\n  if (b.vy \u003c= 0) {\r\n    if (b.y \u003c= ground) { b.y = ground; b.vy = 0; b.grounded = true; }\r\n    else if (was_grounded && b.y - ground \u003c= o.snap) { b.y = ground; b.vy = 0; b.grounded = true; }\r\n  } else if (b.y \u003c ground) {\r\n    b.y = ground;\r\n  }\r\n  if (b.grounded && !was_grounded) ev.landed = Math.max(0, -vy_before);\r\n  if (b.grounded && was_grounded) ev.step_dy = b.y - y_before;\r\n  return ev;\r\n}\r\n\r\n// ---------------------------------------------------------------- raycasts\r\n// ray vs one collider; returns {t, nx, ny, nz} of the entry point or null (origin inside = miss)\r\nexport function ray_collider(c, ox, oy, oz, dx, dy, dz, max_t) {\r\n  let tmin = -Infinity, tmax = Infinity, nx = 0, ny = 0, nz = 0;\r\n  // slabs\r\n  const slab = (o, d, lo, hi, ax) => {\r\n    if (Math.abs(d) \u003c 1e-12) return o > lo && o \u003c hi;\r\n    let t1 = (lo - o)/d, t2 = (hi - o)/d, s = -1;\r\n    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; s = 1; }\r\n    if (t1 > tmin) { tmin = t1; nx = ny = nz = 0; if (ax === 0) nx = s; else if (ax === 1) ny = s; else nz = s; }\r\n    if (t2 \u003c tmax) tmax = t2;\r\n    return tmin \u003c= tmax;\r\n  };\r\n  if (!slab(ox, dx, c.x0, c.x1, 0) || !slab(oy, dy, c.y0, c.y1, 1) || !slab(oz, dz, c.z0, c.z1, 2)) return null;\r\n  if (c.ramp) {\r\n    // inside: y - y0 - H*u(x,z) \u003c= 0, u = gx*(x-ax) + gz*(z-az)\r\n    const gxw = -c.H*c.gx, gzw = -c.H*c.gz;\r\n    const f0 = oy - c.y0 + gxw*(ox - c.ax) + gzw*(oz - c.az);\r\n    const fd = dy + gxw*dx + gzw*dz;\r\n    if (Math.abs(fd) \u003c 1e-12) { if (f0 > 0) return null; }\r\n    else {\r\n      const ts = -f0/fd;\r\n      if (fd \u003c 0) {\r\n        if (ts > tmin) { tmin = ts; const l = Math.hypot(gxw, 1, gzw); nx = gxw/l; ny = 1/l; nz = gzw/l; }\r\n      } else if (ts \u003c tmax) tmax = ts;\r\n      if (tmin > tmax) return null;\r\n    }\r\n  }\r\n  if (tmax \u003c 0 || tmin \u003c 0 || tmin > max_t) return null;\r\n  return { t: tmin, nx, ny, nz };\r\n}\r\n\r\n// nearest hit along a ray against the collider list (dir need not be unit; t is in dir units)\r\nexport function raycast(cols, ox, oy, oz, dx, dy, dz, max_t = 1e9) {\r\n  let best = null, bt = max_t;\r\n  for (const c of cols) {\r\n    if (c.no_ray) continue;\r\n    const r = ray_collider(c, ox, oy, oz, dx, dy, dz, bt);\r\n    if (r && r.t \u003c bt) { bt = r.t; best = r; best.c = c; }\r\n  }\r\n  if (best) { best.x = ox + dx*bt; best.y = oy + dy*bt; best.z = oz + dz*bt; }\r\n  return best;\r\n}\r\n\r\n// clear line between two points?\r\nexport function line_clear(cols, ax, ay, az, bx, by, bz) {\r\n  return !raycast(cols, ax, ay, az, bx - ax, by - ay, bz - az, 1);\r\n}\r\n\r\n// ray vs vertical capsule (segment (cx,y0,cz)-(cx,y1,cz), radius r). returns t or Infinity\r\nexport function ray_capsule(ox, oy, oz, dx, dy, dz, cx, y0, y1, cz, r) {\r\n  let best = Infinity;\r\n  // cylinder side\r\n  const px = ox - cx, pz = oz - cz;\r\n  const a = dx*dx + dz*dz;\r\n  if (a > 1e-12) {\r\n    const bq = 2*(px*dx + pz*dz), cq = px*px + pz*pz - r*r;\r\n    const disc = bq*bq - 4*a*cq;\r\n    if (disc >= 0) {\r\n      const t = (-bq - Math.sqrt(disc))/(2*a);\r\n      const y = oy + dy*t;\r\n      if (t >= 0 && y >= y0 && y \u003c= y1) best = t;\r\n    }\r\n  }\r\n  // end spheres\r\n  const sph = (sy) => {\r\n    const qx = ox - cx, qy = oy - sy, qz = oz - cz;\r\n    const A = dx*dx + dy*dy + dz*dz, B = 2*(qx*dx + qy*dy + qz*dz), C = qx*qx + qy*qy + qz*qz - r*r;\r\n    const D = B*B - 4*A*C;\r\n    if (D \u003c 0) return;\r\n    const t = (-B - Math.sqrt(D))/(2*A);\r\n    if (t >= 0 && t \u003c best) best = t;\r\n  };\r\n  sph(y0); sph(y1);\r\n  return best;\r\n}\r\n\r\n// sphere overlap vs colliders -> the first collider touched, or null\r\nexport function sphere_hits(cols, x, y, z, r) {\r\n  for (const c of cols) {\r\n    if (c.no_ray) continue;\r\n    const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n    const top = surface_y(c, px, pz);\r\n    const py = clamp(y, c.y0, top);\r\n    const dx = x - px, dy = y - py, dz = z - pz;\r\n    if (dx*dx + dy*dy + dz*dz \u003c r*r) return c;\r\n  }\r\n  return null;\r\n}\r\n\r\n// distance from a point to a vertical segment (for capsule overlap tests)\r\nexport function dist_to_vseg(x, y, z, cx, y0, y1, cz) {\r\n  const cy = clamp(y, y0, y1);\r\n  return len3(x - cx, y - cy, z - cz);\r\n}\r\n"}</script>
