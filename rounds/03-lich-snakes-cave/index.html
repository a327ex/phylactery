<script id="__mods" type="application/json">{"game/cave.js":"// cave.js -- the dream's cave: a round chamber of dark rock, one narrow shaft in the ceiling\r\n// that lets a column of sunlight fall on the egg at the centre, a tunnel the lich enters by,\r\n// fractured blocks, piles, leaning slabs and stones breaking up the floor.\r\n//\r\n// Light (round 2, owner: \"more realistic light ... properly model light reflections\"):\r\n// - DIRECT: one directional sun. Everything casts shadows and a shadow-only lid covers the\r\n//   scene except the shaft, so the pool on the floor and the visible column are the shadow\r\n//   map's (render.js marches the column through it, Sun Court's method).\r\n// - INDIRECT: baked (gi.js). Light from the pool and the sky seen up the shaft bounces around\r\n//   the rock; static surfaces carry it per vertex, moving things sample a probe grid. No fill\r\n//   lights: what isn't lit by the sun is lit only by what the sun lit.\r\n//\r\n// Colours and surface treatment follow the It Follows egg cover; the geometry does not.\r\nimport * as THREE from 'three';\r\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\r\nimport { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';\r\nimport { make_rng, clamp, smoothstep, lerp } from 'game/util.js';\r\nimport * as TX from 'game/textures.js';\r\nimport { bake_gi, gi_static, gi_uniforms, export_gi, import_gi } from 'game/gi.js';\r\nimport { GI_DATA } from 'game/gi_data.js';\r\n\r\n// ---------------------------------------------------------------- geometry noise\r\nfunction h3(ix, iy, iz, seed) {\r\n  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(iz | 0, 2147483647) ^ Math.imul(seed | 0, 1442695041);\r\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\r\n  h ^= h >>> 16;\r\n  return (h >>> 0)/4294967296;\r\n}\r\nfunction noise3(x, y, z, seed = 0) {\r\n  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);\r\n  const fx = x - ix, fy = y - iy, fz = z - iz;\r\n  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy), w = fz*fz*(3 - 2*fz);\r\n  const L = (a, b, t) => a + (b - a)*t;\r\n  const c = (dx, dy, dz) => h3(ix + dx, iy + dy, iz + dz, seed);\r\n  return L(L(L(c(0, 0, 0), c(1, 0, 0), u), L(c(0, 1, 0), c(1, 1, 0), u), v),\r\n           L(L(c(0, 0, 1), c(1, 0, 1), u), L(c(0, 1, 1), c(1, 1, 1), u), v), w);\r\n}\r\nconst fbm3 = (x, y, z, seed, oct = 3) => {\r\n  let s = 0, a = 1, t = 0, f = 1;\r\n  for (let o = 0; o \u003c oct; o++) { s += a*noise3(x*f, y*f, z*f, seed + o*31); t += a; a *= 0.5; f *= 2.03; }\r\n  return s/t;\r\n};\r\n\r\n// World-space UVs, one projection per triangle (its dominant axis), so a texture of N texels\r\n// spans N/32 m on every face at any orientation. Geometry must be non-indexed, in world space.\r\nfunction world_uv(g, tile_m) {\r\n  const p = g.attributes.position, n = p.count;\r\n  const uv = new Float32Array(n*2);\r\n  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), nn = new THREE.Vector3();\r\n  for (let i = 0; i \u003c n; i += 3) {\r\n    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);\r\n    nn.subVectors(c, b).cross(a.clone().sub(b));\r\n    const ax = Math.abs(nn.x), ay = Math.abs(nn.y), az = Math.abs(nn.z);\r\n    for (let k = 0; k \u003c 3; k++) {\r\n      const v = k === 0 ? a : k === 1 ? b : c;\r\n      let u0, v0;\r\n      if (ay >= ax && ay >= az) { u0 = v.x; v0 = v.z; }\r\n      else if (ax >= az) { u0 = v.z; v0 = v.y; }\r\n      else { u0 = v.x; v0 = v.y; }\r\n      uv[(i + k)*2] = u0/tile_m; uv[(i + k)*2 + 1] = v0/tile_m;\r\n    }\r\n  }\r\n  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));\r\n  return g;\r\n}\r\n\r\nfunction flat(g) {\r\n  if (g.index) g = g.toNonIndexed();\r\n  g.computeVertexNormals();\r\n  return g;\r\n}\r\n\r\n// Wind every triangle so its normal points to the open side, as `want(centre, normal)` says\r\n// (the GI bake gathers from that side). Non-indexed geometry, positions only.\r\nfunction orient(g, want) {\r\n  const p = g.attributes.position;\r\n  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3(), m = new THREE.Vector3();\r\n  for (let i = 0; i \u003c p.count; i += 3) {\r\n    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);\r\n    n.subVectors(b, a).cross(c.clone().sub(a));\r\n    m.copy(a).add(b).add(c).multiplyScalar(1/3);\r\n    if (!want(m, n)) { p.setXYZ(i + 1, c.x, c.y, c.z); p.setXYZ(i + 2, b.x, b.y, b.z); }\r\n  }\r\n  p.needsUpdate = true;\r\n  g.computeVertexNormals();\r\n  return g;\r\n}\r\n\r\n// ---------------------------------------------------------------- layout constants\r\nexport const LAYOUT = {\r\n  egg: new THREE.Vector3(0, 0, 0),\r\n  // the sun: nearly straight down, tilted a little so the column leans like the cover's\r\n  sun_dir: new THREE.Vector3(0.11, 1, 0.05).normalize(),     // points TO the sun\r\n  floor_r: 15.5,\r\n  tunnel_theta: -Math.PI/2,                                   // tunnel mouth toward -z\r\n  tunnel_half_w: 2.7, tunnel_h: 4.2,\r\n  hover: new THREE.Vector3(0, 0, -2.9),                       // where the lich stops (xz), facing +z\r\n  entrance: new THREE.Vector3(0, 0, -40),\r\n};\r\n\r\nexport function build_cave(R, seed = 7, opts = {}) {\r\n  const rng = make_rng(seed);\r\n  const group = new THREE.Group();\r\n  R.world_scene.add(group);\r\n  const S = LAYOUT.sun_dir;\r\n  const sun_xz = new THREE.Vector2(S.x/S.y, S.z/S.y);        // horizontal drift per metre of height\r\n  const GU = gi_uniforms();\r\n\r\n  // keep-clear zones: the egg's mound and the lich's lane in from the tunnel\r\n  const clear = (x, z, pad = 0) => (x*x + z*z \u003c (3.2 + pad)*(3.2 + pad)) || (Math.abs(x) \u003c 2.6 + pad && z \u003c -1 && z > -20);\r\n\r\n  // ---------------------------------------------------------------- ground height\r\n  const MOUND = 0.3;\r\n  function ground_y(x, z) {\r\n    const r2 = x*x + z*z, r = Math.sqrt(r2);\r\n    let y = (fbm3(x*0.21, 0, z*0.21, 91) - 0.5)*0.7 + (noise3(x*0.9, 7.1, z*0.9, 93) - 0.5)*0.14;\r\n    // low ridges of rock breaking through the floor\r\n    const rid = 1 - Math.abs(fbm3(x*0.13, 3.3, z*0.13, 97, 2)*2 - 1);\r\n    y += Math.pow(rid, 6)*0.55*smoothstep(3.5, 7, r);\r\n    y += MOUND*Math.exp(-r2/4.0);                              // the egg's low mound\r\n    y += smoothstep(12.5, 17.5, r)*1.4;                        // the floor climbs into the walls\r\n    return y;\r\n  }\r\n\r\n  // ---------------------------------------------------------------- materials\r\n  const tx = { rock: TX.rock(11), floor: TX.floor(21), egg: TX.egg_shell(31) };\r\n  const lam = (map, extra = {}) => gi_static(new THREE.MeshLambertMaterial(Object.assign({ map, color: 0xffffff }, extra)), GU);\r\n  const M = {\r\n    rock: lam(tx.rock, { flatShading: true, shadowSide: THREE.DoubleSide }),\r\n    wall: lam(tx.rock, { flatShading: true, side: THREE.DoubleSide, shadowSide: THREE.DoubleSide }),\r\n    dome: lam(tx.rock, { flatShading: true, side: THREE.DoubleSide, shadowSide: THREE.DoubleSide }),\r\n    floor: lam(tx.floor, { flatShading: true }),\r\n    egg: lam(tx.egg),\r\n  };\r\n  const TILE = 64/TX.TEXELS_PER_METER;                          // 2 m per 64-texel tile\r\n  const statics = [];\r\n  const add_static = (g, mat, cast = true) => {\r\n    const m = new THREE.Mesh(g, mat);\r\n    m.castShadow = cast; m.receiveShadow = true;\r\n    group.add(m);\r\n    statics.push(m);\r\n    return m;\r\n  };\r\n\r\n  // ---------------------------------------------------------------- chamber shell (a lathe)\r\n  const PROFILE = [\r\n    [-0.8, 16.8], [0.8, 17.4], [2.6, 17.8], [4.8, 17.2], [7.2, 15.4], [9.4, 12.6], [11.2, 9.6],\r\n    [12.6, 6.8], [13.6, 4.4], [14.3, 2.6], [15.0, 2.1], [16.5, 1.95], [19.0, 2.05], [22.0, 1.95],\r\n    [25.5, 2.1], [29.0, 2.2],\r\n  ];\r\n  const TOP = PROFILE[PROFILE.length - 1][0];\r\n  const axis_at = h => { const k = smoothstep(11.5, 15.0, h); return [sun_xz.x*h*k, sun_xz.y*h*k]; };\r\n  // the dome's height above a given radius (for hanging stalactites)\r\n  const dome_h_at = r => {\r\n    for (let k = 4; k \u003c 10; k++) {\r\n      const [h0, r0] = PROFILE[k], [h1, r1] = PROFILE[k + 1];\r\n      if (r \u003c= r0 && r >= r1) return lerp(h0, h1, (r0 - r)/(r0 - r1));\r\n    }\r\n    return 12;\r\n  };\r\n  const M_SEG = 72;\r\n  const rings = [];\r\n  for (let k = 0; k \u003c PROFILE.length; k++) {\r\n    const [h, r] = PROFILE[k];\r\n    const [cx, cz] = axis_at(h);\r\n    const ring = [];\r\n    for (let j = 0; j \u003c M_SEG; j++) {\r\n      const th = j/M_SEG*Math.PI*2;\r\n      const ct = Math.cos(th), st = Math.sin(th);\r\n      const slab = noise3(th*9.0/(Math.PI*2)*6, h*0.09, 3.3, 17) - 0.5;\r\n      const lump = fbm3(ct*1.6, h*0.16, st*1.6, 23) - 0.5;\r\n      const fine = noise3(ct*5.1, h*0.7, st*5.1, 29) - 0.5;\r\n      const k_d = h \u003c 14 ? 1 : 0.35;\r\n      const rr = r*(1 + (slab*0.30 + lump*0.34 + fine*0.10)*k_d);\r\n      const hy = h + (noise3(ct*3, h*0.5, st*3, 37) - 0.5)*(h \u003c 14 ? 1.2 : 0.4);\r\n      ring.push(new THREE.Vector3(cx + ct*rr, hy, cz + st*rr));\r\n    }\r\n    rings.push(ring);\r\n  }\r\n  const in_mouth = (a, b, c) => {\r\n    const mx = (a.x + b.x + c.x)/3, my = (a.y + b.y + c.y)/3, mz = (a.z + b.z + c.z)/3;\r\n    if (mz > -8) return false;\r\n    const ex = mx/(LAYOUT.tunnel_half_w + 0.6), ey = my/(LAYOUT.tunnel_h + 0.5);\r\n    return ex*ex + ey*ey \u003c 1 || (Math.abs(mx) \u003c LAYOUT.tunnel_half_w + 0.6 && my \u003c 0);\r\n  };\r\n  const DOME_H = 8.5;\r\n  const wall_pos = [], dome_pos = [];\r\n  const tri = (a, b, c) => {\r\n    if (in_mouth(a, b, c)) return;\r\n    ((a.y + b.y + c.y)/3 > DOME_H ? dome_pos : wall_pos).push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);\r\n  };\r\n  for (let k = 0; k \u003c rings.length - 1; k++) for (let j = 0; j \u003c M_SEG; j++) {\r\n    const a = rings[k][j], b = rings[k][(j + 1) % M_SEG], c = rings[k + 1][(j + 1) % M_SEG], d = rings[k + 1][j];\r\n    tri(a, c, b); tri(a, d, c);\r\n  }\r\n  // inward: toward the axis at the triangle's height\r\n  const inward = (m, n) => { const [ax, az] = axis_at(m.y); return n.x*(ax - m.x) + n.z*(az - m.z) > 0; };\r\n  const shell_geo = arr => {\r\n    let g = new THREE.BufferGeometry();\r\n    g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));\r\n    return world_uv(orient(flat(g), inward), TILE);\r\n  };\r\n  add_static(shell_geo(wall_pos), M.wall);\r\n  const dome = add_static(shell_geo(dome_pos), M.dome);\r\n  void dome;\r\n\r\n  // a shadow-only lid over everything, holed at the shaft: no sunlight reaches the scene except\r\n  // down the shaft (never drawn; it writes the shadow map and blocks the GI bake's rays)\r\n  const LID_Y = TOP - 1.0, LID_HOLE = 1.9;\r\n  const lid = (() => {\r\n    const g = new THREE.RingGeometry(LID_HOLE, 80, 24, 1);\r\n    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, side: THREE.DoubleSide }));\r\n    m.rotation.x = -Math.PI/2;\r\n    m.position.set(sun_xz.x*LID_Y, LID_Y, sun_xz.y*LID_Y);\r\n    m.castShadow = true;\r\n    m.frustumCulled = false;\r\n    group.add(m);\r\n    return m;\r\n  })();\r\n\r\n  // ---------------------------------------------------------------- tunnel\r\n  {\r\n    const RING = 18, z0 = -12.5, z1 = -46, N = 16;\r\n    const rings_t = [];\r\n    for (let k = 0; k \u003c= N; k++) {\r\n      const z = lerp(z0, z1, k/N);\r\n      const ring = [];\r\n      for (let j = 0; j \u003c= RING; j++) {\r\n        const a = lerp(-0.12, 1.12, j/RING)*Math.PI;\r\n        const w = LAYOUT.tunnel_half_w + 0.9, hh = LAYOUT.tunnel_h + 0.6;\r\n        let x = Math.cos(a)*w, y = Math.max(Math.sin(a), -0.35)*hh;\r\n        const d = 1 + (fbm3(x*0.4, y*0.4, z*0.25, 51) - 0.5)*0.42 + (noise3(j*0.9, 2.2, z*0.6, 53) - 0.5)*0.12;\r\n        x *= d; y = y > 0 ? y*d : y - 0.6;\r\n        ring.push(new THREE.Vector3(x, y, z));\r\n      }\r\n      rings_t.push(ring);\r\n    }\r\n    const tp = [];\r\n    for (let k = 0; k \u003c N; k++) for (let j = 0; j \u003c RING; j++) {\r\n      const a = rings_t[k][j], b = rings_t[k][j + 1], c = rings_t[k + 1][j + 1], d = rings_t[k + 1][j];\r\n      tp.push(a.x, a.y, a.z, c.x, c.y, c.z, b.x, b.y, b.z, a.x, a.y, a.z, d.x, d.y, d.z, c.x, c.y, c.z);\r\n    }\r\n    const e = rings_t[N], ec = new THREE.Vector3(0, 1.5, z1 - 1.5);\r\n    for (let j = 0; j \u003c RING; j++) tp.push(ec.x, ec.y, ec.z, e[j].x, e[j].y, e[j].z, e[j + 1].x, e[j + 1].y, e[j + 1].z);\r\n    let tg = new THREE.BufferGeometry();\r\n    tg.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3));\r\n    const tin = (m, n) => (m.z \u003c z1 - 0.5 ? n.z > 0 : n.x*(0 - m.x) + n.y*(1.4 - m.y) > 0);\r\n    tg = world_uv(orient(flat(tg), tin), TILE);\r\n    add_static(tg, M.wall);\r\n  }\r\n\r\n  // ---------------------------------------------------------------- floor\r\n  {\r\n    const x0 = -21, x1 = 21, z0 = -47, z1 = 21, CELL = 0.7;\r\n    const nx = Math.round((x1 - x0)/CELL), nz = Math.round((z1 - z0)/CELL);\r\n    const P = [];\r\n    const vy = (x, z) => ground_y(x, z);\r\n    const jit = (i, j, s) => (h3(i, j, 0, s) - 0.5)*CELL*0.55;\r\n    const vx = (i, j) => [x0 + i*CELL + (i > 0 && i \u003c nx ? jit(i, j, 61) : 0), z0 + j*CELL + (j > 0 && j \u003c nz ? jit(i, j, 67) : 0)];\r\n    for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) {\r\n      const [ax, az] = vx(i, j), [bx, bz] = vx(i + 1, j), [cx, cz] = vx(i + 1, j + 1), [dx, dz] = vx(i, j + 1);\r\n      const mx = (ax + cx)/2, mz = (az + cz)/2;\r\n      const in_ch = mx*mx + mz*mz \u003c 19.5*19.5, in_tu = Math.abs(mx) \u003c 3.1 && mz \u003c -12;\r\n      if (!in_ch && !in_tu) continue;\r\n      P.push(ax, vy(ax, az), az, dx, vy(dx, dz), dz, cx, vy(cx, cz), cz);\r\n      P.push(ax, vy(ax, az), az, cx, vy(cx, cz), cz, bx, vy(bx, bz), bz);\r\n    }\r\n    let g = new THREE.BufferGeometry();\r\n    g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));\r\n    g = world_uv(orient(flat(g), (m, n) => n.y > 0), TILE);\r\n    add_static(g, M.floor);\r\n  }\r\n\r\n  // ---------------------------------------------------------------- rocks and formations\r\n  // Round 3 (owner: \"a mix of cave 04 and cave 06\" -- Astra's refs): angular fractured blocks\r\n  // with flat break faces and sharp edges, stacked and tilted (04), dark boulders over a floor\r\n  // strewn with stones and grit (06). No stalagmites or stalactites. Every rock is the convex\r\n  // hull of points scattered in a box, a few pinned near its corners, which gives big planar\r\n  // fracture faces.\r\n  const rocks = [];\r\n  const outward_from = c => (m, n) => n.x*(m.x - c.x) + n.y*(m.y - c.y) + n.z*(m.z - c.z) > 0;\r\n  const block = (w, h, d, corners = 0.55, n = 12) => {\r\n    const pts = [];\r\n    for (let i = 0; i \u003c n; i++) pts.push(new THREE.Vector3(rng.spread(w/2), rng.spread(h/2), rng.spread(d/2)));\r\n    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {\r\n      if (rng.chance(corners)) pts.push(new THREE.Vector3(sx*w/2*rng.float(0.7, 1), sy*h/2*rng.float(0.7, 1), sz*d/2*rng.float(0.7, 1)));\r\n    }\r\n    return new ConvexGeometry(pts);\r\n  };\r\n  // place a block: centre at ground + lift, tilted and turned; `sink` buries its lower part\r\n  const add_block = (x, z, w, h, d, o = {}) => {\r\n    const g = flat(block(w, h, d, o.corners ?? 0.55, o.n ?? 12));\r\n    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rng.spread(o.tilt ?? 0.35), o.yaw ?? rng.float(0, Math.PI*2), rng.spread(o.tilt ?? 0.35), 'YXZ'));\r\n    const c = new THREE.Vector3(x, ground_y(x, z) + h*(0.5 - (o.sink ?? 0.25)) + (o.lift || 0), z);\r\n    g.applyMatrix4(new THREE.Matrix4().compose(c, q, new THREE.Vector3(1, 1, 1)));\r\n    rocks.push(orient(flat(g), outward_from(c)));\r\n    return c;\r\n  };\r\n  const ang_from_tunnel = th => Math.abs(Math.atan2(Math.sin(th - LAYOUT.tunnel_theta), Math.cos(th - LAYOUT.tunnel_theta)));\r\n  // big fractured blocks piled along the walls\r\n  for (let i = 0; i \u003c 80; i++) {\r\n    const th = rng.float(0, Math.PI*2);\r\n    if (ang_from_tunnel(th) \u003c 0.26) continue;\r\n    const r = rng.float(12.8, 17.6);\r\n    const s = lerp(0.6, 3.2, Math.pow(rng.next(), 1.5))*smoothstep(11, 16, r) + 0.3;\r\n    add_block(Math.cos(th)*r, Math.sin(th)*r, s*rng.float(0.8, 1.5), s*rng.float(0.5, 1.1), s*rng.float(0.7, 1.3), { tilt: 0.45, sink: 0.3 });\r\n  }\r\n  // broken slabs leaning against the walls (thin, tall, tilted back)\r\n  for (let i = 0; i \u003c 30; i++) {\r\n    const th = rng.float(0, Math.PI*2);\r\n    if (ang_from_tunnel(th) \u003c 0.32) continue;\r\n    const r = rng.float(15.0, 17.0);\r\n    const x = Math.cos(th)*r, z = Math.sin(th)*r;\r\n    const hgt = rng.float(2.5, 7.0);\r\n    const yaw = Math.atan2(x, z);\r\n    const g = flat(block(rng.float(1.0, 2.6), hgt, rng.float(0.35, 0.8), 0.8, 10));\r\n    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-rng.float(0.08, 0.35), yaw, rng.spread(0.15), 'YXZ'));\r\n    const c = new THREE.Vector3(x, ground_y(x, z) + hgt*0.4, z);\r\n    g.applyMatrix4(new THREE.Matrix4().compose(c, q, new THREE.Vector3(1, 1, 1)));\r\n    rocks.push(orient(flat(g), outward_from(c)));\r\n  }\r\n  // formations on the floor: piles of big angular blocks, stacked and tilted\r\n  const PILES = [];\r\n  for (let n = 0, tries = 0; n \u003c 10 && tries \u003c 400; tries++) {\r\n    const th = rng.float(0, Math.PI*2), r = rng.float(5.5, 13.5);\r\n    const x = Math.cos(th)*r, z = Math.sin(th)*r;\r\n    if (clear(x, z, 2.0) || PILES.some(o => Math.hypot(o[0] - x, o[1] - z) \u003c 4.6)) continue;\r\n    PILES.push([x, z]); n++;\r\n    const S = lerp(0.9, 2.1, rng.next())*lerp(0.8, 1.2, smoothstep(6, 13, r));\r\n    // a base of two or three blocks, one or two resting on them, a few fallen pieces around\r\n    const base = rng.int(2, 3);\r\n    for (let k = 0; k \u003c base; k++) {\r\n      const a = rng.float(0, 6.28), d = rng.float(0.2, 0.8)*S;\r\n      add_block(x + Math.cos(a)*d, z + Math.sin(a)*d, S*rng.float(1.0, 1.7), S*rng.float(0.6, 1.1), S*rng.float(0.8, 1.4), { tilt: 0.3, sink: 0.2 });\r\n    }\r\n    const top = rng.int(0, 2);\r\n    for (let k = 0; k \u003c top; k++) {\r\n      add_block(x + rng.spread(0.4*S), z + rng.spread(0.4*S), S*rng.float(0.7, 1.2), S*rng.float(0.4, 0.8), S*rng.float(0.6, 1.0), { tilt: 0.6, sink: 0, lift: S*0.75 });\r\n    }\r\n    for (let k = 0; k \u003c rng.int(3, 7); k++) {\r\n      const a = rng.float(0, 6.28), d = S*rng.float(1.0, 2.0);\r\n      const s = S*rng.float(0.15, 0.4);\r\n      add_block(x + Math.cos(a)*d, z + Math.sin(a)*d, s*rng.float(0.8, 1.5), s*rng.float(0.5, 1), s, { tilt: 0.7, sink: 0.3 });\r\n    }\r\n  }\r\n  // stones across the open floor, and grit\r\n  for (let i = 0; i \u003c 170; i++) {\r\n    const th = rng.float(0, Math.PI*2), r = rng.float(2.4, 14.5);\r\n    const x = Math.cos(th)*r, z = Math.sin(th)*r;\r\n    if (Math.abs(x) \u003c 1.8 && z \u003c -1.5 && z > -16) continue;              // the lich's lane stays walkable\r\n    const s = lerp(0.06, 0.5, Math.pow(rng.next(), 2.2));\r\n    add_block(x, z, s*rng.float(0.9, 1.6), s*rng.float(0.4, 0.9), s*rng.float(0.8, 1.3), { tilt: 0.8, sink: 0.35, n: 8 });\r\n  }\r\n  // rubble inside and around the pool: its edge breaks up on stones instead of a clean disc\r\n  // (cave 06), bigger stones where the light's edge falls\r\n  for (let i = 0; i \u003c 60; i++) {\r\n    const th = rng.float(0, Math.PI*2), r = i \u003c 22 ? rng.float(1.5, 2.4) : rng.float(0.6, 2.8);\r\n    if (Math.abs(Math.cos(th)*r) \u003c 0.9 && Math.sin(th)*r \u003c -1.8) continue;     // not under the lich\r\n    const s = i \u003c 22 ? lerp(0.12, 0.36, rng.next()) : lerp(0.04, 0.22, Math.pow(rng.next(), 1.8));\r\n    add_block(Math.cos(th)*r, Math.sin(th)*r, s*rng.float(0.9, 1.6), s*rng.float(0.4, 0.9), s*rng.float(0.8, 1.3), { tilt: 0.9, sink: 0.35, n: 8 });\r\n  }\r\n  {\r\n    const g = world_uv(mergeGeometries(rocks, false), TILE);\r\n    add_static(g, M.rock);\r\n  }\r\n\r\n  // ---------------------------------------------------------------- the egg (0.8 m tall)\r\n  const EGG_S = 0.8;\r\n  const egg = new THREE.Group();\r\n  {\r\n    let g = new THREE.SphereGeometry(0.5, 24, 16);\r\n    const p = g.attributes.position;\r\n    for (let i = 0; i \u003c p.count; i++) {\r\n      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);\r\n      const taper = 1 - 0.14*clamp(y/0.5, 0, 1) + 0.03*clamp(-y/0.5, 0, 1);\r\n      p.setXYZ(i, x*0.78*taper*EGG_S, y*EGG_S, z*0.78*taper*EGG_S);\r\n    }\r\n    g.computeVertexNormals();\r\n    g = g.toNonIndexed();                                        // keeps the smooth normals\r\n    const m = new THREE.Mesh(g, M.egg);\r\n    m.position.y = 0.5*EGG_S;\r\n    m.castShadow = true; m.receiveShadow = true;\r\n    egg.add(m);\r\n    egg.userData.shell = m;\r\n    statics.push(m);\r\n  }\r\n  egg.position.set(0, ground_y(0, 0) - 0.03, 0);\r\n  group.add(egg);\r\n\r\n  // ---------------------------------------------------------------- the sun\r\n  const SUN_E = opts.sun_E || 9.0;\r\n  const SUN_COL = new THREE.Color(0xffe6b8);\r\n  const sun = new THREE.DirectionalLight(SUN_COL, SUN_E);\r\n  sun.position.copy(S).multiplyScalar(40);\r\n  sun.target.position.set(0, 0, 0);\r\n  sun.castShadow = true;\r\n  sun.shadow.mapSize.set(2048, 2048);\r\n  {\r\n    const sc = sun.shadow.camera;\r\n    const X = new THREE.Vector3(1, 0, 0);\r\n    const Rx = X.clone().sub(S.clone().multiplyScalar(X.dot(S))).normalize();\r\n    const Uy = new THREE.Vector3().crossVectors(S, Rx);\r\n    sc.up.copy(Uy);\r\n    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;\r\n    for (const cx of [-21, 21]) for (const cy of [-1.5, TOP + 1]) for (const cz of [-48, 21]) {\r\n      const v = new THREE.Vector3(cx, cy, cz);\r\n      a0 = Math.min(a0, v.dot(Rx)); a1 = Math.max(a1, v.dot(Rx)); b0 = Math.min(b0, v.dot(Uy)); b1 = Math.max(b1, v.dot(Uy));\r\n    }\r\n    const tx_ = (a1 - a0)/2048, ty_ = (b1 - b0)/2048;\r\n    sc.left = Math.floor(a0/tx_)*tx_; sc.right = Math.ceil(a1/tx_)*tx_; sc.bottom = Math.floor(b0/ty_)*ty_; sc.top = Math.ceil(b1/ty_)*ty_;\r\n    sc.near = 1; sc.far = 90;\r\n    sc.updateProjectionMatrix();\r\n  }\r\n  sun.shadow.bias = -0.0005;\r\n  sun.shadow.normalBias = 0.03;\r\n  group.add(sun, sun.target);\r\n  // owner, round 2: the egg and the lit floor too bright. The bake keeps the full sun (it sets\r\n  // how much light enters the room); the direct light drawn on the pool is scaled down.\r\n  const DIRECT_K = 0.55;\r\n  // a glimpse of sky at the top of the shaft: an HDR cap for the bloom to catch\r\n  const SKY_L = [2.4, 2.5, 2.7];\r\n  {\r\n    const g = new THREE.CircleGeometry(2.8, 16);\r\n    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: new THREE.Color(9, 8.4, 7.2), side: THREE.DoubleSide }));\r\n    m.rotation.x = Math.PI/2;\r\n    m.position.set(sun_xz.x*(TOP - 0.3), TOP - 0.3, sun_xz.y*(TOP - 0.3));\r\n    group.add(m);\r\n  }\r\n\r\n  // ---------------------------------------------------------------- bake the bounce light\r\n  const t0 = performance.now();\r\n  const baked = bake_gi(statics, {\r\n    sun_dir: S, sun_E: [SUN_COL.r*SUN_E, SUN_COL.g*SUN_E, SUN_COL.b*SUN_E],\r\n    sky: { y: LID_Y, cx: sun_xz.x*LID_Y, cz: sun_xz.y*LID_Y, r: LID_HOLE, L: SKY_L },\r\n    rays: opts.rays || 64, bounces: opts.bounces || 3, occluders: [lid], seed: 5, denoise: 0.9,\r\n    cache: import_gi(GI_DATA),\r\n    // the column: radius of the shaft, radiance per metre of chord = shaft colour x mean phase x\r\n    // density (render.js draws it with the same law)\r\n    beam: { x: 0, z: 0, r: LID_HOLE*0.95, h: 60, L: [1.0*0.5*0.022, 0.8*0.5*0.022, 0.46*0.5*0.022] },\r\n    grid: { min: [-17, 0.2, -24], max: [17, 6.5, 17], n: [18, 6, 22], rays: 64 },\r\n  });\r\n  const bake_ms = performance.now() - t0;\r\n  sun.intensity = SUN_E*DIRECT_K;\r\n  GU.uGIUp.value = baked.probes.up; GU.uGIDown.value = baked.probes.down;\r\n  GU.uGIMin.value.copy(baked.probes.min); GU.uGIMax.value.copy(baked.probes.max);\r\n\r\n  // ---------------------------------------------------------------- atmosphere (render.js)\r\n  const P = R.params;\r\n  R.world_scene.background = new THREE.Color(0x000000);\r\n  P.sky.on = false;\r\n  Object.assign(P.fog, { near: 8, far: 50, max: 0.6, curve: 1.3, sky: 0.0, base_y: 0, falloff: 0.0, height_mix: 0.0 });\r\n  P.fog.color.setRGB(0.004, 0.0037, 0.0034);\r\n  P.shafts = { on: true, light: sun, color: [0.82, 0.65, 0.37], density: 0.022, max_dist: 48, steps: 40, phase: 0.35, ambient: 0.0,\r\n    streak: 0.85, rise: 1.0 };\r\n  P.dither_dark = [0.04, 0.16];\r\n  R.set_shadow_light(sun);\r\n  R.rebuild();\r\n  P.bloom = { strength: 0.32, threshold: 1.25 };\r\n  P.vignette = 0.3;\r\n  P.contrast = 1.04; P.saturation = 1.04;\r\n  P.lift = [0.003, 0.002, 0.006];\r\n\r\n  // dust in the column\r\n  const DUST = 160;\r\n  const dust_pos = new Float32Array(DUST*3), dust_col = new Float32Array(DUST*3), dust = [];\r\n  for (let i = 0; i \u003c DUST; i++) {\r\n    dust.push({ h: rng.float(0.3, 20), a: rng.float(0, 6.283), r: Math.sqrt(rng.next())*1.6, v: rng.float(0.03, 0.12), w: rng.float(0.05, 0.25), b: rng.float(0.4, 1) });\r\n  }\r\n  const dust_geo = new THREE.BufferGeometry();\r\n  dust_geo.setAttribute('position', new THREE.BufferAttribute(dust_pos, 3));\r\n  dust_geo.setAttribute('color', new THREE.BufferAttribute(dust_col, 3));\r\n  const dust_pts = new THREE.Points(dust_geo, new THREE.PointsMaterial({ size: 1, sizeAttenuation: false, vertexColors: true,\r\n    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));\r\n  dust_pts.frustumCulled = false;\r\n  group.add(dust_pts);\r\n  function update_dust(t, dt) {\r\n    for (let i = 0; i \u003c DUST; i++) {\r\n      const d = dust[i];\r\n      d.h -= d.v*dt; d.a += d.w*dt;\r\n      if (d.h \u003c 0.2) d.h = 20;\r\n      const cx = sun_xz.x*d.h, cz = sun_xz.y*d.h;\r\n      dust_pos[i*3] = cx + Math.cos(d.a)*d.r; dust_pos[i*3 + 1] = d.h; dust_pos[i*3 + 2] = cz + Math.sin(d.a)*d.r;\r\n      const tw = 0.6 + 0.4*Math.sin(t*1.7 + i*1.3);\r\n      const k = d.b*tw*(0.55 + 0.45*Math.min(1, d.h/10))*0.6;\r\n      dust_col[i*3] = 1.5*k; dust_col[i*3 + 1] = 1.25*k; dust_col[i*3 + 2] = 0.8*k;\r\n    }\r\n    dust_geo.attributes.position.needsUpdate = true;\r\n    dust_geo.attributes.color.needsUpdate = true;\r\n  }\r\n\r\n  // exposure: a realistic range (the pool is hundreds of times brighter than the far rock), so\r\n  // how much of the cave shows is how the \"camera\" is exposed; the pool rolls off in the shoulder\r\n  // The bake is physical; its LEVEL is art direction (owner, round 1: \"between dim and\r\n  // readable\"). The bounce keeps its realistic distribution -- bright by the pool and the\r\n  // column, soft falloff, dark in occluded corners -- scaled as a whole.\r\n  const DARK = [\r\n    { name: 'DIMMER', gi: 5, exposure: 2.2 },\r\n    { name: 'BETWEEN DIM AND READABLE', gi: 10, exposure: 2.2 },\r\n    { name: 'BRIGHTER', gi: 18, exposure: 2.2 },\r\n  ];\r\n\r\n  const dome_mats = [M.dome];\r\n  return {\r\n    group, ground_y, egg, sun, LAYOUT, GU, bake_ms, tris: baked.tris, gi_cached: baked.cached,\r\n    export_gi: () => export_gi(baked.data),\r\n    set_dome_visible(on) { for (const m of dome_mats) { m.colorWrite = on; m.depthWrite = on; } },\r\n    DARK,\r\n    set_darkness(i) {\r\n      const d = DARK[((i % DARK.length) + DARK.length) % DARK.length];\r\n      P.exposure = d.exposure;\r\n      GU.uGIScale.value = d.gi;\r\n      return d.name;\r\n    },\r\n    update(t, dt) {\r\n      update_dust(t, dt);\r\n      const shell = egg.userData.shell;\r\n      const k = Math.max(0, Math.sin(t*0.9)*Math.sin(t*2.3) - 0.55)*1.6;\r\n      shell.rotation.z = Math.sin(t*38)*0.035*k;\r\n      shell.rotation.x = Math.cos(t*31)*0.025*k;\r\n    },\r\n  };\r\n}\r\n","game/gem.js":"// gem.js -- prismatic bone: a pale, faintly faceted mineral that splits the light hitting it\r\n// (owner, round 1: \"A is the idea, but the effect should be more subtle, as the lich moves\r\n// around and light hits him differently, different portions of his bones glow in that natural\r\n// way that such a prismatic object like a gem would glow\").\r\n//\r\n// Nothing here emits light of its own. Three light-driven effects on a physical material:\r\n//   FIRE   the direct specular (shadowed: only where the sun actually reaches) is split into\r\n//          spectral colour by facet and viewing angle, like a diamond's flashes\r\n//   SHEEN  thin-film iridescence (three.js's physical iridescence), a rainbow that moves with\r\n//          the angle between eye and surface\r\n//   INNER  whatever light arrives (sun + bounce) comes back out as a soft rainbow, as if carried\r\n//          through the mineral; in the dark there is nothing to carry\r\nimport * as THREE from 'three';\r\n\r\nconst DECL = /* glsl */`\r\nuniform float uGemTime, uFire, uInner;\r\nvarying vec3 vGemW;\r\nvec3 gem_spectrum(float h){\r\n  vec3 c = clamp(abs(fract(h + vec3(0.0, 0.6667, 0.3333))*6.0 - 3.0) - 1.0, 0.0, 1.0);\r\n  return c*c*(3.0 - 2.0*c);\r\n}\r\nfloat gem_luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }`;\r\n\r\nexport const GEM_LEVELS = [\r\n  { name: 'SUBTLE', fire: 1.6, inner: 0.16, irid: 0.35 },\r\n  { name: 'MEDIUM', fire: 3.2, inner: 0.32, irid: 0.6 },\r\n  { name: 'STRONG', fire: 6.0, inner: 0.6, irid: 0.9 },\r\n];\r\n\r\nexport function gem_material(opts = {}) {\r\n  const m = new THREE.MeshPhysicalMaterial({\r\n    color: opts.color ?? 0xebe4d6, roughness: opts.roughness ?? 0.3, metalness: 0,\r\n    ior: 1.9, specularIntensity: 1.0,\r\n    iridescence: 0.35, iridescenceIOR: 1.45, iridescenceThicknessRange: [220, 820],\r\n    flatShading: opts.flat ?? true,\r\n  });\r\n  const U = { uGemTime: { value: 0 }, uFire: { value: 1.6 }, uInner: { value: 0.16 } };\r\n  m.userData.gemU = U;\r\n  m.userData.set_level = (l) => { U.uFire.value = l.fire; U.uInner.value = l.inner; m.iridescence = l.irid; };\r\n  const prev = m.onBeforeCompile;\r\n  m.onBeforeCompile = (sh, r) => {\r\n    if (prev) prev(sh, r);\r\n    Object.assign(sh.uniforms, U);\r\n    sh.vertexShader = sh.vertexShader\r\n      .replace('#include \u003ccommon>', '#include \u003ccommon>\\nvarying vec3 vGemW;')\r\n      .replace('#include \u003cproject_vertex>', '#include \u003cproject_vertex>\\n  vGemW = (modelMatrix*vec4(transformed, 1.0)).xyz;');\r\n    sh.fragmentShader = sh.fragmentShader\r\n      .replace('#include \u003ccommon>', '#include \u003ccommon>\\n' + DECL)\r\n      .replace('#include \u003clights_fragment_end>', `#include \u003clights_fragment_end>\r\n  {\r\n    vec3 gnW = normalize((vec4(normal, 0.0)*viewMatrix).xyz);\r\n    // a stable random per facet (flat normals are constant across a facet)\r\n    // a smooth, slowly varying phase over the surface (normal + position): colour shifts across a bone like a gem's play of colour\r\n    float facet = 0.5 + 0.25*sin(dot(gnW, vec3(4.1, 3.3, 5.2)) + dot(vGemW, vec3(7.0, 5.0, 6.0))) + 0.25*sin(dot(gnW, vec3(-3.7, 4.6, 2.9))*1.7);\r\n    float nv = dot(normal, normalize(vViewPosition));\r\n    vec3 fire = gem_spectrum(facet + nv*1.6 + uGemTime*0.02);\r\n    reflectedLight.directSpecular += fire*gem_luma(reflectedLight.directSpecular)*uFire;\r\n    float lit = gem_luma(reflectedLight.directDiffuse + reflectedLight.indirectDiffuse);\r\n    vec3 inner = gem_spectrum(dot(vGemW, vec3(0.45, 0.9, 0.3)) - uGemTime*0.04 + facet*0.18);\r\n    reflectedLight.indirectDiffuse += inner*lit*uInner;\r\n  }`);\r\n  };\r\n  const key = () => 'gem';\r\n  m.customProgramCacheKey = key;\r\n  return m;\r\n}\r\n","game/gi.js":"// gi.js -- baked global illumination for a static scene with one static light.\n//\n// The cave never moves and neither does the sun, so the light bouncing around it can be\n// computed once: every triangle of the static meshes gathers light by casting rays over its\n// hemisphere against a BVH of the whole cave. What a ray sees is the radiance of the surface it\n// hits (albedo x the irradiance there / pi) or, if it leaves through the shaft, the sky.\n// Direct sunlight is NOT baked (the real directional light and its shadow map draw it, sharp);\n// only the indirect light is, stored per vertex as an attribute `gi` (irradiance, linear, in\n// three.js light units: a lambert surface shows gi * albedo / pi).\n//\n// For things that move (the lich, the snakes) a grid of probes stores the irradiance an\n// upward-facing and a downward-facing surface would receive; their materials sample it by world\n// position and blend by the normal's y.\n//\n// Units: the sun's irradiance on a surface facing it is sun_E (= the directional light's\n// intensity), matching three.js's RE_Direct for directional lights.\nimport * as THREE from 'three';\nimport { make_rng } from 'game/util.js';\n\n// ---------------------------------------------------------------- BVH over triangles\nfunction build_bvh(P) {             // P: Float32Array, 9 floats per triangle\n  const N = P.length/9;\n  const cx = new Float32Array(N), cy = new Float32Array(N), cz = new Float32Array(N);\n  const bmin = new Float32Array(N*3), bmax = new Float32Array(N*3);\n  for (let i = 0; i \u003c N; i++) {\n    const o = i*9;\n    let x0 = Infinity, y0 = Infinity, z0 = Infinity, x1 = -Infinity, y1 = -Infinity, z1 = -Infinity;\n    for (let k = 0; k \u003c 3; k++) {\n      const x = P[o + k*3], y = P[o + k*3 + 1], z = P[o + k*3 + 2];\n      if (x \u003c x0) x0 = x; if (y \u003c y0) y0 = y; if (z \u003c z0) z0 = z;\n      if (x > x1) x1 = x; if (y > y1) y1 = y; if (z > z1) z1 = z;\n    }\n    bmin[i*3] = x0; bmin[i*3 + 1] = y0; bmin[i*3 + 2] = z0; bmax[i*3] = x1; bmax[i*3 + 1] = y1; bmax[i*3 + 2] = z1;\n    cx[i] = (x0 + x1)/2; cy[i] = (y0 + y1)/2; cz[i] = (z0 + z1)/2;\n  }\n  const idx = new Uint32Array(N);\n  for (let i = 0; i \u003c N; i++) idx[i] = i;\n  // nodes: min(3) max(3) left/first, count (count > 0 = leaf)\n  const nb = [], nc = [];\n  const LEAF = 4;\n  const C = [cx, cy, cz];\n  function build(first, count) {\n    const ni = nc.length/2;\n    let x0 = Infinity, y0 = Infinity, z0 = Infinity, x1 = -Infinity, y1 = -Infinity, z1 = -Infinity;\n    let c0x = Infinity, c0y = Infinity, c0z = Infinity, c1x = -Infinity, c1y = -Infinity, c1z = -Infinity;\n    for (let i = first; i \u003c first + count; i++) {\n      const t = idx[i];\n      if (bmin[t*3] \u003c x0) x0 = bmin[t*3]; if (bmin[t*3 + 1] \u003c y0) y0 = bmin[t*3 + 1]; if (bmin[t*3 + 2] \u003c z0) z0 = bmin[t*3 + 2];\n      if (bmax[t*3] > x1) x1 = bmax[t*3]; if (bmax[t*3 + 1] > y1) y1 = bmax[t*3 + 1]; if (bmax[t*3 + 2] > z1) z1 = bmax[t*3 + 2];\n      if (cx[t] \u003c c0x) c0x = cx[t]; if (cy[t] \u003c c0y) c0y = cy[t]; if (cz[t] \u003c c0z) c0z = cz[t];\n      if (cx[t] > c1x) c1x = cx[t]; if (cy[t] > c1y) c1y = cy[t]; if (cz[t] > c1z) c1z = cz[t];\n    }\n    nb.push(x0, y0, z0, x1, y1, z1);\n    nc.push(0, 0);\n    if (count \u003c= LEAF) { nc[ni*2] = first; nc[ni*2 + 1] = count; return ni; }\n    const ex = c1x - c0x, ey = c1y - c0y, ez = c1z - c0z;\n    const ax = ex >= ey && ex >= ez ? 0 : ey >= ez ? 1 : 2;\n    const mid = ax === 0 ? (c0x + c1x)/2 : ax === 1 ? (c0y + c1y)/2 : (c0z + c1z)/2;\n    const A = C[ax];\n    let i = first, j = first + count - 1;\n    while (i \u003c= j) { if (A[idx[i]] \u003c mid) i++; else { const t = idx[i]; idx[i] = idx[j]; idx[j] = t; j--; } }\n    let nl = i - first;\n    if (nl === 0 || nl === count) nl = count >> 1;\n    const l = build(first, nl);\n    const r = build(first + nl, count - nl);\n    void l;\n    nc[ni*2] = r; nc[ni*2 + 1] = 0;           // interior: left child is ni+1, right is r\n    return ni;\n  }\n  build(0, N);\n  // reorder triangles into leaf order for locality\n  const T = new Float32Array(P.length);\n  for (let i = 0; i \u003c N; i++) T.set(P.subarray(idx[i]*9, idx[i]*9 + 9), i*9);\n  return { T, idx, box: new Float32Array(nb), node: new Int32Array(nc), N };\n}\n\nconst EPS = 1e-7;\n// closest hit: returns t (Infinity if none) and writes the hit into out = {tri, u, v}\nfunction intersect(B, ox, oy, oz, dx, dy, dz, tmax, out, any = false) {\n  const { T, box, node } = B;\n  const ix = 1/dx, iy = 1/dy, iz = 1/dz;\n  const stack = intersect.stack || (intersect.stack = new Int32Array(128));\n  let sp = 0, best = tmax, hit = -1, hu = 0, hv = 0;\n  stack[sp++] = 0;\n  while (sp > 0) {\n    const n = stack[--sp];\n    const b = n*6;\n    let t0 = (box[b] - ox)*ix, t1 = (box[b + 3] - ox)*ix;\n    if (t0 > t1) { const q = t0; t0 = t1; t1 = q; }\n    let s0 = (box[b + 1] - oy)*iy, s1 = (box[b + 4] - oy)*iy;\n    if (s0 > s1) { const q = s0; s0 = s1; s1 = q; }\n    if (s0 > t0) t0 = s0; if (s1 \u003c t1) t1 = s1;\n    let r0 = (box[b + 2] - oz)*iz, r1 = (box[b + 5] - oz)*iz;\n    if (r0 > r1) { const q = r0; r0 = r1; r1 = q; }\n    if (r0 > t0) t0 = r0; if (r1 \u003c t1) t1 = r1;\n    if (t1 \u003c t0 || t1 \u003c 0 || t0 > best) continue;\n    const cnt = node[n*2 + 1];\n    if (cnt > 0) {\n      const first = node[n*2];\n      for (let k = first; k \u003c first + cnt; k++) {\n        const o = k*9;\n        const ax = T[o], ay = T[o + 1], az = T[o + 2];\n        const e1x = T[o + 3] - ax, e1y = T[o + 4] - ay, e1z = T[o + 5] - az;\n        const e2x = T[o + 6] - ax, e2y = T[o + 7] - ay, e2z = T[o + 8] - az;\n        const px = dy*e2z - dz*e2y, py = dz*e2x - dx*e2z, pz = dx*e2y - dy*e2x;\n        const det = e1x*px + e1y*py + e1z*pz;\n        if (det > -EPS && det \u003c EPS) continue;\n        const inv = 1/det;\n        const tx = ox - ax, ty = oy - ay, tz = oz - az;\n        const u = (tx*px + ty*py + tz*pz)*inv;\n        if (u \u003c 0 || u > 1) continue;\n        const qx = ty*e1z - tz*e1y, qy = tz*e1x - tx*e1z, qz = tx*e1y - ty*e1x;\n        const v = (dx*qx + dy*qy + dz*qz)*inv;\n        if (v \u003c 0 || u + v > 1) continue;\n        const t = (e2x*qx + e2y*qy + e2z*qz)*inv;\n        if (t > 1e-4 && t \u003c best) { best = t; hit = k; hu = u; hv = v; if (any) return t; }\n      }\n    } else {\n      stack[sp++] = node[n*2];               // right\n      stack[sp++] = n + 1;                   // left\n    }\n  }\n  if (out) { out.tri = hit; out.u = hu; out.v = hv; }\n  return hit \u003c 0 ? Infinity : best;\n}\n\nconst s2l = c => (c \u003c 0.04045 ? c*0.0773993808 : Math.pow(c*0.9478672986 + 0.0521327014, 2.4));\n// average linear albedo of a material (its colour x its texture's mean colour)\nfunction albedo_of(mat) {\n  const c = new THREE.Color(1, 1, 1);\n  if (mat.color) c.copy(mat.color);\n  const img = mat.map && mat.map.image;\n  if (img && img.getContext) {\n    const d = img.getContext('2d').getImageData(0, 0, img.width, img.height).data;\n    let r = 0, g = 0, b = 0;\n    const n = d.length/4;\n    for (let i = 0; i \u003c d.length; i += 4) {\n      r += s2l(d[i]/255); g += s2l(d[i + 1]/255); b += s2l(d[i + 2]/255);\n    }\n    c.r *= r/n; c.g *= g/n; c.b *= b/n;\n  }\n  return c;\n}\n\n// ---------------------------------------------------------------- the bake\n// meshes: static meshes (non-indexed geometry; any transform). opts:\n//   sun_dir (to the sun), sun_E, sky { y, cx, cz, r, L: [r,g,b] } -- the shaft's opening as a\n//   disc at height y, radiance L; rays: per triangle per bounce; bounces;\n//   occluders: extra meshes that block light but receive nothing (the lid); albedo 0\nexport function bake_gi(meshes, opts, progress) {\n  const rng = make_rng(opts.seed || 3);\n  const L = opts.sun_dir.clone().normalize();\n  const all = [];\n  const recs = [];\n  const add = (m, receive) => {\n    m.updateMatrixWorld(true);\n    const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry;     // occluders may be indexed\n    const p = g.attributes.position;\n    const tris = p.count/3;\n    const a = receive ? albedo_of(m.material) : new THREE.Color(0, 0, 0);\n    const base = all.length/9;\n    const v = new THREE.Vector3();\n    for (let i = 0; i \u003c p.count; i++) { v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld); all.push(v.x, v.y, v.z); }\n    recs.push({ m, base, tris, a, receive });\n  };\n  for (const m of meshes) add(m, true);\n  for (const m of opts.occluders || []) add(m, false);\n  const P = new Float32Array(all);\n  const N = P.length/9;\n  // the stored bake is valid only for exactly this geometry and these settings\n  let sum = 0;\n  for (let i = 0; i \u003c P.length; i += 7) sum = (sum + P[i]*(1 + (i % 13)))%1e6;\n  const key = [N, sum.toFixed(3), opts.rays, opts.bounces, opts.seed, JSON.stringify(opts.beam || 0), JSON.stringify(opts.sky), opts.sun_E.join(','),\n    JSON.stringify(opts.grid || 0), opts.denoise || 0, 'v2'].join('|');\n  const cache = opts.cache && opts.cache.key === key ? opts.cache : null;\n  const B = cache ? null : build_bvh(P);\n  // per ORIGINAL triangle: normal, centre, area, albedo, receive\n  const nrm = new Float32Array(N*3), cen = new Float32Array(N*3), area = new Float32Array(N), alb = new Float32Array(N*3);\n  const recv = new Uint8Array(N);\n  for (const r of recs) for (let t = 0; t \u003c r.tris; t++) {\n    const i = r.base + t, o = i*9;\n    const e1x = P[o + 3] - P[o], e1y = P[o + 4] - P[o + 1], e1z = P[o + 5] - P[o + 2];\n    const e2x = P[o + 6] - P[o], e2y = P[o + 7] - P[o + 1], e2z = P[o + 8] - P[o + 2];\n    let nx = e1y*e2z - e1z*e2y, ny = e1z*e2x - e1x*e2z, nz = e1x*e2y - e1y*e2x;\n    const l = Math.hypot(nx, ny, nz) || 1;\n    area[i] = l/2;\n    nrm[i*3] = nx/l; nrm[i*3 + 1] = ny/l; nrm[i*3 + 2] = nz/l;\n    cen[i*3] = (P[o] + P[o + 3] + P[o + 6])/3; cen[i*3 + 1] = (P[o + 1] + P[o + 4] + P[o + 7])/3; cen[i*3 + 2] = (P[o + 2] + P[o + 5] + P[o + 8])/3;\n    alb[i*3] = r.a.r; alb[i*3 + 1] = r.a.g; alb[i*3 + 2] = r.a.b;\n    recv[i] = r.receive ? 1 : 0;\n  }\n  // BVH order -> original index\n  const orig = B ? B.idx : null;\n  const Ed = new Float32Array(N*3);              // direct irradiance per triangle (both sides)\n  const sun_E = opts.sun_E;\n  const hit = { tri: -1, u: 0, v: 0 };\n  const shadow = (x, y, z) => intersect(B, x, y, z, L.x, L.y, L.z, 200, null, true) === Infinity;\n  for (let i = 0; i \u003c N && !cache; i++) {\n    if (!recv[i]) continue;\n    const nx = nrm[i*3], ny = nrm[i*3 + 1], nz = nrm[i*3 + 2];\n    const d = nx*L.x + ny*L.y + nz*L.z;\n    if (d \u003c= 0) continue;\n    const x = cen[i*3] + nx*0.02, y = cen[i*3 + 1] + ny*0.02, z = cen[i*3 + 2] + nz*0.02;\n    if (!shadow(x, y, z)) continue;\n    Ed[i*3] = sun_E[0]*d; Ed[i*3 + 1] = sun_E[1]*d; Ed[i*3 + 2] = sun_E[2]*d;\n  }\n  // every receiving triangle's winding must point its normal at the open side (cave.js orients\n  // them: walls inward, floor up, rocks outward); the gather shoots from that side\n  const side = new Int8Array(N).fill(1);\n  const sky = opts.sky;\n  const Ei = new Float32Array(N*3), Enext = new Float32Array(N*3);\n  const K = opts.rays || 32;\n  const bounces = opts.bounces || 2;\n  const tangent = (nx, ny, nz) => {\n    const ax = Math.abs(nx) \u003c 0.9 ? 1 : 0, ay = ax ? 0 : 1;\n    let tx = ay*nz - 0*ny, ty = 0*nx - ax*nz, tz = ax*ny - ay*nx;\n    const l = Math.hypot(tx, ty, tz) || 1;\n    return [tx/l, ty/l, tz/l];\n  };\n  // the column of light is dusty air: seen along a ray it glows with radiance proportional to\n  // the chord through it (beam.L per metre, the same law render.js's shaft pass draws), and\n  // what it scatters lights the rock around it\n  const beam = opts.beam;\n  const ba = opts.sun_dir.clone().normalize();\n  function beam_chord(x, y, z, dx, dy, dz, tmax) {\n    if (!beam) return 0;\n    const wx = x - beam.x, wy = y, wz = z - beam.z;\n    const wa = wx*ba.x + wy*ba.y + wz*ba.z, da = dx*ba.x + dy*ba.y + dz*ba.z;\n    const px = wx - ba.x*wa, py = wy - ba.y*wa, pz = wz - ba.z*wa;\n    const qx = dx - ba.x*da, qy = dy - ba.y*da, qz = dz - ba.z*da;\n    const A = qx*qx + qy*qy + qz*qz, Bq = px*qx + py*qy + pz*qz, C = px*px + py*py + pz*pz - beam.r*beam.r;\n    if (A \u003c 1e-9) return C \u003c 0 ? Math.min(tmax, beam.h) : 0;\n    const disc = Bq*Bq - A*C;\n    if (disc \u003c= 0) return 0;\n    const sq = Math.sqrt(disc);\n    const t0 = Math.max(0, (-Bq - sq)/A), t1 = Math.min(tmax, (-Bq + sq)/A);\n    return t1 > t0 ? t1 - t0 : 0;\n  }\n  function gather(x, y, z, nx, ny, nz, out, rays) {\n    const [tx, ty, tz] = tangent(nx, ny, nz);\n    const bx = ny*tz - nz*ty, by = nz*tx - nx*tz, bz = nx*ty - ny*tx;\n    let r = 0, g = 0, b = 0;\n    for (let k = 0; k \u003c rays; k++) {\n      // cosine-weighted hemisphere (stratified in phi)\n      const u1 = rng.next(), u2 = (k + rng.next())/rays;\n      const rr = Math.sqrt(u1), phi = 6.2831853*u2;\n      const lx = rr*Math.cos(phi), ly = rr*Math.sin(phi), lz = Math.sqrt(Math.max(0, 1 - u1));\n      const dx = tx*lx + bx*ly + nx*lz, dy = ty*lx + by*ly + ny*lz, dz = tz*lx + bz*ly + nz*lz;\n      const t = intersect(B, x, y, z, dx, dy, dz, 300, hit);\n      if (beam) {\n        const ch = beam_chord(x, y, z, dx, dy, dz, t === Infinity ? 60 : t);\n        if (ch > 0) { r += Math.PI*beam.L[0]*ch; g += Math.PI*beam.L[1]*ch; b += Math.PI*beam.L[2]*ch; }\n      }\n      if (t === Infinity) {\n        // escaped: the sky, if it went out through the shaft's opening\n        if (dy > 0.05) {\n          const s = (sky.y - y)/dy;\n          const px = x + dx*s - sky.cx, pz = z + dz*s - sky.cz;\n          if (s > 0 && px*px + pz*pz \u003c sky.r*sky.r) { r += Math.PI*sky.L[0]; g += Math.PI*sky.L[1]; b += Math.PI*sky.L[2]; }\n        }\n        continue;\n      }\n      const j = orig[hit.tri];\n      if (!recv[j]) continue;\n      // radiance of the hit = albedo x (direct + indirect) / pi; E += pi*L/K per sample\n      r += alb[j*3]*(Ed[j*3] + Ei[j*3]);\n      g += alb[j*3 + 1]*(Ed[j*3 + 1] + Ei[j*3 + 1]);\n      b += alb[j*3 + 2]*(Ed[j*3
