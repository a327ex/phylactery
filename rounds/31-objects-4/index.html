<script id="__mods" type="application/json">{"game/beam.js":"// beam.js -- PRISMATIC BEAM (round 11, owner: \"a beam of prismatic light that is shot from his\r\n// finger and pierces a snake, chaining if more need to be killed\").\r\n// Round 27: it never ricochets any more; several beams from the one finger instead (see below).\r\n// Round 13 (owner's references: Diablo 3's Disintegrate for the animation and vibe): a channelled\r\n// beam. Its head shoots out to the first snake, burns into it a beat, then goes on to the next.\r\n// After the last it thins out and is gone. A pierced snake fills with the light from the wound\r\n// and shatters into prismatic shards. Round 19 (owner: \"He should also not change targets while\r\n// the beam is live. If he needs to kill multiple targets quickly, the beam should bounce\r\n// instead\"): it only BOUNCES, from the snake it pierced on to the next; his finger stays on the\r\n// first (round 13's SWEEP, the end swept across to the next snake with his hand, is gone).\r\n// Round 18 (owner: \"just like the lens beam, except prismatic instead of red\"; the round 13\r\n// prism light \"is wrong, it should be more like a rainbow sort of thing, inspired by the\r\n// skeleton himself\"; thinner; \"come out of the lich's finger exactly\"; \"the lich's hand + arm\r\n// should have some force thrown back on them\"):\r\n//   - the lens beam's build (fx.js ribbon style 4): white-hot core, a sheath in the colours of\r\n//     his bones (K: held in the room like the field on his bones (round 18 verdict) / streaming\r\n//     out along it / a full rainbow), noise eating the edges, flicker, a pop wider as it starts and as it bites,\r\n//     sparks shed along it, a white-hot point where it burns; 6.5 cm (the lens beam: 16-22 cm)\r\n//   - it leaves the index fingertip at the finger's own thickness, read after he is posed (it\r\n//     was a tick behind his hand), the finger laid along it (lich.js), and always along the\r\n//     finger: it is drawn as a curve from the finger's direction onto the snake, straight while\r\n//     the finger points at it, whipping when the recoil throws the hand up; the white ball that sat\r\n//     on his fingertip is gone: the tip glows at its own size, and the beam's light, in its\r\n//     colours, falls on his hand and arm, which turn prismatic in it like the rest of him\r\n//   - recoil (lich.kick / lich.press; HEAVY, round 18 verdict): firing throws his arm up and\r\n//     back, its first bite a smaller kick (the later ones are away from him), the pressure holds it braced and trembling while it channels, and it springs back\r\n//     when the beam lets go\r\n//   - no flash discs or rings where it hits (the lens's round 16 ruling): a spit of sparks\r\nimport * as THREE from 'three';\r\nimport { smoothstep } from 'game/util.js';\r\nimport { spectrum } from 'game/fx.js';\r\n\r\nconst SHOOT_V = 45, DWELL = 0.16, END = 0.22, FILL = 0.22, SHATTER_AT = 0.36;\r\nconst W0 = 0.012, W1 = 0.065;                         // metres: the fingertip's thickness, and the beam\r\nconst PIECES = 10;                                    // a beam leaving his finger is a curve in this many straight pieces\r\nexport const BEAM_LOOKS = ['HIS COLOURS, STREAMING', 'HIS COLOURS, HELD', 'FULL RAINBOW, STREAMING'];\r\n\r\n// his bones' colours on the CPU (fx.js opal(), gem.js): for the lights and the sparks\r\nconst opal = (h, full, out) => {\r\n  const c = spectrum(h).map(v => v*v*(3 - 2*v)), g = full ? 0 : 0.16;\r\n  for (let i = 0; i \u003c 3; i++) c[i] = c[i]*(1 - g) + 0.5*g;\r\n  const m = Math.max((c[0] + c[1] + c[2])/3, 0.2);\r\n  out[0] = c[0]/m; out[1] = c[1]/m; out[2] = c[2]/m;\r\n  return out;\r\n};\r\n\r\nexport function create_beam(ctx) {\r\n  const { R, snakes, fx, rng, lich, warp, gore, get_L } = ctx;\r\n  const N = snakes.RINGS;\r\n  const light = new THREE.PointLight(0xffffff, 0, 5, 2);        // where it burns\r\n  const hand = new THREE.PointLight(0xffffff, 0, 1.8, 2);       // on his hand and arm\r\n  R.world_scene.add(light); R.world_scene.add(hand);\r\n  let look = 1, ch = null, clock = 0;                            // round 18 verdict: HIS COLOURS, HELD\r\n  const TIP = new THREE.Vector3(), FD = new THREE.Vector3(), V = new THREE.Vector3(), P = new THREE.Vector3(), C3 = [1, 1, 1];\r\n\r\n  // the hue the ribbon shows at a point (fx.js style 4), for what shares its light\r\n  const hue_at = (p, x) => {\r\n    const field0 = (TIP.x*0.45 + TIP.y*0.9 + TIP.z*0.3)*0.55 - clock*0.04;\r\n    return look === 1 ? (p.x*0.45 + p.y*0.9 + p.z*0.3)*0.55 - clock*0.04 : field0 - (x - clock*2.4)*0.3;\r\n  };\r\n  const tint = (p, x) => opal(hue_at(p, x), look === 2, C3);\r\n  // a spark in the beam's colour where it is (hue given straight: the pool's rainbow tint is\r\n  // weaker than the ribbon's, so the colour is put into r g b and the tint left off)\r\n  const spark = (p, x, o) => {\r\n    const c = tint(p, x);\r\n    return fx.mote(Object.assign({ x: p.x, y: p.y, z: p.z, r: 0.5 + 2.2*c[0], g: 0.5 + 2.2*c[1], b: 0.5 + 2.2*c[2] }, o));\r\n  };\r\n\r\n  function pierce_fx(s, hit) {\r\n    const f = {\r\n      t: 0, sag: 0,\r\n      // the light runs out from the wound along the body\r\n      glow(i) { const reach = smoothstep(0, FILL, f.t)*N; const d = Math.abs(i - hit); return d \u003c reach ? 1 - 0.4*smoothstep(reach*0.7, reach, d) : 0; },\r\n      shift(i, out) { const k = Math.max(0, 1 - Math.abs(i - hit)/6)*Math.sin(f.t*60)*0.012; out[1] += k; },\r\n      hide: false,\r\n      tick(dt) {\r\n        f.t += dt;\r\n        f.sag = smoothstep(0, SHATTER_AT, f.t)*0.6;\r\n        if (f.t >= SHATTER_AT && !f.hide) { shatter(s); f.hide = true; }\r\n        if (f.t >= SHATTER_AT + 0.05) return 'done';\r\n      },\r\n    };\r\n    return f;\r\n  }\r\n  // round 26 (owner: \"Instead of exploding into glitter, let's make the beamed snakes explode into\r\n  // more aggressive streaks of transparent prism like in leakage, except more aggressive and\r\n  // messy, perhaps with some slight gore as well\"): the light it filled with bursts out of it as\r\n  // warped air (warp.js): streaks flung out from all along it, fast, twisting and tangling, gone in\r\n  // half a second; a blast of warped air where it was; and a little blood and meat (gore.spatter).\r\n  // No shards, no motes.\r\n  const DIR = new THREE.Vector3(), AX = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);\r\n  function shatter(s) {\r\n    const pts = [];\r\n    for (let i = 2; i \u003c N - 2; i += 3) pts.push(s.spine[i].clone());\r\n    for (let k = 0; k \u003c 20; k++) {\r\n      const i = rng.int(2, N - 3), p = s.spine[i];\r\n      // out from the body: across it, up, and a little along\r\n      AX.subVectors(s.spine[Math.max(0, i - 2)], s.spine[Math.min(N - 1, i + 2)]).normalize();\r\n      DIR.set(rng.spread(1), rng.float(-0.2, 1), rng.spread(1)).normalize();\r\n      DIR.addScaledVector(AX, -DIR.dot(AX)*0.7).normalize();\r\n      warp.fling({ p, dir: DIR, speed: rng.float(6, 12), life: rng.float(0.35, 0.65), len: rng.float(0.5, 1.1), curl: rng.spread(7), jitter: rng.float(1.5, 3.5),\r\n        w: rng.float(0.1, 0.2), amp: rng.float(7, 10), chroma: rng.float(1.25, 1.6) });\r\n    }\r\n    for (let k = 0; k \u003c 14; k++) {\r\n      const p = pts[rng.int(0, pts.length - 1)];\r\n      warp.puff({ x: p.x, y: p.y + 0.05, z: p.z, vx: rng.spread(1.6), vy: rng.float(0.2, 1.4), vz: rng.spread(1.6), drag: 2.5, rise: 0.2,\r\n        life: rng.float(0.45, 0.85), s0: 0.2, s1: rng.float(0.7, 1.1), amp: rng.float(5, 6.5), spin: rng.spread(6) });\r\n    }\r\n    gore.spatter(pts);\r\n  }\r\n  // where it goes in: a point on the front half of the body\r\n  const hit_ring = () => rng.int(Math.round(N*0.12), Math.round(N*0.55));\r\n\r\n  // where it bites: a white-hot point and a spit of sparks in its colours, no discs or rings;\r\n  // the first bite of a cast kicks his arm\r\n  function bite(p, first) {\r\n    fx.mote({ x: p.x, y: p.y, z: p.z, life: 0.08, s0: u1*u1, Q1);\r\n      b.p0.copy(Q0); b.p1.copy(Q1); b.x0 = x; b.ph0 = ph0;\r\n      b.w0 = w0; b.w1 = w1; b.a = a; b.hue = look;\r\n      b.pv = k > 0 ? sg.rb[k - 1].p0 : null; b.nx = null;\r\n      if (k > 0) sg.rb[k - 1].nx = b.p1;\r\n      x += Q0.distanceTo(Q1); Q0.copy(Q1);\r\n    });\r\n    sg.len = x;\r\n  }\r\n\r\n  // ---------------------------------------------------------------- the beams\r\n  // Round 27 (owner: \"the beam should never ricochet, the lich should just fire multiple beams from\r\n  // the same hand if there are multiple snakes in that general direction and it needs to do so to\r\n  // protect the egg\"): one beam per snake, every one from his fingertip, fanning out from along his\r\n  // finger onto its snake, a beat apart; only snakes within FAN of where he points (the others are\r\n  // left to the next gesture). Each burns into its snake, holds while it fills and bursts, and thins\r\n  // out; the channel is over when the last has.\r\n  // (a beam holds on its snake HOLD_B after burning in, then thins out; the snake fills with its\r\n  // light and bursts on its own: his hand is free sooner)\r\n  const FAN = 0.87, FAN_URGENT = 1.1, STAGGER_B = 0.07, HOLD_B = 0.16, FADE_B = 0.16;\r\n  const yaw_to = (p) => { const L = get_L(); return Math.atan2(p.x - L.x, p.z - L.z); };\r\n  const off_yaw = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));\r\n  const beam_of = (s, ring, delay) => ({ s, ring, at: null, head: TIP.clone(), phase: delay > 0 ? 'wait' : 'shoot', pt: -delay, seg: null, k: 1 });\r\n\r\n  function update(t, dt) {\r\n    clock = t;\r\n    if (!ch) { light.intensity = 0; hand.intensity = 0; return; }\r\n    ch.t += dt;\r\n    let live = 0, kmax = 0;\r\n    for (const b of ch.beams) {\r\n      if (b.phase === 'wait') { b.pt += dt; if (b.pt >= 0) { b.phase = 'shoot'; b.head.copy(TIP); b.seg = new_seg(TIP); } }\r\n      if (b.phase === 'shoot') {\r\n        const goal = at(b), d = V.subVectors(goal, b.head).length(), step = SHOOT_V*dt;\r\n        if (d \u003c= step) {\r\n          // it burns in\r\n          b.head.copy(goal); b.at = goal.clone();\r\n          if (!b.s.fx || b.s.fx.placeholder) b.s.fx = pierce_fx(b.s, b.ring);\r\n          bite(goal, !ch.bit); ch.bit = true;\r\n          b.phase = 'burn'; b.pt = 0;\r\n        } else b.head.addScaledVector(V, step/d);\r\n      } else if (b.phase === 'burn') {\r\n        b.pt += dt;\r\n        if (b.pt >= HOLD_B) { b.phase = 'fade'; b.pt = 0; }\r\n      } else if (b.phase === 'fade') {\r\n        b.pt += dt;\r\n        if (b.pt >= FADE_B) { b.phase = 'gone'; if (b.seg) release(b.seg); b.seg = null; }\r\n      }\r\n      b.k = b.phase === 'fade' ? 1 - smoothstep(0, FADE_B, b.pt) : b.phase === 'gone' ? 0 : 1;\r\n      if (b.phase !== 'gone') { live++; kmax = Math.max(kmax, b.k); }\r\n    }\r\n    ch.k_on = smoothstep(0, 0.06, ch.t);\r\n    ch.pop = Math.max(0, ch.pop - dt*6);\r\n    ch.kmax = kmax;\r\n    // the pressure on his arm while any is on\r\n    lich.press(ch.arm, ch.k_on*kmax);\r\n    // the burning point at each head, like the lens's: a white-hot point, sparks in its colours\r\n    const fl = 0.8 + 0.2*Math.sin(t*47);\r\n    for (const b of ch.beams) {\r\n      if (!(b.phase === 'shoot' || b.phase === 'burn') || !b.seg) continue;\r\n      const hx = b.head.distanceTo(TIP);\r\n      fx.mote({ x: b.head.x, y: b.head.y, z: b.head.z, life: 0.05, s0: 0.12*fl, s1: 0.1, r: 4, g: 4, b: 4, fin: 0.01 });\r\n      const c = tint(b.head, hx);\r\n      fx.mote({ x: b.head.x, y: b.head.y, z: b.head.z, life: 0.05, s0: 0.26*fl, s1: 0.22, r: 0.9*c[0], g: 0.9*c[1], b: 0.9*c[2], fin: 0.01 });\r\n      if (rng.next() \u003c 0.7) spark(b.head, hx + rng.spread(0.5), { vx: rng.spread(2.0), vy: rng.float(0.6, 2.4), vz: rng.spread(2.0), grav: 7, drag: 0.5,\r\n        life: rng.float(0.25, 0.55), s0: 0.028, s1: 0.01 });\r\n    }\r\n    // sparks shed along them\r\n    for (const b of ch.beams) {\r\n      const sg = b.seg;\r\n      if (!sg || sg.len \u003c 0.3 || rng.next() > 0.8) continue;\r\n      const r = sg.rb[rng.int(0, PIECES - 1)], e = rng.next();\r\n      P.lerpVectors(r.p0, r.p1, e);\r\n      spark(P, r.x0 + e*r.p0.distanceTo(r.p1), { x: P.x + rng.spread(0.03), z: P.z + rng.spread(0.03), vx: rng.spread(0.6), vy: rng.float(-0.5, 0.4), vz: rng.spread(0.6), grav: 2, drag: 1.5,\r\n        life: rng.float(0.2, 0.4), s0: 0.022, s1: 0.008, a: b.k });\r\n    }\r\n    // the light where the first one burns\r\n    const b0 = ch.beams.find(b => b.phase === 'shoot' || b.phase === 'burn') || ch.beams[0];\r\n    const c = tint(b0.head, b0.head.distanceTo(TIP));\r\n    light.color.setRGB(0.55 + 0.45*c[0]/2, 0.55 + 0.45*c[1]/2, 0.55 + 0.45*c[2]/2);\r\n    light.position.copy(b0.head); light.position.y += 0.2;\r\n    light.intensity = 1.6*kmax*ch.k_on*fl;\r\n    if (!live) {\r\n      lich.press(ch.arm, 0);\r\n      ch = null; light.intensity = 0; hand.intensity = 0;\r\n    }\r\n  }\r\n\r\n  // after he is posed this tick: every beam leaves his fingertip where it is now, along his\r\n  // finger, and bends onto its snake (so several fan out from the one finger)\r\n  function after_pose(t) {\r\n    if (!ch) return;\r\n    lich.fingertip(ch.arm, TIP);\r\n    lich.finger_dir(ch.arm, FD);\r\n    TIP.addScaledVector(FD, 0.004);                      // the bone's rounded end, not its joint\r\n    const flick = 1 + 0.12*Math.sin(t*57) + 0.07*Math.sin(t*83 + 1);\r\n    const pop = 1 + 0.6*Math.exp(-ch.t*18) + 0.35*ch.pop;\r\n    const ph0 = (TIP.x*0.45 + TIP.y*0.9 + TIP.z*0.3)*0.55 - t*0.04;      // his bones' field where it leaves him\r\n    for (const b of ch.beams) {\r\n      const sg = b.seg;\r\n      if (!sg) continue;\r\n      sg.p0.copy(TIP);\r\n      sg.p1.copy(b.phase === 'shoot' ? b.head : at(b));\r\n      const w = W1*ch.k_on*b.k*flick*pop;\r\n      lay(sg, true, Math.min(W0, w), w, b.k, ph0);\r\n    }\r\n    // the fingertip glows at its own size; the beam's light falls on his hand and arm\r\n    const k = ch.kmax ?? 1, c = tint(TIP, 0);\r\n    fx.mote({ x: TIP.x, y: TIP.y, z: TIP.z, life: 0.04, s0: 0.026*k*(0.9 + 0.3*ch.pop), s1: 0.024, r: 4, g: 4, b: 4, fin: 0.01 });\r\n    fx.mote({ x: TIP.x, y: TIP.y, z: TIP.z, life: 0.04, s0: 0.038*k, s1: 0.034, r: 0.35*c[0], g: 0.35*c[1], b: 0.35*c[2], fin: 0.01 });\r\n    // the light from the beam's first stretch, 15 cm out: his hand gets about the light of the\r\n    // sunlit pool (where his bones turn most prismatic), his forearm less; nearer, the bones\r\n    // washed out to white\r\n    hand.position.copy(TIP).addScaledVector(FD, 0.15);\r\n    hand.color.setRGB(0.4 + 0.6*c[0]/2, 0.4 + 0.6*c[1]/2, 0.4 + 0.6*c[2]/2);\r\n    hand.intensity = 0.05*ch.k_on*k*(0.9 + 0.1*flick);\r\n  }\r\n\r\n  // the beams of this cast that have not burnt in yet let their snakes go (they crawl on)\r\n  const free_unhit = () => { for (const b of ch.beams) if ((b.phase === 'wait' || b.phase === 'shoot') && b.s.fx && b.s.fx.placeholder) b.s.fx = null; };\r\n\r\n  return {\r\n    name: 'BEAM', gesture: true,\r\n    cooldown: 5.5,\r\n    // the first target, then as many more as the fan can take\r\n    capacity: p => 1 + Math.round((p - 1)*1.3),\r\n    aim_ring: () => Math.round(N*0.3),\r\n    get look() { return look; },\r\n    set look(m) { look = ((m % BEAM_LOOKS.length) + BEAM_LOOKS.length) % BEAM_LOOKS.length; },\r\n    // targets[0] is where he points; the others go too if they are within the fan, nearest the\r\n    // way he points first; the rest are let go for the next gesture\r\n    cast(targets, from, ring, arm = 1) {\r\n      if (ch) { for (const b of ch.beams) if (b.seg) release(b.seg); free_unhit(); lich.press(ch.arm, 0); }\r\n      const a0 = yaw_to(targets[0].spine[20]);\r\n      const fan = targets.filter((s, k) => k === 0 || off_yaw(yaw_to(s.spine[20]), a0) \u003c FAN).sort((p, q) => off_yaw(yaw_to(p.spine[20]), a0) - off_yaw(yaw_to(q.spine[20]), a0));\r\n      for (const s of targets) if (!fan.includes(s)) s.claim = null;\r\n      // they stop where they are while the beams come for them\r\n      for (const s of fan) if (snakes.free(s)) snakes.take(s, { placeholder: true, tick() { } });\r\n      lich.fingertip(arm, TIP);\r\n      ch = { t: 0, arm, a0, pop: 0, k_on: 0, bit: false, kmax: 1,\r\n        beams: fan.map((s, k) => beam_of(s, k === 0 ? ring : hit_ring(), k*STAGGER_B)) };\r\n      ch.beams[0].seg = new_seg(TIP);\r\n      // it fires: the arm is thrown back (a little harder for more beams), the fingertip spits sparks\r\n      lich.kick(arm, Math.min(1.4, 1 + 0.12*(fan.length - 1)));\r\n      lich.finger_dir(arm, FD);\r\n      for (let k = 0; k \u003c 8; k++) {\r\n        V.set(rng.spread(1), rng.spread(1), rng.spread(1)); V.addScaledVector(FD, -V.dot(FD)).setLength(rng.float(0.6, 1.4)).addScaledVector(FD, rng.float(-0.3, 0.4));\r\n        spark(TIP, 0, { vx: V.x, vy: V.y, vz: V.z, grav: 3, drag: 2.5, life: rng.float(0.15, 0.3), s0: 0.018, s1: 0.006, fin: 0.01 });\r\n      }\r\n    },\r\n    update, after_pose,\r\n    lights: { light, hand },\r\n    chain: () => (ch ? ch.beams.length : 0),         // tests: how many beams this cast has\r\n    // something about to reach the egg while the beams are on: one more from the same finger if\r\n    // it is (near enough) the way he points; returns whether it took any\r\n    extend(more) {\r\n      if (!ch) return false;\r\n      let took = false;\r\n      for (const s of more) {\r\n        if (!snakes.free(s) || ch.beams.some(b => b.s === s) || off_yaw(yaw_to(s.spine[20]), ch.a0) > FAN_URGENT) continue;\r\n        snakes.take(s, { placeholder: true, tick() { } });\r\n        const b = beam_of(s, hit_ring(), 0); b.seg = new_seg(TIP);\r\n        ch.beams.push(b); took = true;\r\n      }\r\n      return took;\r\n    },\r\n    // one it can't take (the other way) is about to reach the egg: the beams thin out now, so his\r\n    // hand is free for it (the snakes already burnt in still burst)\r\n    cut() {\r\n      if (!ch) return;\r\n      free_unhit();\r\n      for (const b of ch.beams) if (b.phase !== 'gone') { if (b.phase === 'wait' || b.phase === 'shoot') { if (b.seg) release(b.seg); b.seg = null; b.phase = 'gone'; } else if (b.phase === 'burn') { b.phase = 'fade'; b.pt = 0; } }\r\n    },\r\n    // round 22: he lets go of it (it went behind him): the same\r\n    let_go() { this.cut(); },\r\n    // while it channels his finger stays on the first snake\r\n    busy: () => !!ch,\r\n    aim_point: () => (ch ? at(ch.beams[0]) : null),\r\n  };\r\n}\r\n","game/body.js":"// body.js -- round 28: a small rigid body that drops onto the cave floor (a power's object, let\n// go around the egg). Contact is a cloud of points on the object's surface (or one sphere)\n// against the floor's height field, plus the egg as a round wall; sequential impulses with\n// restitution and Coulomb friction, a little rolling resistance, and sleep once it lies still.\nimport * as THREE from 'three';\n\nconst SUB = 4;                        // substeps per 60 Hz tick\nconst G = 9.81;\n\n// opts: points (body-frame Vector3s) or sphere (radius); mass; inertia (Vector3, body-frame\n// diagonal); restitution; friction; floor(x, z) -> y; egg { x, z, r, top }\nexport function create_body(opts) {\n  const b = {\n    x: new THREE.Vector3(), v: new THREE.Vector3(), q: new THREE.Quaternion(), w: new THREE.Vector3(),\n    asleep: false, still: 0, contact: false, landed: 0,\n    on_hit: null,                     // (speed) -> void, each impact over 0.4 m/s\n  };\n  const m = opts.mass ?? 1, im = 1/m;\n  const Ib = opts.inertia ?? new THREE.Vector3(0.01, 0.01, 0.01);\n  const Ibi = new THREE.Vector3(1/Ib.x, 1/Ib.y, 1/Ib.z);\n  const e = opts.restitution ?? 0.25, mu = opts.friction ?? 0.6;\n  const roll = opts.rolling ?? 0.5;   // rolling resistance (1/s while in contact)\n  const rr = opts.rr ?? 0;            // a ball's rolling-resistance coefficient (grit)\n  const pts = opts.points || null, rad = opts.sphere || 0;\n  const R = new THREE.Matrix3(), Rt = new THREE.Matrix3(), m4 = new THREE.Matrix4();\n  const anchor = { x: new THREE.Vector3(1e9, 0, 0), q: new THREE.Quaternion() };\n  const r = new THREE.Vector3(), p = new THREE.Vector3(), n = new THREE.Vector3(), vp = new THREE.Vector3(), t = new THREE.Vector3(), tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();\n\n  // world inverse inertia applied to a vector: R Ibi R^T a\n  const Iinv = (a, out) => { out.copy(a).applyMatrix3(Rt); out.set(out.x*Ibi.x, out.y*Ibi.y, out.z*Ibi.z); return out.applyMatrix3(R); };\n  const floor_n = (x, z, out) => {\n    const h = 0.03, f = opts.floor;\n    return out.set(f(x - h, z) - f(x + h, z), 2*h, f(x, z - h) - f(x, z + h)).normalize();\n  };\n  // one contact at world point p with normal n and depth d: position fix + impulse\n  function contact(pw, nn, depth, strength) {\n    r.subVectors(pw, b.x);\n    vp.crossVectors(b.w, r).add(b.v);\n    const vn = vp.dot(nn);\n    b.x.addScaledVector(nn, depth*0.6*strength);\n    if (vn >= 0) return 0;\n    // normal impulse\n    tmp.crossVectors(r, nn); Iinv(tmp, tmp2); tmp.crossVectors(tmp2, r);\n    const kn = im + nn.dot(tmp);\n    const ee = -vn > 0.5 ? e : 0;                     // slow contacts don't bounce (no jitter at rest)\n    const jn = -(1 + ee)*vn/kn*strength;\n    b.v.addScaledVector(nn, jn*im);\n    tmp.crossVectors(r, nn).multiplyScalar(jn); Iinv(tmp, tmp2); b.w.add(tmp2);\n    // friction\n    vp.crossVectors(b.w, r).add(b.v);\n    t.copy(vp).addScaledVector(nn, -vp.dot(nn));\n    const vt = t.length();\n    if (vt > 1e-5) {\n      t.multiplyScalar(1/vt);\n      tmp.crossVectors(r, t); Iinv(tmp, tmp2); tmp.crossVectors(tmp2, r);\n      const kt = im + t.dot(tmp);\n      const jt = Math.min(vt/kt, mu*jn);\n      b.v.addScaledVector(t, -jt*im);\n      tmp.crossVectors(r, t).multiplyScalar(-jt); Iinv(tmp, tmp2); b.w.add(tmp2);\n    }\n    return -vn;\n  }\n\n  b.step = (dt) => {\n    if (b.asleep) return;\n    const h = dt/SUB;\n    let touched = false;\n    for (let s = 0; s \u003c SUB; s++) {\n      b.v.y -= G*h;\n      b.x.addScaledVector(b.v, h);\n      // q += 0.5 w q h\n      const wq = new THREE.Quaternion(b.w.x*h*0.5, b.w.y*h*0.5, b.w.z*h*0.5, 0).multiply(b.q);\n      b.q.set(b.q.x + wq.x, b.q.y + wq.y, b.q.z + wq.z, b.q.w + wq.w).normalize();\n      m4.makeRotationFromQuaternion(b.q); R.setFromMatrix4(m4); Rt.copy(R).transpose();\n      b.contact = false;\n      let hit = 0;\n      for (let it = 0; it \u003c 2; it++) {\n        if (rad) {\n          const fy = opts.floor(b.x.x, b.x.z);\n          floor_n(b.x.x, b.x.z, n);\n          const d = fy + rad/Math.max(n.y, 0.5) - b.x.y;\n          if (d > 0) { p.copy(b.x).addScaledVector(n, -rad); hit = Math.max(hit, contact(p, n, d*n.y, 1)); b.contact = true; }\n        } else {\n          // the deepest points carry the contact; all touching points share it\n          let cnt = 0;\n          for (const q of pts) { p.copy(q).applyMatrix3(R).add(b.x); if (p.y \u003c opts.floor(p.x, p.z)) cnt++; }\n          for (const q of pts) {\n            p.copy(q).applyMatrix3(R).add(b.x);\n            const fy = opts.floor(p.x, p.z);\n            if (p.y >= fy) continue;\n            floor_n(p.x, p.z, n);\n            hit = Math.max(hit, contact(p, n, (fy - p.y)*n.y, 1/Math.max(1, cnt*0.5)));\n            b.contact = true;\n          }\n        }\n        // the egg: a round wall\n        const eg = opts.egg;\n        if (eg) {\n          const list = rad ? [b.x] : pts.map(q => q.clone().applyMatrix3(R).add(b.x));\n          for (const q of list) {\n            const dx = q.x - eg.x, dz = q.z - eg.z, dd = Math.hypot(dx, dz), rr = eg.r + (rad || 0);\n            if (dd \u003c rr && q.y \u003c eg.top && dd > 1e-4) {\n              n.set(dx/dd, 0, dz/dd);\n              p.copy(q).addScaledVector(n, -(rad || 0));\n              contact(p, n, rr - dd, 1);\n            }\n          }\n        }\n      }\n      if (b.contact) {\n        // rolling resistance; nearly still, contact chatter is damped out hard\n        const k = Math.exp(-(b.w.length() \u003c 0.5 && b.v.length() \u003c 0.08 ? 8 : roll)*h);\n        b.w.multiplyScalar(k);\n        b.v.x *= Math.exp(-0.4*h); b.v.z *= Math.exp(-0.4*h);\n        // a ball on grit: a steady drag against rolling (stops it on a gentle slope)\n        if (rr > 0) {\n          const hv = Math.hypot(b.v.x, b.v.z), dv = rr*G*h;\n          const s = hv > dv ? (hv - dv)/hv : 0;\n          b.v.x *= s; b.v.z *= s; b.w.multiplyScalar(s > 0 ? Math.max(s, 0.9) : 0.5);\n        }\n      }\n      if (hit > 0.4 && b.on_hit) b.on_hit(hit);\n      touched = touched || b.contact;\n    }\n    b.contact = touched;\n    if (b.contact) b.landed += dt;\n    // asleep once it has stayed within a few millimetres and a degree or two for half a second\n    // (contact chatter keeps the velocities from ever reading zero)\n    if (!b.contact || b.x.distanceTo(anchor.x) > 0.004 || b.q.angleTo(anchor.q) > 0.03) { anchor.x.copy(b.x); anchor.q.copy(b.q); b.still = 0; }\n    else b.still += dt;\n    if (b.still > 0.5) { b.asleep = true; b.v.set(0, 0, 0); b.w.set(0, 0, 0); }\n  };\n  b.wake = () => { b.asleep = false; b.still = 0; };\n  return b;\n}\n\n// the diagonal inertia of a solid box w x h x d of mass m (a stand-in for any object)\nexport const box_inertia = (m, w, h, d) => new THREE.Vector3(m*(h*h + d*d)/12, m*(w*w + d*d)/12, m*(w*w + h*h)/12);\n\n// contact points from a geometry: its vertices, thinned to about n by keeping the extremes\n// (a mesh's hull carries the contact; interior points never touch first)\nexport function contact_points(geo, n = 48, seed = 1) {\n  const P = geo.attributes.position, out = [];\n  const dirs = [];\n  // fibonacci directions: for each, the vertex furthest along it\n  for (let i = 0; i \u003c n; i++) {\n    const y = 1 - 2*(i + 0.5)/n, rr = Math.sqrt(1 - y*y), a = i*2.39996323 + seed;\n    dirs.push(new THREE.Vector3(Math.cos(a)*rr, y, Math.sin(a)*rr));\n  }\n  const v = new THREE.Vector3();\n  for (const d of dirs) {\n    let best = -Infinity, bi = 0;\n    for (let i = 0; i \u003c P.count; i++) { v.fromBufferAttribute(P, i); const s = v.dot(d); if (s > best) { best = s; bi = i; } }\n    const q = new THREE.Vector3().fromBufferAttribute(P, bi);\n    if (!out.some(o => o.distanceToSquared(q) \u003c 1e-6)) out.push(q);\n  }\n  return out;\n}\n","game/cave.js":"// cave.js -- the dream's cave: a round chamber of dark rock, one narrow shaft in the ceiling\r\n// that lets a column of sunlight fall on the egg at the centre, a tunnel the lich enters by,\r\n// fractured blocks, piles, leaning slabs and stones breaking up the floor.\r\n//\r\n// Light (round 2, owner: \"more realistic light ... properly model light reflections\"):\r\n// - DIRECT: one directional sun. Everything casts shadows and a shadow-only lid covers the\r\n//   scene except the shaft, so the pool on the floor and the visible column are the shadow\r\n//   map's (render.js marches the column through it, Sun Court's method).\r\n// - INDIRECT: baked (gi.js). Light from the pool and the sky seen up the shaft bounces around\r\n//   the rock; static surfaces carry it per vertex, moving things sample a probe grid. No fill\r\n//   lights: what isn't lit by the sun is lit only by what the sun lit.\r\n//\r\n// Colours and surface treatment follow the It Follows egg cover; the geometry does not.\r\nimport * as THREE from 'three';\r\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\r\nimport { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';\r\nimport { make_rng, clamp, smoothstep, lerp } from 'game/util.js';\r\nimport * as TX from 'game/textures.js';\r\nimport { bake_gi, gi_static, gi_uniforms, export_gi, import_gi } from 'game/gi.js';\r\nimport { GI_DATA } from 'game/gi_data.js';\r\nimport { install_soft_shadows } from 'game/soft_shadows.js';\r\n\r\n// ---------------------------------------------------------------- geometry noise\r\nfunction h3(ix, iy, iz, seed) {\r\n  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(iz | 0, 2147483647) ^ Math.imul(seed | 0, 1442695041);\r\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\r\n  h ^= h >>> 16;\r\n  return (h >>> 0)/4294967296;\r\n}\r\nfunction noise3(x, y, z, seed = 0) {\r\n  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);\r\n  const fx = x - ix, fy = y - iy, fz = z - iz;\r\n  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy), w = fz*fz*(3 - 2*fz);\r\n  const L = (a, b, t) => a + (b - a)*t;\r\n  const c = (dx, dy, dz) => h3(ix + dx, iy + dy, iz + dz, seed);\r\n  return L(L(L(c(0, 0, 0), c(1, 0, 0), u), L(c(0, 1, 0), c(1, 1, 0), u), v),\r\n           L(L(c(0, 0, 1), c(1, 0, 1), u), L(c(0, 1, 1), c(1, 1, 1), u), v), w);\r\n}\r\nconst fbm3 = (x, y, z, seed, oct = 3) => {\r\n  let s = 0, a = 1, t = 0, f = 1;\r\n  for (let o = 0; o \u003c oct; o++) { s += a*noise3(x*f, y*f, z*f, seed + o*31); t += a; a *= 0.5; f *= 2.03; }\r\n  return s/t;\r\n};\r\n\r\n// World-space UVs, one projection per triangle (its dominant axis), so a texture of N texels\r\n// spans N/32 m on every face at any orientation. Geometry must be non-indexed, in world space.\r\nfunction world_uv(g, tile_m) {\r\n  const p = g.attributes.position, n = p.count;\r\n  const uv = new Float32Array(n*2);\r\n  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), nn = new THREE.Vector3();\r\n  for (let i = 0; i \u003c n; i += 3) {\r\n    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);\r\n    nn.subVectors(c, b).cross(a.clone().sub(b));\r\n    const ax = Math.abs(nn.x), ay = Math.abs(nn.y), az = Math.abs(nn.z);\r\n    for (let k = 0; k \u003c 3; k++) {\r\n      const v = k === 0 ? a : k === 1 ? b : c;\r\n      let u0, v0;\r\n      if (ay >= ax && ay >= az) { u0 = v.x; v0 = v.z; }\r\n      else if (ax >= az) { u0 = v.z; v0 = v.y; }\r\n      else { u0 = v.x; v0 = v.y; }\r\n      uv[(i + k)*2] = u0/tile_m; uv[(i + k)*2 + 1] = v0/tile_m;\r\n    }\r\n  }\r\n  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));\r\n  return g;\r\n}\r\n\r\nfunction flat(g) {\r\n  if (g.index) g = g.toNonIndexed();\r\n  g.computeVertexNormals();\r\n  return g;\r\n}\r\n\r\n// Wind every triangle so its normal points to the open side, as `want(centre, normal)` says\r\n// (the GI bake gathers from that side). Non-indexed geometry, positions only.\r\nfunction orient(g, want) {\r\n  const p = g.attributes.position;\r\n  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3(), m = new THREE.Vector3();\r\n  for (let i = 0; i \u003c p.count; i += 3) {\r\n    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);\r\n    n.subVectors(b, a).cross(c.clone().sub(a));\r\n    m.copy(a).add(b).add(c).multiplyScalar(1/3);\r\n    if (!want(m, n)) { p.setXYZ(i + 1, c.x, c.y, c.z); p.setXYZ(i + 2, b.x, b.y, b.z); }\r\n  }\r\n  p.needsUpdate = true;\r\n  g.computeVertexNormals();\r\n  return g;\r\n}\r\n\r\n// ---------------------------------------------------------------- layout constants\r\nexport const LAYOUT = {\r\n  egg: new THREE.Vector3(0, 0, 0),\r\n  // the sun: nearly straight down, tilted a little so the column leans like the cover's\r\n  sun_dir: new THREE.Vector3(0.11, 1, 0.05).normalize(),     // points TO the sun\r\n  floor_r: 15.5,\r\n  tunnel_theta: -Math.PI/2,                                   // tunnel mouth toward -z\r\n  tunnel_half_w: 2.7, tunnel_h: 4.2,\r\n  hover: new THREE.Vector3(0, 0, -1.9),                       // where the lich stops: at the pool edge, the sun on his skull and shoulders (round 4)\r\n  entrance: new THREE.Vector3(0, 0, -40),\r\n};\r\n\r\nexport function build_cave(R, seed = 7, opts = {}) {\r\n  const rng = make_rng(seed);\r\n  const group = new THREE.Group();\r\n  R.world_scene.add(group);\r\n  const S = LAYOUT.sun_dir;\r\n  const sun_xz = new THREE.Vector2(S.x/S.y, S.z/S.y);        // horizontal drift per metre of height\r\n  const GU = gi_uniforms();\r\n\r\n  // keep-clear zones: the egg's mound and the lich's lane in from the tunnel\r\n  const clear = (x, z, pad = 0) => (x*x + z*z \u003c (3.2 + pad)*(3.2 + pad)) || (Math.abs(x) \u003c 2.6 + pad && z \u003c -1 && z > -20);\r\n\r\n  // ---------------------------------------------------------------- ground height\r\n  const MOUND = 0.3;\r\n  function ground_y(x, z) {\r\n    const r2 = x*x + z*z, r = Math.sqrt(r2);\r\n    let y = (fbm3(x*0.21, 0, z*0.21, 91) - 0.5)*0.7 + (noise3(x*0.9, 7.1, z*0.9, 93) - 0.5)*0.14;\r\n    // low ridges of rock breaking through the floor\r\n    const rid = 1 - Math.abs(fbm3(x*0.13, 3.3, z*0.13, 97, 2)*2 - 1);\r\n    y += Math.pow(rid, 6)*0.55*smoothstep(3.5, 7, r);\r\n    y += MOUND*Math.exp(-r2/4.0);                              // the egg's low mound\r\n    y += smoothstep(12.5, 17.5, r)*1.4;                        // the floor climbs into the walls\r\n    return y;\r\n  }\r\n\r\n  // ---------------------------------------------------------------- materials\r\n  const tx = { rock: TX.rock(11), floor: TX.floor(21), egg: TX.egg_shell(31) };\r\n  const lam = (map, extra = {}) => gi_static(new THREE.MeshLambertMaterial(Object.assign({ map, color: 0xffffff }, extra)), GU);\r\n  const M = {\r\n    rock: lam(tx.rock, { flatShading: true, shadowSide: THREE.DoubleSide }),\r\n    wall: lam(tx.rock, { flatShading: true, side: THREE.DoubleSide, shadowSide: THREE.DoubleSide }),\r\n    dome: lam(tx.rock, { flatShading: true, side: THREE.DoubleSide, shadowSide: THREE.DoubleSide }),\r\n    floor: lam(tx.floor, { flatShading: true }),\r\n    egg: lam(tx.egg),\r\n  };\r\n  const TILE = 64/TX.TEXELS_PER_METER;                          // 2 m per 64-texel tile\r\n  const statics = [];\r\n  const add_static = (g, mat, cast = true) => {\r\n    const m = new THREE.Mesh(g, mat);\r\n    m.castShadow = cast; m.receiveShadow = true;\r\n    group.add(m);\r\n    statics.push(m);\r\n    return m;\r\n  };\r\n\r\n  // ---------------------------------------------------------------- chamber shell (a lathe)\r\n  const PROFILE = [\r\n    [-0.8, 16.8], [0.8, 17.4], [2.6, 17.8], [4.8, 17.2], [7.2, 15.4], [9.4, 12.6], [11.2, 9.6],\r\n    [12.6, 6.8], [13.6, 4.4], [14.3, 2.6], [15.0, 2.1], [16.5, 1.95], [19.0, 2.05], [22.0, 1.95],\r\n    [25.5, 2.1], [29.0, 2.2], [33.0, 2.05], [37.0, 2.15], [41.0, 2.1], [44.0, 2.2], [46.5, 2.3],\r\n  ];                               // owner, round 3: the light comes from further above (~46 m)\r\n  const TOP = PROFILE[PROFILE.length - 1][0];\r\n  const axis_at = h => { const k = smoothstep(11.5, 15.0, h); return [sun_xz.x*h*k, sun_xz.y*h*k]; };\r\n  // the dome's height above a given radius (for hanging stalactites)\r\n  const dome_h_at = r => {\r\n    for (let k = 4; k \u003c 10; k++) {\r\n      const [h0, r0] = PROFILE[k], [h1, r1] = PROFILE[k + 1];\r\n      if (r \u003c= r0 && r >= r1) return lerp(h0, h1, (r0 - r)/(r0 - r1));\r\n    }\r\n    return 12;\r\n  };\r\n  const M_SEG = 72;\r\n  const rings = [];\r\n  for (let k = 0; k \u003c PROFILE.length; k++) {\r\n    const [h, r] = PROFILE[k];\r\n    const [cx, cz] = axis_at(h);\r\n    const ring = [];\r\n    for (let j = 0; j \u003c M_SEG; j++) {\r\n      const th = j/M_SEG*Math.PI*2;\r\n      const ct = Math.cos(th), st = Math.sin(th);\r\n      const slab = noise3(th*9.0/(Math.PI*2)*6, h*0.09, 3.3, 17) - 0.5;\r\n      const lump = fbm3(ct*1.6, h*0.16, st*1.6, 23) - 0.5;\r\n      const fine = noise3(ct*5.1, h*0.7, st*5.1, 29) - 0.5;\r\n      const k_d = h \u003c 14 ? 1 : 0.35;\r\n      const rr = r*(1 + (slab*0.30 + lump*0.34 + fine*0.10)*k_d);\r\n      const hy = h + (noise3(ct*3, h*0.5, st*3, 37) - 0.5)*(h \u003c 14 ? 1.2 : 0.4);\r\n      ring.push(new THREE.Vector3(cx + ct*rr, hy, cz + st*rr));\r\n    }\r\n    rings.push(ring);\r\n  }\r\n  const in_mouth = (a, b, c) => {\r\n    const mx = (a.x + b.x + c.x)/3, my = (a.y + b.y + c.y)/3, mz = (a.z + b.z + c.z)/3;\r\n    if (mz > -8) return false;\r\n    const ex = mx/(LAYOUT.tunnel_half_w + 0.6), ey = my/(LAYOUT.tunnel_h + 0.5);\r\n    return ex*ex + ey*ey \u003c 1 || (Math.abs(mx) \u003c LAYOUT.tunnel_half_w + 0.6 && my \u003c 0);\r\n  };\r\n  const DOME_H = 8.5;\r\n  const wall_pos = [], dome_pos = [];\r\n  const tri = (a, b, c) => {\r\n    if (in_mouth(a, b, c)) return;\r\n    ((a.y + b.y + c.y)/3 > DOME_H ? dome_pos : wall_pos).push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);\r\n  };\r\n  for (let k = 0; k \u003c rings.length - 1; k++) for (let j = 0; j \u003c M_SEG; j++) {\r\n    const a = rings[k][j], b = rings[k][(j + 1) % M_SEG], c = rings[k + 1][(j + 1) % M_SEG], d = rings[k + 1][j];\r\n    tri(a, c, b); tri(a, d, c);\r\n  }\r\n  // inward: toward the axis at the triangle's height\r\n  const inward = (m, n) => { const [ax, az] = axis_at(m.y); return n.x*(ax - m.x) + n.z*(az - m.z) > 0; };\r\n  const shell_geo = arr => {\r\n    let g = new THREE.BufferGeometry();\r\n    g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));\r\n    return world_uv(orient(flat(g), inward), TILE);\r\n  };\r\n  add_static(shell_geo(wall_pos), M.wall);\r\n  const dome = add_static(shell_geo(dome_pos), M.dome);\r\n  void dome;\r\n\r\n  // a shadow-only lid over everything, holed at the shaft: no sunlight reaches the scene except\r\n  // down the shaft (never drawn; it writes the shadow map and blocks the GI bake's rays)\r\n  const LID_Y = TOP - 1.0, LID_HOLE = 1.9;\r\n  const lid = (() => {\r\n    const g = new THREE.RingGeometry(LID_HOLE, 80, 24, 1);\r\n    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, side: THREE.DoubleSide }));\r\n    m.rotation.x = -Math.PI/2;\r\n    m.position.set(sun_xz.x*LID_Y, LID_Y, sun_xz.y*LID_Y);\r\n    m.castShadow = true;\r\n    m.frustumCulled = false;\r\n    group.add(m);\r\n    return m;\r\n  })();\r\n\r\n  // ---------------------------------------------------------------- tunnel\r\n  {\r\n    const RING = 18, z0 = -12.5, z1 = -46, N = 16;\r\n    const rings_t = [];\r\n    for (let k = 0; k \u003c= N; k++) {\r\n      const z = lerp(z0, z1, k/N);\r\n      const ring = [];\r\n      for (let j = 0; j \u003c= RING; j++) {\r\n        const a = lerp(-0.12, 1.12, j/RING)*Math.PI;\r\n        const w = LAYOUT.tunnel_half_w + 0.9, hh = LAYOUT.tunnel_h + 0.6;\r\n        let x = Math.cos(a)*w, y = Math.max(Math.sin(a), -0.35)*hh;\r\n        const d = 1 + (fbm3(x*0.4, y*0.4, z*0.25, 51) - 0.5)*0.42 + (noise3(j*0.9, 2.2, z*0.6, 53) - 0.5)*0.12;\r\n        x *= d; y = y > 0 ? y*d : y - 0.6;\r\n        ring.push(new THREE.Vector3(x, y, z));\r\n      }\r\n      rings_t.push(ring);\r\n    }\r\n    const tp = [];\r\n    for (let k = 0; k \u003c N; k++) for (let j = 0; j \u003c RING; j++) {\r\n      const a = rings_t[k][j], b = rings_t[k][j + 1], c = rings_t[k + 1][j + 1], d = rings_t[k + 1][j];\r\n      tp.push(a.x, a.y, a.z, c.x, c.y, c.z, b.x, b.y, b.z, a.x, a.y, a.z, d.x, d.y, d.z, c.x, c.y, c.z);\r\n    }\r\n    const e = rings_t[N], ec = new THREE.Vector3(0, 1.5, z1 - 1.5);\r\n    for (let j = 0; j \u003c RING; j++) tp.push(ec.x, ec.y, ec.z, e[j].x, e[j].y, e[j].z, e[j + 1].x, e[j + 1].y, e[j + 1].z);\r\n    let tg = new THREE.BufferGeometry();\r\n    tg.setAttribute('position', new THREE.Float32BufferAttribute(tp, 3));\r\n    const tin = (m, n) => (m.z \u003c z1 - 0.5 ? n.z > 0 : n.x*(0 - m.x) + n.y*(1.4 - m.y) > 0);\r\n    tg = world_uv(orient(flat(tg), tin), TILE);\r\n    add_static(tg, M.wall);\r\n  }\r\n\r\n  // ---------------------------------------------------------------- floor\r\n  {\r\n    const x0 = -21, x1 = 21, z0 = -47, z1 = 21, CELL = 0.7;\r\n    const nx = Math.round((x1 - x0)/CELL), nz = Math.round((z1 - z0)/CELL);\r\n    const P = [];\r\n    const vy = (x, z) => ground_y(x, z);\r\n    const jit = (i, j, s) => (h3(i, j, 0, s) - 0.5)*CELL*0.55;\r\n    const vx = (i, j) => [x0 + i*CELL + (i > 0 && i \u003c nx ? jit(i, j, 61) : 0), z0 + j*CELL + (j > 0 && j \u003c nz ? jit(i, j, 67) : 0)];\r\n    for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) {\r\n      const [ax, az] = vx(i, j), [bx, bz] = vx(i + 1, j), [cx, cz] = vx(i + 1, j + 1), [dx, dz] = vx(i, j + 1);\r\n      const mx = (ax + cx)/2, mz = (az + cz)/2;\r\n      const in_ch = mx*mx + mz*mz \u003c 19.5*19.5, in_tu = Math.abs(mx) \u003c 3.1 && mz \u003c -12;\r\n      if (!in_ch && !in_tu) continue;\r\n      P.push(ax, vy(ax, az), az, dx, vy(dx, dz), dz, cx, vy(cx, cz), cz);\r\n      P.push(ax, vy(ax, az), az, cx, vy(cx, cz), cz, bx, vy(bx, bz), bz);\r\n    }\r\n    let g = new THREE.BufferGeometry();\r\n    g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));\r\n    g = world_uv(orient(flat(g), (m, n) => n.y > 0), TILE);\r\n    add_static(g, M.floor);\r\n  }\r\n\r\n  // ---------------------------------------------------------------- rocks and formations\r\n  // Round 3 (owner: \"a mix of cave 04 and cave 06\" -- Astra's refs): angular fractured blocks\r\n  // with flat break faces and sharp edges, stacked and tilted (04), dark boulders over a floor\r\n  // strewn with stones and grit (06). No stalagmites or stalactites. Every rock is the convex\r\n  // hull of points scattered in a box, a few pinned near its corners, which gives big planar\r\n  // fracture faces.\r\n  const rocks = [];\r\n  const outward_from = c => (m, n) => n.x*(m.x - c.x) + n.y*(m.y - c.y) + n.z*(m.z - c.z) > 0;\r\n  const block = (w, h, d, corners = 0.55, n = 12) => {\r\n    const pts = [];\r\n    for (let i = 0; i \u003c n; i++) pts.push(new THREE.Vector3(rng.spread(w/2), rng.spread(h/2), rng.spread(d/2)));\r\n    for (const sx of [-1, 1]) for (const sy of [-1, 1]) for (const sz of [-1, 1]) {\r\n      if (rng.chance(corners)) pts.push(new THREE.Vector3(sx*w/2*rng.float(0.7, 1), sy*h/2*rng.float(0.7, 1), sz*d/2*rng.float(0.7, 1)));\r\n    }\r\n    return new ConvexGeometry(pts);\r\n  };\r\n  // place a block: centre at ground + lift, tilted and turned; `sink` buries its lower part\r\n  const add_block = (x, z, w, h, d, o = {}) => {\r\n    const g = flat(block(w, h, d, o.corners ?? 0.55, o.n ?? 12));\r\n    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rng.spread(o.tilt ?? 0.35), o.yaw ?? rng.float(0, Math.PI*2), rng.spread(o.tilt ?? 0.35), 'YXZ'));\r\n    const c = new THREE.Vector3(x, ground_y(x, z) + h*(0.5 - (o.sink ?? 0.25)) + (o.lift || 0), z);\r\n    g.applyMatrix4(new THREE.Matrix4().compose(c, q, new THREE.Vector3(1, 1, 1)));\r\n    rocks.push(orient(flat(g), outward_from(c)));\r\n    return c;\r\n  };\r\n  const ang_from_tunnel = th => Math.abs(Math.atan2(Math.sin(th - LAYOUT.tunnel_theta), Math.cos(th - LAYOUT.tunnel_theta)));\r\n  // big fractured blocks piled along the walls\r\n  for (let i = 0; i \u003c 80; i++) {\r\n    const th = rng.float(0, Math.PI*2);\r\n    if (ang_from_tunnel(th) \u003c 0.26) continue;\r\n    const r = rng.float(12.8, 17.6);\r\n    const s = lerp(0.6, 3.2, Math.pow(rng.next(), 1.5))*smoothstep(11, 16, r) + 0.3;\r\n    add_block(Math.cos(th)*r, Math.sin(th)*r, s*rng.float(0.8, 1.5), s*rng.float(0.5, 1.1), s*rng.float(0.7, 1.3), { tilt: 0.45, sink: 0.3 });\r\n  }\r\n  // broken slabs leaning against the walls (thin, tall, tilted back)\r\n  for (let i = 0; i \u003c 30; i++) {\r\n    const th = rng.float(0, Math.PI*2);\r\n    if (ang_from_tunnel(th) \u003c 0.32) continue;\r\n    const r = rng.float(15.0, 17.0);\r\n    const x = Math.cos(th)*r, z = Math.sin(th)*r;\r\n    const hgt = rng.float(2.5, 7.0);\r\n    const yaw = Math.atan2(x, z);\r\n    const g = flat(block(rng.float(1.0, 2.6), hgt, rng.float(0.35, 0.8), 0.8, 10));\r\n    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-rng.float(0.08, 0.35), yaw, rng.spread(0.15), 'YXZ'));\r\n    const c = new THREE.Vector3(x, ground_y(x, z) + hgt*0.4, z);\r\n    g.applyMatrix4(new THREE.Matrix4().compose(c, q, new THREE.Vector3(1, 1, 1)));\r\n    rocks.push(orient(flat(g), outward_from(c)));\r\n  }\r\n  // formations on the floor: piles of big angular blocks, stacked and tilted\r\n  const PILES = [];\r\n  for (let n = 0, tries = 0; n \u003c 10 && tries \u003c 400; tries++) {\r\n    const th = rng.float(0, Math.PI*2), r = rng.float(5.5, 13.5);\r\n    const x = Math.cos(th)*r, z = Math.sin(th)*r;\r\n    if (clear(x, z, 2.0) || PILES.some(o => Math.hypot(o[0] - x, o[1] - z) \u003c 4.6)) continue;\r\n    PILES.push([x, z]); n++;\r\n    const S = lerp(0.9, 2.1, rng.next())*lerp(0.8, 1.2, smoothstep(6, 13, r));\r\n    // a base of two or three blocks, one or two resting on them, a few fallen pieces around\r\n    const base = rng.int(2, 3);\r\n    for (let k = 0; k \u003c base; k++) {\r\n      const a = rng.float(0, 6.28), d = rng.float(0.2, 0.8)*S;\r\n      add_block(x + Math.cos(a)*d, z + Math.sin(a)*d, S*rng.float(1.0, 1.7), S*rng.float(0.6, 1.1), S*rng.float(0.8, 1.4), { tilt: 0.3, sink: 0.2 });\r\n    }\r\n    const top = rng.int(0, 2);\r\n    for (let k = 0; k \u003c top; k++) {\r\n      add_block(x + rng.spread(0.4*S), z + rng.spread(0.4*S), S*rng.float(0.7, 1.2), S*rng.float(0.4, 0.8), S*rng.float(0.6, 1.0), { tilt: 0.6, sink: 0, lift: S*0.75 });\r\n    }\r\n    for (let k = 0; k \u003c rng.int(3, 7); k++) {\r\n      const a = rng.float(0, 6.28), d = S*rng.float(1.0, 2.0);\r\n      const s = S*rng.float(0.15, 0.4);\r\n      add_block(x + Math.cos(a)*d, z + Math.sin(a)*d, s*rng.float(0.8, 1.5), s*rng.float(0.5, 1), s, { tilt: 0.7, sink: 0.3 });\r\n    }\r\n  }\r\n  // stones across the open floor, and grit\r\n  for (let i = 0; i \u003c 170; i++) {\r\n    const th = rng.float(0, Math.PI*2), r = rng.float(2.4, 14.5);\r\n    const x = Math.cos(th)*r, z = Math.sin(th)*r;\r\n    if (Math.abs(x) \u003c 1.8 && z \u003c -1.5 && z > -16) continue;              // the lich's lane stays walkable\r\n    const s = lerp(0.06, 0.5, Math.pow(rng.next(), 2.2));\r\n    add_block(x, z, s*rng.float(0.9, 1.6), s*rng.float(0.4, 0.9), s*rng.float(0.8, 1.3), { tilt: 0.8, sink: 0.35, n: 8 });\r\n  }\r\n  // rubble inside and around the pool: its edge breaks up on stones instead of a clean disc\r\n  // (cave 06), bigger stones where the light's edge falls\r\n  for (let i = 0; i \u003c 60; i++) {\r\n    const th = rng.float(0, Math.PI*2), r = i \u003c 22 ? rng.float(1.5, 2.4) : rng.float(0.6, 2.8);\r\n    if (Math.abs(Math.cos(th)*r) \u003c 0.9 && Math.sin(th)*r \u003c -1.8) continue;     // not under the lich\r\n    const s = i \u003c 22 ? lerp(0.12, 0.36, rng.next()) : lerp(0.04, 0.22, Math.pow(rng.next(), 1.8));\r\n    add_block(Math.cos(th)*r, Math.sin(th)*r, s*rng.float(0.9, 1.6), s*rng.float(0.4, 0.9), s*rng.float(0.8, 1.3), { tilt: 0.9, sink: 0.35, n: 8 });\r\n  }\r\n  const rock_geo = world_uv(mergeGeometries(rocks, false), TILE);   // world space; nav.js reads it\r\n  add_static(rock_geo, M.rock);\r\n\r\n  // ---------------------------------------------------------------- the egg (0.8 m tall)\r\n  const EGG_S = 0.8;\r\n  const egg = new THREE.Group();\r\n  {\r\n    let g = new THREE.SphereGeometry(0.5, 24, 16);\r\n    const p = g.attributes.position;\r\n    for (let i = 0; i \u003c p.count; i++) {\r\n      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);\r\n      const taper = 1 - 0.14*clamp(y/0.5, 0, 1) + 0.03*clamp(-y/0.5, 0, 1);\r\n      p.setXYZ(i, x*0.78*taper*EGG_S, y*EGG_S, z*0.78*taper*EGG_S);\r\n    }\r\n    g.computeVertexNormals();\r\n    g = g.toNonIndexed();                                        // keeps the smooth normals\r\n    const m = new THREE.Mesh(g, M.egg);\r\n    m.position.y = 0.5*EGG_S;\r\n    m.castShadow = true; m.receiveShadow = true;\r\n    egg.add(m);\r\n    egg.userData.shell = m;\r\n    statics.push(m);\r\n  }\r\n  egg.position.set(0, ground_y(0, 0) - 0.03, 0);\r\n  group.add(egg);\r\n\r\n  // ---------------------------------------------------------------- the sun\r\n  const SUN_E = opts.sun_E || 9.0;\r\n  const SUN_COL = new THREE.Color(0xffe6b8);\r\n  const sun = new THREE.DirectionalLight(SUN_COL, SUN_E);\r\n  sun.position.copy(S).multiplyScalar(70);\r\n  sun.target.position.set(0, 0, 0);\r\n  sun.castShadow = true;\r\n  sun.shadow.mapSize.set(2048, 2048);\r\n  {\r\n    const sc = sun.shadow.camera;\r\n    const X = new THREE.Vector3(1, 0, 0);\r\n    const Rx = X.clone().sub(S.clone().multiplyScalar(X.dot(S))).normalize();\r\n    const Uy = new THREE.Vector3().crossVectors(S, Rx);\r\n    sc.up.copy(Uy);\r\n    let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;\r\n    for (const cx of [-21, 21]) for (const cy of [-1.5, TOP + 1]) for (const cz of [-48, 21]) {\r\n      const v = new THREE.Vector3(cx, cy, cz);\r\n      a0 = Math.min(a0, v.dot(Rx)); a1 = Math.max(a1, v.dot(Rx)); b0 = Math.min(b0, v.dot(Uy)); b1 = Math.max(b1, v.dot(Uy));\r\n    }\r\n    const tx_ = (a1 - a0)/2048, ty_ = (b1 - b0)/2048;\r\n    sc.left = Math.floor(a0/tx_)*tx_; sc.right = Math.ceil(a1/tx_)*tx_; sc.bottom = Math.floor(b0/ty_)*ty_; sc.top = Math.ceil(b1/ty_)*ty_;\r\n    sc.near = 1; sc.far = 130;\r\n    sc.updateProjectionMatrix();\r\n    // shadows soften with the distance to their caster (the sun's half-degree disc)\r\n    install_soft_shadows({ depth_range: sc.far - sc.near, texel_m: Math.max(sc.right - sc.left, sc.top - sc.bottom)/2048, sun_angle: 0.0093*1.6, max_texels: 20 });\r\n  }\r\n  sun.shadow.bias = -0.0005;\r\n  sun.shadow.normalBias = 0.03;\r\n  group.add(sun, sun.target);\r\n  // owner, round 2: the egg and the lit floor too bright. The bake keeps the full sun (it sets\r\n  // how much light enters the room); the direct light drawn on the pool is scaled down.\r\n  const DIRECT_K = 0.42;                   // round 3: dimmer still where it lands\r\n  // a glimpse of sky at the top of the shaft: an HDR cap for the bloom to catch\r\n  const SKY_L = [2.4, 2.5, 2.7];\r\n  {\r\n    const g = new THREE.CircleGeometry(2.8, 16);\r\n    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: new THREE.Color(9, 8.4, 7.2), side: THREE.DoubleSide }));\r\n    m.rotation.x = Math.PI/2;\r\n    m.position.set(sun_xz.x*(TOP - 0.3), TOP - 0.3, sun_xz.y*(TOP - 0.3));\r\n    group.add(m);\r\n  }\r\n\r\n  // ---------------------------------------------------------------- bake the bounce light\r\n  const t0 = performance.now();\r\n  const baked = bake_gi(statics, {\r\n    sun_dir: S, sun_E: [SUN_COL.r*SUN_E, SUN_COL.g*SUN_E, SUN_COL.b*SUN_E],\r\n    sky: { y: LID_Y, cx: sun_xz.x*LID_Y, cz: sun_xz.y*LID_Y, r: LID_HOLE, L: SKY_L },\r\n    rays: opts.rays || 64, bounces: opts.bounces || 3, occluders: [lid], seed: 5, denoise: 0.9,\r\n    cache: import_gi(GI_DATA),\r\n    // the column: radius of the shaft, radiance per metre of chord = shaft colour x mean phase x\r\n    // density (render.js draws it with the same law)\r\n    beam: { x: 0, z: 0, r: LID_HOLE*0.95, h: 60, L: [1.0*0.5*0.022, 0.8*0.5*0.022, 0.46*0.5*0.022] },\r\n    grid: { min: [-17, 0.2, -24], max: [17, 6.5, 17], n: [18, 6, 22], rays: 64 },\r\n  });\r\n  const bake_ms = performance.now() - t0;\r\n  sun.intensity = SUN_E*DIRECT_K;\r\n  GU.uGIUp.value = baked.probes.up; GU.uGIDown.value = baked.probes.down;\r\n  GU.uGIMin.value.copy(baked.probes.min); GU.uGIMax.value.copy(baked.probes.max);\r\n\r\n  // ---------------------------------------------------------------- atmosphere (render.js)\r\n  const P = R.params;\r\n  R.world_scene.background = new THREE.Color(0x000000);\r\n  P.sky.on = false;\r\n  Object.assign(P.fog, { near: 8, far: 50, max: 0.6, curve: 1.3, sky: 0.0, base_y: 0, falloff: 0.0, height_mix: 0.0 });\r\n  P.fog.color.setRGB(0.004, 0.0037, 0.0034);\r\n  P.shafts = { on: true, light: sun, color: [0.74, 0.59, 0.34], density: 0.02, max_dist: 70, steps: 48, phase: 0.35, ambient: 0.0,\r\n    streak: 0.85, rise: 1.0, soft: 0.00022, top: LID_Y };\r\n  P.dither_dark = [0.04, 0.16];\r\n  R.set_shadow_light(sun);\r\n  R.rebuild();\r\n  P.bloom = { strength: 0.32, threshold: 1.25 };\r\n  P.vignette = 0.3;\r\n  P.contrast = 1.04; P.saturation = 1.04;\r\n  P.lift = [0.003, 0.002, 0.006];\r\n\r\n  // dust in the column\r\n  const DUST = 160;\r\n  const dust_pos = new Float32Array(DUST*3), dust_col = new Float32Array(DUST*3), dust = [];\r\n  for (let i = 0; i \u003c DUST; i++) {\r\n    dust.push({ h: rng.float(0.3, 20), a: rng.float(0, 6.283), r: Math.sqrt(rng.next())*1.6, v: rng.float(0.03, 0.12), w: rng.float(0.05, 0.25), b: rng.float(0.4, 1) });\r\n  }\r\n  const dust_geo = new THREE.BufferGeometry();\r\n  dust_geo.setAttribute('position', new THREE.BufferAttribute(dust_pos, 3));\r\n  dust_geo.setAttribute('color', new THREE.BufferAttribute(dust_col, 3));\r\n  const dust_pts = new THREE.Points(dust_geo, new THREE.PointsMaterial({ size: 1, sizeAttenuation: false, vertexColors: true,\r\n    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));\r\n  dust_pts.frustumCulled = false;\r\n  group.add(dust_pts);\r\n  function update_dust(t, dt) {\r\n    for (let i = 0; i \u003c DUST; i++) {\r\n      const d = dust[i];\r\n      d.h -= d.v*dt; d.a += d.w*dt;\r\n      if (d.h \u003c 0.2) d.h = 20;\r\n      const cx = sun_xz.x*d.h, cz = sun_xz.y*d.h;\r\n      dust_pos[i*3] = cx + Math.cos(d.a)*d.r; dust_pos[i*3 + 1] = d.h; dust_pos[i*3 + 2] = cz + Math.sin(d.a)*d.r;\r\n      const tw = 0.6 + 0.4*Math.sin(t*1.7 + i*1.3);\r\n      const k = d.b*tw*(0.55 + 0.45*Math.min(1, d.h/10))*0.6;\r\n      dust_col[i*3] = 1.5*k; dust_col[i*3 + 1] = 1.25*k; dust_col[i*3 + 2] = 0.8*k;\r\n    }\r\n    dust_geo.attributes.position.needsUpdate = true;\r\n    dust_geo.attributes.color.needsUpdate = true;\r\n  }\r\n\r\n  // exposure: a realistic range (the pool is hundreds of times brighter than the far rock), so\r\n  // how much of the cave shows is how the \"camera\" is exposed; the pool rolls off in the shoulder\r\n  // The bake is physical; its LEVEL is art direction (owner, round 1: \"between dim and\r\n  // readable\"). The bounce keeps its realistic distribution -- bright by the pool and the\r\n  // column, soft falloff, dark in occluded corners -- scaled as a whole.\r\n  const DARK = [\r\n    { name: 'DIMMER', gi: 5, exposure: 2.2 },\r\n    { name: 'BETWEEN DIM AND READABLE', gi: 10, exposure: 2.2 },\r\n    { name: 'BRIGHTER', gi: 18, exposure: 2.2 },\r\n  ];\r\n\r\n  const dome_mats = [M.dome];\r\n  return {\r\n    group, ground_y, egg, sun, LAYOUT, GU, rock_geo, rock_tex: tx.rock, bake_ms, tris: baked.tris, gi_cached: baked.cached,\r\n    export_gi: () => export_gi(baked.data),\r\n    set_dome_visible(on) { for (const m of dome_mats) { m.colorWrite = on; m.depthWrite = on; } },\r\n    DARK,\r\n    set_darkness(i) {\r\n      const d = DARK[((i % DARK.length) + DARK.length) % DARK.length];\r\n      P.exposure = d.exposure;\r\n      GU.uGIScale.value = d.gi;\r\n      return d.name;\r\n    },\r\n    update(t, dt) {\r\n      update_dust(t, dt);\r\n      const shell = egg.userData.shell;\r\n      const k = Math.max(0, Math.sin(t*0.9)*Math.sin(t*2.3) - 0.55)*1.6;\r\n      shell.rotation.z = Math.sin(t*38)*0.035*k;\r\n      shell.rotation.x = Math.cos(t*31)*0.025*k;\r\n    },\r\n  };\r\n}\r\n","game/fire.js":"// fire.js -- the lich's first attack (round 9; owner: \"A random snake is set on fire. It stops\r\n// moving while on fire. The fire eventually stops, its blackened corpse goes into the ground as\r\n// disappear effect.\").\r\n//\r\n// A burn is a timeline over a body lying still: the flames spread from one point along it, burn,\r\n// die down tail-first; the scales char black behind the flames, with cracks that glow and cool\r\n// after the flames are gone; smoke keeps rising a little longer. snakes.js owns the body (it\r\n// keeps `burn.spine` up to date and reads `burn.char(i)` / `burn.ember(i)` per ring); this file\r\n// owns the particles (flames, sparks, smoke, ash) and a light per burn, lighting the rock and\r\n// the lich like any other light (lights are pooled so their count never changes: a new light\r\n// count would recompile every material).\r\n//\r\n// F cycles the fire's colour (LOOKS): natural, the lich's own prismatic fire, cold spectral fire.\r\nimport * as THREE from 'three';\r\nimport { make_rng, clamp, smoothstep, lerp } from 'game/util.js';\r\nimport { sprite_pool } from 'game/fx.js';\r\n\r\n// timeline, seconds from ignition\r\nexport const BURN = {\r\n  spread: 0.35,         // the flames run from the ignition point to both ends\r\n  burn: 2.4,            // full fire until here\r\n  die: 0.7,             // then dies down, tail first\r\n  char: 1.3,            // a ring chars fully this long after its flames arrive\r\n  cool: 1.0,            // the glowing cracks cool this long after the flames go\r\n  smoke: 1.2,           // smoke rises this long after the flames go\r\n};\r\nBURN.out = BURN.burn + BURN.die;                  // no flames after this\r\nBURN.end = BURN.out + Math.max(BURN.cool, BURN.smoke);   // the body is ready to sink\r\n\r\nconst LOOKS = [\r\n  { name: 'NATURAL',\r\n    ramp: [[1.0, 0.82, 0.42, 4.2], [1.0, 0.48, 0.09, 2.9], [0.85, 0.2, 0.035, 1.4], [0.3, 0.05, 0.015, 0.35]],\r\n    light: [1.0, 0.52, 0.18], ember: [3.2, 0.75, 0.1], spark: [4.0, 2.4, 0.8], smoke: [0.011, 0.01, 0.009], prism: 0 },\r\n  { name: 'THE LICH\\'S (PRISMATIC)',\r\n    ramp: [[1.0, 0.97, 0.95, 3.8], [0.85, 0.8, 1.0, 2.6], [0.7, 0.6, 1.0, 1.3], [0.4, 0.3, 0.6, 0.35]],\r\n    light: [0.85, 0.8, 1.0], ember: [1.6, 1.0, 2.4], spark: [3.2, 3.0, 3.6], smoke: [0.01, 0.01, 0.012], prism: 1 },\r\n  { name: 'SPECTRAL',\r\n    ramp: [[0.85, 0.95, 1.0, 3.8], [0.35, 0.65, 1.0, 2.6], [0.2, 0.3, 1.0, 1.3], [0.15, 0.1, 0.5, 0.35]],\r\n    light: [0.45, 0.65, 1.0], ember: [0.5, 1.2, 3.2], spark: [2.0, 3.2, 4.0], smoke: [0.009, 0.01, 0.012], prism: 0 },\r\n];\r\n\r\nconst spectrum = (h) => { h = ((h % 1) + 1) % 1; const c = [0, 2/3, 1/3].map(o => clamp(Math.abs(((h + o) % 1)*6 - 3) - 1, 0, 1)); return c; };\r\n\r\nexport function create_fire(R, cave, seed = 13) {\r\n  const rng = make_rng(seed);\r\n  const flames = sprite_pool(R, 900, true, 'flame');\r\n  const sparks = sprite_pool(R, 160, true, 'dot');\r\n  const smoke = sprite_pool(R, 320, false, 'dot');\r\n  const LIGHTS = [0, 1, 2, 3].map(() => {\r\n    const l = new THREE.PointLight(0xffffff, 0, 7, 2);\r\n    l.castShadow = false;\r\n    R.world_scene.add(l);\r\n    return { l, burn: null };\r\n  });\r\n  let look = 0;\r\n  const burns = [];\r\n\r\n  // a burn over a body of `rings` spine points: `burn.spine[i]` (Vector3, world) and `burn.r[i]`\r\n  // (radius, m) are kept current by the caller\r\n  function start(rings, spine, radii, ignite_at) {\r\n    const b = { t: 0, rings, spine, r: radii, at: ignite_at, acc: 0, sacc: 0, kacc: 0, light: null, done: false, flash: 1 };\r\n    const free = LIGHTS.find(L => !L.burn) || LIGHTS.reduce((a, L) => (L.burn.t > a.burn.t ? L : a));\r\n    if (free.burn) free.burn.light = null;\r\n    free.burn = b; b.light = free;\r\n    // the ignition: a burst of flame and sparks at the point it catches\r\n    const p0 = spine[ignite_at];\r\n    for (let k = 0; k \u003c 10; k++) emit_flame(b, ignite_at, 1.3);\r\n    for (let k = 0; k \u003c 14; k++) emit_spark(p0, 1.3);\r\n    burns.push(b);\r\n    return b;\r\n  }\r\n\r\n  // where along the body the flames are, 0..1 per ring (spread from the ignition point, then\r\n  // dying down from the tail)\r\n  function flame_at(b, i) {\r\n    const d = Math.abs(i - b.at)/b.rings;                     // body fractions from the ignition\r\n    const arrive = d*BURN.spread/0.6;\r\n    if (b.t \u003c arrive) return 0;\r\n    const up = smoothstep(arrive, arrive + 0.12, b.t);\r\n    const die_start = BURN.burn + (1 - i/(b.rings - 1))*BURN.die*0.6;   // the tail goes first\r\n    const down = 1 - smoothstep(die_start, die_start + BURN.die*0.4, b.t);\r\n    return up*down;\r\n  }\r\n  const arrive_t = (b, i) => Math.abs(i - b.at)/b.rings*BURN.spread/0.6;\r\n\r\n  function emit_flame(b, i, boost = 1) {\r\n    const p = flames.spawn(), c = b.spine[i], r = b.r[i];\r\n    const a = rng.float(0, Math.PI*2);\r\n    p.x = c.x + Math.cos(a)*r*0.8; p.z = c.z + Math.sin(a)*r*0.8; p.y = c.y + r*rng.float(0.2, 0.9);\r\n    p.vx = rng.spread(0.18)*boost; p.vz = rng.spread(0.18)*boost; p.vy = rng.float(0.55, 1.15)*boost;\r\n    p.max = p.life = rng.float(0.34, 0.66)*(boost > 1 ? 1.2 : 1);\r\n    p.s0 = rng.float(0.12, 0.24)*(boost > 1 ? 1.35 : 1); p.s1 = p.s0*0.3;\r\n    p.h = rng.next();\r\n  }\r\n  function emit_spark(c, boost = 1) {\r\n    const p = sparks.spawn();\r\n    p.x = c.x + rng.spread(0.1); p.y = c.y + 0.05; p.z = c.z + rng.spread(0.1);\r\n    p.vx = rng.spread(0.9)*boost; p.vz = rng.spread(0.9)*boost; p.vy = rng.float(1.2, 2.6)*boost;\r\n    p.max = p.life = rng.float(0.45, 1.0); p.s0 = 0.035; p.s1 = 0.02; p.h = rng.next();\r\n  }\r\n  function emit_smoke(c, r, k = 1, lit = 0) {\r\n    const p = smoke.spawn();\r\n    p.lit = lit;\r\n    p.x = c.x + rng.spread(r); p.y = c.y + r*0.8 + rng.float(0.05, 0.3); p.z = c.z + rng.spread(r);\r\n    p.vx = rng.spread(0.08); p.vz = rng.spread(0.08); p.vy = rng.float(0.35, 0.6);\r\n    p.max = p.life = rng.float(1.4, 2.4); p.s0 = rng.float(0.25, 0.4)*k; p.s1 = p.s0*rng.float(2.0, 2.8); p.h = rng.next();\r\n  }\r\n  // the corpse going into the ground: a low ring of ash and grit\r\n  function ash(spine, rings) {\r\n    for (let k = 0; k \u003c 40; k++) {\r\n      const i = rng.int(0, rings - 1), c = spine[i];\r\n      const p = smoke.spawn();\r\n      p.x = c.x + rng.spread(0.12); p.y = c.y; p.z = c.z + rng.spread(0.12);\r\n      p.vx = rng.spread(0.35); p.vz = rng.spread(0.35); p.vy = rng.float(0.05, 0.3);\r\n      p.max = p.life = rng.float(0.6, 1.1); p.s0 = rng.float(0.1, 0.2); p.s1 = p.s0*2.2; p.h = -1; p.lit = 0;   // h \u003c 0: grit coloured\r\n    }\r\n  }\r\n\r\n  function update(t, dt) {\r\n    const L = LOOKS[look];\r\n    for (let bi = burns.length - 1; bi >= 0; bi--) {\r\n      const b = burns[bi];\r\n      b.t += dt;\r\n      // flames: about 110 a second along a whole burning body, where the fire is\r\n      let lit = 0;\r\n      for (let i = 0; i \u003c b.rings; i++) lit += flame_at(b, i);\r\n      const frac = lit/b.rings;\r\n      b.acc += 170*frac*dt;\r\n      while (b.acc >= 1) {\r\n        b.acc -= 1;\r\n        // pick a ring weighted by its flame\r\n        let i = 0;\r\n        for (let tries = 0; tries \u003c 8; tries++) { i = rng.int(0, b.rings - 1); if (rng.next() \u003c flame_at(b, i)) break; }\r\n        if (flame_at(b, i) > 0.05) emit_flame(b, i);\r\n      }\r\n      b.kacc += 7*frac*dt;\r\n      while (b.kacc >= 1) { b.kacc -= 1; const i = rng.int(0, b.rings - 1); if (flame_at(b, i) > 0.3) emit_spark(b.spine[i]); }\r\n      // smoke: through the fire and a little after, thinning out\r\n      const smoky = b.t \u003c BURN.out ? 0.5 + 0.5*frac : 1 - smoothstep(BURN.out, BURN.out + BURN.smoke, b.t);\r\n      b.sacc += 16*smoky*dt;\r\n      while (b.sacc >= 1) { b.sacc -= 1; const i = rng.int(0, b.rings - 1); emit_smoke(b.spine[i], b.r[i], b.t \u003c BURN.out ? 1 : 0.7, b.t \u003c BURN.out ? frac : 0); }\r\n      // the light: at the body's burning middle, flickering, a flash when it catches\r\n      if (b.light) {\r\n        let cx = 0, cy = 0, cz = 0, w = 0;\r\n        for (let i = 0; i \u003c b.rings; i += 4) { const f = flame_at(b, i) + 1e-3; cx += b.spine[i].x*f; cy += b.spine[i].y*f; cz += b.spine[i].z*f; w += f; }\r\n        const l = b.light.l;\r\n        l.position.set(cx/w, cy/w + 0.35, cz/w);\r\n        b.flash = Math.max(0, b.flash - dt*3.5);\r\n        const flick = 0.82 + 0.1*Math.sin(t*23 + bi) + 0.08*Math.sin(t*37.3 + bi*2.1) + rng.spread(0.05);\r\n        l.color.setRGB(...L.light);\r\n        l.intensity = 3.2*frac*flick*(1 + 1.2*b.flash);\r\n      }\r\n      if (b.t > BURN.end) {\r\n        if (b.light) { b.light.l.intensity = 0; b.light.burn = null; b.light = null; }\r\n        b.done = true;\r\n        burns.splice(bi, 1);\r\n      }\r\n    }\r\n\r\n    // particles\r\n    flames.write((p, i, pos, col, size) => {\r\n      p.life -= dt;\r\n      const u = 1 - p.life/p.max;                     // 0 born .. 1 gone\r\n      p.vx += Math.sin(t*9 + p.h*40)*0.6*dt; p.vz += Math.cos(t*8 + p.h*33)*0.6*dt; p.vy += 0.5*dt;   // buoyant, a little turbulent\r\n      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;\r\n      pos[i*3] = p.x; pos[i*3 + 1] = p.y; pos[i*3 + 2] = p.z;\r\n      // colour down the ramp: core -> body -> tip -> gone\r\n      const k = Math.min(2.999, u*3), j = Math.floor(k), f = k - j, a = L.ramp[j], b = L.ramp[j + 1];\r\n      let r = lerp(a[0], b[0], f), g = lerp(a[1], b[1], f), bl = lerp(a[2], b[2], f), e = lerp(a[3], b[3], f);\r\n      if (L.prism) { const s = spectrum(p.h + t*0.15); const m = 0.45*smoothstep(0.1, 0.6, u); r = lerp(r, s[0], m); g = lerp(g, s[1], m); bl = lerp(bl, s[2], m); }\r\n      const fade = smoothstep(0, 0.12, u)*(1 - smoothstep(0.7, 1, u));\r\n      col[i*4] = r*e; col[i*4 + 1] = g*e; col[i*4 + 2] = bl*e; col[i*4 + 3] = fade;\r\n      size[i] = lerp(p.s0, p.s1, u);\r\n    });\r\n    sparks.write((p, i, pos, col, size) => {\r\n      p.life -= dt;\r\n      const u = 1 - p.life/p.max;\r\n      p.vy -= 1.6*dt; p.vx *= 1 - 0.8*dt; p.vz *= 1 - 0.8*dt;\r\n      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;\r\n      pos[i*3] = p.x; pos[i*3 + 1] = p.y; pos[i*3 + 2] = p.z;\r\n      const tw = 0.6 + 0.4*Math.sin(t*50 + p.h*90);\r\n      let c = L.spark;\r\n      if (L.prism) { const s = spectrum(p.h); c = [lerp(c[0], s[0]*4, 0.5), lerp(c[1], s[1]*4, 0.5), lerp(c[2], s[2]*4, 0.5)]; }\r\n      col[i*4] = c[0]; col[i*4 + 1] = c[1]; col[i*4 + 2] = c[2]; col[i*4 + 3] = tw*(1 - u*u);\r\n      size[i] = lerp(p.s0, p.s1, u);\r\n    });\r\n    smoke.write((p, i, pos, col, size) => {\r\n      p.life -= dt;\r\n      const u = 1 - p.life/p.max;\r\n      p.vy *= 1 - 0.35*dt; p.vx += Math.sin(t*1.7 + p.h*20)*0.08*dt;\r\n      p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;\r\n      pos[i*3] = p.x; pos[i*3 + 1] = p.y; pos[i*3 + 2] = p.z;\r\n      // dark, as smoke is where nothing lights it; warmed by the flames it leaves while young\r\n      const c = p.h \u003c 0 ? [0.016, 0.014, 0.011] : L.smoke, w = (p.lit || 0)*0.07*(1 - u)*(1 - u);\r\n      col[i*4] = c[0] + L.light[0]*w; col[i*4 + 1] = c[1] + L.light[1]*w; col[i*4 + 2] = c[2] + L.light[2]*w;\r\n      col[i*4 + 3] = (p.h \u003c 0 ? 0.55 : 0.4)*smoothstep(0, 0.15, u)*(1 - smoothstep(0.45, 1, u));\r\n      size[i] = lerp(p.s0, p.s1, u);\r\n    });\r\n  }\r\n\r\n  // before each render: how many pixels one metre at one metre spans (the sprites' size)\r\n  function set_camera(cam, H) {\r\n    const s = cam.projectionMatrix.elements[5]*H*0.5;\r\n    flames.mat.uniforms.uScale.value = s; sparks.mat.uniforms.uScale.value = s; smoke.mat.uniforms.uScale.value = s;\r\n  }\r\n\r\n  return {\r\n    start, update, set_camera, ash, LOOKS, BURN,\r\n    get look() { return look; },\r\n    set look(i) { look = ((i % LOOKS.length) + LOOKS.length) % LOOKS.length; },\r\n    // per ring: how burnt (0..1) and how brightly its cracks glow (0..1)\r\n    char(b, i) { const a = arrive_t(b, i); return smoothstep(a, a + BURN.char, b.t); },\r\n    ember(b, i) {\r\n      const a = arrive_t(b, i);\r\n      const on = smoothstep(a + 0.15, a + 0.7, b.t);\r\n      const off = 1 - smoothstep(BURN.out - 0.2, BURN.out + BURN.cool, b.t);\r\n      return on*off;\r\n    },\r\n    flame_at,\r\n    ember_colour: () => LOOKS[look].ember,\r\n    get burning() { return burns.length; },\r\n  };\r\n}\r\n","game/fx.js":"// fx.js -- the effects the powers share (round 11): point sprites (flames, glowing motes, shards,\r\n// dust and mist), beams drawn as screen-space ribbons (so a beam is never thinner than its\r\n// pixel width, near or far), and chunks of snake that fall, bounce and sink.\r\n//\r\n// Everything is pooled: a pool is allocated once and recycled, so nothing is created while\r\n// playing. Particles are simple: position, velocity, gravity, drag, a colour (HDR for the\r\n// additive ones, which the bloom picks up), a size going s0 -> s1 over the life.\r\nimport * as THREE from 'three';\r\nimport { clamp, smoothstep, lerp } from 'game/util.js';\r\nimport { gi_dynamic } from 'game/gi.js';\r\n\r\nexport const spectrum = (h) => { h = ((h % 1) + 1) % 1; return [0, 2/3, 1/3].map(o => clamp(Math.abs(((h + o) % 1)*6 - 3) - 1, 0, 1)); };\r\n\r\n// a pool of point sprites: `additive` for light (flames, sparks, motes), otherwise\r\n// alpha-blended (smoke, dust, mist). shape: 'flame' (a tongue), 'shard' (a sliver), or a soft dot\r\nexport function sprite_pool(R, N, additive, shape) {\r\n  const pos = new Float32Array(N*3), col = new Float32Array(N*4), size = new Float32Array(N);\r\n  const g = new THREE.BufferGeometry();\r\n  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));\r\n  g.setAttribute('aCol', new THREE.BufferAttribute(col, 4));\r\n  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));\r\n  const body = shape === 'flame'\r\n    // a tongue: round below, narrowing upward\r\n    ? `float w = 1.0 - 0.55*clamp(q.y, 0.0, 1.0); float d = length(vec2(q.x/w, q.y*0.8 + 0.12)); float a = smoothstep(1.0, 0.25, d);`\r\n    : shape === 'shard'\r\n    // a thin diamond sliver\r\n    ? `float d = abs(q.x)*2.6 + abs(q.y); float a = smoothstep(1.0, 0.55, d);`\r\n    : `float d = length(q); float a = smoothstep(1.0, 0.1, d);`;\r\n  const mat = new THREE.ShaderMaterial({\r\n    uniforms: { uScale: { value: 1 } },\r\n    vertexShader: `attribute vec4 aCol; attribute float aSize; uniform float uScale; varying vec4 vCol;\r\n      void main(){ vec4 mv = modelViewMatrix*vec4(position, 1.0); gl_Position = projectionMatrix*mv;\r\n        gl_PointSize = aSize > 0.0 ? max(1.0, aSize*uScale/max(-mv.z, 0.05)) : 0.0; vCol = aCol; }`,\r\n    fragmentShader: `varying vec4 vCol;\r\n      void main(){ vec2 q = gl_PointCoord*2.0 - 1.0; q.y = -q.y;\r\n        ${body}\r\n        ${additive ? `gl_FragColor = vec4(vCol.rgb*vCol.a*a, 1.0);` : `gl_FragColor = vec4(vCol.rgb, vCol.a*a);`} }`,\r\n    transparent: true, depthWrite: false, depthTest: true,\r\n    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,\r\n  });\r\n  const pts = new THREE.Points(g, mat);\r\n  pts.frustumCulled = false;\r\n  pts.renderOrder = additive ? 11 : 10;\r\n  R.world_scene.add(pts);\r\n  const P = [];\r\n  for (let i = 0; i \u003c N; i++) P.push({ life: 0, max: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s0: 0, s1: 0, h: 0, kind: 0, burn: null });\r\n  let next = 0;\r\n  return {\r\n    mat, P,\r\n    spawn() { const p = P[next]; next = (next + 1) % N; return p; },\r\n    write(fn) {\r\n      for (let i = 0; i \u003c N; i++) {\r\n        const p = P[i];\r\n        if (p.life \u003c= 0) { size[i] = 0; col[i*4 + 3] = 0; continue; }\r\n        fn(p, i, pos, col, size);\r\n      }\r\n      g.attributes.position.needsUpdate = true; g.attributes.aCol.needsUpdate = true; g.attributes.aSize.needsUpdate = true;\r\n    },\r\n  };\r\n}\r\n\r\n// beams: segments drawn as camera-facing ribbons. Round 12 (owner's references: Diablo 3's\r\n// Disintegrate, real light through a prism, Risk of Rain 2's Stone Titan, Returnal's Phrike):\r\n// a ribbon has a width in metres at each end (w0 at p0, w1 at p1; never thinner than `w` px)\r\n// and a style for its cross-section:\r\n//   0 plain: the colour c, brightest along the middle (a pixel width, as before)\r\n//   1 PRISM: white light leaving p0 and dispersing along the way into an ordered band, red on\r\n//     one edge to violet on the other, soft-edged, a thin white core fading out as it spreads\r\n//   2 FIRE LASER: a white-hot core in an orange sheath and a red glow, noise streaming along it\r\n//     toward p1 and a constant flicker\r\n//   3 PRISM IN FIRE: style 1's build in fire colours (white core, yellow, orange, red edges)\r\n//   4 PRISM LASER (round 18, owner: the prismatic beam \"just like the lens beam, except\r\n//     prismatic instead of red\", its colour \"more like a rainbow sort of thing, inspired by\r\n//     the skeleton himself\", thinner, leaving his finger exactly): style 2's build (white core,\r\n//     sheath, noise eating the edges, flicker) with the sheath in the colours of his bones (the\r\n//     gem's SOFT field: broad zones of lime, pink, lilac, peach, pale cyan; gem.js), the edge a\r\n//     little further round the hue wheel. The width is w1 all along except the first ~28 cm,\r\n//     which grows from w0 (the fingertip's thickness) so it leaves the bone rather than a ball.\r\n//     Its colour stays under the level where bright channels roll off to white on screen, and\r\n//     the white core only shows where the beam is wide enough on screen to have a middle. It can\r\n//     be drawn in pieces along a curve (x0: metres along the beam where a piece starts, ph0: the\r\n//     hue phase where the beam starts, pv/nx: the neighbouring pieces' far ends, so the pieces\r\n//     share their joins).\r\n//     `hue` picks the colour: 0 HIS COLOURS, STREAMING (the zones flow out from his finger) /\r\n//     1 HIS COLOURS, HELD (the same field his bones\r\n//     show, fixed in the room: the beam is a window onto it) / 2 FULL RAINBOW, STREAMING\r\n// Energy streams along styles 1-4 from p0 to p1. `held` ribbons are kept alive and faded by\r\n// their owner (set `a` each tick); others live `life` seconds.\r\nfunction ribbon_pool(R, N) {\r\n  const V = N*4;\r\n  const a0 = new Float32Array(V*3), a1 = new Float32Array(V*3), end = new Float32Array(V), side = new Float32Array(V);\r\n  const apv = new Float32Array(V*3), anx = new Float32Array(V*3);\r\n  const col = new Float32Array(V*4), wo = new Float32Array(V*3), bb = new Float32Array(V*4), ax = new Float32Array(V*2);\r\n  for (let i = 0; i \u003c N; i++) for (let k = 0; k \u003c 4; k++) { end[i*4 + k] = k >> 1; side[i*4 + k] = (k & 1) ? 1 : -1; }\r\n  const idx = [];\r\n  for (let i = 0; i \u003c N; i++) { const b = i*4; idx.push(b, b + 1, b + 3, b, b + 3, b + 2); }\r\n  const g = new THREE.BufferGeometry();\r\n  g.setAttribute('position', new THREE.BufferAttr
