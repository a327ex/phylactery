rry a face (the shader tests fewer)\n  const used = planes.filter(pl => V.filter(v => Math.abs(pl.n.dot(v) - pl.w) \u003c 1e-4).length >= 3);\n  return { geo, planes: used };\n}\n\n// ---------------------------------------------------------------- the trace\nconst VS = /* glsl */`\nvarying vec3 vPosO; varying vec3 vNorO;\nvoid main(){ vPosO = position; vNorO = normal; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`;\nconst FS = /* glsl */`\nprecision highp float;\n#define MAXP ${MAXP}\n#define BOUNCES 6\nuniform vec4 uPlanes[MAXP];\nuniform int uNP;\nuniform vec3 uCamO;\nuniform mat3 uToWorld;\nuniform samplerCube uEnv;\nuniform float uEnvK, uGlintPow, uLit, uFlip;\nuniform vec3 uIor, uSunDir, uSunCol, uAbsorb, uTint;\nvarying vec3 vPosO; varying vec3 vNorO;\nvec3 env_w(vec3 dO){\n  vec3 d = normalize(uToWorld*dO);\n  vec3 c = textureCube(uEnv, vec3(uFlip*d.x, d.y, d.z)).rgb*uEnvK;\n  // the light itself (the sun down the shaft, or the inspect view's key): a hard glint\n  float s = max(dot(d, uSunDir), 0.0);\n  return c + uSunCol*(pow(s, uGlintPow) + 0.04*pow(s, uGlintPow*0.05))*uLit;\n}\nfloat schlick(float c, float n){ float f0 = (n - 1.0)/(n + 1.0); f0 *= f0; return f0 + (1.0 - f0)*pow(1.0 - clamp(c, 0.0, 1.0), 5.0); }\n// follow one colour's ray inside the stone; returns what leaves, in that colour\nfloat trace(vec3 p, vec3 d, float n, int ch){\n  float acc = 0.0, thr = 1.0;\n  for (int b = 0; b \u003c BOUNCES; b++) {\n    float tm = 1e9; vec3 nh = vec3(0.0, 1.0, 0.0);\n    for (int i = 0; i \u003c MAXP; i++) {\n      if (i >= uNP) break;\n      vec4 pl = uPlanes[i];\n      float dn = dot(pl.xyz, d);\n      if (dn > 1e-5) { float t = (pl.w - dot(pl.xyz, p))/dn; if (t \u003c tm) { tm = t; nh = pl.xyz; } }\n    }\n    p += d*tm;\n    thr *= exp(-uAbsorb[ch]*tm);\n    vec3 o = refract(d, -nh, n);\n    float ci = dot(d, nh);\n    if (dot(o, o) \u003c 1e-6) { d = reflect(d, -nh); continue; }       // total internal reflection\n    float F = schlick(dot(o, nh), n);\n    acc += thr*(1.0 - F)*env_w(o)[ch];\n    thr *= F;\n    d = reflect(d, -nh);\n  }\n  return acc + thr*env_w(d)[ch]*0.6;\n}\nvoid main(){\n  vec3 N = normalize(vNorO);\n  vec3 V = normalize(vPosO - uCamO);\n  float c = max(-dot(V, N), 0.0);\n  float F = schlick(c, uIor.g);\n  vec3 col = env_w(reflect(V, N))*F;\n  vec3 inside;\n  for (int ch = 0; ch \u003c 3; ch++) {\n    float n = uIor[ch];\n    vec3 d = refract(V, N, 1.0/n);\n    inside[ch] = trace(vPosO + d*1e-4, d, n, ch);\n  }\n  col += (1.0 - F)*inside*uTint;\n  gl_FragColor = vec4(min(col, vec3(5.0)), 1.0);      // a glint's bloom stays a sparkle, not a halo\n}`;\n\n// env: a cube texture; opts: cut index, size (girdle radius, m), ior, spread\nexport function gem_material(env, planes, opts = {}) {\n  const U = {\n    uPlanes: { value: Array.from({ length: MAXP }, (_, i) => planes[i] ? new THREE.Vector4(planes[i].n.x, planes[i].n.y, planes[i].n.z, planes[i].w) : new THREE.Vector4(0, 1, 0, 1e3)) },\n    uNP: { value: Math.min(planes.length, MAXP) },\n    uCamO: { value: new THREE.Vector3() }, uToWorld: { value: new THREE.Matrix3() },\n    uEnv: { value: env }, uEnvK: { value: opts.env_k ?? 1 }, uFlip: { value: opts.flip ?? 1 },\n    uGlintPow: { value: opts.glint_pow ?? 1400 }, uLit: { value: 1 },\n    uIor: { value: new THREE.Vector3(...(opts.ior ?? [2.30, 2.43, 2.62])) },\n    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Vector3(30, 27, 22) },\n    uAbsorb: { value: new THREE.Vector3(...(opts.absorb ?? [0.02, 0.02, 0.03])) },\n    uTint: { value: new THREE.Vector3(...(opts.tint ?? [1, 1, 1])) },\n  };\n  const m = new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS, fragmentShader: FS });\n  m.userData.U = U;\n  return m;\n}\n\n// builds the gem (one mesh). ctx.env = the cube to see; ctx.sun = { dir, col } in world.\nexport function build_gem(ctx, cut = 0) {\n  const { geo, planes } = solid(CUTS[cut]());\n  const size = 0.065;                        // girdle radius, m\n  const mat = gem_material(ctx.env, planes, { env_k: ctx.env_k ?? 1, flip: ctx.flip ?? 1, glint_pow: ctx.glint_pow ?? 1400 });\n  const mesh = new THREE.Mesh(geo, mat);\n  mesh.scale.setScalar(size);\n  const inv = new THREE.Matrix4(), cam = new THREE.Vector3();\n  mesh.onBeforeRender = (r, s, camera) => {\n    inv.copy(mesh.matrixWorld).invert();\n    mat.userData.U.uCamO.value.copy(cam.setFromMatrixPosition(camera.matrixWorld).applyMatrix4(inv));\n    const tw = mat.userData.U.uToWorld.value.setFromMatrix4(mesh.matrixWorld);\n    // strip the scale (uniform)\n    const sc = new THREE.Vector3().setFromMatrixScale(mesh.matrixWorld).x;\n    tw.multiplyScalar(1/sc);\n    if (ctx.sun) { mat.userData.U.uSunDir.value.copy(ctx.sun.dir); mat.userData.U.uSunCol.value.copy(ctx.sun.col); }\n  };\n  mesh.castShadow = true;\n  const g = new THREE.Group();\n  g.add(mesh);\n  g.userData.mat = mat;\n  g.userData.mats = [mat];\n  g.userData.geo = geo;\n  g.userData.scale = size;\n  return g;\n}\n","game/item_hand.js":"// item_hand.js -- the LIFT AND BURST power's object (owner, round 28: the Hand of Sabazios \"looks\n// cool\", but \"the model doesn't need to be that hand specifically though, just pinky + the other\n// finger curled, index and the other pointing forward, thumb outwards\"). A votive hand: a right\n// hand raised palm out in that gesture, on the cuff it stands on, cast in bronze gone green (the\n// patina, the bronze worn through at a few high points), without the Sabazios hand's symbols.\n// M: BRONZE (default) / BONE.\n//\n// Round 30 (owner: \"more realistic and aesthetic, the current one is too square on the upper\n// side (inverse of the palm) and the fingers have an unnatural thickness to them\"): built from\n// the bones out. The back of the hand is the four metacarpals blended under one skin (an arch\n// across, the knuckles a ridge at the top, narrowing to the wrist), not a box; the palm is its\n// pads (the ball of the thumb, the heel, the pads under the fingers) with its creases; fingers\n// are flatter than deep, a real finger's width (~1.8 cm at the base), fuller at the joints and a\n// little narrower between them, with pads and nails at their tips; the cast surface finer.\nimport * as THREE from 'three';\nimport { mesh_sdf, smin, cone, ellipsoid } from 'game/sdf.js';\nimport { fbm3, cells3, sstep, vertex_mr } from 'game/shape_noise.js';\n\nexport const HAND_MATS = ['BRONZE', 'BONE'];\n\n// ---------------------------------------------------------------- the pose (m; palm faces +z,\n// fingers +y, the thumb toward -x: a right hand seen from its palm)\nconst V = (x, y, z) => new THREE.Vector3(x, y, z);\n\n// a finger: joints along it, each segment turned by its flex toward the palm (+z); per joint a\n// half-width (across) and half-depth (palm to back); each segment knows its own frame\nfunction finger(base, lens, W, D, spread, flex) {\n  const pts = [base.clone()], seg = [];\n  let th = 0;\n  for (let i = 0; i \u003c lens.length; i++) {\n    th += flex[i];\n    const d = V(Math.sin(spread)*Math.cos(th), Math.cos(spread)*Math.cos(th), Math.sin(th)).normalize();\n    const n = V(-Math.sin(spread)*Math.sin(th), -Math.cos(spread)*Math.sin(th), Math.cos(th)).normalize();   // toward the palm side\n    const s = new THREE.Vector3().crossVectors(d, n).normalize();\n    pts.push(pts[i].clone().addScaledVector(d, lens[i]));\n    seg.push({ d, n, s });\n  }\n  return { pts, W, D, seg };\n}\nconst FINGERS = [\n  // index, middle: raised (a little natural curve); ring, pinky: curled into the palm\n  finger(V(-0.029, 0.093, -0.002), [0.04, 0.024, 0.019], [0.0092, 0.0085, 0.0077, 0.0064], [0.0079, 0.0071, 0.0063, 0.0052], -0.07, [0.05, 0.08, 0.06]),\n  finger(V(-0.008, 0.098, -0.002), [0.045, 0.028, 0.02], [0.0095, 0.0088, 0.0079, 0.0066], [0.0082, 0.0074, 0.0065, 0.0054], 0.02, [0.04, 0.07, 0.06]),\n  finger(V(0.013, 0.094, -0.002), [0.042, 0.026, 0.019], [0.009, 0.0083, 0.0075, 0.0063], [0.0077, 0.007, 0.0062, 0.0051], 0.09, [1.3, 1.62, 1.12]),\n  finger(V(0.032, 0.085, -0.003), [0.033, 0.019, 0.018], [0.0079, 0.0073, 0.0066, 0.0056], [0.0068, 0.0062, 0.0056, 0.0046], 0.17, [1.22, 1.66, 1.08]),\n];\n// the thumb: from the wrist's side out and up; its metacarpal is part of it\nconst THUMB = (() => {\n  const p0 = V(-0.017, 0.012, 0.003);\n  const dirs = [V(-0.75, 0.55, 0.36), V(-0.5, 0.82, 0.25), V(-0.3, 0.94, 0.15)].map(v => v.normalize());\n  const L = [0.042, 0.03, 0.026];\n  const pts = [p0], seg = [];\n  for (let i = 0; i \u003c 3; i++) {\n    pts.push(pts[i].clone().addScaledVector(dirs[i], L[i]));\n    // the thumb's pad faces across the palm (+x, +z)\n    const n = V(0.55, 0.0, 0.85).addScaledVector(dirs[i], -V(0.55, 0, 0.85).dot(dirs[i])).normalize();\n    seg.push({ d: dirs[i], n, s: new THREE.Vector3().crossVectors(dirs[i], n).normalize() });\n  }\n  return { pts, W: [0.0128, 0.0109, 0.0099, 0.0083], D: [0.0115, 0.0096, 0.0086, 0.0071], seg };\n})();\n// the metacarpals: from the wrist to each knuckle; the middle two sit further back, so the back\n// of the hand arches across\nconst META = [\n  [V(-0.011, 0.012, -0.005), V(-0.029, 0.092, -0.004)],\n  [V(-0.002, 0.014, -0.008), V(-0.008, 0.097, -0.007)],\n  [V(0.008, 0.013, -0.0075), V(0.013, 0.093, -0.0065)],\n  [V(0.017, 0.011, -0.005), V(0.032, 0.084, -0.004)],\n];\n\n// distance to an elliptical capsule segment (half-widths across / deep, blended along it)\nfunction oval_seg(x, y, z, a, b, sg, w0, w1, d0, d1) {\n  const px = x - a.x, py = y - a.y, pz = z - a.z;\n  const L = a.distanceTo(b);\n  const t = (px*sg.d.x + py*sg.d.y + pz*sg.d.z)/L;\n  const tc = t \u003c 0 ? 0 : t > 1 ? 1 : t;\n  const ax = px - sg.d.x*tc*L, ay = py - sg.d.y*tc*L, az = pz - sg.d.z*tc*L;\n  const u = ax*sg.s.x + ay*sg.s.y + az*sg.s.z, v = ax*sg.n.x + ay*sg.n.y + az*sg.n.z;\n  const w = w0 + (w1 - w0)*tc, d = d0 + (d1 - d0)*tc, mr = Math.min(w, d);\n  // rounded (ellipsoidal) ends, so segments meeting at a joint join smoothly without a blend\n  const along = t \u003c 0 ? -t*L : t > 1 ? (t - 1)*L : 0;\n  return (Math.hypot(u/w, v/d, along/mr) - 1)*mr;\n}\nfunction digit(x, y, z, f) {\n  let dd = Infinity;\n  // one smooth tapering finger through its joints (round 30's first pass, knuckle knobs and a\n  // waist in each bone, read as a jointed stick)\n  // (a blend between segments swells a ring at every joint: they are simply joined)\n  for (let i = 0; i \u003c f.seg.length; i++) dd = Math.min(dd, oval_seg(x, y, z, f.pts[i], f.pts[i + 1], f.seg[i], f.W[i], f.W[i + 1], f.D[i], f.D[i + 1]));\n  // the fingertip's pad (fuller on the palm side) and a nail on the back\n  const tip = f.pts[f.pts.length - 1], sg = f.seg[f.seg.length - 1], w = f.W[f.W.length - 1];\n  const pad = tip.clone().addScaledVector(sg.d, -w*0.9).addScaledVector(sg.n, w*0.28);\n  dd = smin(dd, Math.hypot(x - pad.x, y - pad.y, z - pad.z) - w*0.84, 0.004);\n  const nc = tip.clone().addScaledVector(sg.d, -w*1.25).addScaledVector(sg.n, -f.D[f.D.length - 1]*0.72);\n  const nx = x - nc.x, ny = y - nc.y, nz = z - nc.z;\n  const nu = nx*sg.s.x + ny*sg.s.y + nz*sg.s.z, nv = nx*sg.n.x + ny*sg.n.y + nz*sg.n.z, nw = nx*sg.d.x + ny*sg.d.y + nz*sg.d.z;\n  const nail = Math.hypot(nu/(w*0.7), (nv + 0.0004)/(w*0.22), nw/(w*1.05)) - 1;\n  dd = smin(dd, nail*w*0.22, 0.0008);\n  return dd;\n}\n\nfunction body(x, y, z) {\n  // the back: the metacarpals under one skin\n  let d = Infinity;\n  for (const [a, b] of META) d = smin(d, cone(x, y, z, a.x, a.y, a.z, b.x, b.y, b.z, 0.0078, 0.0088), 0.016);\n  // the knuckles' ridge: the metacarpals' heads\n  for (const [, b] of META) d = smin(d, Math.hypot(x - b.x, y - b.y + 0.002, z - b.z + 0.0015) - 0.0098, 0.006);\n  // the palm's pads: the ball of the thumb, the heel of the hand, the pad under the fingers\n  d = smin(d, ellipsoid(x, y, z, 0.003, 0.052, 0.003, 0.036, 0.043, 0.0115), 0.012);\n  d = smin(d, ellipsoid(x, y, z, -0.021, 0.028, 0.008, 0.017, 0.026, 0.0135), 0.012);\n  d = smin(d, ellipsoid(x, y, z, 0.026, 0.034, 0.005, 0.013, 0.03, 0.0105), 0.012);\n  d = smin(d, ellipsoid(x, y, z, 0.002, 0.087, 0.006, 0.036, 0.009, 0.008), 0.008);\n  // fingers, thumb\n  for (const f of FINGERS) d = smin(d, digit(x, y, z, f), 0.0075);\n  d = smin(d, digit(x, y, z, THUMB), 0.011);\n  // the palm's creases (shallow grooves on its face)\n  if (z > 0 && y > 0.02 && y \u003c 0.1) {\n    const crease = (px, py, qx, qy, depth) => {\n      const dx = qx - px, dy = qy - py, L2 = dx*dx + dy*dy;\n      const t = Math.max(0, Math.min(1, ((x - px)*dx + (y - py)*dy)/L2));\n      return depth*sstep(0.0016, 0.0, Math.hypot(x - px - dx*t, y - py - dy*t))*Math.sin(Math.PI*t);\n    };\n    d += crease(-0.03, 0.066, 0.035, 0.078, 0.0009) + crease(-0.033, 0.058, 0.02, 0.05, 0.0008) + crease(-0.012, 0.018, -0.028, 0.07, 0.0007);\n  }\n  // the wrist (wider than deep), rounding down into the cuff\n  const wx = Math.hypot((x - 0.001)/1.42, (z + 0.001)) - 0.0195, wy = Math.max(y - 0.018, -0.03 - y);\n  d = smin(d, Math.min(Math.max(wx, wy), 0) + Math.hypot(Math.max(wx, 0), Math.max(wy, 0)), 0.014);\n  // the cuff it stands on: a smooth sleeve flaring to a rounded foot, grown out of the wrist\n  const cr = Math.hypot((x - 0.001)/1.12, z + 0.001);\n  const t = Math.min(1, Math.max(0, (-0.024 - y)/0.05));\n  const R = 0.026 + 0.01*t*t;\n  let cuff = Math.max(cr - R, y + 0.024, -0.075 - y);\n  cuff = smin(cuff, Math.hypot(cr - 0.035, y + 0.072) - 0.0042, 0.004);    // the foot's rim\n  d = smin(d, cuff, 0.012);\n  return d;\n}\n// cast, and worn by time: a fine pitting and a faint unevenness (finer than round 29's lumps)\nfunction field(x, y, z) {\n  const d = body(x, y, z);\n  if (d > 0.01) return d;\n  const pit = cells3(x*300, y*300, z*300, 61);\n  return d + (fbm3(x*140, y*140, z*140, 63, 3) - 0.5)*0.0005 + sstep(0.2, 0.04, pit.d1)*0.00028;\n}\n\nlet CACHE = null;\nfunction geometry() {\n  if (CACHE) return CACHE;\n  const g = mesh_sdf(field, [-0.09, -0.085, -0.04, 0.065, 0.2, 0.065], 0.001);\n  const P = g.attributes.position, N = g.attributes.normal, n = P.count;\n  const cols = [new Float32Array(n*3), new Float32Array(n*3)], mrs = [new Float32Array(n*2), new Float32Array(n*2)];\n  for (let i = 0; i \u003c n; i++) {\n    const x = P.getX(i), y = P.getY(i), z = P.getZ(i), nx = N.getX(i), ny = N.getY(i), nz = N.getZ(i);\n    // how open this point is: a crevice has the hand close by in front of it\n    const o1 = Math.min(1, Math.max(0, body(x + nx*0.003, y + ny*0.003, z + nz*0.003)/0.003));\n    const o2 = Math.min(1, Math.max(0, body(x + nx*0.01, y + ny*0.01, z + nz*0.01)/0.01));\n    const open = o1*0.5 + o2*0.5;\n    const nz_ = fbm3(x*90, y*90, z*90, 67, 3);\n    // BRONZE: patina over nearly everything, bronze where it is rubbed, dark in the deepest\n    const worn = sstep(0.95, 1.0, open)*sstep(0.62, 0.74, nz_)*(y > 0.165 ? 1.0 : 0.45);\n    const tone = fbm3(x*40, y*40, z*40, 69, 3);\n    let r = 0.11 + 0.09*tone, gg = 0.17 + 0.08*tone, b = 0.14 + 0.05*(1 - tone);\n    if (nz_ > 0.64) { r += 0.07; gg += 0.08; b += 0.05; }           // paler powdery crust\n    const dark = sstep(0.6, 0.15, open);\n    r *= 1 - 0.75*dark; gg *= 1 - 0.7*dark; b *= 1 - 0.72*dark;\n    const w = Math.min(1, worn);\n    cols[0][i*3] = r + (0.36 - r)*w; cols[0][i*3 + 1] = gg + (0.25 - gg)*w; cols[0][i*3 + 2] = b + (0.13 - b)*w;\n    mrs[0][i*2] = 0.9*w; mrs[0][i*2 + 1] = 0.8 - 0.45*w;\n    // BONE: pale, yellowed in the hollows\n    const bv = 0.62 + 0.14*tone;\n    cols[1][i*3] = bv*(1 - 0.55*dark); cols[1][i*3 + 1] = bv*0.93*(1 - 0.6*dark); cols[1][i*3 + 2] = bv*0.8*(1 - 0.65*dark);\n    mrs[1][i*2] = 0; mrs[1][i*2 + 1] = 0.55;\n  }\n  g.userData.cols = cols.map(a => new THREE.BufferAttribute(a, 3));\n  g.userData.mrs = mrs.map(a => new THREE.BufferAttribute(a, 2));\n  g.setAttribute('color', g.userData.cols[0]);\n  g.setAttribute('aMR', g.userData.mrs[0]);\n  CACHE = g;\n  return g;\n}\n\nexport function set_hand_material(i) {\n  const g = geometry();\n  g.setAttribute('color', g.userData.cols[i]);\n  g.setAttribute('aMR', g.userData.mrs[i]);\n}\n\nexport function build_hand(ctx = {}, opts = {}) {\n  const lit = ctx.lit || (m => m);\n  set_hand_material(opts.hand_mat ?? 0);\n  const mat = lit(vertex_mr(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, metalness: 0, envMapIntensity: ctx.env_i ?? 1, side: THREE.DoubleSide })));\n  const m = new THREE.Mesh(geometry(), mat);\n  m.castShadow = true;\n  const g = new THREE.Group();\n  g.add(m);\n  return g;\n}\n","game/item_lens.js":"// item_lens.js -- round 28: the LENS power's object (owner: \"a lens, as it appears when\n// attacking but more detailed\"). The attack's lens is a bare biconvex disc of clear glass\n// (lens.js); this is the same glass as a thing you could hold: two ground spherical faces, a\n// narrow edge ground flat and left frosted, the sharp corners eased by a bevel, a slight green\n// in its thickness (old glass), polishing marks in the faces, and two conchoidal chips knocked\n// out of the rim.\nimport * as THREE from 'three';\n\nconst R = 0.22;               // radius, m (44 cm across; the attack's is 76)\n// round 29 (owner: \"shouldn't a lens that does that kind of attack be convex?\"): it was, 14% as\n// thick as wide, but the bulge didn't read; a burning glass gathers the sun to a point by being\n// thicker in the middle, so it bulges plainly now (about a quarter as thick as it is wide)\nconst TC = 0.105, TE = 0.012; // centre and edge thickness\nconst BEV = 0.0025;           // the bevel at each corner of the edge\nconst SEG = 288;\n\n// polishing marks: fine arcs and a few longer scratches, as a roughness map (0 = polished)\nfunction scratch_texture(seed = 3) {\n  const S = 512, c = document.createElement('canvas');\n  c.width = c.height = S;\n  const g = c.getContext('2d');\n  g.fillStyle = 'rgb(6,6,6)'; g.fillRect(0, 0, S, S);\n  let s = seed;\n  const rnd = () => ((s = Math.imul(s ^ (s >>> 15), 2246822519) + 0x9e3779b9 >>> 0)/4294967296);\n  g.lineCap = 'round';\n  for (let i = 0; i \u003c 260; i++) {\n    const cx = rnd()*S, cy = rnd()*S, r = 20 + rnd()*220, a0 = rnd()*6.283, da = (0.05 + rnd()*0.4)*(rnd() \u003c 0.5 ? -1 : 1);\n    g.strokeStyle = `rgba(255,255,255,${0.08 + rnd()*0.22})`;\n    g.lineWidth = 0.5 + rnd()*0.8;\n    g.beginPath(); g.arc(cx, cy, r, a0, a0 + da, da \u003c 0); g.stroke();\n  }\n  for (let i = 0; i \u003c 14; i++) {\n    const x = rnd()*S, y = rnd()*S, a = rnd()*6.283, l = 30 + rnd()*160;\n    g.strokeStyle = `rgba(255,255,255,${0.25 + rnd()*0.3})`; g.lineWidth = 0.6 + rnd()*0.7;\n    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.3)*l*0.5, y + Math.sin(a + 0.3)*l*0.5, x + Math.cos(a)*l, y + Math.sin(a)*l); g.stroke();\n  }\n  const t = new THREE.CanvasTexture(c);\n  t.wrapS = t.wrapT = THREE.RepeatWrapping;\n  t.anisotropy = 4;\n  return t;\n}\n\n// the profile, r outward, y up: top face, bevel, edge band, bevel, bottom face\nfunction profile() {\n  const s = (TC - TE)/2;                         // sagitta\n  const Rc = (R*R + s*s)/(2*s);                  // the faces' sphere radius\n  const face = [], band = [];\n  const top = r => TE/2 + Math.sqrt(Rc*Rc - r*r) - (Rc - s);\n  const n = 40;\n  for (let i = 0; i \u003c= n; i++) {\n    const r = (R - BEV)*Math.sin(i/n*Math.PI/2);   // dense toward the rim\n    face.push([r, top(r)]);\n  }\n  band.push([R - BEV, TE/2 - 0.0002], [R, TE/2 - BEV], [R, TE/4], [R, 0], [R, -TE/4], [R, -(TE/2 - BEV)], [R - BEV, -(TE/2 - 0.0002)]);\n  return { face, band, top };\n}\n\n// a lathe from [r, y] points; a flag per point for which faces get planar uvs\nfunction lathe(pts, uv_planar) {\n  const pos = [], uv = [], idx = [];\n  const n = pts.length;\n  for (let j = 0; j \u003c= SEG; j++) {\n    const a = j/SEG*Math.PI*2, ca = Math.cos(a), sa = Math.sin(a);\n    for (let i = 0; i \u003c n; i++) {\n      const [r, y] = pts[i];\n      pos.push(r*ca, y, r*sa);\n      if (uv_planar) uv.push(0.5 + r*ca/(2*R), 0.5 + r*sa/(2*R) + (y \u003c 0 ? 0.37 : 0));\n      else uv.push(j/SEG*6, i/(n - 1));\n    }\n  }\n  for (let j = 0; j \u003c SEG; j++) for (let i = 0; i \u003c n - 1; i++) {\n    const a = j*n + i, b = (j + 1)*n + i, c = (j + 1)*n + i + 1, d = j*n + i + 1;\n    idx.push(a, b, d, b, c, d);\n  }\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));\n  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));\n  g.setIndex(idx);\n  return g;\n}\n\n// knock a chip out: vertices inside a sphere at the rim are pushed onto its surface (a\n// conchoidal scoop), which only ever removes glass\nfunction chip(g, cx, cy, cz, rad) {\n  const p = g.attributes.position, v = new THREE.Vector3(), c = new THREE.Vector3(cx, cy, cz);\n  for (let i = 0; i \u003c p.count; i++) {\n    v.fromBufferAttribute(p, i);\n    const d = v.distanceTo(c);\n    if (d \u003c rad && d > 1e-6) { v.sub(c).multiplyScalar(rad/d).add(c); p.setXYZ(i, v.x, v.y, v.z); }\n  }\n}\n\n// a faint rim where the glass turns away from the eye, so its edge still reads against dark\n// rock (the attack's lens has the same)\nfunction rim(m, k) {\n  const prev = m.onBeforeCompile;\n  m.onBeforeCompile = (sh, r) => {\n    if (prev) prev(sh, r);\n    sh.fragmentShader = sh.fragmentShader.replace('#include \u003clights_fragment_end>', `#include \u003clights_fragment_end>\n  { float nv = abs(dot(normalize(normal), normalize(vViewPosition))); totalEmissiveRadiance += vec3(0.85, 0.92, 0.86)*pow(1.0 - nv, 3.0)*${k.toFixed(3)}; }`);\n  };\n  const key = m.customProgramCacheKey ? m.customProgramCacheKey.bind(m) : () => '';\n  m.customProgramCacheKey = () => key() + '|rim' + k;\n  return m;\n}\n\nexport function build_lens(ctx = {}) {\n  const { face, band } = profile();\n  const bottom = face.map(([r, y]) => [r, -y]).reverse();\n  const top_g = lathe(face, true), bot_g = lathe(bottom, true), band_g = lathe(band, false);\n  // two chips on the rim: one from the top corner, a smaller one from the bottom\n  const CH = [[0.9, 1, 0.017, 0.006], [3.7, -1, 0.012, 0.004]];\n  for (const [a, side, rad, inward] of CH) {\n    const cx = Math.cos(a)*(R + rad - inward - 0.0045), cz = Math.sin(a)*(R + rad - inward - 0.0045), cy = side*(TE/2 + rad*0.45);\n    for (const g of [top_g, bot_g, band_g]) chip(g, cx, cy, cz, rad);\n  }\n  for (const g of [top_g, bot_g, band_g]) g.computeVertexNormals();\n  const rough = scratch_texture(7);\n  const lit = ctx.lit || (m => m);\n  const glass = rim(lit(new THREE.MeshPhysicalMaterial({\n    color: 0xffffff, metalness: 0, roughness: 0.035, roughnessMap: rough, transmission: 1, thickness: 0.075, ior: 1.52,\n    dispersion: 0.9, attenuationColor: new THREE.Color(0.8, 0.93, 0.84), attenuationDistance: 0.22,\n    specularIntensity: 0.7, envMapIntensity: (ctx.env_i ?? 1)*1.1, side: THREE.FrontSide,\n  })), ctx.rim ?? 0);\n  const frost = lit(new THREE.MeshPhysicalMaterial({\n    color: 0xc9d2c8, metalness: 0, roughness: 0.5, transmission: 0.7, thickness: 0.02, ior: 1.52,\n    attenuationColor: new THREE.Color(0.8, 0.92, 0.84), attenuationDistance: 0.12, envMapIntensity: ctx.env_i ?? 1,\n  }));\n  const g = new THREE.Group();\n  for (const [geo, mat] of [[top_g, glass], [bot_g, glass], [band_g, frost]]) {\n    const m = new THREE.Mesh(geo, mat);\n    // clear glass casts no dark shadow (the frosted edge does: a thin ring)\n    m.castShadow = mat === frost; m.userData.no_shadow = mat !== frost; m.receiveShadow = false;\n    g.add(m);\n  }\n  g.userData.radius = R;\n  return g;\n}\n","game/item_lodestone.js":"// item_lodestone.js -- the ROCK power's object (owner, round 28's board: \"raw lodestone is fine\").\n//\n// Round 30 (owner: \"remove the iron filings, they make me feel weird, and make the rock a bit more\n// jagged instead of curved all around\"): a broken lump of magnetite, all fracture: flat and\n// stepped faces meeting at sharp edges, a few chunks knocked out of it (notches with their own\n// faces); iron-black with a dull grey lustre and a few bright flakes, rust in its hollows. No\n// filings.\n//\n// Round 31 (owner: \"a more destroyed look, it looks a bit too plastic right now\"): weathered and\n// broken all over: the faces pocked with cavities and pits, cracks running across them, the edges\n// crumbled, a granular, lumpy surface at three scales; matte, speckled grain to grain, a brown\n// weathering crust in patches, grey dust in the pits; the metal only in small bright flakes.\nimport * as THREE from 'three';\nimport { mesh_sdf, smax } from 'game/sdf.js';\nimport { fbm3, cells3, sstep, rand, vertex_mr } from 'game/shape_noise.js';\n\n// a convex chunk: planes n.p \u003c= w (random normals, uneven offsets, squashed to the stone's shape)\nfunction chunk(R, count, s, jit) {\n  const out = [];\n  for (let i = 0; i \u003c count; i++) {\n    const y = 1 - 2*(i + 0.5)/count, r = Math.sqrt(1 - y*y), a = i*2.39996 + R.s(0.5);\n    const n = new THREE.Vector3(Math.cos(a)*r + R.s(0.3), y + R.s(0.3), Math.sin(a)*r + R.s(0.3)).normalize();\n    const w = 1 - R.f(0, jit);\n    const m = new THREE.Vector3(n.x/s[0], n.y/s[1], n.z/s[2]);\n    out.push({ n: m.clone().normalize(), w: w/m.length() });\n  }\n  return out;\n}\nconst R = rand(733);\nconst MAIN = chunk(R, 26, [0.078, 0.05, 0.058], 0.22);\n// knocked out: smaller chunks centred on the surface\nconst NOTCH = [0, 1, 2].map(() => {\n  const a = R.f(0, 6.28), b = R.f(-0.8, 0.8);\n  const c = new THREE.Vector3(Math.cos(a)*Math.cos(b)*0.07, Math.sin(b)*0.045, Math.sin(a)*Math.cos(b)*0.055);\n  return { c, planes: chunk(R, 12, [0.022, 0.018, 0.02].map(v => v*R.f(0.8, 1.3)), 0.3) };\n});\nconst convex = (planes, x, y, z) => { let d = -Infinity; for (const p of planes) d = Math.max(d, p.n.x*x + p.n.y*y + p.n.z*z - p.w); return d; };\n\nfunction body(x, y, z) {\n  let d = convex(MAIN, x, y, z);\n  if (d > 0.02) return d;\n  for (const nt of NOTCH) d = smax(d, -convex(nt.planes, x - nt.c.x, y - nt.c.y, z - nt.c.z), 0.0015);\n  return d;\n}\n// what weathering did to its surface: lumps at three scales, pits and cavities, cracks, crumbled\n// edges (where the surface is sharpest the noise bites deepest)\nfunction wear(x, y, z) {\n  const lump = (fbm3(x*45, y*45, z*45, 73, 3) - 0.5)*0.004 + (fbm3(x*140, y*140, z*140, 74, 2) - 0.5)*0.0018 + (fbm3(x*420, y*420, z*420, 75, 2) - 0.5)*0.0007;\n  const pc = cells3(x*180, y*180, z*180, 76);\n  const pit = pc.id > 0.5 ? sstep(0.42, 0.08, pc.d1)*(0.0006 + 0.0012*pc.id) : 0;\n  const vc = cells3(x*55, y*55, z*55, 77);\n  const vug = vc.id > 0.8 ? sstep(0.35, 0.05, vc.d1)*0.003 : 0;\n  const cc = cells3(x*28 + 3.3, y*28, z*28, 78);\n  const crack = sstep(0.05, 0.012, cc.edge)*sstep(0.45, 0.6, fbm3(x*18, y*18, z*18, 79, 2));\n  return { disp: lump - pit - vug - crack*0.0012, pit: pit > 0 ? 1 : 0, vug: vug > 0 ? 1 : 0, crack };\n}\nfunction field(x, y, z) {\n  const d = body(x, y, z);\n  if (d > 0.01) return d;\n  // crumbled edges: near an edge between faces the field is shallow; noise there bites deeper\n  const e = 0.0035, gx = body(x + e, y, z) - body(x - e, y, z), gy = body(x, y + e, z) - body(x, y - e, z), gz = body(x, y, z + e) - body(x, y, z - e);\n  const edge = 1 - Math.min(1, Math.hypot(gx, gy, gz)/(2*e));\n  const crumble = edge*sstep(0.45, 0.7, fbm3(x*70, y*70, z*70, 80, 3))*0.006;\n  return d - wear(x, y, z).disp + crumble;\n}\n\nlet CACHE = null;\nfunction build_geo() {\n  if (CACHE) return CACHE;\n  const g = mesh_sdf(field, [-0.1, -0.075, -0.08, 0.1, 0.075, 0.08], 0.0009);\n  const P = g.attributes.position, N = g.attributes.normal, n = P.count;\n  const col = new Float32Array(n*3), mr = new Float32Array(n*2);\n  for (let i = 0; i \u003c n; i++) {\n    const x = P.getX(i), y = P.getY(i), z = P.getZ(i), nx = N.getX(i), ny = N.getY(i), nz = N.getZ(i);\n    const open = Math.min(1, Math.max(0, field(x + nx*0.004, y + ny*0.004, z + nz*0.004)/0.004));\n    const wr = wear(x, y, z);\n    const crust = sstep(0.58, 0.74, fbm3(x*26, y*26, z*26, 82, 3));\n    const grain = cells3(x*400, y*400, z*400, 83);\n    const flake = cells3(x*160, y*160, z*160, 84);\n    const shiny = flake.id > 0.93 && wr.pit === 0 ? 1 : 0;\n    // iron-black, speckled grain to grain, matte; the metal only in small flakes\n    const v = 0.022 + 0.022*grain.id + 0.012*fbm3(x*70, y*70, z*70, 81, 2);\n    let r = v, gg = v*1.01, b = v*1.04, metal = 0.55*shiny, rough = 0.86 - 0.5*shiny;\n    // the weathering crust: brown, dull\n    const k = Math.min(1, crust*0.8 + sstep(0.75, 0.35, open)*0.35);\n    r += (0.12 - r)*k; gg += (0.07 - gg)*k; b += (0.04 - b)*k;\n    metal *= 1 - k; rough += (0.95 - rough)*k;\n    // grey dust in the pits, cavities and cracks; dark where the surface folds in\n    const dust = Math.max(wr.pit*0.7, wr.vug*0.8, wr.crack*0.6);\n    r += (0.07 - r)*dust; gg += (0.066 - gg)*dust; b += (0.062 - b)*dust;\n    const dark = sstep(0.55, 0.1, open)*0.6;\n    r *= 1 - dark; gg *= 1 - dark; b *= 1 - dark;\n    col[i*3] = r; col[i*3 + 1] = gg; col[i*3 + 2] = b;\n    mr[i*2] = metal; mr[i*2 + 1] = rough;\n  }\n  g.setAttribute('color', new THREE.BufferAttribute(col, 3));\n  g.setAttribute('aMR', new THREE.BufferAttribute(mr, 2));\n  CACHE = g;\n  return g;\n}\n\nexport function build_lodestone(ctx = {}) {\n  const lit = ctx.lit || (m => m);\n  const mat = lit(vertex_mr(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0, envMapIntensity: (ctx.env_i ?? 1)*0.7 })));\n  const stone = new THREE.Mesh(build_geo(), mat);\n  stone.castShadow = true;\n  const grp = new THREE.Group();\n  grp.add(stone);\n  return grp;\n}\n","game/item_mask.js":"// item_mask.js -- round 29: the FIRE power's object (owner: \"a burned mask instead,\n// specifically the a327ex, so black with white eyes/mouth, as though it had been burned\"). The\n// a327ex avatar is Shun's mask (Shin Sekai Yori): a smooth white full-face mask, a round brow over\n// a short lower face narrowing to a pointed chin, no features but a faint ridge of a nose, two\n// long slits for eyes and a short one for the mouth.\n//\n// Burned: the face charred black into blistered scales split by cracks (charred wood's\n// alligator pattern), the rim eaten ragged and grey with ash where it burned through, one hole\n// burned right through the cheek; the slits sit a little below the face and kept their white.\n// Sculpted as a thin shell (distance field, meshed by surface nets) with its colour, roughness\n// and cracks read from the same functions.\nimport * as THREE from 'three';\nimport { mesh_sdf, smax, largest_piece } from 'game/sdf.js';\nimport { cells2, fbm3, sstep, vertex_mr } from 'game/shape_noise.js';\n\nconst T = 0.0055;                 // shell thickness, m\nconst GROOVE = 0.0026;            // how far the slits sit below the face\n\n// Round 30 (owner: \"the proportions are off compared to the source\"). Measured on the avatar,\n// in units of E = the span from one eye's outer end to the other's: each eye 0.34 E long with a\n// 0.34 E gap between them; the mouth 0.47 E below the eyes and 0.24 E long; the chin's point\n// 0.77 E below the eyes; the face 1.37 E wide at the eyes, 1.26 E a little below them, 1.02 E at\n// a third of E down, 0.81 E at the mouth, then straight jaw lines to the point. (Round 29 had the\n// mouth 0.84 E and the chin 1.18 E down, the eyes 0.21 E apart: a long face.) E = 13.8 cm here.\nconst EY = 0.022;                 // the eyes' line\nconst JAW = [[0, 0.093], [0.0245, 0.0855], [0.042, 0.0695], [0.06, 0.059], [0.068, 0.0555], [0.085, 0.0365], [0.098, 0.017], [0.106, 0.0]];\nfunction jaw(dy) {\n  // Catmull-Rom through the measured half-widths (dy below the eyes)\n  if (dy \u003c= 0) return JAW[0][1];\n  if (dy >= JAW[JAW.length - 1][0]) return 0;\n  let i = 0;\n  while (JAW[i + 1][0] \u003c dy) i++;\n  const p0 = JAW[Math.max(0, i - 1)][1], p1 = JAW[i][1], p2 = JAW[i + 1][1], p3 = JAW[Math.min(JAW.length - 1, i + 2)][1];\n  const t = (dy - JAW[i][0])/(JAW[i + 1][0] - JAW[i][0]);\n  return 0.5*((2*p1) + (-p0 + p2)*t + (2*p0 - 5*p1 + 4*p2 - p3)*t*t + (-p0 + 3*p1 - 3*p2 + p3)*t*t*t);\n}\n// the outline (2D, \u003c0 inside): a round brow over the eyes, the measured jaw below them\nfunction outline(x, y) {\n  if (y >= EY) return (Math.hypot(x/0.093, (y - EY)/0.09) - 1)*0.09;\n  const dy = EY - y;\n  if (dy > 0.106) return Math.hypot(x, dy - 0.106);\n  return (Math.abs(x) - jaw(dy))*0.85;\n}\n// the face, before the fire: its height toward the viewer at (x, y)\nfunction face(x, y) {\n  const v = y - 0.01;\n  let z = -(x*x)/(2*0.105) - (v*v)/(2*0.3);\n  z += 0.008*Math.exp(-((x/0.0105)**2))*sstep(EY + 0.012, EY - 0.01, y)*sstep(EY - 0.046, EY - 0.03, y);   // the nose's ridge\n  z -= 0.0035*Math.exp(-(((Math.abs(x) - 0.046)/0.026)**2 + ((y - EY)/0.018)**2));                         // the eyes sit a little in\n  z += 0.0026*Math.exp(-(((Math.abs(x) - 0.048)/0.028)**2 + ((y - EY + 0.036)/0.024)**2));                 // cheeks\n  z += 0.0016*Math.exp(-((x/0.026)**2 + ((y - EY + 0.064)/0.013)**2));                                      // the mouth's rise\n  return z;\n}\n// the slits (2D): > 0 inside, its value the depth fraction there. Bars of even thickness with\n// rounded ends, like the avatar's (round 30's first pass tapered them to points)\nfunction bar(x, y, cx, cy, hl, t) {\n  const dx = Math.max(Math.abs(x - cx) - (hl - t), 0), dy = y - cy;\n  return (t - Math.hypot(dx, dy))/t;\n}\nfunction slit(x, y) {\n  let best = -1;\n  for (const s of [-1, 1]) best = Math.max(best, bar(x, y, s*0.046, EY, 0.0235, 0.0041));\n  return Math.max(best, bar(x, y, 0, EY - 0.065, 0.0168, 0.0029));\n}\n// the burn (round 31, owner: \"a different burning texture ... irregularities to it overall, it\n// should look burned, worn, etc. The same kind of irregularities you added to the hand\"): the\n// shell warped by the heat, a grainy, pitted surface; blisters risen and a few burst; charred\n// crackle over part of it (irregular, not round 30's even scales everywhere); a few long fissures;\n// a burn front at the eaten rim, ash going to brown going to black (colour, below).\nfunction char(x, y) {\n  const warp = (fbm3(x*9 + 1.7, y*9, 3.3, 57, 3) - 0.5)*0.007;\n  const grain = (fbm3(x*260, y*260, 0.5, 43, 3) - 0.5)*0.0008 + (fbm3(x*70, y*70, 0.9, 44, 2) - 0.5)*0.0012;\n  const pc = cells2(x/0.004 + 0.3, y/0.004, 59);\n  const pit = pc.id > 0.82 ? sstep(0.35, 0.05, pc.d1)*0.0005 : 0;\n  // blisters (lacquer lifting off in the heat): some whole, a few burst to a shallow crater\n  const bc = cells2(x/0.013 - 7.3, y/0.013 + 2.2, 49);\n  let blister = 0, burst = 0;\n  if (bc.id > 0.5) {\n    const r = bc.d1/(0.22 + 0.25*bc.id);\n    if (bc.id > 0.9) { burst = r \u003c 0.8 ? 1 : 0; blister = 0.0005*sstep(1.0, 0.75, r) - 0.0007*sstep(0.8, 0.2, r); }\n    else blister = 0.0011*Math.pow(sstep(1.0, 0.0, r), 0.7);\n  }\n  // charred crackle in patches: cells bent out of true by the noise, deep cracks\n  const qx = x + (fbm3(x*40, y*40, 2.9, 71, 2) - 0.5)*0.006, qy = y + (fbm3(x*40, y*40, 6.1, 72, 2) - 0.5)*0.006;\n  const cc = cells2(qx/0.0075, qy/0.0065, 41);\n  const patch = sstep(0.5, 0.6, fbm3(x*16, y*16, 4.1, 45, 3));\n  const crack = sstep(0.0009, 0.00015, cc.edge*0.007)*patch;\n  const dome = sstep(0, 0.0022, cc.edge*0.007)*patch;\n  // long fissures where the noise lets them run\n  const fc = cells2(x/0.034 + 5.1, y/0.028 - 3.3, 61);\n  const fissure = sstep(0.0011, 0.0002, fc.edge*0.03)*sstep(0.55, 0.66, fbm3(x*14, y*14, 7.7, 63, 2));\n  return { disp: warp + grain - pit + blister + dome*0.0003 - crack*0.0008 - fissure*0.0009, pit: pit > 0 ? 1 : 0,\n    blister: Math.max(0, blister)/0.0011, burst, crack, dome, fissure, id: bc.id };\n}\n// where the fire ate the rim, and the hole through the cheek (2D, > 0 = burned away); ragged\n// but shallow (round 30: up to ~7 mm, so the outline stays the source's)\nfunction burned(x, y) {\n  const n = fbm3(x*38, y*38, 1.3, 47, 3);\n  let eat = (n - 0.45)*0.014;\n  eat += 0.006*Math.exp(-(((x + 0.06)/0.03)**2 + ((y - EY + 0.07)/0.03)**2));   // a bite out of the lower left jaw\n  const hole = 0.0065 + 0.0035*(fbm3(x*90, y*90, 2.1, 53, 2) - 0.5)*2 - Math.hypot(x - 0.058, y - EY + 0.04);\n  return { eat: Math.max(eat, 0), hole };\n}\n\nfunction field(x, y, z) {\n  const b = burned(x, y);\n  const o = outline(x, y) + b.eat;\n  if (o > 0.012) return o;\n  const f = face(x, y);\n  const s = slit(x, y);\n  const ch = char(x, y);\n  const front = f + ch.disp*(s > 0 ? 0.5 : 1) - (s > 0 ? GROOVE*Math.min(1, s*3) : 0);\n  const back = f + (fbm3(x*9 + 1.7, y*9, 3.3, 57, 3) - 0.5)*0.007 - T;\n  let d = Math.max(z - front, back - z);\n  d = smax(d, o, 0.0016);\n  d = Math.max(d, b.hole);\n  return d;\n}\n\nlet CACHE = null;\nfunction geometry() {\n  if (CACHE) return CACHE;\n  const g = largest_piece(mesh_sdf(field, [-0.1, -0.09, -0.075, 0.1, 0.118, 0.022], 0.0007));\n  // colour, roughness\n  const P = g.attributes.position, n = P.count;\n  const col = new Float32Array(n*3), mr = new Float32Array(n*2);\n  for (let i = 0; i \u003c n; i++) {\n    const x = P.getX(i), y = P.getY(i), z = P.getZ(i);\n    const f = face(x, y), s = slit(x, y), ch = char(x, y), b = burned(x, y);\n    const front = z > f + (fbm3(x*9 + 1.7, y*9, 3.3, 57, 3) - 0.5)*0.007 - T*0.85;\n    const rim = sstep(-0.006, -0.0005, outline(x, y) + b.eat) + sstep(-0.004, 0.0, b.hole);\n    let r, gg, bb, rough;\n    const soot = fbm3(x*45, y*20, 1.9, 67, 3);\n    // how far in from where the fire ate the rim (0 at the edge): the burn front\n    const edge = -(outline(x, y) + b.eat), front_d = Math.min(edge, -b.hole + 0.0065*0.3);\n    const ashy = sstep(0.006, 0.0, front_d), brown = sstep(0.02, 0.004, front_d);\n    if (front && s > 0.05) {\n      // the slits kept their white, stained brown with soot, dirtier at their edges\n      const w = sstep(0.05, 0.6, s)*(0.7 + 0.3*sstep(0.62, 0.4, soot));\n      r = 0.05 + 0.68*w; gg = 0.042 + 0.62*w; bb = 0.036 + 0.55*w; rough = 0.65;\n    } else if (front) {\n      // char: black, velvety; a faint grey sheen on crackle tops and blisters; cracks and\n      // craters dead black; scorched brown and then ash toward the eaten rim; soot streaks\n      const t = fbm3(x*60, y*60, 2.2, 55, 3);\n      const v = 0.0045 + 0.005*t + 0.004*ch.dome + 0.003*ch.blister*(1 - ch.burst) - 0.003*Math.max(ch.crack, ch.fissure, ch.burst, ch.pit);\n      r = v*1.15; gg = v; bb = v*0.9;\n      r += (0.045 - r)*brown*0.8; gg += (0.026 - gg)*brown*0.8; bb += (0.014 - bb)*brown*0.8;\n      const streak = sstep(0.62, 0.74, soot)*0.5;\n      r *= 1 - streak*0.5; gg *= 1 - streak*0.5; bb *= 1 - streak*0.5;\n      rough = 0.8 - 0.25*ch.dome - 0.35*ch.blister*(1 - ch.burst) + 0.15*ch.crack;\n    } else {\n      r = 0.008; gg = 0.0065; bb = 0.0055; rough = 0.9;\n    }\n    r += (0.085 - r)*ashy*0.85; gg += (0.078 - gg)*ashy*0.85; bb += (0.072 - bb)*ashy*0.85; rough += (0.95 - rough)*ashy;\n    col[i*3] = r; col[i*3 + 1] = gg; col[i*3 + 2] = bb;\n    mr[i*2] = 0; mr[i*2 + 1] = Math.min(1, rough);\n  }\n  g.setAttribute('color', new THREE.BufferAttribute(col, 3));\n  g.setAttribute('aMR', new THREE.BufferAttribute(mr, 2));\n  CACHE = g;\n  return g;\n}\n\nexport function build_mask(ctx = {}) {\n  const lit = ctx.lit || (m => m);\n  // char is black and nearly matte: a weak specular (a grey sheen read as \"not black\")\n  const mat = lit(vertex_mr(new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.8, metalness: 0, side: THREE.DoubleSide,\n    specularIntensity: 0.3, envMapIntensity: (ctx.env_i ?? 1)*0.4 })));\n  const m = new THREE.Mesh(geometry(), mat);\n  m.castShadow = true;\n  const g = new THREE.Group();\n  g.add(m);\n  return g;\n}\n","game/item_orbs.js":"// item_orbs.js -- round 28: the LEAKAGE power's object (owner: \"the orbs Shun uses around him\n// before he becomes a Karma demon\", Shin Sekai Yori). In the anime (ep. 10, his house; the\n// frames in reference/objects/leak-shun/) they are clear glass spheres of a few sizes drifting\n// in the air near him: dark green in their depth, a darker rim where the glass is thickest, a\n// hard star of a glint.\n//\n// Each sphere is traced as solid glass: the eye's ray refracts in, crosses, and either leaves\n// (seeing the world behind, upside down, as a glass ball does) or reflects inside and tries\n// again; red, green and blue bend a little differently (faint rainbow fringes at the rim);\n// glass absorbs along its path, more in red and blue, so the middle of a thick ball is green.\n// In the inspect view they hover around each other; on the floor each is its own rolling ball.\nimport * as THREE from 'three';\n\n// radii, m (a few sizes, like the anime's)\nexport const ORB_R = [0.05, 0.036, 0.042, 0.028, 0.032];\n\nconst VS = /* glsl */`\nvarying vec3 vPosO;\nvoid main(){ vPosO = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`;\nconst FS = /* glsl */`\nprecision highp float;\nuniform vec3 uCamO;\nuniform mat3 uToWorld;\nuniform samplerCube uEnv;\nuniform float uEnvK, uGlintPow, uLit, uFlip;\nuniform vec3 uIor, uSunDir, uSunCol, uAbsorb;\nvarying vec3 vPosO;\nvec3 env_w(vec3 dO){\n  vec3 d = normalize(uToWorld*dO);\n  vec3 c = textureCube(uEnv, vec3(uFlip*d.x, d.y, d.z)).rgb*uEnvK;\n  float s = max(dot(d, uSunDir), 0.0);\n  return c + uSunCol*(pow(s, uGlintPow) + 0.03*pow(s, uGlintPow*0.04))*uLit;\n}\nfloat schlick(float c, float n){ float f0 = (n - 1.0)/(n + 1.0); f0 *= f0; return f0 + (1.0 - f0)*pow(1.0 - clamp(c, 0.0, 1.0), 5.0); }\n// one colour through the ball (unit sphere, object space), from surface point p going d\nfloat through(vec3 p, vec3 d, float n, int ch){\n  float acc = 0.0, thr = 1.0;\n  for (int b = 0; b \u003c 3; b++) {\n    float t = -2.0*dot(p, d);\n    p += d*t;\n    thr *= exp(-uAbsorb[ch]*t);\n    vec3 N = normalize(p);\n    vec3 o = refract(d, -N, n);\n    if (dot(o, o) \u003c 1e-6) { d = reflect(d, -N); continue; }\n    float F = schlick(dot(o, N), n);\n    acc += thr*(1.0 - F)*env_w(o)[ch];\n    thr *= F;\n    d = reflect(d, -N);\n  }\n  return acc;\n}\nvoid main(){\n  vec3 P = normalize(vPosO);\n  vec3 V = normalize(vPosO - uCamO);\n  float c = max(-dot(V, P), 0.0);\n  float F = schlick(c, uIor.g);\n  vec3 col = env_w(reflect(V, P))*F;\n  vec3 inside;\n  for (int ch = 0; ch \u003c 3; ch++) { float n = uIor[ch]; inside[ch] = through(P, refract(V, P, 1.0/n), n, ch); }\n  col += (1.0 - F)*inside;\n  gl_FragColor = vec4(min(col, vec3(2.4)), 1.0);\n}`;\n\nfunction orb_material(ctx) {\n  const U = {\n    uCamO: { value: new THREE.Vector3() }, uToWorld: { value: new THREE.Matrix3() },\n    uEnv: { value: ctx.env }, uEnvK: { value: ctx.env_k ?? 1 }, uFlip: { value: ctx.flip ?? 1 },\n    uGlintPow: { value: ctx.glint_pow ?? 1400 }, uLit: { value: 1 },\n    uIor: { value: new THREE.Vector3(1.505, 1.52, 1.54) },\n    uSunDir: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Vector3(30, 27, 22) },\n    uAbsorb: { value: new THREE.Vector3(0.16, 0.15, 0.15) },      // per unit radius: neutral, a little grey (round 29, owner: not green)\n  };\n  const m = new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS, fragmentShader: FS });\n  m.userData.U = U;\n  return m;\n}\n\n// ctx.env = the cube to see; ctx.sun = { dir, col } (world). Returns a group of spheres; each\n// has userData.r (its radius) and userData.mat. g.userData.hover(t) floats them around each\n// other (the inspect view).\nexport function build_orbs(ctx = {}) {\n  const g = new THREE.Group();\n  const geo = new THREE.SphereGeometry(1, 48, 32);\n  const inv = new THREE.Matrix4(), cam = new THREE.Vector3(), sc = new THREE.Vector3();\n  const orbs = ORB_R.map((r, i) => {\n    const mat = orb_material(ctx);\n    const m = new THREE.Mesh(geo, mat);\n    m.scale.setScalar(r);\n    m.userData.r = r; m.userData.mat = mat;\n    m.castShadow = false; m.userData.no_shadow = true;         // clear glass: no dark shadow\n    m.onBeforeRender = (rr, s, camera) => {\n      m.updateMatrixWorld();\n      inv.copy(m.matrixWorld).invert();\n      mat.userData.U.uCamO.value.copy(cam.setFromMatrixPosition(camera.matrixWorld).applyMatrix4(inv));\n      const k = sc.setFromMatrixScale(m.matrixWorld).x;\n      mat.userData.U.uToWorld.value.setFromMatrix4(m.matrixWorld).multiplyScalar(1/k);\n      if (ctx.sun) { mat.userData.U.uSunDir.value.copy(ctx.sun.dir); mat.userData.U.uSunCol.value.copy(ctx.sun.col); }\n    };\n    g.add(m);\n    return m;\n  });\n  // a loose cluster: each on its own slow tilted orbit around the middle, bobbing\n  const ORBIT = ORB_R.map((r, i) => ({ rad: 0.015 + 0.045*i, speed: (0.3 + 0.1*i)*(i % 2 ? -1 : 1), tilt: [0.2, -0.5, 0.7, -0.3, 0.45][i], ph: i*1.9, bob: 0.012 + 0.004*i }));\n  const place = (t) => {\n    orbs.forEach((m, i) => {\n      const o = ORBIT[i], a = o.ph + t*o.speed;\n      const x = Math.cos(a)*o.rad, z = Math.sin(a)*o.rad;\n      // orbits mostly across the view (x, y), a little depth\n      m.position.set(x, Math.sin(t*0.7 + o.ph)*o.bob + z*Math.cos(o.tilt), z*Math.sin(o.tilt));\n    });\n    // never through each other: overlapping pairs pushed apart\n    for (let it = 0; it \u003c 3; it++) for (let i = 0; i \u003c orbs.length; i++) for (let j = i + 1; j \u003c orbs.length; j++) {\n      const a = orbs[i].position, b = orbs[j].position, d = a.distanceTo(b), min = (ORB_R[i] + ORB_R[j])*1.15;\n      if (d \u003c min && d > 1e-6) { const k = (min - d)/d*0.5; const dx = (b.x - a.x)*k, dy = (b.y - a.y)*k, dz = (b.z - a.z)*k; a.x -= dx; a.y -= dy; a.z -= dz; b.x += dx; b.y += dy; b.z += dz; }\n    }\n  };\n  place(0);\n  g.userData.orbs = orbs;\n  g.userData.hover = place;\n  return g;\n}\n","game/leak.js":"// leak.js -- LEAKAGE (round 11, owner: \"prismatic effect coming from his head, slowly\r\n// dematerializes snakes near him\"; it happens by itself, he never gestures for it).\r\n//\r\n// A snake within its reach slows and comes apart from the tail forward (snakes.js draws the\r\n// dissolving, from `s.leak`). Out of reach, a half-gone snake slowly comes back together. With\r\n// fewer powers left its reach grows until, alone, it spans from him to past the egg wherever he\r\n// is, and it works faster.\r\n//\r\n// Round 23 (owner: the glitter-like dots should \"feel more like wind visually ... a kind of\r\n// transparent slight warping of things ... streaks of prismatic warping coming out of the lich's\r\n// head, and when snakes die they die with a smoke-like effect using this a similar effect\"): all\r\n// of it is warp.js now, air that bends the light with rainbow fringes, no dots:\r\n//   - wind streaks curl out of his skull and flow away across the room, more and further the\r\n//     larger its reach\r\n//   - now and then a ripple of it runs out across the floor to the edge of its reach\r\n//   - where a snake is coming apart, warped smoke rises from it; when the last of it goes, a\r\n//     last puff where its head was\r\nimport * as THREE from 'three';\r\nimport { smoothstep } from 'game/util.js';\r\nimport { K } from 'game/warp.js';\r\nimport { spectrum } from 'game/fx.js';\r\n\r\n// Round 25 (owner: \"the disappear effect needs to be more... visual, interesting, somehow\";\r\n// \"the transparent lines coming out from the lich also look cool but they could be a bit more\r\n// visible and prismatic, just a tad more\"; and the dissolving went the wrong way): it goes from\r\n// where the snake is nearest him outward (snakes.js); ahead of its edge the flesh turns glassy\r\n// and prismatic, and at the edge the body breaks into flakes that swirl up, burning into his\r\n// colours as they rise, and go to warped air; the wind lines a little stronger, a little more\r\n// split into colour.\r\nexport function create_leak(ctx) {\r\n  const { R, snakes, warp, lich, rng, egg, get_L, cave, GU } = ctx;\r\n  const N = snakes.RINGS;\r\n  const H = new THREE.Vector3();\r\n  let ring_t = 0, emit = 0;\r\n  let reach = 2.6, rate = 0.22;\r\n  const streaks = [], rings = [];\r\n\r\n  // a wind line leaving his skull: a path that curls as it goes (sampled every DS m), and the\r\n  // stretch of it the streak covers at any moment\r\n  const DS = 0.08;\r\n  function streak_from(p0) {\r\n    const s = warp.streak();\r\n    if (!s) return;\r\n    const sp = rng.float(1.3, 2.2)*(0.7 + reach/6), len = rng.float(0.6, 1.1)*(0.8 + reach/10);\r\n    const life = Math.min(3.2, Math.max(0.9, (reach*rng.float(0.7, 1.05))/sp));\r\n    let a = rng.float(0, 6.2832), e = rng.float(-0.25, 0.35);\r\n    const curl = rng.spread(1.6), rise = rng.spread(0.35), wav = rng.float(0, 6.28);\r\n    const path = [p0.clone()], q = p0.clone();\r\n    const total = sp*life + len;\r\n    for (let d = 0; d \u003c total; d += DS) {\r\n      a += curl*DS; e += rise*DS*0.5;\r\n      q.x += Math.sin(a)*Math.cos(e)*DS; q.y += (Math.sin(e) + 0.06*Math.sin(d*5 + wav))*DS; q.z += Math.cos(a)*Math.cos(e)*DS;\r\n      const g = cave.ground_y(q.x, q.z) + 0.15;\r\n      if (q.y \u003c g) { q.y = g; e = Math.max(e, 0); }             // it skims the floor rather than going into it\r\n      path.push(q.clone());\r\n    }\r\n    s.w = rng.float(0.08, 0.15); s.amp = rng.float(3.1, 4.6)*(0.85 + Math.min(1, reach/10)*0.4); s.chroma = rng.float(0.85, 1.15);\r\n    streaks.push({ s, path, sp, len, life, t: 0 });\r\n  }\r\n  const at = (path, d, out) => {\r\n    const f = Math.max(0, Math.min(path.length - 1.001, d/DS)), i = Math.floor(f);\r\n    return out.lerpVectors(path[i], path[i + 1], f - i);\r\n  };\r\n  function update_streaks(dt) {\r\n    for (let i = streaks.length - 1; i >= 0; i--) {\r\n      const q = streaks[i];\r\n      q.t += dt;\r\n      const head = q.t*q.sp, tail = Math.max(0, head - q.len*Math.min(1, q.t/0.3));\r\n      for (let k = 0; k \u003c K; k++) at(q.path, tail + (head - tail)*k/(K - 1), q.s.pts[k]);\r\n      q.s.a = smoothstep(0, 0.15, q.t)*(1 - smoothstep(q.life - 0.35, q.life, q.t));\r\n      if (q.t >= q.life) { warp.release(q.s); streaks.splice(i, 1); }\r\n    }\r\n  }\r\n  // a ripple across the floor, from him out to the edge of its reach\r\n  function ring_from(c) {\r\n    const s = warp.streak();\r\n    if (!s) return;\r\n    s.w = 0.16; s.amp = 3.2; s.chroma = 0.8;\r\n    rings.push({ s, c: c.clone(), t: 0, T: 1.4 + reach*0.06 });\r\n  }\r\n  function update_rings(dt) {\r\n    for (let i = rings.length - 1; i >= 0; i--) {\r\n      const q = rings[i];\r\n      q.t += dt;\r\n      const u = q.t/q.T, r = 0.3 + (reach - 0.3)*(1 - Math.pow(1 - Math.min(1, u), 1.6));\r\n      for (let k = 0; k \u003c K; k++) {\r\n        const a = k/(K - 1)*6.2832, p = q.s.pts[k];\r\n        p.set(q.c.x + Math.sin(a)*r, 0, q.c.z + Math.cos(a)*r);\r\n        p.y = cave.ground_y(p.x, p.z) + 0.08;\r\n      }\r\n      q.s.a = smoothstep(0, 0.1, u)*(1 - smoothstep(0.6, 1, u))*0.9;\r\n      if (u >= 1) { warp.release(q.s); rings.splice(i, 1); }\r\n    }\r\n  }\r\n  // ---------------------------------------------------------------- flakes\r\n  // small plates of it, breaking off at the edge where it is going: its own dark skin, a faint\r\n  // sheen of his colours coming into it as it swirls up, and each one going to warped air (not\r\n  // glowing: the owner moved the prismatic away from glitter, round 23)\r\n  const FN = 700;\r\n  const fgeo = new THREE.CircleGeometry(1, 5);\r\n  const fmat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });\r\n  const fmesh = new THREE.InstancedMesh(fgeo, fmat, FN);\r\n  fmesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(FN*3), 3);\r\n  fmesh.frustumCulled = false;\r\n  R.world_scene.add(fmesh);\r\n  const FL = [];\r\n  for (let i = 0; i \u003c FN; i++) { FL.push({ life: 0 }); fmesh.setMatrixAt(i, new THREE.Matrix4().makeScale(0, 0, 0)); }\r\n  let fnext = 0;\r\n  const M4 = new THREE.Matrix4(), QQ = new THREE.Quaternion(), EE = new THREE.Euler(), SV = new THREE.Vector3(), PV = new THREE.Vector3(), OP = [1, 1, 1];\r\n  const opal = (h) => { const c = spectrum(h).map(v => v*v*(3 - 2*v)); for (let i = 0; i \u003c 3; i++) c[i] = c[i]*0.84 + 0.08; const m = Math.max((c[0] + c[1] + c[2])/3, 0.2); OP[0] = c[0]/m; OP[1] = c[1]/m; OP[2] = c[2]/m; return OP; };\r\n  function flake(p, r) {\r\n    const f = FL[fnext]; fnext = (fnext + 1) % FN;\r\n    const a = rng.float(0, 6.28);\r\n    Object.assign(f, { life: rng.float(0.9, 1.5), t: 0, x: p.x + Math.cos(a)*r, y: p.y + rng.spread(r), z: p.z + Math.sin(a)*r, cx: p.x, cz: p.z,\r\n      vx: Math.cos(a)*rng.float(0.1, 0.35), vy: rng.float(0.25, 0.6), vz: Math.sin(a)*rng.float(0.1, 0.35), s: rng.float(0.018, 0.04),\r\n      rx: rng.float(0, 6), ry: rng.float(0, 6), rz: rng.float(0, 6), wx: rng.spread(9), wy: rng.spread(9), wz: rng.spread(9), hue: rng.next(), curl: rng.sign()*rng.float(1.2, 2.4), puffed: false });\r\n    f.max = f.life;\r\n  }\r\n  function update_flakes(t, dt) {\r\n    for (let i = 0; i \u003c FN; i++) {\r\n      const f = FL[i];\r\n      if (f.life \u003c= 0) continue;\r\n      f.life -= dt; f.t += dt;\r\n      const u = f.t/f.max;\r\n      // up, and round the line it rose from (the swirl widens as it goes)\r\n      const dx = f.x - f.cx, dz = f.z - f.cz;\r\n      f.vx += -dz*f.curl*dt*2.2; f.vz += dx*f.curl*dt*2.2;\r\n      f.vy += 0.5*dt;\r\n      const d = 1 - 0.9*dt; f.vx *= d; f.vz *= d;\r\n      f.x += f.vx*dt; f.y += f.vy*dt; f.z += f.vz*dt;\r\n      f.rx += f.wx*dt; f.ry += f.wy*dt; f.rz += f.wz*dt;\r\n      // its skin burning into his colours, brighter, then gone\r\n      const b = smoothstep(0.1, 0.6, u), g = opal(f.hue + t*0.15);\r\n      const k = 0.012*b;\r\n      fmesh.instanceColor.setXYZ(i, 0.034 + g[0]*k, 0.03 + g[1]*k, 0.022 + g[2]*k);\r\n      const sc = f.s*(1 - smoothstep(0.6, 1, u));\r\n      EE.set(f.rx, f.ry, f.rz); QQ.setFromEuler(EE);\r\n      M4.compose(PV.set(f.x, f.y, f.z), QQ, SV.set(sc, sc, sc));\r\n      fmesh.setMatrixAt(i, f.life > 0 ? M4 : M4.makeScale(0, 0, 0));\r\n      if (!f.puffed && u > 0.6) { f.puffed = true; warp.puff({ x: f.x, y: f.y, z: f.z, vx: f.vx*0.5, vy: 0.35, vz: f.vz*0.5, life: rng.float(0.6, 1.0), s0: 0.08, s1: 0.3, amp: 3.6, spin: rng.spread(3) }); }\r\n    }\r\n    fmesh.instanceMatrix.needsUpdate = true; fmesh.instanceColor.needsUpdate = true;\r\n  }\r\n\r\n  // warped smoke from where a snake is coming apart\r\n  // (a billowing column: each puff swells as it rises, turning over)\r\n  const smoke = (p, big = 1) => warp.puff({ x: p.x + rng.spread(0.08), y: p.y + rng.spread(0.04), z: p.z + rng.spread(0.08),\r\n    vx: rng.spread(0.2), vy: rng.float(0.35, 0.8), vz: rng.spread(0.2), rise: 0.35, drag: 0.6,\r\n    life: rng.float(1.4, 2.4)*big, s0: 0.16*big, s1: rng.float(0.6, 0.9)*big, amp: rng.float(4.0, 5.2), spin: rng.spread(2.0) });\r\n  // the last of it going: a puff where its head was\r\n  snakes.on_dissolve = (s) => { for (let k = 0; k \u003c 6; k++) smoke(s.spine[rng.int(0, 6)], 1.3); };\r\n\r\n  return {\r\n    name: 'LEAKAGE', gesture: false,\r\n    // how far it reaches and how fast it takes them, for a power level p (1 = all six powers)\r\n    scale(p, R_T) {\r\n      const L = get_L();\r\n      const far = Math.hypot(L.x - egg.x, L.z - egg.z) + R_T + 0.8;\r\n      const k = (p - 1)/5;\r\n      reach = 2.6 + k*Math.max(0, far - 2.6);\r\n      rate = 0.22*Math.pow(p, 0.75)*(p >= 6 ? 1.6 : 1);\r\n    },\r\n    get reach() { return reach; },\r\n    update(t, dt, on, urgent) {\r\n      const L = get_L();\r\n      for (const s of snakes.S) {\r\n        if (s.delay > 0 || s.dying >= 0 || s.burn || s.sink >= 0 || s.fx) continue;\r\n        let d = 1e9;\r\n        for (let i = 0; i \u003c N; i += 6) d = Math.min(d, Math.hypot(s.spine[i].x - L.x, s.spine[i].z - L.z));\r\n        if (on && d \u003c reach) {\r\n          // it starts from the part of it nearest him\r\n          if (s.leak_at == null || s.leak \u003c= 0) {\r\n            let bi = 0, bd = 1e9;\r\n            for (let i = 0; i \u003c N; i += 2) { const e = Math.hypot(s.spine[i].x - L.x, s.spine[i].z - L.z); if (e \u003c bd) { bd = e; bi = i; } }\r\n            s.leak_at = bi;\r\n          }\r\n          // closer to him, faster; a snake about to reach the egg is taken much faster\r\n          const k = 1 - 0.5*d/reach;\r\n          s.leak += rate*k*dt*(urgent && urgent.has(s) ? 4 : 1);\r\n          // its two edges (toward the head, toward the tail): flakes breaking off, and smoke\r\n          const LEN = snakes.LEN, ac = snakes.arc(s.leak_at), ext = Math.max(ac, LEN - ac, 0.5), fr = Math.min(1.12, s.leak*1.12)*ext;\r\n          for (const e of [ac - fr, ac + fr]) {\r\n            if (e \u003c 0 || e > LEN) continue;\r\n            const i = Math.max(0, Math.min(N - 1, Math.round(snakes.ring_at(e))));\r\n            const p = s.spine[i], r = s.radii[i] || 0.06;\r\n            for (let m = 0; m \u003c 2; m++) if (rng.next() \u003c 0.3) flake(p, r);\r\n            if (rng.next() \u003c 0.4) smoke(p);\r\n          }\r\n        } else if (s.leak > 0) { s.leak = Math.max(0, s.leak - 0.06*dt); if (s.leak \u003c= 0) s.leak_at = null; }\r\n      }\r\n      update_streaks(dt); update_rings(dt); update_flakes(t, dt);\r\n      if (!on) return;\r\n      // from his skull: wind lines curling out, more the further it reaches\r\n      lich.head_pos(H);\r\n      emit += dt*(5 + reach*1.2);\r\n      while (emit >= 1) { emit -= 1; streak_from(H.clone().add(new THREE.Vector3(rng.spread(0.06), rng.spread(0.05), rng.spread(0.06)))); }\r\n      // now and then a ripple runs out across the floor to the edge of its reach\r\n      ring_t -= dt;\r\n      if (ring_t \u003c= 0) { ring_t = rng.float(1.6, 2.6); ring_from(L); }\r\n    },\r\n  };\r\n}\r\n","game/lens.js":"// lens.js -- LENS (round 11, owner: \"creates a lens bending the shaft's sunlight and creating a\r\n// single fire laser beam that moves forward and splits any snakes it passes through\"; the lens\r\n// is a physical floating glass-like object, and he doesn't point).\r\n//\r\n// Round 14 (owner: the effect is right, but the lens \"looks like a slab of concrete instead of\r\n// glass. It should look transparent like glass but still visible. The way the light converges\r\n// on it should also feel a bit more realistic.\" And it hit tails: \"It should aim for either\r\n// cutting the head off or middle\"). Round 15 (owner: no glints leading into it). Round 16\r\n// (owner: no light from above at all; the flash as it fired \"feels off\"):\r\n//   FORM      the glass crystallizes in the shaft: real transmissive glass (it bends what is\r\n//             behind it, a little spectral spread, glints where the sun catches it, a faint rim\r\n//             so it reads in the dark; it casts its shadow into the shaft like a real lens)\r\n//   CONVERGE  as a magnifying glass does: the light it gathers coming out as a cone to a wide\r\n//             soft patch on the floor beside the snake that tightens to a blinding point,\r\n//             brighter as it shrinks (the same light on less floor), and starts to smoke; the\r\n//             focus follows the snake while it crawls\r\n//   FIRE      the cone goes out as the focus becomes the laser (round 13's beam: L = fire laser\r\n//             / prism in fire): the glass flares a moment, the focal point ignites (sparks, a\r\n//             puff); it sweeps across the snake from right beside it, at its middle (round 17:\r\n//             no longer the neck); tails are never cut\r\n//   END       the beam thins out, the glass dissolves into glints\r\n// Cut halves part charred and smoking, twitch, and sink into the ground. With fewer powers\r\n// left, several lenses form at once.\r\nimport * as THREE from 'three';\r\nimport { smoothstep } from 'game/util.js';\r\nimport { LAYOUT } from 'game/cave.js';\r\n\r\nconst FORM = 0.4, CONVERGE = 0.8, SPEED = 3.0, SWEEP = 2.6, LEAD = 0.35, OFF = 0.2, FADE = 0.45, CUT_R = 0.13;\r\nconst LENS_R = 0.38;\r\nconst LIGHTS_OFF = 0.15;             // the cone goes out this fast as it fires\r\n// where a cut may fall, in metres from the snout (round 17: the middle; the head and the tail\r\n// are never cut, even by a beam that happens to cross another snake)\r\nconst CUT_MIN = 1.0, CUT_MAX = 2.6;\r\nexport const LENS_LOOKS = ['FIRE LASER (TITAN, PHRIKE)', 'THE PRISMATIC BEAM, IN FIRE'];\r\n\r\nexport function create_lens(ctx) {\r\n  const { R, snakes, fx, cave, rng } = ctx;\r\n  const N = snakes.RINGS;\r\n  const S = LAYOUT.sun_dir, sxz = new THREE.Vector2(S.x/S.y, S.z/S.y);\r\n  const axis_at = h => new THREE.Vector3(sxz.x*h, h, sxz.y*h);\r\n\r\n  // ---------------------------------------------------------------- the glass\r\n  const geo = new THREE.SphereGeometry(1, 40, 16);\r\n  geo.scale(1, 0.14, 1);                            // a biconvex lens: 76 cm across, ~10 cm thick\r\n  const glass_mat = () => {\r\n    const m = new THREE.MeshPhysicalMaterial({\r\n      color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 1, thickness: 0.18, ior: 1.52,\r\n      dispersion: 0.8, specularIntensity: 1, specularColor: 0xffffff, envMapIntensity: 0,\r\n      depthWrite: false,             // the shaft's haze (drawn after, by depth) must show through the glass, not stop at it\r\n    });\r\n    const U = { uRim: { value: 0 } };\r\n    m.userData.U = U;\r\n    m.onBeforeCompile = (sh) => {\r\n      Object.assign(sh.uniforms, U);\r\n      sh.fragmentShader = sh.fragmentShader\r\n        .replace('#include \u003ccommon>', '#include \u003ccommon>\\nuniform float uRim;')\r\n        .replace('#include \u003clights_fragment_end>', `#include \u003clights_fragment_end>\r\n  {\r\n    // a faint rim so the edge of the glass still reads in the dark cave\r\n    float nv = abs(dot(normalize(normal), normalize(vViewPosition)));\r\n    totalEmissiveRadiance += vec3(0.85, 0.9, 1.0)*pow(1.0 - nv, 3.0)*uRim;\r\n  }`);\r\n    };\r\n    m.customProgramCacheKey = () => 'lens_glass';\r\n    return m;\r\n  };\r\n  // a shimmer over the glass while it crystallizes (additive, fades once it has formed)\r\n  const shimmer_mat = () => new THREE.ShaderMaterial({\r\n    uniforms: { uA: { value: 0 }, uTime: { value: 0 } },\r\n    vertexShader: `varying vec3 vN, vV, vP; void main(){ vec4 w = modelMatrix*vec4(position, 1.0); vN = normalize(mat3(modelMatrix)*normal); vV = normalize(cameraPosition - w.xyz); vP = position; gl_Position = projectionMatrix*viewMatrix*w; }`,\r\n    fragmentShader: `uniform float uA, uTime; varying vec3 vN, vV, vP;\r\n      void main(){\r\n        float rim = pow(1.0 - abs(dot(normalize(vN), vV)), 3.0);\r\n        vec3 h = clamp(abs(fract(atan(vP.z, vP.x)*0.16 + uTime*0.8 + vec3(0.0, 0.6667, 0.3333))*6.0 - 3.0) - 1.0, 0.0, 1.0);\r\n        gl_FragColor = vec4(mix(vec3(1.0), h, 0.6)*rim*1.1*uA, 1.0); }`,\r\n    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,\r\n  });\r\n\r\n  // the cone of gathered sunlight under the lens, and the patch it throws on the floor\r\n  const SEG = 28;\r\n  const cone_mat = new THREE.ShaderMaterial({\r\n    uniforms: { uA: { value: 1 } },\r\n    vertexShader: `attribute float aT; attribute float aA; varying float vT, vA; void main(){ vT = aT; vA = aA; gl_Position = projectionMatrix*viewMatrix*vec4(position, 1.0); }`,\r\n    fragmentShader: `varying float vT, vA; void main(){ gl_FragColor = vec4(vec3(1.0, 0.9, 0.7)*vA*(0.25 + 0.75*vT*vT), 1.0); }`,\r\n    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,\r\n  });\r\n  const patch_mat = new THREE.ShaderMaterial({\r\n    uniforms: { uA: { value: 0 } },\r\n    vertexShader: `varying vec2 vU; void main(){ vU = uv*2.0 - 1.0; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`,\r\n    fragmentShader: `uniform float uA; varying vec2 vU; void main(){ float d = length(vU); float k = smoothstep(1.0, 0.0, d); k = k*k; gl_FragColor = vec4(vec3(1.0, 0.92, 0.75)*k*uA, 1.0); }`,\r\n    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,\r\n  });\r\n  const make_cone = () => {\r\n    const g = new THREE.BufferGeometry( pread(0.08), vy: rng.float(0.3, 0.5), vz: rng.spread(0.08), drag: 0.3,\r\n            life: rng.float(1.2, 2.0), s0: 0.12, s1: 0.4, r: 0.012, g: 0.011, b: 0.01, a: 0.35 });\r\n        }\r\n        if (f.t > 3.15) return 'done';\r\n      },\r\n    };\r\n    return f;\r\n  }\r\n\r\n  // the snake's frame at a ring: position, its direction (toward the head), across it\r\n  const TAN = new THREE.Vector3(), ACR = new THREE.Vector3();\r\n  function frame_at(s, c) {\r\n    TAN.subVectors(s.spine[Math.max(0, c - 3)], s.spine[Math.min(N - 1, c + 3)]).setY(0).normalize();\r\n    ACR.set(-TAN.z, 0, TAN.x);\r\n    return s.spine[c];\r\n  }\r\n\r\n  // aim: the middle of the body (round 17, owner: the neck cuts fell too close to the head,\r\n  // sometimes ahead of it). The body moves on while the beam crosses it, so it aims a little\r\n  // ahead of where the cut should fall.\r\n  const aim_ring = () => Math.max(1, Math.round(snakes.ring_at(Math.max(0.05, rng.float(1.7, 2.3) - 0.18))));\r\n  // round 23 (owner: \"the beam is often starting from the egg\"): another power can take its snake\r\n  // before it fires; the focus then stayed at the room's origin, which is the egg (2 of 7 beams in\r\n  // a 90 s run). Now the focus moves over to the nearest free snake, or with none within reach the\r\n  // glass dissolves without firing.\r\n  let unclaimed = (s) => snakes.free(s), claim = () => { };\r\n  function retarget(q) {\r\n    let best = null, bd = 1e9;\r\n    for (const s of snakes.S) {\r\n      if (!unclaimed(s) || active.some(o => o !== q && o.s === s)) continue;\r\n      if (Math.hypot(s.x - snakes.egg.x, s.z - snakes.egg.z) > 7) continue;\r\n      const d = Math.hypot(s.spine[20].x - q.spot.x, s.spine[20].z - q.spot.z);\r\n      if (d \u003c bd) { bd = d; best = s; }\r\n    }\r\n    if (best) { q.s = best; q.ring = aim_ring(); claim(best); return true; }\r\n    // nothing to cut: it goes, unfired\r\n    q.fired = true; q.t = FORM + CONVERGE + q.dur + OFF + 1e-3;\r\n    retu
