04], H(0.0026)*1.3));\r\n    add('fore' + S, mesh_sdf_g((x, y, z) => forearm(x, y, z, s), [-0.035, -0.27, -0.03, 0.035, 0.03, 0.03], H(0.0022)*1.25));\r\n    add('hand' + S, mesh_sdf_g((x, y, z) => carpals(x, y, z, s), [-0.015, -0.035, -0.03, 0.015, 0.005, 0.03], H(0.0016)));\r\n    add('thigh' + S, mesh_sdf_g((x, y, z) => femur(x, y, z, s), [-0.08, -0.46, -0.05, 0.08, 0.035, 0.05], H(0.003)*1.3));\r\n    add('shin' + S, mesh_sdf_g((x, y, z) => shin(x, y, z, s), [-0.055, -0.42, -0.04, 0.055, 0.005, 0.045], H(0.0027)*1.3));\r\n    add('knee' + S, mesh_sdf_g(patella, [-0.025, -0.01, 0.02, 0.025, 0.045, 0.05], H(0.002)));\r\n    add('foot' + S, mesh_sdf_g((x, y, z) => foot(x, y, z, s), [-0.05, -0.07, -0.08, 0.05, 0.005, 0.17], H(0.0021)));\r\n    // metacarpals (rigid with the hand) and the finger segments (each its own joint)\r\n    add('hand' + S, mesh_sdf_g((x, y, z) => {\r\n      let d = Infinity;\r\n      for (const f of FINGERS) d = Math.min(d, cone(x, y, z, 0, -0.028, f.z*0.8, 0, -0.028 - f.meta, f.z, 0.0058, 0.0052), smin(d, sphere(x, y, z, 0, -0.028 - f.meta, f.z, 0.0064), 0.003));\r\n      // thumb metacarpal, angled out toward the front\r\n      d = Math.min(d, cone(x, y, z, 0, -0.02, 0.022, s*0.012, -0.055, 0.046, 0.0065, 0.0058));\r\n      return d;\r\n    }, [-0.02, -0.1, -0.03, 0.02, -0.01, 0.06], H(0.0016)));\r\n    FINGERS.forEach((f, i) => f.ph.forEach((L, j) => {\r\n      const r = (0.0052 - j*0.0009)*(i === 3 ? 0.85 : 1);\r\n      add(`finger${S}${i}_${j}`, mesh_sdf_g((x, y, z) => smin(cone(x, y, z, 0, 0, 0, 0, -L, 0, r, r*0.82), sphere(x, y, z, 0, -L, 0, r*0.95), 0.002), [-0.009, -L - 0.008, -0.009, 0.009, 0.008, 0.009], H(0.0014)));\r\n    }));\r\n    [0.034, 0.026].forEach((L, j) => {\r\n      const r = 0.006 - j*0.001;\r\n      add(`thumb${S}_${j}`, mesh_sdf_g((x, y, z) => smin(cone(x, y, z, 0, 0, 0, 0, -L, 0, r, r*0.85), sphere(x, y, z, 0, -L, 0, r), 0.002), [-0.01, -L - 0.008, -0.01, 0.01, 0.008, 0.01], H(0.0014)));\r\n    });\r\n  }\r\n  // merge each node's pieces\r\n  const out = {};\r\n  for (const k in G) {\r\n    const gs = G[k].map(g => { const n = g.index ? g : g; if (!n.attributes.uv) n.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(n.attributes.position.count*2), 2)); return n; });\r\n    out[k] = gs.length === 1 ? gs[0] : mergeGeometries(gs, false);\r\n  }\r\n  return out;\r\n}\r\nexport { FINGERS };\r\n","game/snakes.js":"// snakes.js -- the snakes (round 3; owner: \"the ones in the game have the wrong shape ... snake\r\n// 03 feels fine, it's not an issue of species, it's just general shape\"). Astra's snake 03 (a\r\n// mamba-like build): long and slender, one continuous body lying in wide smooth S-curves, the\r\n// neck lifted off the ground in a curve so the narrow, elongated head rides level above it, a\r\n// long thin tail.\r\n//\r\n// Each snake is one tube mesh rebuilt every frame along its head's trail (serpentine\r\n// locomotion: the body follows exactly where the head went). The front of the body rises\r\n// off the ground; the head is part of the same tube, shaped by the radius profile and a\r\n// flatter section. Glossy scales, a paler belly, dark glassy eyes.\r\n//\r\n// Behaviour: they come out of the dark toward the egg (reaching it they shrink away: a\r\n// placeholder). Round 9: set on fire (fire.js) a snake stops where it is, its lifted neck sinks\r\n// as it dies, its scales char black with glowing cracks that cool; then the black corpse sinks\r\n// into the ground in a puff of ash, and another comes.\r\nimport * as THREE from 'three';\r\nimport { make_rng, clamp, smoothstep, lerp } from 'game/util.js';\r\nimport { gi_dynamic } from 'game/gi.js';\r\n\r\nconst LEN = 4.4, R0 = 0.08;                   // body length and body radius, metres (03 build, dream-sized: readable from the room camera)\r\nconst RINGS = 72, SIDES = 12;\r\nconst RAISE = 0.34, RAISE_LEN = 1.1;           // the head rides this high; the neck curve spans this much body\r\n// rings crowd toward the snout (about 14 in the first 20 cm) so the head has a shape\r\nconst S_AT = i => LEN*Math.pow(i/(RINGS - 1), 1.6);\r\nconst I_AT = sl => (RINGS - 1)*Math.pow(sl/LEN, 1/1.6);\r\n\r\n// radius profile along the body, s = 0 at the snout, in body radii; and the section's height\r\nfunction radius_at(s) {\r\n  if (s \u003c 0.012) return lerp(0.18, 0.45, s/0.012);\r\n  if (s \u003c 0.05) return lerp(0.45, 0.82, (s - 0.012)/0.038);\r\n  if (s \u003c 0.085) return lerp(0.82, 0.95, (s - 0.05)/0.035);        // the head's widest, at the jaw\r\n  if (s \u003c 0.115) return lerp(0.95, 0.68, (s - 0.085)/0.03);        // the neck\r\n  if (s \u003c 0.3) return lerp(0.68, 0.98, smoothstep(0.115, 0.3, s));\r\n  const tail0 = LEN*0.62;\r\n  if (s \u003c tail0) return 1.0;\r\n  return lerp(1.0, 0.07, Math.pow((s - tail0)/(LEN - tail0), 0.85));\r\n}\r\n// the corpse sinking: how far below its bed it is, eased\r\nconst SINK_T = 1.5, SINK_D = 0.34;\r\nconst RESPAWN = [2.0, 5.0];                  // seconds in the dark before a gone snake comes back\r\nconst sink_depth = s => (s.sink \u003c 0 ? 0 : SINK_D*smoothstep(0, SINK_T, s.sink));\r\nconst flat_at = s => (s \u003c 0.11 ? 0.62 : lerp(0.62, 0.84, smoothstep(0.11, 0.3, s)));   // head flatter than body\r\n\r\n// scale texture: dark olive-bronze back with overlapping scale rows, pale belly\r\nfunction scale_texture() {\r\n  const W = 64, H = 256;\r\n  const c = document.createElement('canvas'); c.width = W; c.height = H;\r\n  const g = c.getContext('2d');\r\n  const img = g.createImageData(W, H), d = img.data;\r\n  for (let y = 0; y \u003c H; y++) for (let x = 0; x \u003c W; x++) {\r\n    const u = x/W;                                                // around: 0.5 = back, 0/1 = belly\r\n    const back = Math.cos((u - 0.5)*Math.PI*2)*0.5 + 0.5;         // 1 on the back, 0 on the belly\r\n    const row = (y + (Math.floor(x/4) % 2)*2) % 4, col = x % 4;\r\n    const dia = Math.abs(col - 1.5) + Math.abs(row - 1.5);\r\n    let k = dia \u003c 1.4 ? 1.0 : dia \u003c 2.4 ? 0.86 : 0.7;\r\n    const belly = smoothstep(0.35, 0.1, back);\r\n    const top = [60, 56, 44], side = [84, 78, 59], bel = [140, 130, 100];      // dark olive-bronze: a silhouette on the brown floor\r\n    let col3 = back > 0.6 ? top : side;\r\n    col3 = col3.map((v, i) => lerp(v, bel[i], belly));\r\n    if (belly > 0.5) k = (y % 6 === 0) ? 0.78 : 1.0;             // belly plates\r\n    const i = (y*W + x)*4;\r\n    d[i] = col3[0]*k; d[i + 1] = col3[1]*k; d[i + 2] = col3[2]*k; d[i + 3] = 255;\r\n  }\r\n  g.putImageData(img, 0, 0);\r\n  const t = new THREE.CanvasTexture(c);\r\n  t.colorSpace = THREE.SRGBColorSpace;\r\n  t.wrapS = t.wrapT = THREE.RepeatWrapping;\r\n  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;\r\n  return t;\r\n}\r\n\r\nexport function create_snakes(R, cave, get_lich_pos, fire, count = 8, seed = 5) {\r\n  const rng = make_rng(seed);\r\n  const mat = new THREE.MeshStandardMaterial({ map: scale_texture(), roughness: 0.3, metalness: 0.0 });\r\n  if (cave.GU) gi_dynamic(mat, cave.GU);\r\n  // scales are glossy: their edges catch whatever light is around (the bounce light included),\r\n  // which draws the body's outline against the floor\r\n  // burning (round 9): aBurn per vertex = (how charred, how brightly its cracks glow, how much\r\n  // prismatic light shines in it: the beam and the leakage, round 11)\r\n  const uEmber = { value: new THREE.Color(3.2, 0.75, 0.1) }, uSnakeT = { value: 0 };\r\n  {\r\n    const prev = mat.onBeforeCompile;\r\n    mat.onBeforeCompile = (sh, r) => {\r\n      prev(sh, r);\r\n      sh.uniforms.uEmber = uEmber; sh.uniforms.uSnakeT = uSnakeT;\r\n      sh.vertexShader = sh.vertexShader\r\n        .replace('#include \u003ccommon>', `#include \u003ccommon>\r\nattribute vec3 aBurn;\r\nvarying vec3 vBurn;`)\r\n        .replace('#include \u003cbegin_vertex>', `#include \u003cbegin_vertex>\r\n  vBurn = aBurn;`);\r\n      sh.fragmentShader = sh.fragmentShader\r\n        .replace('#include \u003ccommon>', `#include \u003ccommon>\r\nvarying vec3 vBurn;\r\nuniform vec3 uEmber;\r\nuniform float uSnakeT;`)\r\n        .replace('#include \u003cmap_fragment>', `#include \u003cmap_fragment>\r\n  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.02, 0.018, 0.016), vBurn.x);`)\r\n        .replace('#include \u003croughnessmap_fragment>', `#include \u003croughnessmap_fragment>\r\n  roughnessFactor = mix(roughnessFactor, 0.85, vBurn.x);`)\r\n        .replace('#include \u003cemissivemap_fragment>', `#include \u003cemissivemap_fragment>\r\n  {\r\n    // cracks between the charred scales, glowing while the body is hot\r\n    vec2 cu = vMapUv;\r\n    float c1 = abs(sin(cu.y*9.0 + sin(cu.x*18.85)*1.3));\r\n    float c2 = abs(sin(cu.x*12.57 + cu.y*3.1 + sin(cu.y*5.0)));\r\n    float crack = smoothstep(0.24, 0.0, min(c1, c2));\r\n    totalEmissiveRadiance += uEmber*vBurn.y*(0.03 + 0.8*crack);\r\n    // prismatic light inside it (beam, leakage): a shimmer running with a rainbow. Round 18: in\r\n    // the lich's colours (the beam's: smooth spectrum, a little grey, normalised) and dim enough\r\n    // not to roll off to white on screen (it was a white snake beside a rainbow beam)\r\n    vec3 hue = clamp(abs(fract(cu.y*0.35 + cu.x + uSnakeT*0.3 + vec3(0.0, 0.6667, 0.3333))*6.0 - 3.0) - 1.0, 0.0, 1.0);\r\n    hue = mix(hue*hue*(3.0 - 2.0*hue), vec3(0.5), 0.16); hue /= max((hue.r + hue.g + hue.b)/3.0, 0.2);\r\n    totalEmissiveRadiance += mix(vec3(1.0), hue, 0.8)*vBurn.z*vBurn.z*0.8;\r\n  }`)\r\n        .replace('#include \u003clights_fragment_end>', `#include \u003clights_fragment_end>\r\n  {\r\n    float rim = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.6);\r\n    vec3 amb = reflectedLight.indirectDiffuse/max(diffuseColor.rgb, vec3(0.05)) + reflectedLight.directDiffuse/max(diffuseColor.rgb, vec3(0.05));\r\n    reflectedLight.indirectSpecular += rim*amb*0.55*(1.0 - 0.85*vBurn.x);\r\n  }`);\r\n    };\r\n    mat.customProgramCacheKey = () => 'snake_gi_rim_burn';\r\n  }\r\n  const eye_mat = new THREE.MeshStandardMaterial({ color: 0x0b0a08, roughness: 0.08, metalness: 0.0 });\r\n  const eye_geo = new THREE.SphereGeometry(1, 8, 6);\r\n  const egg = cave.egg.position;\r\n  const S = [];\r\n\r\n  // one tube geometry per snake, rewritten each frame\r\n  const make_mesh = () => {\r\n    const n = RINGS*SIDES + 2;\r\n    const g = new THREE.BufferGeometry();\r\n    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3), 3));\r\n    g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(n*3), 3));\r\n    const uv = new Float32Array(n*2);\r\n    for (let i = 0; i \u003c RINGS; i++) for (let j = 0; j \u003c SIDES; j++) { const o = (i*SIDES + j)*2; uv[o] = j/SIDES; uv[o + 1] = S_AT(i)*4; }\r\n    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));\r\n    g.setAttribute('aBurn', new THREE.BufferAttribute(new Float32Array(n*3), 3));\r\n    const idx = [];\r\n    for (let i = 0; i \u003c RINGS - 1; i++) for (let j = 0; j \u003c SIDES; j++) {\r\n      const a = i*SIDES + j, b = i*SIDES + (j + 1)%SIDES, c = (i + 1)*SIDES + (j + 1)%SIDES, d = (i + 1)*SIDES + j;\r\n      idx.push(a, d, c, a, c, b);\r\n    }\r\n    const tip = RINGS*SIDES, end = tip + 1;\r\n    for (let j = 0; j \u003c SIDES; j++) { idx.push(tip, (j + 1)%SIDES, j); idx.push(end, (RINGS - 1)*SIDES + j, (RINGS - 1)*SIDES + (j + 1)%SIDES); }\r\n    g.setIndex(idx);\r\n    const m = new THREE.Mesh(g, mat);\r\n    m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;\r\n    R.world_scene.add(m);\r\n    const eyes = [0, 1].map(() => { const e = new THREE.Mesh(eye_geo, eye_mat); e.castShadow = false; R.world_scene.add(e); return e; });\r\n    const spine = [], radii = new Float32Array(RINGS);\r\n    for (let i = 0; i \u003c RINGS; i++) spine.push(new THREE.Vector3());\r\n    return { m, eyes, spine, radii };\r\n  };\r\n\r\n  const spawn = (s, delay) => {\r\n    let th;\r\n    do th = rng.float(0, Math.PI*2); while (Math.abs(Math.atan2(Math.sin(th + Math.PI/2), Math.cos(th + Math.PI/2))) \u003c 0.5);\r\n    const r = rng.float(14.0, 15.8);\r\n    s.x = Math.cos(th)*r; s.z = Math.sin(th)*r;\r\n    s.dir = Math.atan2(-s.z, -s.x) + rng.spread(0.3);\r\n    s.phase = rng.float(0, 6.28); s.speed = rng.float(1.0, 1.35);\r\n    s.wave = rng.float(0.95, 1.2);                               // wavelength of the S, metres\r\n    s.amp = rng.float(0.55, 0.75);                                // heading swing, radians\r\n    s.trail = [];\r\n    for (let i = 0; i \u003c 400; i++) s.trail.push([s.x - Math.cos(s.dir)*i*0.01, s.z - Math.sin(s.dir)*i*0.01]);\r\n    s.dying = -1; s.delay = delay; s.scale = 1; s.dist = 0;\r\n    s.burn = null; s.sag = 0; s.sink = -1; s.burnt = false;\r\n    s.fx = null; s.leak = 0; s.leak_at = null; s.claim = null;\r\n    s.m.geometry.attributes.aBurn.array.fill(0); s.m.geometry.attributes.aBurn.needsUpdate = true;\r\n  };\r\n  for (let i = 0; i \u003c count; i++) { const s = make_mesh(); spawn(s, i*1.6); S.push(s); }\r\n  // gone (burst, shattered, dissolved, ...): out of sight until it comes back out of the dark\r\n  const respawn = (s) => spawn(s, rng.float(RESPAWN[0], RESPAWN[1]));\r\n  let reached = 0, dissolved = 0;                // tests: dissolved = taken by leakage\r\n  const reach_log = [];               // tests: what each one that got through was doing\r\n\r\n  const P = [], T = new THREE.Vector3(), Nn = new THREE.Vector3(), Bn = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);\r\n  const RK = new Float32Array(RINGS), GL = new Float32Array(RINGS), SH = [0, 0, 0];\r\n  for (let i = 0; i \u003c RINGS; i++) P.push(new THREE.Vector3());\r\n\r\n  function update(t, dt) {\r\n    uSnakeT.value = t;\r\n    for (const s of S) {\r\n      if (s.delay > 0) { s.delay -= dt; s.m.visible = false; s.eyes.forEach(e => (e.visible = false)); continue; }\r\n      const hide = !!(s.fx && s.fx.hide);\r\n      s.m.visible = !hide; s.eyes.forEach(e => (e.visible = !hide));\r\n      if (s.sink >= 0) {\r\n        // the black corpse goes into the ground\r\n        s.sink += dt;\r\n        if (s.sink > SINK_T) { respawn(s); continue; }\r\n      } else if (s.burn) {\r\n        // on fire: it stops where it is; its neck sinks to the ground as it dies\r\n        s.sag = Math.min(1, s.sag + dt/1.6);\r\n        if (s.burn.done) { s.burn = null; s.burnt = true; s.sink = 0; build(s); fire.ash(s.spine, RINGS); }\r\n      } else if (s.dying >= 0) {\r\n        s.dying += dt;\r\n        s.scale = clamp(1 - s.dying/0.5, 0, 1);\r\n        if (s.dying > 0.5) respawn(s);\r\n      } else if (s.fx) {\r\n        // another power has it (lifted, blown, cut, pierced): that power moves it\r\n        const r = s.fx.tick ? s.fx.tick(dt, s) : undefined;\r\n        if (r === 'done') { respawn(s); continue; }\r\n        if (r === 'free') s.fx = null;\r\n      } else {\r\n        // serpentine: steer at the egg, swinging the heading so the path is a steady S; a\r\n        // dissolving snake (leakage) slows as it goes\r\n        const sp = s.speed*(1 - 0.85*smoothstep(0, 0.8, s.leak));\r\n        s.dist += sp*dt;\r\n        const want = Math.atan2(egg.z - s.z, egg.x - s.x) + Math.sin(s.dist/s.wave*Math.PI*2 + s.phase)*s.amp;\r\n        let d = want - s.dir; d = Math.atan2(Math.sin(d), Math.cos(d));\r\n        s.dir += clamp(d, -5*dt, 5*dt);\r\n        s.x += Math.cos(s.dir)*sp*dt; s.z += Math.sin(s.dir)*sp*dt;\r\n        const last = s.trail[0];\r\n        if (Math.hypot(s.x - last[0], s.z - last[1]) > 0.01) s.trail.unshift([s.x, s.z]);\r\n        if (s.trail.length > 600) s.trail.length = 600;\r\n        if (Math.hypot(s.x - egg.x, s.z - egg.z) \u003c 1.1) { s.dying = 0; reached++; reach_log.push({ t: +t.toFixed(2), claim: s.claim, until: s.claim_until, leak: +s.leak.toFixed(2), speed: s.speed }); }   // it reached the egg (placeholder: it shrinks away)\r\n      }\r\n      if (s.leak >= 1.12 && !s.burn && s.sink \u003c 0) { dissolved++; if (api.on_dissolve) api.on_dissolve(s); respawn(s); continue; }   // dissolved into nothing\r\n      build(s);\r\n    }\r\n  }\r\n\r\n  // the spine: points along the trail by arc length, the front raised into a neck curve\r\n  function build(s) {\r\n    let acc = 0, ti = 0;\r\n    const sc = s.scale, fx = s.fx;\r\n    // per ring: radius factor (cuts, dissolving, swelling) and prismatic glow.\r\n    // Leakage (round 25, owner: \"the snakes disappear from outwards inwards and that looks wrong,\r\n    // need to be reversed\"; it went tail first, the far end first): it goes from the part of it\r\n    // nearest him (s.leak_at, set by leak.js) outward both ways along the body. Ahead of the edge\r\n    // the flesh turns glassy and prismatic, like his bones, a band that the edge eats into.\r\n    const f = s.leak*1.12;\r\n    const ac = S_AT(s.leak_at ?? 0), ext = Math.max(ac, LEN - ac, 0.5);\r\n    for (let i = 0; i \u003c RINGS; i++) {\r\n      const u = Math.abs(S_AT(i) - ac)/ext;                        // 0 nearest him, 1 at the far end\r\n      RK[i] = s.leak > 0 ? smoothstep(f, f + 0.1, u) : 1;\r\n      GL[i] = s.leak > 0 ? Math.min(1, 0.62*Math.exp(-(((u - f)/0.04)**2)) + 0.4*(1 - smoothstep(f, f + 0.12, u))*Math.min(1, s.leak*4)) : 0;\r\n      if (fx) { if (fx.radk) RK[i] *= fx.radk(i); if (fx.glow) GL[i] = Math.max(GL[i], fx.glow(i)); }\r\n    }\r\n    for (let i = 0; i \u003c RINGS; i++) {\r\n      const target = S_AT(i);\r\n      let x = s.trail[s.trail.length - 1][0], z = s.trail[s.trail.length - 1][1];\r\n      while (ti \u003c s.trail.length - 1) {\r\n        const a = s.trail[ti], b = s.trail[ti + 1];\r\n        const l = Math.hypot(b[0] - a[0], b[1] - a[1]);\r\n        if (acc + l >= target) { const f = (target - acc)/(l || 1); x = a[0] + (b[0] - a[0])*f; z = a[1] + (b[1] - a[1])*f; break; }\r\n        acc += l; ti++;\r\n      }\r\n      const r = R0*radius_at(target)*sc*RK[i];\r\n      // the neck lifts the head: a smooth rise over the front RAISE_LEN metres (it sinks as a\r\n      // burning snake dies); a sinking corpse goes down through the floor; other powers lift\r\n      // and shift it\r\n      let lift = RAISE*smoothstep(RAISE_LEN, 0.05, target)*sc*(1 - smoothstep(0, 1, s.sag));\r\n      SH[0] = SH[1] = SH[2] = 0;\r\n      if (fx) { if (fx.sag !== undefined) lift *= 1 - fx.sag; if (fx.lift) lift += fx.lift(i); if (fx.shift) fx.shift(i, SH); }\r\n      P[i].set(x + SH[0], cave.ground_y(x, z) + R0*radius_at(target)*sc*flat_at(target) + lift + SH[1] - sink_depth(s), z + SH[2]);\r\n      if (fx && fx.place) fx.place(i, P[i]);                    // round 25: a body the fx moves itself (knocked by a rock)\r\n      s.spine[i].copy(P[i]); s.radii[i] = r;\r\n    }\r\n    // how burnt each ring is, how its cracks glow, how it glows with prismatic light\r\n    const glowing = s.leak > 0 || (fx && fx.glow);\r\n    const charred = s.burn || s.burnt || (fx && fx.char);\r\n    if (charred || glowing || s.fxw) {\r\n      const ab = s.m.geometry.attributes.aBurn, a = ab.array;\r\n      for (let i = 0; i \u003c RINGS; i++) {\r\n        let c = s.burn ? fire.char(s.burn, i) : s.burnt ? 1 : 0, e = s.burn ? fire.ember(s.burn, i) : 0;\r\n        if (fx && fx.char) { c = Math.max(c, fx.char(i)); e = Math.max(e, fx.ember ? fx.ember(i) : 0); }\r\n        for (let j = 0; j \u003c SIDES; j++) { const o = (i*SIDES + j)*3; a[o] = c; a[o + 1] = e; a[o + 2] = GL[i]; }\r\n      }\r\n      const tip = RINGS*SIDES*3, last = (RINGS - 1)*SIDES*3;\r\n      for (let k = 0; k \u003c 3; k++) { a[tip + k] = a[k]; a[tip + 3 + k] = a[last + k]; }\r\n      ab.needsUpdate = true;\r\n      s.fxw = charred || glowing;                                // wrote something: clear it once the effect ends\r\n    }\r\n    const pos = s.m.geometry.attributes.position.array, nor = s.m.geometry.attributes.normal.array;\r\n    for (let i = 0; i \u003c RINGS; i++) {\r\n      const a = P[Math.max(0, i - 1)], b = P[Math.min(RINGS - 1, i + 1)];\r\n      T.subVectors(a, b).normalize();                             // pointing toward the head\r\n      Bn.crossVectors(T, UP).normalize();                         // sideways\r\n      Nn.crossVectors(Bn, T).normalize();                         // up, square to the body\r\n      const target = S_AT(i);\r\n      const r = R0*radius_at(target)*sc*RK[i], fl = flat_at(target);\r\n      for (let j = 0; j \u003c SIDES; j++) {\r\n        const ang = j/SIDES*Math.PI*2;                            // 0 = belly, pi = back\r\n        const cx = Math.sin(ang), cy = -Math.cos(ang);\r\n        const fy = cy \u003c 0 ? fl*0.8 : fl;                          // a flatter belly\r\n        const o = (i*SIDES + j)*3;\r\n        pos[o] = P[i].x + Bn.x*cx*r + Nn.x*cy*r*fy;\r\n        pos[o + 1] = P[i].y + Bn.y*cx*r + Nn.y*cy*r*fy;\r\n        pos[o + 2] = P[i].z + Bn.z*cx*r + Nn.z*cy*r*fy;\r\n        const nx = Bn.x*cx + Nn.x*cy/fy, ny = Bn.y*cx + Nn.y*cy/fy, nz = Bn.z*cx + Nn.z*cy/fy;\r\n        const l = Math.hypot(nx, ny, nz) || 1;\r\n        nor[o] = nx/l; nor[o + 1] = ny/l; nor[o + 2] = nz/l;\r\n      }\r\n    }\r\n    // snout tip and tail tip\r\n    const tip = RINGS*SIDES*3, end = tip + 3;\r\n    T.subVectors(P[0], P[1]).normalize();\r\n    const tr = R0*0.25*sc*RK[0];\r\n    pos[tip] = P[0].x + T.x*tr; pos[tip + 1] = P[0].y + T.y*tr; pos[tip + 2] = P[0].z + T.z*tr;\r\n    nor[tip] = T.x; nor[tip + 1] = T.y; nor[tip + 2] = T.z;\r\n    pos[end] = P[RINGS - 1].x; pos[end + 1] = P[RINGS - 1].y; pos[end + 2] = P[RINGS - 1].z;\r\n    nor[end] = -T.x; nor[end + 1] = 0; nor[end + 2] = -T.z;\r\n    s.m.geometry.attributes.position.needsUpdate = true;\r\n    s.m.geometry.attributes.normal.needsUpdate = true;\r\n    // eyes: on the sides of the head, a little up, near the front of the widest part\r\n    const ei = Math.round(I_AT(0.055));\r\n    const a = P[Math.max(0, ei - 1)], b = P[ei + 1];\r\n    T.subVectors(a, b).normalize(); Bn.crossVectors(T, UP).normalize(); Nn.crossVectors(Bn, T).normalize();\r\n    const rr = R0*radius_at(0.055)*sc*RK[ei];\r\n    s.eyes.forEach((e, k) => {\r\n      const side = k ? 1 : -1;\r\n      e.position.copy(P[ei]).addScaledVector(Bn, side*rr*0.8).addScaledVector(Nn, rr*0.18);   // set into the side of the head\r\n      e.scale.setScalar(R0*0.12*sc*RK[ei]);\r\n    });\r\n  }\r\n  // set one on fire (the lich's attack): it stops, and burns from a point along its body\r\n  function ignite(s, at = Math.round(RINGS*rng.float(0.15, 0.75))) {\r\n    if (!free(s)) return false;\r\n    at = Math.max(0, Math.min(RINGS - 1, at));\r\n    s.burn = fire.start(RINGS, s.spine, s.radii, at);\r\n    return true;\r\n  }\r\n  // give it to another power (lift, wind, beam, lens): `fx` drives it from now on (see build())\r\n  function take(s, fx) { if (!free(s)) return false; s.fx = fx; return true; }\r\n  // out of the dark and crawling (a dissolving one still counts)\r\n  const free = s => s.delay \u003c= 0 && s.dying \u003c 0 && !s.burn && s.sink \u003c 0 && !s.fx;\r\n  const live = () => S.filter(free);\r\n  function set_ember(c) { uEmber.value.setRGB(c[0], c[1], c[2]); }\r\n  const api = { update, S, ignite, LEN, take, live, free, set_ember, respawn, RINGS, SIDES, mat, egg, reach_log, arc: S_AT, ring_at: I_AT, get reached() { return reached; }, get dissolved() { return dissolved; },\r\n    on_dissolve: null };            // round 23: leak.js puffs its last smoke here\r\n  return api;\r\n}\r\n","game/soft_shadows.js":"// soft_shadows.js -- sun shadows whose softness grows with the distance to what casts them\n// (percentage-closer soft shadows), replacing three.js's PCF shadow filter.\n//\n// Owner, round 3: the light should come from further above, and \"the edges of the light circle\n// ... more soft\". The sun is a disc about half a degree across, so a shadow edge blurs by\n// (distance to the caster) x (the sun's angular size): the rim of a shaft 40 m up blurs the\n// pool's edge over tens of centimetres while a rock beside the pool stays crisp. For each\n// point: search the shadow map around it for casters, average their depth, turn the gap into a\n// penumbra width, then filter over that width. The shadow map is orthographic, so its depth is\n// linear: metres = depth x (far - near).\n//\n// Call install_soft_shadows(params) BEFORE any material compiles; the renderer must use\n// THREE.PCFShadowMap (this replaces that branch).\nimport * as THREE from 'three';\n\nexport const SOFT = { depth_range: 89, texel_m: 0.034, sun_angle: 0.0093, max_texels: 22 };\n\nexport function install_soft_shadows(p = {}) {\n  Object.assign(SOFT, p);\n  const chunk = THREE.ShaderChunk.shadowmap_pars_fragment;\n  const start = chunk.indexOf('#if defined( SHADOWMAP_TYPE_PCF )');\n  const end = chunk.indexOf('#elif defined( SHADOWMAP_TYPE_PCF_SOFT )');\n  if (start \u003c 0 || end \u003c 0) throw new Error('soft_shadows: shadow chunk changed shape');\n  const f = v => (Number.isInteger(v) ? v.toFixed(1) : String(v));\n  const pcss = `#if defined( SHADOWMAP_TYPE_PCF )\n\t\t\t// lich-survivors: percentage-closer soft shadows (soft_shadows.js)\n\t\t\tvec2 texel = vec2( 1.0 ) / shadowMapSize;\n\t\t\tfloat zr = shadowCoord.z;\n\t\t\tfloat bsum = 0.0, bn = 0.0;\n\t\t\tfor ( int i = 0; i \u003c 16; i ++ ) {\n\t\t\t\tfloat fi = float( i );\n\t\t\t\tfloat r = sqrt( ( fi + 0.5 ) / 16.0 ) * ${f(SOFT.max_texels)};\n\t\t\t\tvec2 o = vec2( cos( fi*2.39996 ), sin( fi*2.39996 ) )*r*texel;\n\t\t\t\tfloat bz = unpackRGBAToDepth( texture2D( shadowMap, shadowCoord.xy + o ) );\n\t\t\t\tif ( bz \u003c zr ) { bsum += bz; bn += 1.0; }\n\t\t\t}\n\t\t\tif ( bn \u003c 0.5 ) {\n\t\t\t\tshadow = 1.0;\n\t\t\t} else {\n\t\t\t\tfloat gap = ( zr - bsum/bn )*${f(SOFT.depth_range)};\n\t\t\t\tfloat pen = clamp( gap*${f(SOFT.sun_angle)}/${f(SOFT.texel_m)}*0.5, 0.75, ${f(SOFT.max_texels)} );\n\t\t\t\tfloat rot = fract( 52.9829189*fract( dot( gl_FragCoord.xy, vec2( 0.06711056, 0.00583715 ) ) ) )*6.2831853;\n\t\t\t\tfloat lit = 0.0;\n\t\t\t\tfor ( int i = 0; i \u003c 24; i ++ ) {\n\t\t\t\t\tfloat fi = float( i );\n\t\t\t\t\tfloat r = sqrt( ( fi + 0.5 ) / 24.0 )*pen;\n\t\t\t\t\tfloat a = fi*2.39996 + rot;\n\t\t\t\t\tlit += texture2DCompare( shadowMap, shadowCoord.xy + vec2( cos( a ), sin( a ) )*r*texel, zr );\n\t\t\t\t}\n\t\t\t\tshadow = lit/24.0;\n\t\t\t}\n\t\t`;\n  THREE.ShaderChunk.shadowmap_pars_fragment = chunk.slice(0, start) + pcss + chunk.slice(end);\n}\n","game/textures.js":"// textures.js -- every texture is generated here (canvas), no files.\r\n//\r\n// TEXEL DENSITY RULE (Sun Court, retro-shooter/STYLE.md): world surfaces use 32 texels per metre,\r\n// world-space UVs (cave.js projects every face onto its dominant axis), NearestMipmapNearest.\r\n// Tones are quantized into a few flat steps so surfaces read as painted pixels, never noise.\r\n//\r\n// Palette: the It Follows egg cover (/artifacts, it-follows-3.jpg) -- near-black cool rock,\r\n// brown-grey slabs whose edges catch warm bronze, a cream-yellow pool of light, a pale egg,\r\n// dark bronze snakes.\r\nimport * as THREE from 'three';\r\n\r\nexport const TEXELS_PER_METER = 32;\r\n\r\nexport function finish(canvas, { srgb = true, repeat = true, mips = true } = {}) {\r\n  const t = new THREE.CanvasTexture(canvas);\r\n  t.magFilter = THREE.NearestFilter;\r\n  t.minFilter = mips ? THREE.NearestMipmapNearestFilter : THREE.NearestFilter;\r\n  t.generateMipmaps = mips;\r\n  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;\r\n  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;\r\n  t.anisotropy = 1;\r\n  t.needsUpdate = true;\r\n  return t;\r\n}\r\n\r\nfunction painter(w, h) {\r\n  const c = document.createElement('canvas');\r\n  c.width = w; c.height = h;\r\n  const g = c.getContext('2d');\r\n  const img = g.createImageData(w, h);\r\n  const d = img.data;\r\n  const cl = v => (v \u003c 0 ? 0 : v > 255 ? 255 : v | 0);\r\n  return {\r\n    w, h,\r\n    set(x, y, rgb) {\r\n      x = ((x % w) + w) % w; y = ((y % h) + h) % h;\r\n      const i = (y*w + x)*4;\r\n      d[i] = cl(rgb[0]); d[i + 1] = cl(rgb[1]); d[i + 2] = cl(rgb[2]); d[i + 3] = 255;\r\n    },\r\n    get(x, y) {\r\n      x = ((x % w) + w) % w; y = ((y % h) + h) % h;\r\n      const i = (y*w + x)*4;\r\n      return [d[i], d[i + 1], d[i + 2]];\r\n    },\r\n    done(opts) { g.putImageData(img, 0, 0); return finish(c, opts); },\r\n  };\r\n}\r\n\r\nconst mix = (a, b, t) => [a[0] + (b[0] - a[0])*t, a[1] + (b[1] - a[1])*t, a[2] + (b[2] - a[2])*t];\r\nconst mul = (a, k) => [a[0]*k, a[1]*k, a[2]*k];\r\n\r\nfunction lattice_hash(ix, iy, seed) {\r\n  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 1442695041);\r\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\r\n  h ^= h >>> 16;\r\n  return (h >>> 0)/4294967296;\r\n}\r\nfunction vnoise(x, y, px, py, seed) {\r\n  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;\r\n  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy);\r\n  const m = (a, p) => ((a % p) + p) % p;\r\n  const a = lattice_hash(m(ix, px), m(iy, py), seed), b = lattice_hash(m(ix + 1, px), m(iy, py), seed);\r\n  const c = lattice_hash(m(ix, px), m(iy + 1, py), seed), d = lattice_hash(m(ix + 1, px), m(iy + 1, py), seed);\r\n  return (a + (b - a)*u) + ((c + (d - c)*u) - (a + (b - a)*u))*v;\r\n}\r\n// tileable fbm over a w x h texture; cells = lattice cells across the width at octave 0\r\nfunction fbm(x, y, w, h, cells, seed, oct = 3) {\r\n  let s = 0, amp = 1, tot = 0, f = 1;\r\n  for (let o = 0; o \u003c oct; o++) {\r\n    const cx = cells*f, cy = Math.max(1, Math.round(cells*f*h/w));\r\n    s += amp*vnoise(x/w*cx, y/h*cy, cx, cy, seed + o*101);\r\n    tot += amp; amp *= 0.5; f *= 2;\r\n  }\r\n  return s/tot;\r\n}\r\n// tileable cellular (nearest point) noise: returns [d1, d2, cell id]\r\nfunction cells2(x, y, w, h, n, seed) {\r\n  const gx = x/w*n, gy = y/h*n;\r\n  const ix = Math.floor(gx), iy = Math.floor(gy);\r\n  let d1 = 9, d2 = 9, id = 0;\r\n  for (let j = -1; j \u003c= 1; j++) for (let i = -1; i \u003c= 1; i++) {\r\n    const cx = ix + i, cy = iy + j;\r\n    const wx = ((cx % n) + n) % n, wy = ((cy % n) + n) % n;\r\n    const px = cx + lattice_hash(wx, wy, seed), py = cy + lattice_hash(wx, wy, seed + 7);\r\n    const d = Math.hypot(gx - px, gy - py);\r\n    if (d \u003c d1) { d2 = d1; d1 = d; id = lattice_hash(wx, wy, seed + 13); } else if (d \u003c d2) d2 = d;\r\n  }\r\n  return [d1, d2, id];\r\n}\r\n\r\nexport const PAL = {\r\n  // albedo of real cave rock (the darkness comes from the light, round 2): ~0.12-0.35 linear\r\n  rock_hi: [168, 150, 126], rock: [136, 121, 103], rock_mid: [114, 102, 89], rock_lo: [90, 81, 72], rock_deep: [64, 58, 53],\r\n  bronze: [186, 146, 96],\r\n  floor_hi: [164, 142, 110], floor: [132, 114, 90], floor_lo: [104, 90, 74], floor_deep: [76, 67, 57],\r\n  egg_hi: [196, 186, 164], egg: [180, 168, 144], egg_lo: [156, 144, 118], egg_spot: [112, 94, 72],\r\n  bone: [236, 228, 212],\r\n  scale_hi: [104, 84, 56], scale: [62, 50, 36], scale_lo: [38, 31, 24], scale_belly: [120, 100, 70],\r\n};\r\n\r\n// Rock: broad chipped facets (cellular patches), each a flat tone, a pale chip edge where two\r\n// patches meet on the lit side -- the cover's palette-knife slabs, at 32 texels/m.\r\nexport function rock(seed = 11, S = 64) {\r\n  const P = painter(S, S);\r\n  const tones = [PAL.rock_deep, PAL.rock_lo, PAL.rock_mid, PAL.rock, PAL.rock_hi];\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const [d1, d2, id] = cells2(x + 0.5, y + 0.5, S, S, 5, seed);\r\n    const n = fbm(x, y, S, S, 4, seed + 3, 2);\r\n    let k = Math.floor(id*3.2 + n*1.6);               // 0..4 flat tone per patch\r\n    k = Math.max(0, Math.min(4, k));\r\n    let c = tones[k];\r\n    const edge = d2 - d1;\r\n    if (edge \u003c 0.07) c = tones[Math.max(0, k - 2)];    // dark crack between facets\r\n    else if (edge \u003c 0.13 && ((x + y) & 1) === 0 && id > 0.55) c = mix(tones[Math.min(4, k + 1)], PAL.bronze, 0.25);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n\r\n// Floor: packed grit and flat stones, darker, one or two tones per stone, gritty speckle.\r\nexport function floor(seed = 21, S = 64) {\r\n  const P = painter(S, S);\r\n  const tones = [PAL.floor_deep, PAL.floor_lo, PAL.floor, PAL.floor_hi];\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const [d1, d2, id] = cells2(x + 0.5, y + 0.5, S, S, 8, seed);\r\n    const n = fbm(x, y, S, S, 6, seed + 5, 3);\r\n    let k = Math.floor(n*2.4 + id*1.4);\r\n    k = Math.max(0, Math.min(3, k));\r\n    let c = tones[k];\r\n    if (d2 - d1 \u003c 0.08) c = PAL.floor_deep;\r\n    const grit = lattice_hash(x, y, seed + 99);\r\n    if (grit > 0.93) c = tones[Math.min(3, k + 1)];\r\n    else if (grit \u003c 0.06) c = PAL.floor_deep;\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n\r\n// Egg shell: pale cream, a few sparse brown speckles, slightly cooler toward one pole.\r\nexport function egg_shell(seed = 31, S = 64) {\r\n  const P = painter(S, S);\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const n = fbm(x, y, S, S, 4, seed, 2);\r\n    let c = n > 0.62 ? PAL.egg_hi : n \u003c 0.4 ? PAL.egg_lo : PAL.egg;\r\n    const h = lattice_hash(x, y, seed + 17);\r\n    if (h > 0.985) c = PAL.egg_spot;\r\n    else if (h > 0.97) c = mix(PAL.egg_lo, PAL.egg_spot, 0.4);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done({ repeat: true });\r\n}\r\n\r\n// Snake: overlapping diamond scales along the body (u = around, v = along), a paler belly band,\r\n// dark seams. The texture wraps around one body segment.\r\nexport function scales(seed = 41, W = 32, H = 16) {\r\n  const P = painter(W, H);\r\n  for (let y = 0; y \u003c H; y++) for (let x = 0; x \u003c W; x++) {\r\n    const u = x/W, v = y/H;\r\n    const sx = (x + (Math.floor(y/4) % 2)*2) % 4, sy = y % 4;\r\n    const dia = Math.abs(sx - 1.5) + Math.abs(sy - 1.5);\r\n    let c = dia \u003c 1.2 ? PAL.scale_hi : dia \u003c 2.2 ? PAL.scale : PAL.scale_lo;\r\n    const belly = Math.abs(u - 0.75) \u003c 0.12;\r\n    if (belly) c = (y % 3 === 0) ? PAL.scale_lo : PAL.scale_belly;\r\n    if (lattice_hash(x, y, seed) > 0.9 && !belly) c = mul(c, 0.8);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n","game/util.js":"// util.js -- seeded rng, math helpers, springs, and the collision / raycast geometry that\r\n// player, enemy and weapon all share. Pure functions over plain numbers; no three.js here.\r\n//\r\n// COLLIDER FORMAT (what room.js exports as room.colliders):\r\n//   { x0, y0, z0, x1, y1, z1 }                  solid axis-aligned box, x0\u003cx1 etc (use box())\r\n//   { ..., ramp: '+x'|'-x'|'+z'|'-z' }           wedge inside that box whose top rises from y0 at\r\n//                                                 the low edge to y1 at the edge named by `ramp`\r\n//                                                 (use ramp()); walkable, blocks from the sides\r\n//   optional flags: no_ray (bullets pass), no_walk (bodies pass), no_floor (never chosen as a\r\n//                   spawn/teleport floor or nav surface: lids, clip ceilings), color (hex, used for\r\n//                   impact debris), tag (any string)\r\n// Bodies (player, enemy) are vertical capsules: feet at y, radius r, height h.\r\n\r\nexport const DT = 1 / 60;\r\nexport const DEG = Math.PI / 180;\r\n\r\n// ---------------------------------------------------------------- rng\r\nfunction splitmix(seed) {\r\n  let s = seed >>> 0;\r\n  return () => {\r\n    s = (s + 0x9e3779b9) >>> 0;\r\n    let z = s;\r\n    z = Math.imul(z ^ (z >>> 16), 0x85ebca6b);\r\n    z = Math.imul(z ^ (z >>> 13), 0xc2b2ae35);\r\n    return (z ^ (z >>> 16)) >>> 0;\r\n  };\r\n}\r\n\r\nexport function hash_str(str) {\r\n  let h = 2166136261 >>> 0;\r\n  for (let i = 0; i \u003c str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);\r\n  return h >>> 0;\r\n}\r\n\r\n// sfc32 seeded through splitmix32. rng.next() in [0,1).\r\nexport function make_rng(seed = 1) {\r\n  const sm = splitmix(seed);\r\n  let a = sm(), b = sm(), c = sm(), d = sm();\r\n  const next = () => {\r\n    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;\r\n    let t = (a + b) | 0;\r\n    a = b ^ (b >>> 9);\r\n    b = (c + (c \u003c\u003c 3)) | 0;\r\n    c = (c \u003c\u003c 21) | (c >>> 11);\r\n    d = (d + 1) | 0;\r\n    t = (t + d) | 0;\r\n    c = (c + t) | 0;\r\n    return (t >>> 0) / 4294967296;\r\n  };\r\n  for (let i = 0; i \u003c 12; i++) next();\r\n  const rng = {\r\n    seed,\r\n    next,\r\n    float: (lo = 0, hi = 1) => lo + (hi - lo)*next(),\r\n    int: (lo, hi) => lo + Math.floor(next()*(hi - lo + 1)),     // inclusive\r\n    chance: p => next() \u003c p,\r\n    sign: () => (next() \u003c 0.5 ? -1 : 1),\r\n    pick: arr => arr[Math.floor(next()*arr.length)],\r\n    spread: s => (next()*2 - 1)*s,                                // symmetric in [-s, s]\r\n    // a new independent stream derived from this seed + a tag\r\n    fork: tag => make_rng((seed ^ hash_str(String(tag))) >>> 0),\r\n  };\r\n  return rng;\r\n}\r\n\r\n// ---------------------------------------------------------------- math\r\nexport const clamp = (x, a, b) => (x \u003c a ? a : x > b ? b : x);\r\nexport const lerp = (a, b, t) => a + (b - a)*t;\r\nexport const inv_lerp = (a, b, x) => (x - a)/(b - a);\r\nexport const remap = (x, a, b, c, d) => c + (d - c)*clamp((x - a)/(b - a), 0, 1);\r\nexport const smoothstep = (a, b, x) => { const t = clamp((x - a)/(b - a), 0, 1); return t*t*(3 - 2*t); };\r\nexport const approach = (x, target, step) => (x \u003c target ? Math.min(x + step, target) : Math.max(x - step, target));\r\n// frame-rate independent exponential smoothing: rate = 1/time-constant\r\nexport const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate*dt));\r\nexport const ease_out_cubic = t => 1 - Math.pow(1 - t, 3);\r\nexport const ease_in_cubic = t => t*t*t;\r\nexport const ease_out_back = (t, k = 1.7) => 1 + (k + 1)*Math.pow(t - 1, 3) + k*Math.pow(t - 1, 2);\r\nexport const wrap_deg = a => { a = (a + 180) % 360; if (a \u003c 0) a += 360; return a - 180; };\r\nexport const len2 = (x, z) => Math.sqrt(x*x + z*z);\r\nexport const len3 = (x, y, z) => Math.sqrt(x*x + y*y + z*z);\r\n\r\n// compass heading convention used by the whole game and the GAME API:\r\n// yaw 0 looks at -z, yaw 90 looks at +x. pitch > 0 looks up.\r\nexport const yaw_to = (x0, z0, x1, z1) => Math.atan2(x1 - x0, -(z1 - z0))/DEG;\r\nexport const forward_of = (yaw_deg, pitch_deg = 0) => {\r\n  const y = yaw_deg*DEG, p = pitch_deg*DEG, cp = Math.cos(p);\r\n  return [Math.sin(y)*cp, Math.sin(p), -Math.cos(y)*cp];\r\n};\r\n\r\n// damped spring (semi-implicit Euler, stable at 60 Hz for freq up to ~40 rad/s)\r\n// s = {x, v}; omega = angular frequency (rad/s), zeta = damping ratio (1 = critical)\r\nexport function spring(s, target, omega, zeta, dt) {\r\n  const a = -2*zeta*omega*s.v - omega*omega*(s.x - target);\r\n  s.v += a*dt;\r\n  s.x += s.v*dt;\r\n  return s.x;\r\n}\r\nexport const make_spring = (x = 0) => ({ x, v: 0 });\r\n\r\n// smooth 1D value noise in [-1, 1], deterministic\r\nexport function noise1(x, seed = 0) {\r\n  const i = Math.floor(x), f = x - i;\r\n  const h = n => {\r\n    let v = Math.imul((n + seed*7919) | 0, 0x27d4eb2d);\r\n    v ^= v >>> 15; v = Math.imul(v, 0x85ebca6b); v ^= v >>> 13;\r\n    return ((v >>> 0)/4294967296)*2 - 1;\r\n  };\r\n  const u = f*f*(3 - 2*f);\r\n  return lerp(h(i), h(i + 1), u);\r\n}\r\n\r\n// ---------------------------------------------------------------- colliders\r\nexport function box(x0, y0, z0, x1, y1, z1, extra) {\r\n  const c = {\r\n    x0: Math.min(x0, x1), y0: Math.min(y0, y1), z0: Math.min(z0, z1),\r\n    x1: Math.max(x0, x1), y1: Math.max(y0, y1), z1: Math.max(z0, z1),\r\n  };\r\n  return extra ? Object.assign(c, extra) : c;\r\n}\r\n\r\n// wedge: rises from y0 at the low edge to y1 at the side named by dir\r\nexport function ramp(x0, y0, z0, x1, y1, z1, dir, extra) {\r\n  const c = box(x0, y0, z0, x1, y1, z1, extra);\r\n  c.ramp = dir;\r\n  c.H = c.y1 - c.y0;\r\n  c.gx = 0; c.gz = 0; c.ax = 0; c.az = 0;\r\n  if (dir === '+x') { c.gx = 1/(c.x1 - c.x0); c.ax = c.x0; }\r\n  else if (dir === '-x') { c.gx = -1/(c.x1 - c.x0); c.ax = c.x1; }\r\n  else if (dir === '+z') { c.gz = 1/(c.z1 - c.z0); c.az = c.z0; }\r\n  else if (dir === '-z') { c.gz = -1/(c.z1 - c.z0); c.az = c.z1; }\r\n  else throw new Error('ramp dir must be +x -x +z -z');\r\n  return c;\r\n}\r\n\r\n// top surface height of a collider at (x, z) (clamped into its footprint)\r\nexport function surface_y(c, x, z) {\r\n  if (!c.ramp) return c.y1;\r\n  const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n  const u = clamp(c.gx*(px - c.ax) + c.gz*(pz - c.az), 0, 1);\r\n  return c.y0 + c.H*u;\r\n}\r\n\r\n// does a circle (x, z, r) overlap the collider's footprint (strictly)?\r\nexport function circle_hits(c, x, z, r) {\r\n  const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n  const dx = x - px, dz = z - pz;\r\n  return dx*dx + dz*dz \u003c r*r;\r\n}\r\n\r\nexport function point_inside(c, x, y, z) {\r\n  if (x \u003c= c.x0 || x >= c.x1 || z \u003c= c.z0 || z >= c.z1 || y \u003c= c.y0) return false;\r\n  return y \u003c surface_y(c, x, z);\r\n}\r\n\r\n// highest walkable surface under a circle, not above max_y. -Infinity when nothing.\r\nexport function ground_at(cols, x, z, r, max_y = Infinity) {\r\n  let g = -Infinity;\r\n  for (const c of cols) {\r\n    if (c.no_walk || !circle_hits(c, x, z, r)) continue;\r\n    const top = surface_y(c, x, z);\r\n    if (top \u003c= max_y && top > g) g = top;\r\n  }\r\n  return g;\r\n}\r\n\r\n// floor under a point for teleports / spawns: the highest surface with headroom h above it\r\nexport function resolve_floor_y(cols, x, z, h = 1.8, r = 0.05) {\r\n  const tops = [];\r\n  for (const c of cols) if (!c.no_walk && !c.no_floor && circle_hits(c, x, z, r)) tops.push(surface_y(c, x, z));\r\n  tops.sort((a, b) => b - a);\r\n  for (const top of tops) {\r\n    let clear = true;\r\n    for (const c of cols) {\r\n      if (c.no_walk || !circle_hits(c, x, z, r)) continue;\r\n      if (c.y0 \u003c top + h - 0.01 && surface_y(c, x, z) > top + 0.01) { clear = false; break; }\r\n    }\r\n    if (clear) return top;\r\n  }\r\n  return tops.length ? tops[tops.length - 1] : 0;\r\n}\r\n\r\nfunction headroom_ok(cols, x, z, r, y_new, h, y_now) {\r\n  for (const c of cols) {\r\n    if (c.no_walk) continue;\r\n    if (c.y0 \u003c y_new + h && c.y0 >= y_now + h - 0.02 && circle_hits(c, x, z, r - 0.01)) return false;\r\n  }\r\n  return true;\r\n}\r\n\r\n// horizontal circle push-out against every collider that is a wall at this height.\r\n// Colliders whose top at the contact point is within step_allow of the feet are left for the\r\n// vertical pass (that is the step-up). Returns true if a wall was touched.\r\nexport function push_out(b, cols, step_allow) {\r\n  let touched = false;\r\n  for (let pass = 0; pass \u003c 4; pass++) {\r\n    let moved = false;\r\n    for (const c of cols) {\r\n      if (c.no_walk) continue;\r\n      if (c.y0 >= b.y + b.h - 0.01) continue;                    // entirely above the head\r\n      const px = clamp(b.x, c.x0, c.x1), pz = clamp(b.z, c.z0, c.z1);\r\n      const ddx = b.x - px, ddz = b.z - pz, d2 = ddx*ddx + ddz*ddz;\r\n      if (d2 >= b.r*b.r) continue;\r\n      const top = surface_y(c, px, pz);\r\n      if (top \u003c= b.y + 0.001) continue;                            // below the feet\r\n      if (top \u003c= b.y + step_allow && headroom_ok(cols, b.x, b.z, b.r, top, b.h, b.y)) continue;\r\n      let nx, nz, pen;\r\n      if (d2 > 1e-12) {\r\n        const d = Math.sqrt(d2);\r\n        nx = ddx/d; nz = ddz/d; pen = b.r - d;\r\n      } else {                                                     // centre inside: nearest side\r\n        const l = b.x - c.x0, rr = c.x1 - b.x, bk = b.z - c.z0, f = c.z1 - b.z;\r\n        const m = Math.min(l, rr, bk, f);\r\n        if (m === l) { nx = -1; nz = 0; pen = l + b.r; }\r\n        else if (m === rr) { nx = 1; nz = 0; pen = rr + b.r; }\r\n        else if (m === bk) { nx = 0; nz = -1; pen = bk + b.r; }\r\n        else { nx = 0; nz = 1; pen = f + b.r; }\r\n      }\r\n      b.x += nx*(pen + 1e-5); b.z += nz*(pen + 1e-5);\r\n      const vn = b.vx*nx + b.vz*nz;\r\n      if (vn \u003c 0) { b.vx -= vn*nx; b.vz -= vn*nz; }\r\n      touched = moved = true;\r\n    }\r\n    if (!moved) break;\r\n  }\r\n  return touched;\r\n}\r\n\r\n// Kinematic capsule mover shared by player and enemy.\r\n//   b = {x, y, z, vx, vy, vz, r, h, grounded}  (y = feet). Gravity is the caller's job.\r\n//   o = {step, air_step, snap}\r\n// Returns events: {landed: impact speed or 0, step_dy: vertical snap while grounded, wall, ceiling}\r\nexport function move_body(b, cols, dt, o) {\r\n  const ev = { landed: 0, step_dy: 0, wall: false, ceiling: false };\r\n  const y_before = b.y, was_grounded = b.grounded;\r\n  const dx = b.vx*dt, dz = b.vz*dt;\r\n  const n = Math.max(1, Math.ceil(Math.hypot(dx, dz)/(b.r*0.45)));\r\n  const allow = was_grounded ? o.step : o.air_step;\r\n  for (let i = 0; i \u003c n; i++) {\r\n    b.x += dx/n; b.z += dz/n;\r\n    if (push_out(b, cols, allow)) ev.wall = true;\r\n  }\r\n  const vy_before = b.vy;\r\n  b.y += b.vy*dt;\r\n  // ceiling: colliders that were above the head before this move\r\n  const rr = b.r - 0.01;\r\n  if (b.vy > 0) {\r\n    let ceil = Infinity;\r\n    for (const c of cols) {\r\n      if (c.no_walk || c.y0 \u003c y_before + b.h - 0.02 || !circle_hits(c, b.x, b.z, rr)) continue;\r\n      if (c.y0 \u003c ceil) ceil = c.y0;\r\n    }\r\n    if (b.y + b.h > ceil) { b.y = ceil - b.h; b.vy = 0; ev.ceiling = true; }\r\n  }\r\n  // ground: highest surface under the circle that is not a ceiling\r\n  let ground = -Infinity;\r\n  for (const c of cols) {\r\n    if (c.no_walk || !circle_hits(c, b.x, b.z, rr)) continue;\r\n    if (c.y0 >= y_before + b.h - 0.02) continue;\r\n    const top = surface_y(c, b.x, b.z);\r\n    if (top \u003c= Math.max(y_before, b.y) + allow + 0.001 && top > ground) ground = top;\r\n  }\r\n  b.grounded = false;\r\n  if (b.vy \u003c= 0) {\r\n    if (b.y \u003c= ground) { b.y = ground; b.vy = 0; b.grounded = true; }\r\n    else if (was_grounded && b.y - ground \u003c= o.snap) { b.y = ground; b.vy = 0; b.grounded = true; }\r\n  } else if (b.y \u003c ground) {\r\n    b.y = ground;\r\n  }\r\n  if (b.grounded && !was_grounded) ev.landed = Math.max(0, -vy_before);\r\n  if (b.grounded && was_grounded) ev.step_dy = b.y - y_before;\r\n  return ev;\r\n}\r\n\r\n// ---------------------------------------------------------------- raycasts\r\n// ray vs one collider; returns {t, nx, ny, nz} of the entry point or null (origin inside = miss)\r\nexport function ray_collider(c, ox, oy, oz, dx, dy, dz, max_t) {\r\n  let tmin = -Infinity, tmax = Infinity, nx = 0, ny = 0, nz = 0;\r\n  // slabs\r\n  const slab = (o, d, lo, hi, ax) => {\r\n    if (Math.abs(d) \u003c 1e-12) return o > lo && o \u003c hi;\r\n    let t1 = (lo - o)/d, t2 = (hi - o)/d, s = -1;\r\n    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; s = 1; }\r\n    if (t1 > tmin) { tmin = t1; nx = ny = nz = 0; if (ax === 0) nx = s; else if (ax === 1) ny = s; else nz = s; }\r\n    if (t2 \u003c tmax) tmax = t2;\r\n    return tmin \u003c= tmax;\r\n  };\r\n  if (!slab(ox, dx, c.x0, c.x1, 0) || !slab(oy, dy, c.y0, c.y1, 1) || !slab(oz, dz, c.z0, c.z1, 2)) return null;\r\n  if (c.ramp) {\r\n    // inside: y - y0 - H*u(x,z) \u003c= 0, u = gx*(x-ax) + gz*(z-az)\r\n    const gxw = -c.H*c.gx, gzw = -c.H*c.gz;\r\n    const f0 = oy - c.y0 + gxw*(ox - c.ax) + gzw*(oz - c.az);\r\n    const fd = dy + gxw*dx + gzw*dz;\r\n    if (Math.abs(fd) \u003c 1e-12) { if (f0 > 0) return null; }\r\n    else {\r\n      const ts = -f0/fd;\r\n      if (fd \u003c 0) {\r\n        if (ts > tmin) { tmin = ts; const l = Math.hypot(gxw, 1, gzw); nx = gxw/l; ny = 1/l; nz = gzw/l; }\r\n      } else if (ts \u003c tmax) tmax = ts;\r\n      if (tmin > tmax) return null;\r\n    }\r\n  }\r\n  if (tmax \u003c 0 || tmin \u003c 0 || tmin > max_t) return null;\r\n  return { t: tmin, nx, ny, nz };\r\n}\r\n\r\n// nearest hit along a ray against the collider list (dir need not be unit; t is in dir units)\r\nexport function raycast(cols, ox, oy, oz, dx, dy, dz, max_t = 1e9) {\r\n  let best = null, bt = max_t;\r\n  for (const c of cols) {\r\n    if (c.no_ray) continue;\r\n    const r = ray_collider(c, ox, oy, oz, dx, dy, dz, bt);\r\n    if (r && r.t \u003c bt) { bt = r.t; best = r; best.c = c; }\r\n  }\r\n  if (best) { best.x = ox + dx*bt; best.y = oy + dy*bt; best.z = oz + dz*bt; }\r\n  return best;\r\n}\r\n\r\n// clear line between two points?\r\nexport function line_clear(cols, ax, ay, az, bx, by, bz) {\r\n  return !raycast(cols, ax, ay, az, bx - ax, by - ay, bz - az, 1);\r\n}\r\n\r\n// ray vs vertical capsule (segment (cx,y0,cz)-(cx,y1,cz), radius r). returns t or Infinity\r\nexport function ray_capsule(ox, oy, oz, dx, dy, dz, cx, y0, y1, cz, r) {\r\n  let best = Infinity;\r\n  // cylinder side\r\n  const px = ox - cx, pz = oz - cz;\r\n  const a = dx*dx + dz*dz;\r\n  if (a > 1e-12) {\r\n    const bq = 2*(px*dx + pz*dz), cq = px*px + pz*pz - r*r;\r\n    const disc = bq*bq - 4*a*cq;\r\n    if (disc >= 0) {\r\n      const t = (-bq - Math.sqrt(disc))/(2*a);\r\n      const y = oy + dy*t;\r\n      if (t >= 0 && y >= y0 && y \u003c= y1) best = t;\r\n    }\r\n  }\r\n  // end spheres\r\n  const sph = (sy) => {\r\n    const qx = ox - cx, qy = oy - sy, qz = oz - cz;\r\n    const A = dx*dx + dy*dy + dz*dz, B = 2*(qx*dx + qy*dy + qz*dz), C = qx*qx + qy*qy + qz*qz - r*r;\r\n    const D = B*B - 4*A*C;\r\n    if (D \u003c 0) return;\r\n    const t = (-B - Math.sqrt(D))/(2*A);\r\n    if (t >= 0 && t \u003c best) best = t;\r\n  };\r\n  sph(y0); sph(y1);\r\n  return best;\r\n}\r\n\r\n// sphere overlap vs colliders -> the first collider touched, or null\r\nexport function sphere_hits(cols, x, y, z, r) {\r\n  for (const c of cols) {\r\n    if (c.no_ray) continue;\r\n    const px = clamp(x, c.x0, c.x1), pz = clamp(z, c.z0, c.z1);\r\n    const top = surface_y(c, px, pz);\r\n    const py = clamp(y, c.y0, top);\r\n    const dx = x - px, dy = y - py, dz = z - pz;\r\n    if (dx*dx + dy*dy + dz*dz \u003c r*r) return c;\r\n  }\r\n  return null;\r\n}\r\n\r\n// distance from a point to a vertical segment (for capsule overlap tests)\r\nexport function dist_to_vseg(x, y, z, cx, y0, y1, cz) {\r\n  const cy = clamp(y, y0, y1);\r\n  return len3(x - cx, y - cy, z - cz);\r\n}\r\n","game/warp.js":"// warp.js -- things that bend the light behind them (round 23, owner: \"The general way you've done\r\n// the prismatic effect is with glitter-like dot particles. I'd [like] this effect to feel more\r\n// like wind visually. You know wind is portrayed visually sometimes as a kind of transparent\r\n// slight warping of things?\").\r\n//\r\n// Nothing here is drawn as colour: each piece writes, into R.warp_scene's target, how far (in\r\n// screen pixels) the world behind it is shifted and how far apart its three colour channels are\r\n// pulled (render.js bends the world image by it in the final pass). So a streak reads as a clear\r\n// rippling line through which the cave wobbles, with rainbow fringes at its edges: the lich's\r\n// prism as air. Each fragment is tested against the world's depth, so rock in front hides it.\r\n//   streaks  polylines of K points the owner moves each tick (wind lines, rings on the floor):\r\n//            across them the background is pushed out on one side and in on the other, like a\r\n//            thin lens; ripples run along them\r\n//   puffs    rising, spreading, swirling blobs (smoke made of warped air)\r\nimport * as THREE from 'three';\r\nimport { smoothstep } from 'game/util.js';\r\n\r\nexport const K = 24;                  // points in a streak\r\n\r\nconst DECL = /* glsl */`\r\nuniform vec2 uRes; uniform float uProj, uTime; uniform sampler2D tDepth;\r\nuniform float uNoDepth;\r\nbool hidden(){ return uNoDepth \u003c 0.5 && gl_FragCoord.z > texture2D(tDepth, gl_FragCoord.xy/uRes).x + 1e-6; }\r\nfloat h1(float x){ return fract(sin(x*127.1)*43758.5453); }\r\nfloat n1(float x){ float i = floor(x), f = fract(x); return mix(h1(i), h1(i + 1.0), f*f*(3.0 - 2.0*f)); }`;\r\n\r\n// additive, signed: the shifts of overlapping pieces add up\r\nconst blend = { transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide, blending: THREE.CustomBlending,\r\n  blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor, blendEquation: THREE.AddEquation };\r\n\r\nexport function create_warp(R) {\r\n  const U = { uRes: { value: new THREE.Vector2(R.W, R.H) }, uProj: { value: 400 }, uTime: { value: 0 }, tDepth: { value: R.targets.rt_world.depthTexture }, uNoDepth: { value: 0 } };\r\n\r\n  // ---------------------------------------------------------------- streaks\r\n  const NS = 200, NV = NS*K*2;                 // (round 26: bursts fling many at once)\r\n  const pos = new Float32Array(NV*3), prv = new Float32Array(NV*3), nxt = new Float32Array(NV*3);\r\n  const side = new Float32Array(NV), along = new Float32Array(NV), prm = new Float32Array(NV*4), fade = new Float32Array(NV);\r\n  for (let s = 0; s \u003c NS; s++) for (let k = 0; k \u003c K; k++) for (let e = 0; e \u003c 2; e++) { const v = (s*K + k)*2 + e; side[v] = e ? 1 : -1; along[v] = k/(K - 1); }\r\n  const idx = [];\r\n  for (let s = 0; s \u003c NS; s++) for (let k = 0; k \u003c K - 1; k++) { const a = (s*K + k)*2; idx.push(a, a + 1, a + 3, a, a + 3, a + 2); }\r\n  const sg = new THREE.BufferGeometry();\r\n  sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));\r\n  sg.setAttribute('aPrev', new THREE.BufferAttribute(prv, 3));\r\n  sg.setAttribute('aNext', new THREE.BufferAttribute(nxt, 3));\r\n  sg.setAttribute('aSide', new THREE.BufferAttribute(side, 1));\r\n  sg.setAttribute('aU', new THREE.BufferAttribute(along, 1));\r\n  sg.setAttribute('aP', new THREE.BufferAttribute(prm, 4));          // width m, amp px, chroma, phase\r\n  sg.setAttribute('aA', new THREE.BufferAttribute(fade, 1));\r\n  sg.setIndex(idx);\r\n  const smat = new THREE.ShaderMaterial({\r\n    uniforms: U, ...blend,\r\n    vertexShader: `attribute vec3 aPrev, aNext; attribute float aSide, aU, aA; attribute vec4 aP;\r\n      uniform vec2 uRes; uniform float uProj;\r\n      varying float vSide, vU, vA, vAmp, vCh, vPh; varying vec2 vN, vT;\r\n      void main(){\r\n        mat4 PV = projectionMatrix*viewMatrix;\r\n        vec4 c = PV*vec4(position, 1.0), cp = PV*vec4(aPrev, 1.0), cn = PV*vec4(aNext, 1.0);\r\n        vec2 d = (cn.xy/max(cn.w, 1e-3) - cp.xy/max(cp.w, 1e-3))*uRes;\r\n        d = length(d) > 1e-4 ? normalize(d) : vec2(1.0, 0.0);\r\n        vec2 n = vec2(-d.y, d.x);\r\n        float px = max(3.0, aP.x*uProj/max(c.w, 0.05));\r\n        c.xy += n*aSide*px*0.5*2.0/uRes*c.w;\r\n        gl_Position = c;\r\n        vSide = aSide; vU = aU; vA = aA; vAmp = aP.y*min(1.0, px/3.0 + 0.3); vCh = aP.z; vPh = aP.w; vN = n; vT = d; }`,\r\n    fragmentShader: `${DECL}\r\n      varying float vSide, vU, vA, vAmp, vCh, vPh; varying vec2 vN, vT;\r\n      void main(){\r\n        if (uNoDepth > 1.5) { gl_FragColor = vec4(5.0, 0.0, 0.0, vA); return; }\r\n        if (vA \u003c= 0.0 || hidden()) discard;\r\n        float x = vSide;\r\n        // a thin lens across it: pushed out on one side, in on the other; strongest in its middle\r\n        float g = -x*exp(-x*x*2.2)*2.3;\r\n        float env = smoothstep(0.0, 0.18, vU)*smoothstep(1.0, 0.7, vU);\r\n        float rip = 0.7 + 0.3*sin(vU*19.0 - uTime*15.0 + vPh) + 0.15*(n1(vU*9.0 + vPh*3.0 - uTime*6.0) - 0.5);\r\n        float k = vAmp*env*rip*vA;\r\n        vec2 off = vN*g*k + vT*exp(-x*x*2.0)*k*0.35;        // and dragged a little along it, like wind\r\n        gl_FragColor = vec4(off, vCh*env*exp(-x*x*1.5)*vA, 0.32*exp(-x*x*2.0)*env*vA); }`,\r\n  });\r\n  const smesh = new THREE.Mesh(sg, smat); smesh.frustumCulled = false;\r\n  R.warp_scene.add(smesh);\r\n  const S = [];\r\n  for (let i = 0; i \u003c NS; i++) S.push({ on: false, pts: [...Array(K)].map(() => new THREE.Vector3()), w: 0.1, amp: 3, chroma: 0.7, a: 0, ph: Math.random()*6.28 });\r\n\r\n  // ---------------------------------------------------------------- puffs\r\n  const NP = 500;\r\n  const ppos = new Float32Array(NP*3), pprm = new Float32Array(NP*4);\r\n  const pg = new THREE.BufferGeometry();\r\n  pg.setAttribute('position', new THREE.BufferAttribute(ppos, 3));\r\n  pg.setAttribute('aP', new THREE.BufferAttribute(pprm, 4));         // size m, amp px, rotation, alpha\r\n  const pmat = new THREE.ShaderMaterial({\r\n    uniforms: U, ...blend,\r\n    vertexShader: `attribute vec4 aP; uniform float uProj; varying vec4 vP; varying float vSeed;\r\n      void main(){ vec4 mv = modelViewMatrix*vec4(position, 1.0); gl_Position = projectionMatrix*mv;\r\n        gl_PointSize = aP.w > 0.0 ? clamp(aP.x*uProj/max(-mv.z, 0.05), 2.0, 96.0) : 0.0; vP = aP; vSeed = fract(position.x*3.1 + position.z*1.7); }`,\r\n    fragmentShader: `${DECL}\r\n      varying vec4 vP; varying float vSeed;\r\n      void main(){\r\n        if (hidden()) discard;\r\n        vec2 q = gl_PointCoord*2.0 - 1.0; q.y = -q.y;\r\n        float r = length(q);\r\n        if (r > 1.0) discard;\r\n        float fall = smoothstep(1.0, 0.1, r);\r\n        float c = cos(vP.z), s = sin(vP.z);\r\n        vec2 qr = vec2(c*q.x - s*q.y, s*q.x + c*q.y);\r\n        // a swirl with lumps in it: air turning over, smoke made of it\r\n        float lump = 0.6 + 0.8*n1(qr.x*3.0 + vSeed*17.0 + uTime*1.3)*n1(qr.y*3.0 + vSeed*9.0 - uTime*1.1);\r\n        vec2 off = (vec2(-qr.y, qr.x)*0.9 + qr*0.35)*vP.y*fall*lump*vP.w;\r\n        gl_FragColor = vec4(off, 0.9*fall*vP.w, 0.3*fall*vP.w); }`,\r\n  });\r\n  const pts = new THREE.Points(pg, pmat); pts.frustumCulled = false;\r\n  R.warp_scene.add(pts);\r\n  const P = [];\r\n  for (let i = 0; i \u003c NP; i++) P.push({ life: 0 });\r\n  let pnext = 0;\r\n\r\n  // ---------------------------------------------------------------- flung streaks\r\n  // round 26: a streak thrown out of something bursting: a path that turns as it goes (curl, and\r\n  // a messy jitter), the streak covering a stretch of it that races out along it and thins away\r\n  const FL = [], DS = 0.06, TMP = new THREE.Vector3();\r\n  function fling(o) {\r\n    const s = S.find(q => !q.on);\r\n    if (!s) return;\r\n    s.on = true; s.a = 0; s.w = o.w ?? 0.12; s.amp = o.amp ?? 5; s.chroma = o.chroma ?? 1.2; s.ph = Math.random()*6.28;\r\n    const sp = o.speed ?? 6, life = o.life ?? 0.5, len = o.len ?? 0.8, jit = o.jitter ?? 1.5;\r\n    const d = o.dir.clone().normalize(), q = o.p.clone(), path = [q.clone()];\r\n    const ax = new THREE.Vector3().crossVectors(d, Math.abs(d.y) \u003c 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0)).normalize();\r\n    const total = sp*life + len;\r\n    let curl = o.curl ?? 3;\r\n    for (let t = 0; t \u003c total; t += DS) {\r\n      // it turns about an axis across it, and the axis itself wanders (messy)\r\n      TMP.copy(ax).applyAxisAngle(d, (Math.random() - 0.5)*jit*DS*6);\r\n      ax.copy(TMP).normalize();\r\n      d.applyAxisAngle(ax, curl*DS + (Math.random() - 0.5)*jit*DS*3).normalize();\r\n      d.y -= 0.35*DS; d.normalize();                                   // it droops a little, like a thrown thing\r\n      q.addScaledVector(d, DS);\r\n      path.push(q.clone());\r\n    }\r\n    FL.push({ s, path, sp, len, life, t: 0 });\r\n  }\r\n  const at = (path, d, out) => {\r\n    const f = Math.max(0, Math.min(path.length - 1.001, d/DS)), i = Math.floor(f);\r\n    return out.lerpVectors(path[i], path[i + 1], f - i);\r\n  };\r\n  function update_flings(dt) {\r\n    for (let i = FL.length - 1; i >= 0; i--) {\r\n      const q = FL[i];\r\n      q.t += dt;\r\n      // fast out, slowing (the burst's force spent)\r\n      const u = q.t/q.life, head = q.sp*q.life*(1 - Math.pow(1 - Math.min(1, u), 2)) + q.len*Math.min(1, q.t/0.08);\r\n      const tail = Math.max(0, head - q.len*(1 - 0.5*u));\r\n      for (let k = 0; k \u003c K; k++) at(q.path, tail + (head - tail)*k/(K - 1), q.s.pts[k]);\r\n      q.s.a = smoothstep(0, 0.05, q.t)*(1 - smoothstep(0.55, 1, u));\r\n      if (q.t >= q.life) { q.s.on = false; q.s.a = 0; FL.splice(i, 1); }\r\n    }\r\n  }\r\n\r\n  return {\r\n    // a streak for the caller to move: set .pts (K points, first = tail), .w (m), .amp (px), .chroma, .a (0..1)\r\n    streak() {\r\n      const s = S.find(q => !q.on);\r\n      if (!s) return null;\r\n      s.on = true; s.a = 0; s.w = 0.1; s.amp = 3; s.chroma = 0.7; s.ph = Math.random()*6.28;\r\n      return s;\r\n    },\r\n    release(s) { if (s) { s.on = false; s.a = 0; } },\r\n    // a puff: x y z, vx vy vz, life, s0 -> s1 (m across), amp (px), spin (rad/s), drag, rise (m/s^2)\r\n    puff(o) {\r\n      const p = P[pnext]; pnext = (pnext + 1) % NP;\r\n      Object.assign(p, { vx: 0, vy: 0, vz: 0, drag: 0.8, rise: 0, spin: 1, rot: Math.random()*6.28, amp: 3.5, s0: 0.15, s1: 0.5 }, o, { max: o.life });\r\n      return p;\r\n    },\r\n    fling,\r\n    update(t, dt) {\r\n      U.uTime.value = t;\r\n      update_flings(dt);\r\n      S.forEach((s, i) => {\r\n        for (let k = 0; k \u003c K; k++) {\r\n          const p = s.pts[k], a = s.pts[Math.max(0, k - 1)], b = s.pts[Math.min(K - 1, k + 1)];\r\n          for (let e = 0; e \u003c 2; e++) {\r\n            const v = (i*K + k)*2 + e;\r\n            pos[v*3] = p.x; pos[v*3 + 1] = p.y; pos[v*3 + 2] = p.z;\r\n            prv[v*3] = a.x; prv[v*3 + 1] = a.y; prv[v*3 + 2] = a.z;\r\n            nxt[v*3] = b.x; nxt[v*3 + 1] = b.y; nxt[v*3 + 2] = b.z;\r\n            prm[v*4] = s.w; prm[v*4 + 1] = s.amp; prm[v*4 + 2] = s.chroma; prm[v*4 + 3] = s.ph;\r\n            fade[v] = s.on ? s.a : 0;\r\n          }\r\n        }\r\n      });\r\n      for (const k of ['position', 'aPrev', 'aNext', 'aP', 'aA']) sg.attributes[k].needsUpdate = true;\r\n      for (let i = 0; i \u003c NP; i++) {\r\n        const p = P[i];\r\n        if (p.life \u003c= 0) { pprm[i*4 + 3] = 0; continue; }\r\n        p.life -= dt;\r\n        const u = 1 - p.life/p.max, d = 1 - p.drag*dt;\r\n        p.vx *= d; p.vy = p.vy*d + p.rise*dt; p.vz *= d;\r\n        p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt; p.rot += p.spin*dt;\r\n        ppos[i*3] = p.x; ppos[i*3 + 1] = p.y; ppos[i*3 + 2] = p.z;\r\n        pprm[i*4] = p.s0 + (p.s1 - p.s0)*u; pprm[i*4 + 1] = p.amp; pprm[i*4 + 2] = p.rot;\r\n        pprm[i*4 + 3] = smoothstep(0, 0.15, u)*(1 - smoothstep(0.45, 1, u));\r\n      }\r\n      pg.attributes.position.needsUpdate = true; pg.attributes.aP.needsUpdate = true;\r\n    },\r\n    set_camera(cam, H) { U.uProj.value = cam.projectionMatrix.elements[5]*H*0.5; },\r\n    // tests\r\n    buf: () => ({ pos: Array.from(pos.slice(0, 12)).map(v => +v.toFixed(2)), prm: Array.from(prm.slice(0, 8)).map(v => +v.toFixed(2)), fade: Array.from(fade.slice(0, 4)), side: Array.from(side.slice(0, 4)), idx: sg.index.array.length, count: sg.attributes.position.count, drawRange: [sg.drawRange.start, sg.drawRange.count] }),\r\n    debug: () => ({ streaks: S.filter(s => s.on).map(s => [+s.a.toFixed(2), s.pts[0].toArray().map(v => +v.toFixed(2)), s.pts[K - 1].toArray().map(v => +v.toFixed(2))]).slice(0, 5), n: S.filter(s => s.on).length, puffs: P.filter(p => p.life > 0).length }),\r\n    U,\r\n  };\r\n}\r\n"}</script>
