max = 3600) { const f = new Function('G', 'return (' + src + ');'); let n = 0; while (n \u003c max && !f(G)) { tick(); place_camera(DT); n++; } render(n*DT); return n; },\n  // set the snake nearest (x, z) alight now; returns its index\n  ignite_near(x, z) {\n    const live = snakes.live(); if (!live.length) return -1;\n    live.sort((a, b) => Math.hypot(a.x - x, a.z - z) - Math.hypot(b.x - x, b.z - z));\n    snakes.ignite(live[0], 30);\n    return snakes.S.indexOf(live[0]);\n  },\n  snake_at(i) { const s = snakes.S[i]; const c = s.spine[20]; return { x: +c.x.toFixed(2), z: +c.z.toFixed(2), burning: !!s.burn, sink: +s.sink.toFixed(2), burnt: s.burnt, fire: fire.burning }; },\n  mode(m) { lich.mode = m; render(0); return lich.MODES[lich.mode]; },\n  dark(i) { G.dark = i; const n = cave.set_darkness(i); render(0); return n; },\n  snakes() { return snakes.S.map(s => [+s.x.toFixed(2), +s.z.toFixed(2), s.dying, +s.delay.toFixed(2)]); },\n  springs() {\n    const S = lich.springs;\n    return { body: [r3(S.bp.x), r3(S.br.x)], chest: [r3(S.cp.x), r3(S.cr.x)], head: [r3(S.hp.x), r3(S.hr.x), r3(S.hy.x)], jaw: r3(S.jw.x),\n      legs: S.legs.map(l => [r3(l.p.x), r3(l.r.x), r3(l.k.x)]), arms: S.arms.map(a => [r3(a.p.x), r3(a.r.x), r3(a.e.x)]) };\n  },\n  state() {\n    return { t: r3(G.t), tick: G.tick, cam: CAMS[G.cam].name, juice: lich.JUICE[lich.juice].name, lich: L.toArray().map(r3),\n      speed: r3(mover.speed), yaw: r3(mover.yaw), goal: goal ? [r3(goal.x), r3(goal.z)] : null, motion: { a: mover.motion.a.map(r3), v: mover.motion.v.map(r3) } };\n  },\n  nav_map() {\n    // the walkable map as rows of characters ('#' blocked, '.' open), every 2nd cell\n    const out = [];\n    for (let j = nav.nz - 1; j >= 0; j -= 2) { let s = ''; for (let i = 0; i \u003c nav.nx; i += 2) s += nav.blocked[j*nav.nx + i] ? '#' : '.'; out.push(s); }\n    return out;\n  },\n};\ncave.set_darkness(G.dark);\ntick();\nrender(0);\nwindow.GAME.ready = true;\nrequestAnimationFrame(frame);\n","game/mover.js":"// mover.js -- the lich's body through the room (round 5). He floats: he eases into motion,\n// drifts a little out of it, turns to face where he is sent, rides up over stones and rubble,\n// and is stopped by rock, the egg, and the edge of what the room camera sees (nav.js).\n// Each tick hands lich.pose() the pelvis' real acceleration and velocity in his own frame,\n// which is what swings his parts.\nimport * as THREE from 'three';\nimport { clamp } from 'game/util.js';\n\nexport const MOVE = {\n  speed: 2.6,            // m/s; the snakes crawl at 1.0-1.35\n  acc: 7.0, tau_acc: 0.3,   // pushing: at most 7 m/s^2, closing the gap to the wanted velocity in ~0.3 s\n  dec: 5.0, tau_dec: 0.38,  // letting go: a softer stop, he drifts ~0.6 m\n  jerk: 11,              // how fast the push itself changes (1/s): no instant jolts\n  radius: 0.34,          // his body, for rock\n  turn_f: 0.8, turn_z: 0.85, turn_amax: 22, turn_vmax: 5.5,   // facing spring (Hz, damping, limits)\n  turn_f_point: 2.0, turn_amax_point: 45, turn_vmax_point: 8,   // round 22: quicker while he turns to keep what he points at in front\n  bob: 0.05,             // the breathing float, metres\n};\n\nconst wrap = a => Math.atan2(Math.sin(a), Math.cos(a));\n\nexport function create_mover(nav, lich, start, yaw0) {\n  const p = start.clone();                     // the pelvis, world\n  const v = new THREE.Vector3();               // horizontal velocity (y unused)\n  const push = new THREE.Vector2();            // the applied horizontal acceleration\n  let vy = 0, yaw = yaw0, yaw_v = 0, yaw_a = 0, want_yaw = yaw0;\n  // round 22 (owner: he should not point at something behind him; what he points at stays in the\n  // half in front, \"open like on a cross\" at most): while `face` is on, he faces as near to where\n  // he is sent as he can with face.yaw (the way to what he points at) within face.half of his\n  // facing; still, he turns toward it just enough. He floats, so he can go one way facing another.\n  const face = { on: false, yaw: 0, half: 1.31 };\n  const prev_p = p.clone(), prev_vel = new THREE.Vector3(), vel = new THREE.Vector3(), acc = new THREE.Vector3();\n  const motion = { a: [0, 0, 0], v: [0, 0, 0], push: [0, 0], yaw_a: 0, yaw_v: 0, look: 0 };\n  const height_at = (t) => nav.floor(p.x, p.z) + lich.hover_h + MOVE.bob*Math.sin(t*1.1) + 0.015*Math.sin(t*0.63 + 1.0);\n  p.y = height_at(0);\n  prev_p.copy(p);\n\n  function tick(t, dt, want) {\n    const wl = Math.hypot(want.x, want.z);\n    const pushing = wl > 0.01;\n    // steer toward the wanted velocity with a bounded push, harder when sent than when let go\n    const tau = pushing ? MOVE.tau_acc : MOVE.tau_dec, amax = pushing ? MOVE.acc : MOVE.dec;\n    let cx = (want.x - v.x)/tau, cz = (want.z - v.z)/tau;\n    const cl = Math.hypot(cx, cz);\n    if (cl > amax) { cx *= amax/cl; cz *= amax/cl; }\n    const k = 1 - Math.exp(-MOVE.jerk*dt);\n    push.x += (cx - push.x)*k; push.y += (cz - push.y)*k;\n    v.x += push.x*dt; v.z += push.y*dt;\n    if (!pushing && Math.hypot(v.x, v.z) \u003c 0.02 && Math.hypot(push.x, push.y) \u003c 0.05) { v.x = v.z = 0; push.set(0, 0); }\n    p.x += v.x*dt; p.z += v.z*dt;\n    if (nav.resolve(p, v, MOVE.radius)) {\n      // against rock: the push along the wall survives, the push into it doesn't\n      const s = Math.hypot(v.x, v.z), ps = Math.hypot(push.x, push.y);\n      if (s > 1e-4 && ps > 1e-4) { const along = (push.x*v.x + push.y*v.z)/s; push.set(v.x/s*along, v.z/s*along); }\n    }\n    // height: a soft spring to the floor under his legs, plus the bob\n    const wv = 6.2832*1.0;\n    vy += (wv*wv*(height_at(t) - p.y) - 2*0.65*wv*vy)*dt;\n    p.y += vy*dt;\n    // facing: a spring toward where he is sent\n    if (pushing) want_yaw = Math.atan2(want.x, want.z);\n    if (face.on) { const rel = wrap(face.yaw - want_yaw); if (Math.abs(rel) > face.half) want_yaw = wrap(face.yaw - Math.sign(rel)*face.half); }\n    const wy = 6.2832*(face.on ? MOVE.turn_f_point : MOVE.turn_f);\n    const tam = face.on ? MOVE.turn_amax_point : MOVE.turn_amax, tvm = face.on ? MOVE.turn_vmax_point : MOVE.turn_vmax;\n    yaw_a = clamp(wy*wy*wrap(want_yaw - yaw) - 2*MOVE.turn_z*wy*yaw_v, -tam, tam);\n    yaw_v = clamp(yaw_v + yaw_a*dt, -tvm, tvm);\n    yaw = wrap(yaw + yaw_v*dt);\n    // what the body felt this tick, in his frame (x = his left, z = forward)\n    vel.subVectors(p, prev_p).divideScalar(dt);\n    acc.subVectors(vel, prev_vel).divideScalar(dt);\n    if (acc.length() > 20) acc.setLength(20);\n    prev_p.copy(p); prev_vel.copy(vel);\n    const sy = Math.sin(yaw), cy = Math.cos(yaw);\n    motion.a[0] = acc.x*cy - acc.z*sy; motion.a[1] = acc.y; motion.a[2] = acc.x*sy + acc.z*cy;\n    motion.v[0] = vel.x*cy - vel.z*sy; motion.v[1] = vel.y; motion.v[2] = vel.x*sy + vel.z*cy;\n    // the push: where he is sent minus how he moves, in his frame, as a fraction of full speed\n    let qx = ((want.x - vel.x)*cy - (want.z - vel.z)*sy)/MOVE.speed, qz = ((want.x - vel.x)*sy + (want.z - vel.z)*cy)/MOVE.speed;\n    const ql = Math.hypot(qx, qz);\n    if (ql > 1) { qx /= ql; qz /= ql; }\n    motion.push[0] = qx; motion.push[1] = qz;\n    motion.yaw_a = yaw_a; motion.yaw_v = yaw_v;\n    motion.look = pushing ? wrap(want_yaw - yaw) : 0;\n    lich.root.position.copy(p);\n    lich.root.rotation.y = yaw;\n  }\n\n  return {\n    p, v, motion, tick, face,\n    get yaw() { return yaw; },\n    get speed() { return Math.hypot(v.x, v.z); },\n    place(x, z, y_ = yaw) {\n      p.x = x; p.z = z; v.set(0, 0, 0); push.set(0, 0); yaw = want_yaw = y_; yaw_v = 0;\n      p.y = height_at(0); vy = 0; prev_p.copy(p); prev_vel.set(0, 0, 0);\n      lich.root.position.copy(p); lich.root.rotation.y = yaw;\n    },\n  };\n}\n","game/nav.js":"// nav.js -- where the lich can float (round 5). A 0.2 m grid over the chamber, rasterized from\n// the rock meshes: a cell whose rock rises more than BLOCK_H above the ground blocks him; lower\n// rock (stones, rubble) only lifts his float so his toes pass over it. Anything else the caller\n// marks (the egg, what the room camera can't see) blocks too. The distance to the nearest\n// blocking cell pushes him out and lets him slide along an edge.\nexport function build_nav({ geo, ground_y, x0 = -16, x1 = 16, z0 = -16, z1 = 16, cell = 0.2, block_h = 0.6 }) {\n  const nx = Math.round((x1 - x0)/cell), nz = Math.round((z1 - z0)/cell), N = nx*nz;\n  const top = new Float32Array(N).fill(-1e9);\n  const gy = new Float32Array(N);\n  const cx = i => x0 + (i + 0.5)*cell, cz = j => z0 + (j + 0.5)*cell;\n  for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) gy[j*nx + i] = ground_y(cx(i), cz(j));\n\n  // rock tops: every triangle's surface over the cell centres it covers, and its corners\n  const p = geo.attributes.position.array;\n  const mark = (x, z, y) => {\n    const i = Math.floor((x - x0)/cell), j = Math.floor((z - z0)/cell);\n    if (i >= 0 && j >= 0 && i \u003c nx && j \u003c nz && y > top[j*nx + i]) top[j*nx + i] = y;\n  };\n  for (let t = 0; t \u003c p.length; t += 9) {\n    const ax = p[t], ay = p[t + 1], az = p[t + 2], bx = p[t + 3], by = p[t + 4], bz = p[t + 5], qx = p[t + 6], qy = p[t + 7], qz = p[t + 8];\n    mark(ax, az, ay); mark(bx, bz, by); mark(qx, qz, qy);\n    const det = (bz - qz)*(ax - qx) + (qx - bx)*(az - qz);\n    if (Math.abs(det) \u003c 1e-9) continue;\n    const i0 = Math.max(0, Math.floor((Math.min(ax, bx, qx) - x0)/cell)), i1 = Math.min(nx - 1, Math.floor((Math.max(ax, bx, qx) - x0)/cell));\n    const j0 = Math.max(0, Math.floor((Math.min(az, bz, qz) - z0)/cell)), j1 = Math.min(nz - 1, Math.floor((Math.max(az, bz, qz) - z0)/cell));\n    for (let j = j0; j \u003c= j1; j++) for (let i = i0; i \u003c= i1; i++) {\n      const x = cx(i), z = cz(j);\n      const l1 = ((bz - qz)*(x - qx) + (qx - bx)*(z - qz))/det;\n      const l2 = ((qz - az)*(x - qx) + (ax - qx)*(z - qz))/det;\n      const l3 = 1 - l1 - l2;\n      if (l1 \u003c -1e-4 || l2 \u003c -1e-4 || l3 \u003c -1e-4) continue;\n      const y = l1*ay + l2*by + l3*qy;\n      if (y > top[j*nx + i]) top[j*nx + i] = y;\n    }\n  }\n  const blocked = new Uint8Array(N);\n  const floor = new Float32Array(N);\n  for (let k = 0; k \u003c N; k++) {\n    const h = top[k] - gy[k];\n    if (h > block_h) blocked[k] = 1;\n    floor[k] = Math.max(gy[k], h > 0 && h \u003c= block_h ? top[k] : gy[k]);\n  }\n  const rock = blocked.slice();                   // rock alone (block() adds the rest to `blocked`)\n\n  // what the float clears: the highest floor under his legs (a disc around the pelvis)\n  const lift = new Float32Array(N);\n  const LR = Math.ceil(0.35/cell);\n  for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) {\n    let m = floor[j*nx + i];\n    for (let dj = -LR; dj \u003c= LR; dj++) for (let di = -LR; di \u003c= LR; di++) {\n      if (di*di + dj*dj > LR*LR) continue;\n      const ii = i + di, jj = j + dj;\n      if (ii \u003c 0 || jj \u003c 0 || ii >= nx || jj >= nz || blocked[jj*nx + ii]) continue;\n      m = Math.max(m, floor[jj*nx + ii]);\n    }\n    lift[j*nx + i] = m;\n  }\n\n  // bilinear read of a cell field at a world point\n  const sample = (F, x, z) => {\n    const fx = (x - x0)/cell - 0.5, fz = (z - z0)/cell - 0.5;\n    let i = Math.floor(fx), j = Math.floor(fz);\n    const u = fx - i, v = fz - j;\n    const at = (a, b) => F[Math.min(nz - 1, Math.max(0, b))*nx + Math.min(nx - 1, Math.max(0, a))];\n    return (at(i, j)*(1 - u) + at(i + 1, j)*u)*(1 - v) + (at(i, j + 1)*(1 - u) + at(i + 1, j + 1)*u)*v;\n  };\n\n  let dist = null;\n  const MAXD = 1.6;\n  const nav = {\n    nx, nz, cell, x0, z0, blocked,\n    // block every cell whose centre `fn(x, z)` says so; call finish() after the last one\n    block(fn) { for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) if (fn(cx(i), cz(j))) blocked[j*nx + i] = 1; },\n    finish() {\n      // distance from each cell centre to the edge of the nearest blocking cell (brute force in a window)\n      dist = new Float32Array(N);\n      const R = Math.ceil(MAXD/cell);\n      for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) {\n        if (blocked[j*nx + i]) { dist[j*nx + i] = -cell*0.5; continue; }\n        let best = MAXD*MAXD;\n        for (let dj = -R; dj \u003c= R; dj++) for (let di = -R; di \u003c= R; di++) {\n          const ii = i + di, jj = j + dj;\n          const out = ii \u003c 0 || jj \u003c 0 || ii >= nx || jj >= nz;\n          if (!out && !blocked[jj*nx + ii]) continue;\n          const d2 = (di*di + dj*dj)*cell*cell;\n          if (d2 \u003c best) best = d2;\n        }\n        dist[j*nx + i] = Math.sqrt(best) - cell*0.5;\n      }\n      return nav;\n    },\n    floor: (x, z) => sample(lift, x, z),\n    dist: (x, z) => sample(dist, x, z),\n    // the top of any rock (low stones too) in the cell at a point, or -1e9 (round 29: the\n    // objects' places avoid stones)\n    rock_top(x, z) {\n      const i = Math.floor((x - x0)/cell), j = Math.floor((z - z0)/cell);\n      if (i \u003c 0 || j \u003c 0 || i >= nx || j >= nz) return 1e9;\n      return top[j*nx + i];\n    },\n    // rock at a point, and how high it rises there (for cameras to stop short of it)\n    rock_at(x, z) {\n      const i = Math.floor((x - x0)/cell), j = Math.floor((z - z0)/cell);\n      if (i \u003c 0 || j \u003c 0 || i >= nx || j >= nz) return Infinity;\n      return rock[j*nx + i] ? top[j*nx + i] : -Infinity;\n    },\n    is_blocked(x, z) {\n      const i = Math.floor((x - x0)/cell), j = Math.floor((z - z0)/cell);\n      return i \u003c 0 || j \u003c 0 || i >= nx || j >= nz || blocked[j*nx + i] === 1;\n    },\n    // push a body of radius r at (p.x, p.z) out of blocking cells; slide v along the edge.\n    // Returns true on contact.\n    resolve(pos, vel, r) {\n      let hit = false;\n      for (let it = 0; it \u003c 3; it++) {\n        const d = sample(dist, pos.x, pos.z);\n        if (d >= r) break;\n        const e = cell*0.5;\n        let gx = sample(dist, pos.x + e, pos.z) - sample(dist, pos.x - e, pos.z);\n        let gz = sample(dist, pos.x, pos.z + e) - sample(dist, pos.x, pos.z - e);\n        const gl = Math.hypot(gx, gz);\n        if (gl \u003c 1e-6) break;\n        gx /= gl; gz /= gl;\n        pos.x += gx*(r - d); pos.z += gz*(r - d);\n        const into = vel.x*gx + vel.z*gz;\n        if (into \u003c 0) { vel.x -= gx*into; vel.z -= gz*into; }\n        hit = true;\n      }\n      return hit;\n    },\n  };\n  return nav;\n}\n","game/powers.js":"// powers.js -- the lich's six powers and what decides when they act (round 11).\n//\n// Owner, 2026-09-28: fire, lift and burst, wind, leakage, prismatic beam, lens. \"The player\n// starts with all abilities and the cooldowns of abilities are such that snakes always almost\n// reach the egg but never do, regardless of where the lich is in the cave. As attacks are\n// removed by the player, the remaining attacks increase in frequency to make sure that snakes\n// don't reach.\" Fire, lift, rock (wind until round 23) and beam are cast with a hand pointing at the target; the lens\n// is a floating object; leakage happens by itself.\n//\n// How that is kept:\n// - A snake becomes a target only when its head comes within ENGAGE of the egg (so they always\n//   get close), wherever the lich is: no power has a range limit, except leakage, which is\n//   about what is near him.\n// - He casts one gestured power at a time: head turns to the spot, the arm rises and points,\n//   the power goes off a beat after both are on it (round 19), he holds a moment, lowers. Among the powers that\n//   are ready he uses the one he has used least recently, so all of them show.\n// - With fewer powers, each one left grows by power = 6 / (powers left): cooldowns divide by\n//   it, and what one cast takes multiplies (fire lights several, lift raises several, rock\n//   blows several away, the beam chains through many, several lenses form, leakage reaches\n//   further and works faster).\n// - A snake that gets within URGENT of the egg with nothing on it forces a cast now (cooldown\n//   ignored, a quicker aim), whichever power is left. With no powers left, they reach the egg.\n// - Round 20 (owner: \"When you have N attacks active they should keep the snakes away but be used\n//   roughly equally\"; with the beam and the lens the lens took 31 casts of 31, because it forms\n//   at 6 m, in parallel, before the gestured powers engage at 3.4 m): one rotation for every\n//   power that acts (all but leakage, which is always on): a power goes only when no other power\n//   that is ready, or nearly (under SOON s of cooldown left), has been used fewer times since\n//   the set of powers last changed. Something about to reach the egg skips the rotation.\nimport * as THREE from 'three';\nimport { create_lift } from 'game/lift.js';\nimport { create_rock } from 'game/rock.js';\nimport { create_beam } from 'game/beam.js';\nimport { create_lens } from 'game/lens.js';\nimport { create_leak } from 'game/leak.js';\n\nexport const ENGAGE = 3.4, URGENT = 2.6, LENS_ENGAGE = 6.0;             // the lens takes ~1.5 s from forming to cutting\nconst ON_T = 0.08, HOLD = 0.45, LOWER = 0.3;\n// round 19 (owner: \"He should point, wait a beat, then attack, currently he's attacking before he\n// finishes pointing\"; it went off with the arm still swinging up at ~3 rad/s): it goes off only\n// once his head is on the spot and his arm has arrived (its swing below ARRIVE rad/s), after a\n// beat of stillness; at most AIM_MAX after the aim starts. Something about to reach the egg: a\n// looser arrival and a shorter beat.\n// Round 20 (owner): the beat 0.15 s (\"a tad too long\"); fire's own 0.05 s (\"that one should be quick\").\nconst ARRIVE = 0.7, BEAT = 0.15, AIM_MAX = 1.2, QUICK_ARRIVE = 1.6, QUICK_BEAT = 0.08, QUICK_MAX = 0.45;\nconst SOON = 1.5;\n// round 20: with a snake waiting, he goes from one gesture to the next without lowering his arm,\n// after holding this long (the hand, shared by the gestured powers, was the bottleneck: with\n// five powers the lens made up for it and was used twice as much)\nconst HOLD_CHAIN = 0.2;\n// round 22 (owner: \"he tries to orient his body such that what he points at [is] in a 180 degree\n// angle in front of him ... his body should orient itself such that it doesn't break, or he\n// should drop a previous target, maybe? I don't know\"): O picks which. Either way a new gesture\n// prefers a snake in front of him; one behind him he only turns for when nothing in front will\n// do, or it is about to reach the egg.\nexport const FACINGS = ['TURNS TO KEEP IT IN FRONT', 'LETS GO OF IT'];\nconst FRONT = Math.PI/2;            // behind = past his shoulders' line\nconst ARM_UP = 1.66, FIRE_IN = 1.4; // his arm rises only once it is within 95 deg, and it goes off within 80\n\nexport function create_powers(ctx) {\n  const { snakes, fire, lich, mover, egg, get_L, rng } = ctx;\n  const N = snakes.RINGS;\n  const FIRE = {\n    name: 'FIRE', gesture: true, cooldown: 5.0, beat: 0.05,\n    capacity: p => Math.ceil(p/2),\n    aim_ring: () => Math.round(N*rng.float(0.15, 0.75)),\n    cast(targets, from, ring) {\n      // the first catches where he points; any others a beat after, one by one\n      targets.forEach((s, k) => { if (k === 0) snakes.ignite(s, ring); else later.push({ at: clock + k*0.12, s }); });\n    },\n    update() { },\n  };\n  const later = [];\n  // round 23 (owner): wind is replaced by the rock throw\n  const lift = create_lift(ctx), rock = create_rock(ctx), beam = create_beam(ctx), lens = create_lens(ctx), leak = create_leak(ctx);\n  const ALL = [FIRE, lift, rock, leak, beam, lens];\n  const on = new Map(ALL.map(a => [a, true]));\n  const next = new Map(ALL.map(a => [a, 1.0])), last = new Map(ALL.map((a, i) => [a, -10 + i]));\n  let clock = 0, power = 1;\n  // tests: how many times each power was used, and how many snakes each took (leakage: dissolved)\n  const uses = new Map(ALL.map(a => [a, 0])), took = new Map(ALL.map(a => [a, 0]));\n  // the rotation: uses since the set of powers last changed\n  const fair = new Map(ALL.map(a => [a, 0]));\n  const count = (a, n) => { uses.set(a, uses.get(a) + 1); took.set(a, took.get(a) + n); fair.set(a, fair.get(a) + 1); };\n  const reset_fair = () => { for (const a of ALL) fair.set(a, 0); };\n  let quick_lens = 0;                 // tests: lenses fired at once, for something about to reach the egg\n  lens.use_claims(s => unclaimed(s), s => claim(s, 'LENS', 2.0));\n  const G = { phase: 'idle', ab: null, targets: [], t: 0, on_t: 0, arm: 1, ring: 0, primary: null, quick: false, w: 0, pw: 0, point: new THREE.Vector3(), must_turn: false };\n  let facing = 0, drops = 0, test_old = false;       // test_old: round 21's facing, to compare against\n  // where something is from his facing (radians, 0 = straight ahead), and whether it is behind him\n  const rel_yaw = (c) => { const L = get_L(); const a = Math.atan2(c.x - L.x, c.z - L.z) - mover.yaw; return Math.atan2(Math.sin(a), Math.cos(a)); };\n  const behind = (c) => Math.abs(rel_yaw(c)) > FRONT;\n  const TIP = new THREE.Vector3();\n  // a lens forms from his mind: when his hands are free he glances up at it while it forms\n  const LOOK = { p: new THREE.Vector3(), t: 9 };\n\n  const d_egg = s => Math.hypot(s.x - egg.x, s.z - egg.z);\n  const unclaimed = s => snakes.free(s) && !(s.claim && s.claim_until > clock);\n  const claim = (s, who, secs) => { s.claim = who; s.claim_until = clock + secs; };\n  const threats = (R) => snakes.S.filter(s => unclaimed(s) && d_egg(s) \u003c R).sort((a, b) => d_egg(a) - d_egg(b));\n\n  // where he looks from his facing (yaw) and down (pitch), toward a point\n  const gaze_to = (c) => {\n    const L = get_L();\n    const a = Math.atan2(c.x - L.x, c.z - L.z) - mover.yaw;\n    return [Math.atan2(Math.sin(a), Math.cos(a)), Math.atan2(L.y + 0.75 - c.y, Math.max(0.3, Math.hypot(c.x - L.x, c.z - L.z)))];\n  };\n  // the arm on the target's side (his left arm, the reaching one, when it's ahead)\n  const pick_arm = (c) => {\n    const L = get_L(), yw = mover.yaw;\n    const x = (c.x - L.x)*Math.cos(yw) - (c.z - L.z)*Math.sin(yw);\n    const z = (c.x - L.x)*Math.sin(yw) + (c.z - L.z)*Math.cos(yw);\n    return x > -0.25*Math.abs(z) ? 1 : 0;\n  };\n\n  function start_gesture(ab, targets, quick) {\n    for (const s of targets) claim(s, ab.name, 2.0);\n    G.phase = 'aim'; G.ab = ab; G.targets = targets; G.t = 0; G.on_t = 0; G.still = 0; G.quick = quick;\n    G.primary = targets[0]; G.ring = ab.aim_ring();\n    G.point.copy(G.primary.spine[G.ring]);\n    G.arm = pick_arm(G.point);\n    // letting go of what goes behind him (O): not of one he had to turn for\n    G.must_turn = behind(G.point);\n  }\n\n  function tick(t, dt) {\n    clock += dt;\n    const actives = ALL.filter(a => on.get(a));\n    power = actives.length ? 6/actives.length : 1;\n    leak.scale(power, ENGAGE);\n    for (const a of ALL) next.set(a, next.get(a) - dt);\n    // fire's second and later catches\n    for (let i = later.length - 1; i >= 0; i--) if (clock >= later[i].at) { snakes.ignite(later[i].s); later.splice(i, 1); }\n\n    // about to reach the egg with nothing on it yet (claimed or not: a claim can be too slow)\n    const urgent = new Set(snakes.S.filter(s => snakes.free(s) && d_egg(s) \u003c URGENT));\n    const gestured = actives.filter(a => a.gesture);\n    lift.update(dt);\n    // whose turn: the fewest uses among the powers that are ready or nearly\n    const acting = actives.filter(a => a !== leak);\n    let low = Infinity;\n    for (const a of acting) if (next.get(a) \u003c SOON && (a !== lens || lens.free_lenses() > 0)) low = Math.min(low, fair.get(a));\n    const turn = a => fair.get(a) \u003c= low;\n\n    // --- the gestured powers, one at a time\n    // the next gesture, if there is something to take and a power whose turn it is\n    const try_gesture = () => {\n      // round 23: a power can take them from further out than ENGAGE (the rock needs its flight time)\n      const far = Math.max(ENGAGE, ...gestured.map(a => a.engage || ENGAGE));\n      const th_all = threats(far);\n      if (!(th_all.length || urgent.size) || !gestured.length) return false;\n      const quick = urgent.size > 0;\n      const has = a => quick || th_all.some(s => d_egg(s) \u003c (a.engage || ENGAGE));\n      let ready = gestured.filter(a => next.get(a) \u003c= 0 && (quick || turn(a)) && has(a));\n      if (!ready.length && quick) {\n        // something is about to reach the egg: whichever power is soonest goes now\n        const a = gestured.reduce((x, y) => (next.get(x) \u003c= next.get(y) ? x : y));\n        next.set(a, 0); ready = [a];\n      }\n      if (!ready.length) return false;\n      // the least used, then the least recently used\n      const ab = ready.reduce((x, y) => (fair.get(x) \u003c fair.get(y) || (fair.get(x) === fair.get(y) && last.get(x) \u003c= last.get(y)) ? x : y));\n      const th = th_all.filter(s => d_egg(s) \u003c (ab.engage || ENGAGE));\n      const first = quick ? [...urgent].sort((a, b) => d_egg(a) - d_egg(b)) : [];\n      // in front of him first (the list is already nearest the egg first)\n      const ahead = th.filter(s => !urgent.has(s)).map(s => [s, !test_old && behind(s.spine[Math.round(N*0.3)]) ? 1 : 0]).sort((a, b) => a[1] - b[1]).map(q => q[0]);\n      // letting go (O): one behind him only if it is about to reach the egg\n      const pick = [...first, ...(facing === 1 ? ahead.filter(s => !behind(s.spine[Math.round(N*0.3)])) : ahead)];\n      if (!pick.length) return false;\n      start_gesture(ab, pick.slice(0, Math.max(1, ab.capacity(power))), quick);\n      return true;\n    };\n    if (G.phase === 'idle') {\n      try_gesture();\n    } else if (G.phase === 'aim') {\n      G.t += dt;\n      const s = G.primary;\n      if (!on.get(G.ab) || !snakes.free(s) || (facing === 1 && !G.must_turn && behind(s.spine[G.ring]))) {\n        if (on.get(G.ab) && snakes.free(s)) drops++;\n        // it's gone (another power took it), or the power was taken from him: let go, try again\n        for (const q of G.targets) q.claim = null;\n        G.phase = 'lower'; G.t = 0;\n      } else {\n        G.point.copy(s.spine[G.ring]);\n        const [gy] = gaze_to(G.point);\n        const S = lich.springs, reach = Math.max(-1.45, Math.min(1.45, gy));\n        G.on_t = Math.abs(reach - (S.hy.x + S.cy.x)) \u003c 0.12 ? G.on_t + dt : 0;\n        // (round 22: and with it in front of him: one behind him he turns to before his arm comes up)\n        const arrived = G.pw >= 1 && G.on_t >= ON_T && lich.arm_speed(G.arm) \u003c (G.quick ? QUICK_ARRIVE : ARRIVE) && (test_old || Math.abs(rel_yaw(G.point)) \u003c FIRE_IN);\n        G.still = arrived ? G.still + dt : 0;\n        const beat = Math.min(G.ab.beat ?? BEAT, G.quick ? QUICK_BEAT : 9);\n        if (G.still >= beat || G.t >= (G.quick ? QUICK_MAX : AIM_MAX)) {\n          const targets = G.targets.filter(q => snakes.free(q));\n          lich.fingertip(G.arm, TIP);\n          G.ab.cast(targets, TIP, G.ring, G.arm, G.quick);\n          count(G.ab, targets.length);\n          next.set(G.ab, G.ab.cooldown/power); last.set(G.ab, clock);\n          G.phase = 'hold'; G.t = 0;\n        }\n      }\n    } else if (G.phase === 'hold') {\n      G.t += dt;\n      // a channelled power (the beam; the lift, round 20) keeps his hand up, following it, until it ends\n      let channel = G.ab.busy && G.ab.busy();\n      if (channel) { G.t = 0; const p = G.ab.aim_point(); if (p) G.point.copy(p); }\n      // letting go (O): what he holds has gone behind him (he was moved away from it): the beam\n      // ends, the lift goes on without his hand\n      if (facing === 1 && !G.must_turn && behind(G.point)) {\n        if (channel && G.ab.let_go) G.ab.let_go();\n        drops++; G.phase = 'lower'; G.t = 0; channel = false;\n      }\n      // something about to reach the egg: a channel takes it on; any other hold gives way at once\n      if (urgent.size) {\n        / e/util.js';\r\nimport { gi_dynamic } from 'game/gi.js';\r\n\r\n// (quick: from his gesture to the hit it has ~2 s, the time a snake 5.6 m out takes to reach the egg)\r\nconst HOLD = 0.25, STAGGER = 0.12, SPEED = 17, ACCEL = 55, GRAV = 9.8, HIT_R = 0.14;\r\nconst CONTROL_MAX = 1.4;              // s of flight before he lets go of one that has hit nothing\r\nconst REST = 3.0, SINK = 1.2;\r\n\r\nexport function create_rock(ctx) {\r\n  const { R, snakes, fx, cave, rng, gore, warp, lich, get_L } = ctx;\r\n  const N = snakes.RINGS, mid = Math.round(N*0.4);\r\n\r\n  // ---------------------------------------------------------------- the rocks\r\n  const mat = new THREE.MeshLambertMaterial({ map: cave.rock_tex, color: 0xffffff, flatShading: true });\r\n  if (cave.GU) gi_dynamic(mat, cave.GU);\r\n  const make_geo = () => {\r\n    const pts = [];\r\n    const sx = rng.float(0.17, 0.23), sy = rng.float(0.13, 0.17), sz = rng.float(0.15, 0.2);\r\n    for (let i = 0; i \u003c 16; i++) { const v = new THREE.Vector3(rng.spread(2), rng.spread(2), rng.spread(2)); if (v.length() > 1) v.normalize(); pts.push(new THREE.Vector3(v.x*sx, v.y*sy, v.z*sz)); }\r\n    const g = new ConvexGeometry(pts);                // already non-indexed\r\n    g.computeVertexNormals();\r\n    // the cave's rock texture, projected along each face's main axis (2 m to a tile, as the cave)\r\n    const p = g.attributes.position, uv = new Float32Array(p.count*2), n = g.attributes.normal;\r\n    for (let i = 0; i \u003c p.count; i++) {\r\n      const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));\r\n      const [u, v] = ay >= ax && ay >= az ? [p.getX(i), p.getZ(i)] : ax >= az ? [p.getZ(i), p.getY(i)] : [p.getX(i), p.getY(i)];\r\n      uv[i*2] = u/2 + 0.37; uv[i*2 + 1] = v/2 + 0.61;\r\n    }\r\n    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));\r\n    return { g, r: (sx + sy + sz)/3 };\r\n  };\r\n  const POOL = [];\r\n  for (let i = 0; i \u003c 8; i++) {\r\n    const { g, r ough: a free snake whose body it touches\r\n  function hits(q, cb) {\r\n    const p = q.m.position;\r\n    for (const s of snakes.S) {\r\n      if (!snakes.free(s) || q.hit.includes(s)) continue;\r\n      let best = 1e9, bi = -1;\r\n      for (let j = 2; j \u003c N - 2; j++) { const d = s.spine[j].distanceTo(p); if (d \u003c best) { best = d; bi = j; } }\r\n      if (best \u003c q.r + HIT_R) cb(s, bi);\r\n    }\r\n  }\r\n\r\n  // ---------------------------------------------------------------- aiming\r\n  // where a snake's middle will be `dt` from now (it crawls on toward the egg)\r\n  const ahead = (s, dt, out) => {\r\n    const a = s.spine[mid], b = s.spine[Math.min(N - 1, mid + 4)];\r\n    V.subVectors(a, b).setY(0); const l = V.length() || 1;\r\n    return out.copy(a).addScaledVector(V, (s.speed || 1.1)*dt/l);\r\n  };\r\n  // of the lines through a free snake, the one whose ~4 m beyond it crosses the most bodies\r\n  // taken by another rock of his, in the air or about to be\r\n  const claimed = (s, q) => live.some(o => o !== q && o.target === s && (o.phase !== 'rest'));\r\n  // a snake for a rock whose own is gone: the free one nearest the egg that no other rock has\r\n  const another = (q) => {\r\n    let best = null, bd = 1e9;\r\n    for (const s of snakes.S) {\r\n      if (!snakes.free(s) || claimed(s, q)) continue;\r\n      const d = Math.hypot(s.x - snakes.egg.x, s.z - snakes.egg.z);\r\n      if (d \u003c bd && d \u003c 7) { bd = d; best = s; }\r\n    }\r\n    return best;\r\n  };\r\n  function best_line(from, first, q) {\r\n    const cands = [first, ...snakes.S.filter(s => s !== first && snakes.free(s) && !claimed(s, q) && s.spine[mid].distanceTo(first.spine[mid]) \u003c 4)];\r\n    let best = { s: first, n: 0 };\r\n    const P0 = new THREE.Vector3(), D = new THREE.Vector3();\r\n    for (const c of cands) {\r\n      ahead(c, from.distanceTo(c.spine[mid])/SPEED, P0);\r\n      D.subVectors(P0, from).setY(0).normalize();\r\n      let n = 0;\r\n      for (const s of snakes.S) {\r\n        if (!snakes.free(s)) continue;\r\n        for (let j = 4; j \u003c N - 4; j += 5) {\r\n          V.subVectors(s.spine[j], P0).setY(0);\r\n          const along = V.dot(D), across = Math.abs(V.x*D.z - V.z*D.x);\r\n          if (along > -0.6 && along \u003c 4 && across \u003c 0.3) { n++; break; }\r\n        }\r\n      }\r\n      if (n > best.n) best = { s: c, n };\r\n    }\r\n    return best.s;\r\n  }\r\n\r\n  // ---------------------------------------------------------------- one rock\r\n  // quick (something about to reach the egg): it tears out and goes almost at once\r\n  function raise(target, k, arm, quick = false) {\r\n    const q = POOL.find(p => !p.on);\r\n    if (!q) return;\r\n    const L = get_L();\r\n    const dir = V.subVectors(target.spine[mid], L).setY(0).normalize().clone();\r\n    const side = new THREE.Vector3(-dir.z, 0, dir.x);\r\n    // out of the floor in front of him, up beside his hand\r\n    const off = (k - 0.5*(k > 0 ? 1 : 0))*0.45*(k % 2 ? 1 : -1);\r\n    const from = L.clone().addScaledVector(dir, 1.15).addScaledVector(side, off*1.2);\r\n    from.y = cave.ground_y(from.x, from.z) - q.r*0.8;\r\n    const hold = L.clone().addScaledVector(dir, 1.0).addScaledVector(side, off);\r\n    hold.y = L.y + 0.45 + k*0.12;\r\n    Object.assign(q, { on: true, phase: 'rip', t: -k*STAGGER*(quick ? 0.4 : 1), quick, hold_t: quick ? 0.05 : HOLD, speed: quick ? SPEED*1.45 : SPEED,\r\n      accel: quick ? ACCEL*2.2 : ACCEL, ramp: 0, ph: [rng.float(0, 6.28), rng.float(0, 6.28), rng.float(0, 6.28), rng.float(0, 6.28)], ctrl: true,\r\n      torn: false, hits: 0, from, hold, target, arm, hit: [], v: new THREE.Vector3(), w: new THREE.Vector3(),\r\n      rest: 0, bounced: 0, wake: 0, dir });\r\n    q.m.position.copy(from); q.m.visible = true;\r\n    q.m.quaternion.setFromEuler(new THREE.Euler(rng.float(0, 6), rng.float(0, 6), rng.float(0, 6)));\r\n    live.push(q);\r\n  }\r\n  // it tears out of the floor: dust, grit thrown up, a ripple of warped air across the floor\r\n  function tear(q) {\r\n    const p = q.from, gy = cave.ground_y(p.x, p.z);\r\n    for (let k = 0; k \u003c 16; k++) {\r\n      const a = rng.float(0, 6.28), r = rng.float(0.05, 0.35);\r\n      fx.puff({ x: p.x + Math.cos(a)*r, y: gy + 0.05, z: p.z + Math.sin(a)*r, vx: Math.cos(a)*rng.float(0.5, 1.4), vy: rng.float(0.3, 1.2), vz: Math.sin(a)*rng.float(0.5, 1.4),\r\n        drag: 2.0, life: rng.float(0.8, 1.5), s0: 0.12, s1: 0.45, r: 0.035, g: 0.03, b: 0.022, a: 0.55 });\r\n    }\r\n    for (let k = 0; k \u003c 9; k++) {\r\n      const c = fx.chunk();\r\n      Object.assign(c, { life: rng.float(1.5, 2.5), x: p.x + rng.spread(0.2), y: gy + 0.05, z: p.z + rng.spread(0.2), vx: rng.spread(1.6), vy: rng.float(1.5, 3.2), vz: rng.spread(1.6),\r\n        rx: 0, ry: 0, rz: 0, wx: rng.spread(10), wy: rng.spread(10), wz: rng.spread(10), s: rng.float(0.018, 0.04), sx: 1, sy: rng.float(0.6, 1), sz: 1 });\r\n    }\r\n    for (let k = 0; k \u003c 5; k++) warp.puff({ x: p.x + rng.spread(0.3), y: gy + 0.2, z: p.z + rng.spread(0.3), vy: 0.5, life: 0.7, s0: 0.2, s1: 0.7, amp: 3.5, spin: rng.spread(3) });\r\n  }\r\n  // his force round it while it is held, and the wake behind it as it flies\r\n  const aura = (p, big) => warp.puff({ x: p.x + rng.spread(0.12), y: p.y + rng.spread(0.12), z: p.z + rng.spread(0.12), vx: rng.spread(0.2), vy: rng.spread(0.2), vz: rng.spread(0.2),\r\n    drag: 2, life: rng.float(0.25, 0.45), s0: 0.3*big, s1: 0.55*big, amp: 3.2, spin: rng.spread(4) });\r\n\r\n  function update(t, dt) {\r\n    for (let i = live.length - 1; i >= 0; i--) {\r\n      const q = live[i], m = q.m;\r\n      q.t += dt;\r\n      if (q.t \u003c 0) continue;\r\n      // its snake has come close to the egg while it rises or is held: it hurries (emergency timing)\r\n      if (!q.quick && q.target && (q.phase === 'rip' || q.phase === 'hold' || q.phase === 'fly') && Math.hypot(q.target.x - snakes.egg.x, q.target.z - snakes.egg.z) \u003c 2.9) {\r\n        q.quick = true; q.hold_t = Math.min(q.hold_t, 0.05); q.speed = SPEED*1.45; q.accel = ACCEL*2.2;\r\n      }\r\n      // the slow forces of an imprecise mind: never quite steady, never the same twice\r\n      const wander = (amp, out) => out.set(\r\n        (Math.sin(t*2.1 + q.ph[0])*0.6 + Math.sin(t*4.7 + q.ph[1])*0.4)*amp,\r\n        (Math.sin(t*1.7 + q.ph[2])*0.6 + Math.sin(t*3.9 + q.ph[3])*0.4)*amp*0.6,\r\n        (Math.sin(t*2.6 + q.ph[1])*0.6 + Math.sin(t*5.3 + q.ph[2])*0.4)*amp);\r\n      // his hand on it, held: a spring toward where he means it to be (f Hz, damping z), its push\r\n      // capped at amax and easing in over 0.15 s whenever what he wants of it changes\r\n      const hold_on = (T, f, z, amax, wob) => {\r\n        const w = 6.2832*f;\r\n        q.ramp = Math.min(1, q.ramp + dt/0.15);\r\n        A.subVectors(T, m.position).multiplyScalar(w*w).addScaledVector(q.v, -2*z*w);\r\n        A.add(wander(wob, V));\r\n        const l = A.length(), cap = amax*q.ramp;\r\n        if (l > cap) A.multiplyScalar(cap/l);\r\n        q.v.addScaledVector(A, dt);\r\n        m.position.addScaledVector(q.v, dt);\r\n      };\r\n      // a slow tumble that it gathers and loses\r\n      const spin = (to, rate) => { q.w.multiplyScalar(1 - Math.min(1, rate*dt)); if (q.w.length() \u003c to) q.w.addScaledVector(V.set(q.ph[0] - 3, q.ph[1] - 3, q.ph[2] - 3).normalize(), to*rate*dt); };\r\n      if (q.phase === 'rip') {\r\n        if (!q.torn) { q.torn = true; tear(q); q.v.set(q.dir.x*0.6, q.quick ? 5 : 3.4, q.dir.z*0.6); q.ramp = 0.3; }\r\n        // it breaks out of the floor and is drawn up beside his hand, over-rising a little and settling\r\n        hold_on(q.hold, q.quick ? 2.4 : 1.5, 0.5, q.quick ? 90 : 40, 2.5);\r\n        spin(2, 3);\r\n        if (rng.next() \u003c 0.5) aura(m.position, 0.9);\r\n        const near = m.position.distanceTo(q.hold) \u003c 0.2 && q.v.length() \u003c 1.2;\r\n        if ((q.t > (q.quick ? 0.12 : 0.3) && near) || q.t > (q.quick ? 0.25 : 0.6)) { q.phase = 'hold'; q.pt = 0; q.ramp = 0.5; }\r\n      } else if (q.phase === 'hold') {\r\n        q.pt += dt;\r\n        // held: floating, bobbing, drifting on his attention; just before it goes it is drawn back\r\n        // a little toward him (the throw gathered)\r\n        const back = smoothstep(q.hold_t - 0.14, q.hold_t, q.pt);\r\n        TG.copy(q.hold).addScaledVector(q.dir, -0.18*back);\r\n        TG.y += 0.05*back + Math.sin(t*2.2 + q.ph[0])*0.03;\r\n        hold_on(TG, 1.3, 0.42, 25, 2.0);\r\n        spin(0.8, 2);\r\n        if (rng.next() \u003c 0.7) aura(m.position, 1);\r\n        if (q.pt >= q.hold_t) {\r\n          // thrown: along the line that takes the most, toward where its snake will be\r\n          if (!q.target || !snakes.free(q.target) || claimed(q.target, q)) q.target = another(q);\r\n          q.target = q.target ? best_line(m.position, q.target, q) : null;\r\n          q.phase = 'fly'; q.ft = 0; q.ramp = 0.35; q.s_cmd = q.v.length(); q.l0 = m.position.clone();\r\n          q.h0 = q.target ? Math.max(1, Math.hypot(q.target.spine[mid].x - m.position.x, q.target.spine[mid].z - m.position.z)) : 4;\r\n          stats.thrown++;\r\n          for (let k = 0; k \u003c 4; k++) aura(m.position, 1.3);\r\n        }\r\n      } else if (q.phase === 'fly') {\r\n        q.ft += dt;\r\n        if (q.ctrl && q.target && (!snakes.free(q.target) || q.hit.includes(q.target))) {\r\n          // its snake gone before it got there: another, or he lets it go\r\n          const o = q.hit.length ? null : another(q);\r\n          if (o) q.target = o; else q.ctrl = false;\r\n        }\r\n        if (q.ctrl && q.target && q.ft \u003c CONTROL_MAX) {\r\n          // urged at its snake along a floating arc: it gathers speed (never leaves at full\r\n          // speed), wanders a little off the line and is corrected, and dives onto the body\r\n          ahead(q.target, 0, TG); TG.y = cave.ground_y(TG.x, TG.z) + 0.1;\r\n          const hx = TG.x - m.position.x, hz = TG.z - m.position.z, h = Math.max(1e-3, Math.hypot(hx, hz));\r\n          q.s_cmd = Math.min(q.speed, q.s_cmd + q.accel*dt);\r\n          const u = Math.min(1, 1 - h/q.h0), arc = Math.min(0.6, 0.1*q.h0)*(q.quick ? 0.5 : 1);\r\n          const look = Math.min(1, u + q.s_cmd*0.12/q.h0);\r\n          const y_next = m.position.y + (TG.y - m.position.y)*Math.min(1, q.s_cmd*0.12/h) + arc*4*(look*(1 - look) - u*(1 - u));\r\n          V2.set(hx/h*q.s_cmd, (y_next - m.position.y)/0.12, hz/h*q.s_cmd);\r\n          q.ramp = Math.min(1, q.ramp + dt/0.15);\r\n          A.subVectors(V2, q.v).multiplyScalar(12);\r\n          // imprecise: a slow sideways and up-and-down wander that the correction keeps catching\r\n          const side = V.set(-hz/h, 0, hx/h).multiplyScalar((Math.sin(t*3.1 + q.ph[0])*0.7 + Math.sin(t*6.3 + q.ph[3])*0.3)*7);\r\n          A.add(side); A.y += Math.sin(t*2.7 + q.ph[2])*3;\r\n          const l = A.length(), cap = q.accel*1.4*q.ramp;\r\n          if (l > cap) A.multiplyScalar(cap/l);\r\n          q.v.addScaledVector(A, dt);\r\n          m.position.addScaledVector(q.v, dt);\r\n        } else {\r\n          // his, no longer: it flies on as a thrown thing does\r\n          q.ctrl = false;\r\n          q.v.y -= GRAV*dt;\r\n          m.position.addScaledVector(q.v, dt);\r\n        }\r\n        spin(q.ctrl ? 9 : 5, 2.5);\r\n        const wl = q.w.length();\r\n        if (wl > 1e-3) { Q.setFromAxisAngle(V.copy(q.w).multiplyScalar(1/wl), wl*dt); m.quaternion.premultiply(Q); }\r\n        // its wake\r\n        q.wake += dt*40*Math.min(1, q.v.length()/6);\r\n        while (q.wake >= 1) { q.wake -= 1; warp.puff({ x: m.position.x, y: m.position.y, z: m.position.z, vx: -q.v.x*0.05, vy: 0.05, vz: -q.v.z*0.05, drag: 3, life: rng.float(0.25, 0.4), s0: 0.22, s1: 0.5, amp: 3.4, spin: rng.spread(3) }); }\r\n        // what it goes through is crushed; it loses a little each time\r\n        hits(q, (s, j) => {\r\n          const dir = V2.copy(q.v).setY(0).normalize().clone();\r\n          snakes.take(s, crush_fx(s, Math.max(3, j), dir, q.v));\r\n          s.claim = null;\r\n          q.hit.push(s);\r\n          gore.crush(s.spine[j], dir, s.radii[j]);\r\n          q.v.multiplyScalar(0.78);\r\n          q.ctrl = false;\r\n          q.hits = (q.hits || 0) + 1; stats.hits++; if (q.hits === 2) stats.multi++;\r\n        });\r\n        // the floor: it bounces, skids, and comes to rest\r\n        const gy = cave.ground_y(m.position.x, m.position.z) + q.r*0.75;\r\n        if (m.position.y \u003c gy) {\r\n          m.position.y = gy;\r\n          if (q.v.y \u003c 0) {\r\n            for (let k = 0; k \u003c 8; k++) fx.puff({ x: m.position.x + rng.spread(0.15), y: gy - q.r*0.5, z: m.position.z + rng.spread(0.15), vx: rng.spread(0.8) + q.v.x*0.1, vy: rng.float(0.2, 0.7), vz: rng.spread(0.8) + q.v.z*0.1,\r\n              drag: 2.2, life: rng.float(0.7, 1.2), s0: 0.1, s1: 0.35, r: 0.035, g: 0.03, b: 0.022, a: 0.45 });\r\n            q.v.y = Math.abs(q.v.y) > 1.5 ? -q.v.y*0.32 : 0;\r\n            q.v.x *= 0.72; q.v.z *= 0.72; q.w.multiplyScalar(0.6);\r\n            q.bounced++;\r\n          }\r\n          // skidding along the floor\r\n          const d = 1 - Math.min(1, 2.2*dt); q.v.x *= d; q.v.z *= d;\r\n        }\r\n        if (q.bounced && Math.hypot(q.v.x, q.v.z) \u003c 0.6 && Math.abs(q.v.y) \u003c 0.3) { q.phase = 'rest'; q.rest = 0; if (!q.hits) stats.missed++; }\r\n      }\r\n      if (q.phase === 'rip' || q.phase === 'hold') {\r\n        const wl = q.w.length();\r\n        if (wl > 1e-3) { Q.setFromAxisAngle(V.copy(q.w).multiplyScalar(1/wl), wl*dt); m.quaternion.premultiply(Q); }\r\n      }\r\n      if (q.phase === 'rest') {\r\n        q.rest += dt;\r\n        if (q.rest > REST) m.position.y -= (q.r*2.4/SINK)*dt;\r\n        if (q.rest > REST + SINK) { q.on = false; m.visible = false; live.splice(i, 1); }\r\n      }\r\n    }\r\n  }\r\n\r\n  return {\r\n    name: 'ROCK', gesture: false,\r\n    cooldown: 5.0,\r\n    engage: 5.6,                      // it needs the time to rise and fly: it takes them further out\r\n    capacity: p => Math.ceil(p/1.5),\r\n    // where he points: the middle of the body\r\n    aim_ring: () => mid,\r\n    cast(targets, from, ring, arm = 1, quick = false) { targets.forEach((s, k) => raise(s, k, arm, quick)); },\r\n    update,\r\n    // tests / the director: how many it is holding or throwing now\r\n    get busy() { return live.filter(q => q.phase !== 'rest').length; },\r\n    free_rocks: () => POOL.filter(p => !p.on).length,\r\n    // where the first it raises will be held (he glances at it)\r\n    hold_at: () => { const q = live.find(q => q.phase === 'rip' || q.phase === 'hold'); return q ? q.hold : null; },\r\n    stats,\r\n    // tests\r\n    debug: () => live.map(q => [q.phase, q.hits || 0, +q.m.position.x.toFixed(2), +q.m.position.y.toFixed(2), +q.m.position.z.toFixed(2),\r\n      q.target ? [+q.target.spine[mid].x.toFixed(2), +q.target.spine[mid].z.toFixed(2)] : null]),\r\n  };\r\n}\r\n","game/sdf.js":"// sdf.js -- sculpting with signed distance fields, and meshing them (naive surface nets).\n//\n// A shape is a function (x, y, z) -> signed distance (negative inside). mesh_sdf() samples it\n// on a grid over a box and builds an indexed mesh: one vertex per cell the surface crosses, at\n// the mean of that cell's edge crossings, one quad per crossed edge. Normals come from the\n// field's gradient, so the surface is smooth whatever the voxel size.\nimport * as THREE from 'three';\n\n// ---------------------------------------------------------------- primitives (return distance)\nexport const sphere = (x, y, z, cx, cy, cz, r) => Math.hypot(x - cx, y - cy, z - cz) - r;\n\nexport function ellipsoid(x, y, z, cx, cy, cz, rx, ry, rz) {\n  const px = (x - cx)/rx, py = (y - cy)/ry, pz = (z - cz)/rz;\n  const k0 = Math.hypot(px, py, pz);\n  const k1 = Math.hypot(px/rx, py/ry, pz/rz);\n  return k1 \u003c 1e-9 ? -Math.min(rx, ry, rz) : k0*(k0 - 1)/k1;\n}\n\n// capsule between a and b with radius ra at a and rb at b (a \"round cone\" when they differ)\nexport function cone(x, y, z, ax, ay, az, bx, by, bz, ra, rb) {\n  const px = x - ax, py = y - ay, pz = z - az;\n  const dx = bx - ax, dy = by - ay, dz = bz - az;\n  const L2 = dx*dx + dy*dy + dz*dz;\n  let t = L2 > 0 ? (px*dx + py*dy + pz*dz)/L2 : 0;\n  t = t \u003c 0 ? 0 : t > 1 ? 1 : t;\n  const qx = px - dx*t, qy = py - dy*t, qz = pz - dz*t;\n  return Math.hypot(qx, qy, qz) - (ra + (rb - ra)*t);\n}\nexport const capsule = (x, y, z, ax, ay, az, bx, by, bz, r) => cone(x, y, z, ax, ay, az, bx, by, bz, r, r);\n\nexport function rbox(x, y, z, cx, cy, cz, hx, hy, hz, r) {\n  const qx = Math.abs(x - cx) - hx + r, qy = Math.abs(y - cy) - hy + r, qz = Math.abs(z - cz) - hz + r;\n  const ox = Math.max(qx, 0), oy = Math.max(qy, 0), oz = Math.max(qz, 0);\n  return Math.hypot(ox, oy, oz) + Math.min(Math.max(qx, qy, qz), 0) - r;\n}\n\n// a chain of round cones through points [[x,y,z,r], ...] (smooth-unioned with k)\nexport function chain(x, y, z, P, k = 0) {\n  let d = Infinity;\n  for (let i = 0; i \u003c P.length - 1; i++) {\n    const a = P[i], b = P[i + 1];\n    const e = cone(x, y, z, a[0], a[1], a[2], b[0], b[1], b[2], a[3], b[3]);\n    d = k > 0 ? smin(d, e, k) : Math.min(d, e);\n  }\n  return d;\n}\n\n// ---------------------------------------------------------------- combinators\nexport function smin(a, b, k) {\n  if (!isFinite(a)) return b;\n  const h = Math.max(k - Math.abs(a - b), 0)/k;\n  return Math.min(a, b) - h*h*k*0.25;\n}\nexport function smax(a, b, k) { return -smin(-a, -b, k); }\nexport const sub = (a, b, k = 0) => (k > 0 ? smax(a, -b, k) : Math.max(a, -b));\n\n// ---------------------------------------------------------------- meshing\n// f: the field; box: [x0, y0, z0, x1, y1, z1]; h: voxel size. Returns a BufferGeometry (indexed)\nexport function mesh_sdf(f, box, h) {\n  const pad = 2*h;\n  const x0 = box[0] - pad, y0 = box[1] - pad, z0 = box[2] - pad;\n  const nx = Math.ceil((box[3] + pad - x0)/h) + 1, ny = Math.ceil((box[4] + pad - y0)/h) + 1, nz = Math.ceil((box[5] + pad - z0)/h) + 1;\n  const F = new Float32Array(nx*ny*nz);\n  const I = (i, j, k) => (k*ny + j)*nx + i;\n  // narrow band: sample a lattice 4x coarser first; a fine point is evaluated only when the\n  // nearest coarse sample is close to the surface (the fields here are only roughly metric, so\n  // the band is generous); elsewhere the coarse value stands in (its sign is all that matters)\n  const Q = 4, cq = Q*h, band = cq*2.2;\n  const mx = Math.ceil((nx - 1)/Q) + 1, my = Math.ceil((ny - 1)/Q) + 1, mz = Math.ceil((nz - 1)/Q) + 1;\n  const Cs = new Float32Array(mx*my*mz);\n  for (let k = 0; k \u003c mz; k++) for (let j = 0; j \u003c my; j++) for (let i = 0; i \u003c mx; i++) Cs[(k*my + j)*mx + i] = f(x0 + i*cq, y0 + j*cq, z0 + k*cq);\n  for (let k = 0; k \u003c nz; k++) for (let j = 0; j \u003c ny; j++) for (let i = 0; i \u003c nx; i++) {\n    const c = Cs[(Math.min(mz - 1, Math.round(k/Q))*my + Math.min(my - 1, Math.round(j/Q)))*mx + Math.min(mx - 1, Math.round(i/Q))];\n    F[I(i, j, k)] = Math.abs(c) > band ? c : f(x0 + i*h, y0 + j*h, z0 + k*h);\n  }\n  const vid = new Int32Array((nx - 1)*(ny - 1)*(nz - 1)).fill(-1);\n  const C = (i, j, k) => (k*(ny - 1) + j)*(nx - 1) + i;\n  const pos = [];\n  const EDGES = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];\n  const corner = new Float32Array(8);\n  for (let k = 0; k \u003c nz - 1; k++) for (let j = 0; j \u003c ny - 1; j++) for (let i = 0; i \u003c nx - 1; i++) {\n    let mask = 0;\n    for (let c = 0; c \u003c 8; c++) {\n      const v = F[I(i + (c & 1), j + ((c >> 1) & 1), k + ((c >> 2) & 1))];\n      corner[c] = v;\n      if (v \u003c 0) mask |= 1 \u003c\u003c c;\n    }\n    if (mask === 0 || mask === 255) continue;\n    let sx = 0, sy = 0, sz = 0, n = 0;\n    for (const [a, b] of EDGES) {\n      const va = corner[a], vb = corner[b];\n      if ((va \u003c 0) === (vb \u003c 0)) continue;\n      const t = va/(va - vb);\n      sx += (a & 1) + (((b & 1) - (a & 1))*t);\n      sy += ((a >> 1) & 1) + ((((b >> 1) & 1) - ((a >> 1) & 1))*t);\n      sz += ((a >> 2) & 1) + ((((b >> 2) & 1) - ((a >> 2) & 1))*t);\n      n++;\n    }\n    vid[C(i, j, k)] = pos.length/3;\n    pos.push(x0 + (i + sx/n)*h, y0 + (j + sy/n)*h, z0 + (k + sz/n)*h);\n  }\n  const idx = [];\n  const quad = (a, b, c, d, flip) => {\n    if (a \u003c 0 || b \u003c 0 || c \u003c 0 || d \u003c 0) return;\n    if (flip) idx.push(a, c, b, a, d, c); else idx.push(a, b, c, a, c, d);\n  };\n  for (let k = 1; k \u003c nz - 1; k++) for (let j = 1; j \u003c ny - 1; j++) for (let i = 1; i \u003c nx - 1; i++) {\n    const v0 = F[I(i, j, k)] \u003c 0;\n    // x edge (i,j,k)-(i+1,j,k): cells around it share j-1..j, k-1..k\n    if (i \u003c nx - 1 && v0 !== (F[I(i + 1, j, k)] \u003c 0)) quad(vid[C(i, j - 1, k - 1)], vid[C(i, j, k - 1)], vid[C(i, j, k)], vid[C(i, j - 1, k)], !v0);\n    if (j \u003c ny - 1 && v0 !== (F[I(i, j + 1, k)] \u003c 0)) quad(vid[C(i - 1, j, k - 1)], vid[C(i - 1, j, k)], vid[C(i, j, k)], vid[C(i, j, k - 1)], !v0);\n    if (k \u003c nz - 1 && v0 !== (F[I(i, j, k + 1)] \u003c 0)) quad(vid[C(i - 1, j - 1, k)], vid[C(i, j - 1, k)], vid[C(i, j, k)], vid[C(i - 1, j, k)], !v0);\n  }\n  const g = new THREE.BufferGeometry();\n  const P = new Float32Array(pos);\n  g.setAttribute('position', new THREE.BufferAttribute(P, 3));\n  g.setIndex(idx);\n  // normals from the field's gradient\n  const N = new Float32Array(P.length), e = h*0.5;\n  for (let v = 0; v \u003c P.length; v += 3) {\n    const x = P[v], y = P[v + 1], z = P[v + 2];\n    let gx = f(x + e, y, z) - f(x - e, y, z), gy = f(x, y + e, z) - f(x, y - e, z), gz = f(x, y, z + e) - f(x, y, z - e);\n    const l = Math.hypot(gx, gy, gz) || 1;\n    N[v] = gx/l; N[v + 1] = gy/l; N[v + 2] = gz/l;\n  }\n  g.setAttribute('normal', new THREE.BufferAttribute(N, 3));\n  return g;\n}\n\n// the largest connected piece of an indexed mesh (crumbs a noisy field leaves are dropped)\nexport function largest_piece(g) {\n  const idx = g.index.array, n = g.attributes.position.count;\n  const parent = new Int32Array(n); for (let i = 0; i \u003c n; i++) parent[i] = i;\n  const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };\n  for (let t = 0; t \u003c idx.length; t += 3) { const a = find(idx[t]), b = find(idx[t + 1]), c = find(idx[t + 2]); parent[b] = a; parent[find(c)] = a; }\n  const count = new Map();\n  for (let t = 0; t \u003c idx.length; t += 3) { const r = find(idx[t]); count.set(r, (count.get(r) || 0) + 1); }\n  let best = -1, bn = 0;\n  for (const [r, c] of count) if (c > bn) { bn = c; best = r; }\n  const keep = [];\n  for (let t = 0; t \u003c idx.length; t += 3) if (find(idx[t]) === best) keep.push(idx[t], idx[t + 1], idx[t + 2]);\n  g.setIndex(keep);\n  return g;\n}\n\n// ---------------------------------------------------------------- swept tubes\n// A tube along a polyline of points [[x,y,z], ...] with an elliptical section (w across the\n// curve's `up` side, t across the other), radii scaled per point by prof(s) (s = 0..1).\n// `up` is a fixed direction the section's wide axis aligns to (a rib's flat side faces it).\nexport function sweep(pts, w, t, prof, up, sides = 8) {\n  const n = pts.length;\n  const P = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));\n  const pos = [], nor = [], idx = [];\n  const U = new THREE.Vector3(...up).normalize();\n  for (let i = 0; i \u003c n; i++) {\n    const T = new THREE.Vector3().subVectors(P[Math.min(n - 1, i + 1)], P[Math.max(0, i - 1)]).normalize();\n    const B = new THREE.Vector3().crossVectors(T, U).normalize();\n    const Nn = new THREE.Vector3().crossVectors(B, T).normalize();\n    const s = i/(n - 1), k = prof(s);\n    for (let j = 0; j \u003c sides; j++) {\n      const a = j/sides*Math.PI*2;\n      const ca = Math.cos(a), sa = Math.sin(a);\n      const ox = Nn.x*ca*w*k + B.x*sa*t*k, oy = Nn.y*ca*w*k + B.y*sa*t*k, oz = Nn.z*ca*w*k + B.z*sa*t*k;\n      pos.push(P[i].x + ox, P[i].y + oy, P[i].z + oz);\n      const nx = Nn.x*ca/w + B.x*sa/t, ny = Nn.y*ca/w + B.y*sa/t, nz = Nn.z*ca/w + B.z*sa/t;\n      const l = Math.hypot(nx, ny, nz) || 1;\n      nor.push(nx/l, ny/l, nz/l);\n    }\n  }\n  for (let i = 0; i \u003c n - 1; i++) for (let j = 0; j \u003c sides; j++) {\n    const a = i*sides + j, b = i*sides + (j + 1)%sides, c = (i + 1)*sides + (j + 1)%sides, d = (i + 1)*sides + j;\n    idx.push(a, b, c, a, c, d);\n  }\n  // caps\n  for (const end of [0, n - 1]) {\n    const c = pos.length/3;\n    const p = P[end], T = new THREE.Vector3().subVectors(P[end === 0 ? 1 : n - 1], P[end === 0 ? 0 : n - 2]).normalize();\n    pos.push(p.x, p.y, p.z); nor.push(end === 0 ? -T.x : T.x, end === 0 ? -T.y : T.y, end === 0 ? -T.z : T.z);\n    for (let j = 0; j \u003c sides; j++) {\n      const a = end*sides + j, b = end*sides + (j + 1)%sides;\n      if (end === 0) idx.push(c, b, a); else idx.push(c, a, b);\n    }\n  }\n  const g = new THREE.BufferGeometry();\n  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));\n  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));\n  g.setIndex(idx);\n  return g;\n}\n","game/shape_noise.js":"// shape_noise.js -- round 29: noise for sculpting the objects (value noise, fbm, cellular\n// cracks), deterministic by seed. Everything here runs once at build time, on the CPU.\n\nfunction h3(ix, iy, iz, seed) {\n  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(iz | 0, 2147483647) ^ Math.imul(seed | 0, 1442695041);\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\n  h ^= h >>> 16;\n  return (h >>> 0)/4294967296;\n}\nexport const hash3 = h3;\n\nexport function noise3(x, y, z, seed = 0) {\n  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);\n  const fx = x - ix, fy = y - iy, fz = z - iz;\n  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy), w = fz*fz*(3 - 2*fz);\n  const L = (a, b, t) => a + (b - a)*t;\n  const c = (dx, dy, dz) => h3(ix + dx, iy + dy, iz + dz, seed);\n  return L(L(L(c(0, 0, 0), c(1, 0, 0), u), L(c(0, 1, 0), c(1, 1, 0), u), v),\n           L(L(c(0, 0, 1), c(1, 0, 1), u), L(c(0, 1, 1), c(1, 1, 1), u), v), w);\n}\n\n// fractal sum, 0..1 around 0.5\nexport function fbm3(x, y, z, seed = 0, oct = 4) {\n  let s = 0, a = 1, t = 0, f = 1;\n  for (let o = 0; o \u003c oct; o++) { s += a*noise3(x*f, y*f, z*f, seed + o*31); t += a; a *= 0.5; f *= 2.03; }\n  return s/t;\n}\n\n// 2D cells (jittered grid, cell size 1): the distance to the nearest cell's point (d1), to the\n// second (d2), the edge distance ~ (d2 - d1)/2, and the nearest cell's id (0..1)\nexport function cells2(x, y, seed = 0) {\n  const ix = Math.floor(x), iy = Math.floor(y);\n  let d1 = 9, d2 = 9, id = 0;\n  for (let j = -1; j \u003c= 1; j++) for (let i = -1; i \u003c= 1; i++) {\n    const cx = ix + i, cy = iy + j;\n    const px = cx + 0.15 + 0.7*h3(cx, cy, 0, seed), py = cy + 0.15 + 0.7*h3(cx, cy, 1, seed);\n    const d = Math.hypot(x - px, y - py);\n    if (d \u003c d1) { d2 = d1; d1 = d; id = h3(cx, cy, 2, seed); } else if (d \u003c d2) d2 = d;\n  }\n  return { d1, d2, edge: (d2 - d1)*0.5, id };\n}\n\n// 3D cells, same idea (for a crack network on a curved solid)\nexport function cells3(x, y, z, seed = 0) {\n  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);\n  let d1 = 9, d2 = 9, id = 0;\n  for (let k = -1; k \u003c= 1; k++) for (let j = -1; j \u003c= 1; j++) for (let i = -1; i \u003c= 1; i++) {\n    const cx = ix + i, cy = iy + j, cz = iz + k;\n    const px = cx + 0.1 + 0.8*h3(cx, cy, cz, seed), py = cy + 0.1 + 0.8*h3(cx, cy, cz, seed + 1), pz = cz + 0.1 + 0.8*h3(cx, cy, cz, seed + 2);\n    const d = Math.hypot(x - px, y - py, z - pz);\n    if (d \u003c d1) { d2 = d1; d1 = d; id = h3(cx, cy, cz, seed + 3); } else if (d \u003c d2) d2 = d;\n  }\n  return { d1, d2, edge: (d2 - d1)*0.5, id };\n}\n\nexport const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a)/(b - a))); return t*t*(3 - 2*t); };\n\n// a seeded random stream\nexport function rand(seed) {\n  let s = seed >>> 0 || 1;\n  const next = () => { s = (Math.imul(s ^ (s >>> 15), 2246822519) + 0x9e3779b9) >>> 0; s = (s ^ (s >>> 13)) >>> 0; return s/4294967296; };\n  return { next, f: (a, b) => a + (b - a)*next(), s: (k) => (next()*2 - 1)*k };\n}\n\n// per-vertex colour, metalness and roughness on a standard material: attribute aMR (x = metal,\n// y = rough) replaces the material's factors (vertex colours give the albedo)\nexport function vertex_mr(mat) {\n  const prev = mat.onBeforeCompile;\n  mat.onBeforeCompile = (sh, r) => {\n    if (prev) prev(sh, r);\n    sh.vertexShader = sh.vertexShader\n      .replace('#include \u003ccommon>', '#include \u003ccommon>\\nattribute vec2 aMR;\\nvarying vec2 vMR;')\n      .replace('#include \u003cbegin_vertex>', '#include \u003cbegin_vertex>\\n  vMR = aMR;');\n    sh.fragmentShader = sh.fragmentShader\n      .replace('#include \u003ccommon>', '#include \u003ccommon>\\nvarying vec2 vMR;')\n      .replace('#include \u003croughnessmap_fragment>', '#include \u003croughnessmap_fragment>\\n  roughnessFactor = vMR.y;')\n      .replace('#include \u003cmetalnessmap_fragment>', '#include \u003cmetalnessmap_fragment>\\n  metalnessFactor = vMR.x;');\n  };\n  const key = mat.customProgramCacheKey ? mat.customProgramCacheKey.bind(mat) : () => '';\n  mat.customProgramCacheKey = () => key() + '|vmr';\n  return mat;\n}\n","game/skeleton.js":"// skeleton.js -- a realistic human skeleton, sculpted (round 3; owner: \"the lich model itself\r\n// should be way more realistic\"; target: Astra's lich 07, reference/astra-r02/lich/07.png).\r\n//\r\n// Every bone is built in the frame of the joint it hangs from (see RIG below), so the lich can\r\n// be posed by rotating joints. Rounded bones (skull, jaw, pelvis, vertebrae, scapulae, sternum,\r\n// long bones, carpals, tarsals) are signed distance fields meshed by sdf.js; the thin flat ones\r\n// (ribs, costal cartilage, clavicles) are swept tubes with a flattened section.\r\n//\r\n// Units: metres. Frame: +y up, +z forward (the way the lich faces), s = +1 / -1 for the two\r\n// sides (x). A 1.8 m adult.\r\nimport * as THREE from 'three';\r\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\r\nimport { sphere, ellipsoid, cone, capsule, rbox, chain, smin, smax, sub, mesh_sdf, sweep } from 'game/sdf.js';\r\n\r\nconst cyl = (x, y, z, cx, cy, cz, r, hh, k) => {\r\n  const dx = Math.hypot(x - cx, z - cz) - r + k, dy = Math.abs(y - cy) - hh + k;\r\n  return Math.min(Math.max(dx, dy), 0) + Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) - k;\r\n};\r\nconst lerp = (a, b, t) => a + (b - a)*t;\r\n\r\n// ------------------------------------------------------------------ the rig (joint offsets)\r\n// parent-relative positions of every joint; the skeleton hangs from them\r\nexport const RIG = {\r\n  spine: [0, 0.10, -0.062],        // from the pelvis (hip-joint line) to the top of the sacrum\r\n  chest: [0, 0.18, 0.0],           // from the spine node to T12\r\n  neck: [0, 0.285, 0.004],         // from the chest node to C7\r\n  head: [0, 0.118, 0.014],         // from the neck node to the atlas\r\n  jaw: [0, 0.004, 0.008],          // from the head node to the jaw hinge\r\n  shoulder: [0.172, 0.248, -0.006],  // from the chest node (x times s)\r\n  elbow: [0, -0.305, 0],\r\n  wrist: [0, -0.262, 0.004],\r\n  hip: [0.088, 0, 0],              // from the pelvis (x times s)\r\n  knee: [-0.03, -0.44, 0.004],     // the femur angles in: knees closer than hips (x times s)\r\n  ankle: [0, -0.405, -0.004],\r\n};\r\n\r\n// ------------------------------------------------------------------ bone fields\r\nfunction skull(x, y, z) {\r\n  // proportions from the foramen magnum (origin): orbits ~4 cm above it and ~8 cm in front,\r\n  // the vertex ~14 cm up, the occiput ~10 cm behind\r\n  let d = ellipsoid(x, y, z, 0, 0.072, -0.016, 0.067, 0.07, 0.097);                      // cranium\r\n  d = smin(d, ellipsoid(x, y, z, 0, 0.078, 0.03, 0.056, 0.052, 0.06), 0.018);             // forehead\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.008, 0.064, 0.037, 0.036, 0.036), 0.014);        // maxilla, taller\r\n  for (const s of [-1, 1]) {\r\n    d = smin(d, ellipsoid(x, y, z, s*0.05, 0.018, 0.064, 0.02, 0.016, 0.019), 0.009);   // cheekbone\r\n    d = smin(d, capsule(x, y, z, s*0.055, 0.018, 0.058, s*0.064, 0.022, 0.0, 0.006), 0.007);  // arch\r\n    d = smin(d, ellipsoid(x, y, z, s*0.056, -0.012, -0.024, 0.011, 0.016, 0.013), 0.009); // mastoid\r\n  }\r\n  d = smin(d, capsule(x, y, z, -0.045, 0.058, 0.08, 0.045, 0.058, 0.08, 0.0095), 0.012);  // brow ridge\r\n  for (const s of [-1, 1]) {\r\n    d = smax(d, -ellipsoid(x, y, z, s*0.032, 0.037, 0.094, 0.0165, 0.0155, 0.03), 0.004);  // orbit: smaller, deep\r\n    d = smax(d, -ellipsoid(x, y, z, s*0.073, 0.045, 0.018, 0.011, 0.02, 0.026), 0.009);  // temple\r\n  }\r\n  d = smax(d, -ellipsoid(x, y, z, 0, 0.004, 0.099, 0.0095, 0.018, 0.02), 0.003);       // nasal opening\r\n  d = smax(d, -ellipsoid(x, y, z, 0, -0.045, -0.03, 0.05, 0.03, 0.05), 0.012);         // skull base\r\n  for (let i = 0; i \u003c 12; i++) {                                                        // upper teeth\r\n    const a = lerp(-1.25, 1.25, i/11);\r\n    const tx = Math.sin(a)*0.033, tz = 0.052 + Math.cos(a)*0.035;\r\n    d = smin(d, capsule(x, y, z, tx, -0.03, tz, tx, -0.043, tz, 0.0042 - Math.abs(a)*0.0006), 0.002);\r\n  }\r\n  return d;\r\n}\r\nfunction mandible(x, y, z) {\r\n  // jaw-hinge frame: condyles at the origin's sides, the chin ~7.5 cm down-forward\r\n  const P = [];\r\n  for (let i = 0; i \u003c= 10; i++) {\r\n    const a = lerp(-1.5, 1.5, i/10);\r\n    P.push([Math.sin(a)*0.046, -0.072 + Math.abs(Math.sin(a))*0.01, 0.018 + Math.cos(a)*0.05, 0.0088]);\r\n  }\r\n  let d = chain(x, y, z, P, 0.006);\r\n  for (const s of [-1, 1]) {\r\n    d = smin(d, cone(x, y, z, s*0.046, -0.066, 0.004, s*0.05, -0.004, -0.004, 0.011, 0.008), 0.008);   // ramus\r\n    d = smin(d, sphere(x, y, z, s*0.05, -0.002, -0.005, 0.0075), 0.004);                 // condyle\r\n    d = smin(d, cone(x, y, z, s*0.049, -0.03, 0.004, s*0.046, 0.002, 0.016, 0.006, 0.003), 0.005);   // coronoid\r\n  }\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.08, 0.064, 0.014, 0.012, 0.009), 0.008);           // chin\r\n  for (let i = 0; i \u003c 12; i++) {                                                         // lower teeth\r\n    const a = lerp(-1.2, 1.2, i/11);\r\n    const tx = Math.sin(a)*0.039, tz = 0.018 + Math.cos(a)*0.044;\r\n    d = smin(d, capsule(x, y, z, tx, -0.061, tz, tx, -0.049, tz, 0.0042), 0.002);\r\n  }\r\n  return d;\r\n}\r\n// a vertebra at height yc, depth zc: body, pedicles, spinous and transverse processes\r\nfunction vertebra(x, y, z, yc, zc, R, hh, spL, spDrop, trL) {\r\n  let d = cyl(x, y, z, 0, yc, zc + R*0.1, R, hh, hh*0.6);\r\n  d = smin(d, capsule(x, y, z, -R*0.5, yc + hh*0.3, zc - R*0.8, R*0.5, yc + hh*0.3, zc - R*0.8, R*0.28), R*0.3);\r\n  d = smin(d, cone(x, y, z, 0, yc + hh*0.3, zc - R*0.9, 0, yc - spDrop, zc - R - spL, R*0.32, R*0.2), R*0.25);\r\n  for (const s of [-1, 1]) d = smin(d, cone(x, y, z, s*R*0.5, yc + hh*0.4, zc - R*0.8, s*(R*0.5 + trL), yc + hh*0.5, zc - R*0.95, R*0.25, R*0.16), R*0.2);\r\n  return d;\r\n}\r\nfunction pelvis(x, y, z) {\r\n  let d = Infinity;\r\n  for (const s of [-1, 1]) {\r\n    // iliac blade: a thin broad fan facing out and forward, thick at its crest\r\n    const cx = s*0.088, cy = 0.085, cz = -0.012;\r\n    const a = s*0.55, ca = Math.cos(a), sa = Math.sin(a);\r\n    const lx = (x - cx)*ca - (z - cz)*sa, lz = (x - cx)*sa + (z - cz)*ca, ly = y - cy;\r\n    // bent so its edges curl medially: the iliac fossa is a bowl, the gluteal side convex\r\n    let blade = ellipsoid(lx + 3.2*(lz*lz + (ly - 0.01)*(ly - 0.01)), ly, lz, 0, 0, 0, 0.0075, 0.07, 0.078);\r\n    blade = smax(blade, -(ly + 0.045), 0.01);\r\n    d = smin(d, blade, 0.01);\r\n    const crest = [];\r\n    for (let i = 0; i \u003c= 8; i++) {\r\n      const t = lerp(-1.25, 1.25, i/8);\r\n      const px = Math.sin(t)*0.077, py = Math.cos(t)*0.064;\r\n      // the crest traced in the blade's plane, back in pelvis space\r\n      const bend = -3.2*(px*px + (py - 0.014)*(py - 0.014));      // follow the blade's curl\r\n      crest.push([cx + bend*ca + px*sa, cy + py - 0.004, cz - bend*sa + px*ca, 0.0075]);\r\n    }\r\n    d = smin(d, chain(x, y, z, crest, 0.006), 0.008);\r\n    // body of the ilium down to the socket, the socket, the ischium and its tuberosity\r\n    d = smin(d, cone(x, y, z, s*0.084, 0.05, -0.012, s*0.08, 0.004, -0.002, 0.021, 0.024), 0.014);\r\n    const sock = sphere(x, y, z, s*0.078, 0, 0, 0.029);\r\n    d = smin(d, sock, 0.012);\r\n    d = smax(d, -sphere(x, y, z, s*0.093, 0, 0, 0.025), 0.004);                      // acetabulum\r\n    d = smin(d, cone(x, y, z, s*0.072, -0.02, -0.012, s*0.058, -0.085, -0.03, 0.017, 0.014), 0.01);\r\n    // the pelvic ring: arcuate line to the pubis, pubic rami, the obturator loop\r\n    d = smin(d, chain(x, y, z, [[s*0.035, 0.07, -0.062, 0.011], [s*0.062, 0.04, -0.03, 0.01], [s*0.066, 0.008, 0.022, 0.011], [s*0.036, -0.018, 0.058, 0.011], [s*0.012, -0.03, 0.066, 0.012]], 0.006), 0.008);\r\n    d = smin(d, chain(x, y, z, [[s*0.012, -0.056, 0.058, 0.009], [s*0.034, -0.078, 0.028, 0.008], [s*0.056, -0.088, -0.018, 0.011]], 0.005), 0.006);\r\n    d = smin(d, capsule(x, y, z, s*0.012, -0.03, 0.066, s*0.012, -0.058, 0.058, 0.01), 0.006);\r\n  }\r\n  // sacrum: a curved wedge between the blades at the back, and the coccyx\r\n  const sac = [];\r\n  for (let i = 0; i \u003c= 5; i++) { const t = i/5; sac.push([0, lerp(0.1, -0.02, t), -0.066 - Math.sin(t*2.6)*0.016 + t*0.01, lerp(0.034, 0.012, t)]); }\r\n  let sd = chain(x, y, z, sac, 0.01);\r\n  sd = smax(sd, Math.abs(z + 0.07 + (y - 0.04)*0.25) - 0.022, 0.008);          // flatten front-to-back\r\n  d = smin(d, sd, 0.012);\r\n  d = smin(d, chain(x, y, z, [[0, -0.02, -0.06, 0.009], [0, -0.042, -0.05, 0.006], [0, -0.056, -0.038, 0.004]], 0.003), 0.004);\r\n  return d;\r\n}\r\n// long bones, each hanging from its joint (local y down)\r\nfunction humerus(x, y, z, s) {\r\n  let d = sphere(x, y, z, -s*0.006, -0.012, -0.006, 0.024);\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.018, 0.004, 0.016), 0.01);                   // tubercles\r\n  d = smin(d, chain(x, y, z, [[0, -0.03, 0, 0.014], [s*0.004, -0.1, 0.002, 0.012], [s*0.002, -0.2, 0, 0.010], [0, -0.27, 0, 0.011]], 0.01), 0.012);\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.288, -0.002, 0.031, 0.012, 0.014), 0.01);          // epicondyles\r\n  d = smin(d, sphere(x, y, z, -s*0.01, -0.298, 0.006, 0.011), 0.006);\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.297, 0.006, 0.01), 0.006);\r\n  return d;\r\n}\r\nfunction forearm(x, y, z, s) {\r\n  // ulna (inner, with the olecranon hooked up behind the elbow) and radius (outer)\r\n  let d = cone(x, y, z, -s*0.009, 0.014, -0.012, -s*0.01, -0.03, -0.004, 0.012, 0.011);\r\n  d = smin(d, chain(x, y, z, [[-s*0.01, -0.03, -0.004, 0.0105], [-s*0.011, -0.14, -0.002, 0.008], [-s*0.012, -0.245, 0, 0.0065]], 0.006), 0.008);\r\n  d = smin(d, sphere(x, y, z, -s*0.012, -0.25, 0.0, 0.0085), 0.004);\r\n  let r = cyl(x, y, z, s*0.012, -0.012, 0.004, 0.01, 0.006, 0.003);\r\n  r = smin(r, chain(x, y, z, [[s*0.012, -0.016, 0.004, 0.007], [s*0.016, -0.13, 0.006, 0.0075], [s*0.016, -0.235, 0.006, 0.011], [s*0.012, -0.252, 0.006, 0.013]], 0.006), 0.006);\r\n  return Math.min(d, r);\r\n}\r\nfunction femur(x, y, z, s) {\r\n  let d = sphere(x, y, z, 0, 0, 0, 0.025);                                             // head\r\n  d = smin(d, cone(x, y, z, 0, 0, 0, s*0.038, -0.036, -0.002, 0.016, 0.018), 0.01);     // neck\r\n  d = smin(d, sphere(x, y, z, s*0.046, -0.028, -0.008, 0.019), 0.012);                   // greater trochanter\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.065, -0.012, 0.01), 0.008);                    // lesser\r\n  d = smin(d, chain(x, y, z, [[s*0.036, -0.05, -0.002, 0.016], [s*0.022, -0.16, 0.008, 0.0145], [s*0.004, -0.3, 0.008, 0.0145], [-s*0.022, -0.405, 0.0, 0.019]], 0.012), 0.014);\r\n  for (const k of [-1, 1]) d = smin(d, ellipsoid(x, y, z, -s*0.03 + k*0.021, -0.425, -0.006, 0.019, 0.021, 0.028), 0.012);\r\n  return d;\r\n}\r\nfunction shin(x, y, z, s) {\r\n  let d = ellipsoid(x, y, z, 0, -0.016, -0.002, 0.037, 0.016, 0.03);                    // plateau\r\n  d = smin(d, sphere(x, y, z, 0, -0.05, 0.022, 0.011), 0.01);                            // tuberosity\r\n  d = smin(d, chain(x, y, z, [[0, -0.035, 0.004, 0.019], [0, -0.14, 0.008, 0.0135], [-s*0.002, -0.3, 0.004, 0.012], [-s*0.004, -0.38, 0, 0.016]], 0.012), 0.014);\r\n  d = smin(d, sphere(x, y, z, -s*0.016, -0.397, 0.001, 0.0115), 0.008);                  // medial malleolus\r\n  let f = chain(x, y, z, [[s*0.03, -0.035, -0.012, 0.01], [s*0.03, -0.2, -0.01, 0.0065], [s*0.028, -0.38, -0.008, 0.008]], 0.004);\r\n  f = smin(f, sphere(x, y, z, s*0.029, -0.405, -0.006, 0.011), 0.006);                   // lateral malleolus\r\n  return Math.min(d, f);\r\n}\r\nfunction patella(x, y, z) { return ellipsoid(x, y, z, 0, 0.018, 0.036, 0.021, 0.025, 0.011); }\r\nfunction foot(x, y, z, s) {\r\n  let d = ellipsoid(x, y, z, 0, -0.016, 0.0, 0.02, 0.016, 0.022);                        // talus\r\n  d = smin(d, ellipsoid(x, y, z, s*0.004, -0.038, -0.038, 0.017, 0.022, 0.034), 0.012);  // calcaneus\r\n  d = smin(d, ellipsoid(x, y, z, -s*0.004, -0.032, 0.03, 0.028, 0.014, 0.02), 0.01);     // tarsals\r\n  const toes = [[-s*0.022, 1.0], [-s*0.006, 0.82], [s*0.008, 0.78], [s*0.02, 0.72], [s*0.031, 0.64]];\r\n  for (let i = 0; i \u003c 5; i++) {\r\n    const [tx, L] = toes[i], r = i === 0 ? 0.009 : 0.0058;\r\n    const bx = tx*0.8, bz = 0.045;\r\n    const mz = bz + 0.072*L, tz = mz + (i === 0 ? 0.052 : 0.045)*L;\r\n    d = smin(d, chain(x, y, z, [[bx, -0.036, bz, r*1.1], [tx, -0.05, mz, r], [tx, -0.055, mz + 0.01, r*0.95], [tx, -0.056, tz, r*0.75]], 0.004), 0.006);\r\n  }\r\n  return d;\r\n}\r\nfunction carpals(x, y, z, s) {\r\n  let d = Infinity;\r\n  for (let i = 0; i \u003c 4; i++) for (let row = 0; row \u003c 2; row++) {\r\n    const zz = lerp(0.016, -0.018, i/3), yy = -0.008 - row*0.013;\r\n    d = smin(d, sphere(x, y, z, 0, yy, zz, 0.0082 - row*0.0006), 0.006);\r\n  }\r\n  return d;\r\n}\r\n// fingers: z offsets across the hanging hand (palm toward the body), index at the front\r\nconst FINGERS = [\r\n  { z: 0.018, meta: 0.064, ph: [0.04, 0.024, 0.018] },\r\n  { z: 0.005, meta: 0.062, ph: [0.044, 0.027, 0.019] },\r\n  { z: -0.008, meta: 0.058, ph: [0.041, 0.026, 0.018] },\r\n  { z: -0.02, meta: 0.052, ph: [0.033, 0.019, 0.016] },\r\n];\r\n\r\n// ------------------------------------------------------------------ ribs (swept)\r\n// chest-node frame. Rib k (0 = first) hangs from thoracic vertebra T(k+1).\r\nconst T_Y = k => 0.268 - k*0.0223;                           // thoracic vertebra heights (T1 top)\r\nconst T_Z = y => -0.026*Math.sin(Math.PI*y/0.29);            // the thoracic curve (kyphosis)\r\nconst RIB = {\r\n  halfw: [0.058, 0.082, 0.098, 0.11, 0.12, 0.127, 0.131, 0.132, 0.128, 0.12, 0.104, 0.086],\r\n  depth: [0.118, 0.148, 0.168, 0.182, 0.192, 0.196, 0.196, 0.188, 0.172, 0.148, 0.098, 0.066],\r\n  drop: [0.028, 0.048, 0.066, 0.082, 0.092, 0.098, 0.102, 0.102, 0.098, 0.088, 0.06, 0.04],\r\n  end: [0.84, 0.86, 0.86, 0.86, 0.85, 0.84, 0.83, 0.79, 0.75, 0.71, 0.55, 0.47],\r\n};\r\nconst STERNUM = { top: [0, 0.228, 0.118], bot: [0, 0.07, 0.186] };\r\nconst sternum_at = t => [0, lerp(STERNUM.top[1], STERNUM.bot[1], t), lerp(STERNUM.top[2], STERNUM.bot[2], t)];\r\n\r\nfunction rib_points(k, s) {\r\n  const y0 = T_Y(k), z0 = T_Z(y0);\r\n  const hw = RIB.halfw[k], dp = RIB.depth[k], dr = RIB.drop[k];\r\n  const pts = [[s*0.024, y0, z0 - 0.012]];\r\n  const back = 0.035;                                         // the rib's angle, behind the spine\r\n  const N = 18;\r\n  for (let i = 0; i \u003c= N; i++) {\r\n    const th = lerp(0.16, RIB.end[k]*Math.PI, i/N);\r\n    const x = s*hw*Math.sin(th)*(1 - 0.08*Math.sin(th*2));\r\n    const z = z0 - back + (dp*0.5 + back)*(1 - Math.cos(th)) - 0.01;\r\n    const y = y0 - dr*(1 - Math.cos(th))/2;\r\n    pts.push([x, y, z]);\r\n  }\r\n  return pts;\r\n}\r\nfunction cartilage_points(k, s, rib_end) {\r\n  // ribs 1-7 reach the sternum; 8-10 join the cartilage above; 11-12 float\r\n  if (k >= 10) return null;\r\n  const e = rib_end;\r\n  let tgt;\r\n  if (k \u003c 7) tgt = sternum_at([0.02, 0.1, 0.25, 0.4, 0.55, 0.7, 0.82][k]);\r\n  else tgt = [s*(0.06 - (k - 7)*0.004), T_Y(6) - RIB.drop[6] - 0.012 - (k - 7)*0.018, 0.17 - (k - 7)*0.012];\r\n  const tx = k \u003c 7 ? s*0.016 : tgt[0];\r\n  const pts = [];\r\n  for (let i = 0; i \u003c= 8; i++) {\r\n    const t = i/8;\r\n    // bend upward toward the sternum (the costal margin), more for the lower ribs\r\n    const lift = Math.sin(t*Math.PI*0.5)*(k > 4 ? 0.025 + (k - 4)*0.006 : 0.004);\r\n    pts.push([lerp(e[0], tx, t), lerp(e[1], tgt[1], t) + lift*(1 - t)*0.8, lerp(e[2], tgt[2], t)]);\r\n  }\r\n  return pts;\r\n}\r\n\r\n// ------------------------------------------------------------------ build all meshes\r\n// Returns { node_name: [geometries...] } in each node's own frame, plus the finger segments.\r\nexport function build_skeleton_geometry(res = 1, grow = 0.0032) {\r\n  // owner, round 3: \"the lich is almost invisible ... he should be a bit more solid\". At the room\r\n  // camera a real bone is under a pixel wide; every surface is pushed out by `grow` metres.\r\n  const H = h => h*res;\r\n  const GROW = grow;\r\n  const mesh_sdf_g = (f, box, h) => mesh_sdf((x, y, z) => f(x, y, z) - GROW, [box[0] - GROW, box[1] - GROW, box[2] - GROW, box[3] + GROW, box[4] + GROW, box[5] + GROW], h);\r\n  const sweep_g = (pts, w, t, prof, up, sides) => sweep(pts, w + GROW*0.8, t + GROW*0.8, prof, up, sides);\r\n  const G = {};\r\n  const add = (node, g) => { (G[node] = G[node] || []).push(g); };\r\n  // skull and jaw (head / jaw nodes)\r\n  add('head', mesh_sdf_g(skull, [-0.085, -0.06, -0.125, 0.085, 0.155, 0.13], H(0.0028)*0.8));\r\n  add('jaw', mesh_sdf_g(mandible, [-0.065, -0.1, -0.025, 0.065, 0.015, 0.09], H(0.0024)*0.85));\r\n  // spine: lumbar (spine node), thoracic (chest), cervical (neck)\r\n  add('spine', mesh_sdf_g((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let i = 0; i \u003c 5; i++) { const yc = 0.015 + i*0.034; d = Math.min(d, vertebra(x, y, z, yc, 0.014*Math.sin(Math.PI*yc/0.18), 0.021 - i*0.0008, 0.0115, 0.028, 0.004, 0.028)); }\r\n    return d;\r\n  }, [-0.06, -0.01, -0.075, 0.06, 0.2, 0.04], H(0.0024)));\r\n  add('chest', mesh_sdf_g((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let k = 0; k \u003c 12; k++) { const yc = T_Y(k); d = Math.min(d, vertebra(x, y, z, yc, T_Z(yc), 0.0125 + k*0.0006, 0.0085, 0.03, 0.02 - Math.abs(k - 6)*0.001, 0.024)); }\r\n    return d;\r\n  }, [-0.05, -0.03, -0.1, 0.05, 0.29, 0.03], H(0.0022)));\r\n  add('neck', mesh_sdf_g((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let i = 0; i \u003c 7; i++) { const yc = 0.008 + i*0.0165; d = Math.min(d, vertebra(x, y, z, yc, 0.012*Math.sin(Math.PI*yc/0.12), 0.0105 - i*0.0003, 0.006, i === 0 ? 0.03 : 0.014, 0.006, 0.02)); }\r\n    return d;\r\n  }, [-0.045, -0.01, -0.07, 0.045, 0.13, 0.03], H(0.002)));\r\n  // pelvis and sacrum\r\n  add('pelvis', mesh_sdf_g(pelvis, [-0.18, -0.11, -0.12, 0.18, 0.17, 0.09], H(0.0028)*1.15));\r\n  // ribcage: ribs, costal cartilage, sternum, scapulae, clavicles (chest node)\r\n  for (const s of [-1, 1]) for (let k = 0; k \u003c 12; k++) {\r\n    const rp = rib_points(k, s);\r\n    add('chest', sweep_g(rp, 0.0062, 0.0031, t => (t \u003c 0.08 ? 0.75 + t*3 : 1 - Math.max(0, t - 0.7)*0.6), [0, 1, 0], 8));\r\n    const cp = cartilage_points(k, s, rp[rp.length - 1]);\r\n    if (cp) add('chest', sweep_g(cp, 0.0048, 0.0028, () => 1, [0, 1, 0], 6));\r\n  }\r\n  add('chest', mesh_sdf_g((x, y, z) => {\r\n    // sternum: manubrium, body, xiphoid, tilted with the chest\r\n    let d = Infinity;\r\n    const P = [0, 0.08, 0.3, 0.55, 0.8, 0.95, 1.05].map(t => { const p = sternum_at(Math.min(t, 1)); return [p[0], p[1] - (t > 1 ? 0.012 : 0), p[2] + (t > 1 ? 0.005 : 0), t \u003c 0.15 ? 0.022 : t > 1 ? 0.006 : 0.014]; });\r\n    d = chain(x, y, z, P, 0.01);\r\n    d = smax(d, Math.abs((z - lerp(0.118, 0.186, (0.228 - y)/0.158))) - 0.0065, 0.004);   // flatten front-to-back\r\n    // scapulae: thin triangular blades on the back, the spine ridge, the acromion\r\n    for (const s of [-1, 1]) {\r\n      const cx = s*0.095, cy = 0.165, cz = -0.078;\r\n      const a = s*0.42, ca = Math.cos(a), sa = Math.sin(a);\r\n      const lx = (x - cx)*ca + (z - cz)*sa, lz = -(x - cx)*sa + (z - cz)*ca, ly = y - cy;\r\n      let b = ellipsoid(lx, ly, lz, 0, 0, 0, 0.052, 0.072, 0.006);\r\n      b = smax(b, (ly + 0.9*(Math.abs(lx) - 0.01)*s*0) - 0.06, 0.01);\r\n      b = smin(b, chain(lx, ly, lz, [[-0.045, 0.035, -0.004, 0.005], [0.03, 0.05, -0.012, 0.007], [0.065, 0.06, 0.005, 0.009]], 0.004), 0.006);\r\n      d = smin(d, b, 0.004);\r\n      d = smin(d, sphere(x, y, z, s*0.168, 0.248, -0.012, 0.014), 0.012);                  // glenoid rim / acromion\r\n    }\r\n    return d;\r\n  }, [-0.22, 0.03, -0.12, 0.22, 0.29, 0.21], H(0.0026)));\r\n  for (const s of [-1, 1]) {\r\n    const cl = [[s*0.016, 0.232, 0.118], [s*0.06, 0.242, 0.122], [s*0.11, 0.25, 0.09], [s*0.15, 0.256, 0.03], [s*0.166, 0.255, -0.004]];\r\n    const pts = [];\r\n    for (let i = 0; i \u003c= 12; i++) {\r\n      const t = i/12*(cl.length - 1), a = Math.floor(Math.min(t, cl.length - 2)), f = t - a;\r\n      pts.push([0, 1, 2].map(c => lerp(cl[a][c], cl[a + 1][c], f)));\r\n    }\r\n    add('chest', sweep_g(pts, 0.0075, 0.0055, t => 1 + 0.25*Math.abs(t - 0.5)*2, [0, 1, 0], 8));\r\n  }\r\n  // limbs, per side\r\n  for (const s of [-1, 1]) {\r\n    const S = s > 0 ? 'L' : 'R';\r\n    add('upper' + S, mesh_sdf_g((x, y, z) => humerus(x, y, z, s), [-0.045, -0.32, -0.04, 0.045, 0.02, 0.
