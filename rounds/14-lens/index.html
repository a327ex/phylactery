s\r\n// on it should also feel a bit more realistic. The glass forms from the Lich's mind, light\r\n// converges on it, then the attack starts charging.\" And it hit tails: \"It should aim for\r\n// either cutting the head off or middle\"):\r\n//   FORM      glints stream from his skull up into the shaft and the glass crystallizes where\r\n//             they end: real transmissive glass (it bends what is behind it, a little spectral\r\n//             spread, glints where the sun catches it, a faint rim so it reads in the dark; it\r\n//             casts its shadow into the shaft like a real lens would)\r\n//   CONVERGE  as a magnifying glass does: the sunlight it gathers comes down as a cone to a\r\n//             wide soft patch on the floor beside the snake, and the patch tightens to a blinding\r\n//             point, brighter as it shrinks (the same light on less floor), and starts to smoke;\r\n//             the focus follows the snake while it crawls\r\n//   FIRE      the focus becomes the laser (round 13's beam: L = fire laser / prism in fire) and\r\n//             sweeps across the snake from right beside it, at its neck (the head comes off) or\r\n//             its middle; tails are never cut\r\n//   END       the beam thins out, the glass dissolves into glints\r\n// Cut halves part charred and smoking, twitch, and sink into the ground. With fewer powers\r\n// left, several lenses form at once.\r\nimport * as THREE from 'three';\r\nimport { smoothstep } from 'game/util.js';\r\nimport { LAYOUT } from 'game/cave.js';\r\n\r\nconst FORM = 0.55, CONVERGE = 0.8, SPEED = 3.0, SWEEP = 2.6, LEAD = 0.35, OFF = 0.2, FADE = 0.45, CUT_R = 0.13;\r\nconst LENS_R = 0.38;\r\n// where a cut may fall: from just behind the snout back to here (metres along the body); past\r\n// it, the tail\r\nconst CUT_MAX = 2.6;\r\nexport const LENS_LOOKS = ['FIRE LASER (TITAN, PHRIKE)', 'THE PRISMATIC BEAM, IN FIRE'];\r\n\r\nexport function create_lens(ctx) {\r\n  const { R, snakes, fx, cave, rng, lich } = ctx;\r\n  const N = snakes.RINGS;\r\n  const S = LAYOUT.sun_dir, sxz = new THREE.Vector2(S.x/S.y, S.z/S.y);\r\n  const axis_at = h => new THREE.Vector3(sxz.x*h, h, sxz.y*h);\r\n  const H = new THREE.Vector3();\r\n\r\n  // ---------------------------------------------------------------- the glass\r\n  const geo = new THREE.SphereGeometry(1, 40, 16);\r\n  geo.scale(1, 0.14, 1);                            // a biconvex lens: 76 cm across, ~10 cm thick\r\n  const glass_mat = () => {\r\n    const m = new THREE.MeshPhysicalMaterial({\r\n      color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 1, thickness: 0.18, ior: 1.52,\r\n      dispersion: 0.8, specularIntensity: 1, specularColor: 0xffffff, envMapIntensity: 0,\r\n      depthWrite: false,             // the shaft's haze (drawn after, by depth) must show through the glass, not stop at it\r\n    });\r\n    const U = { uRim: { value: 0 } };\r\n    m.userData.U = U;\r\n    m.onBeforeCompile = (sh) => {\r\n      Object.assign(sh.uniforms, U);\r\n      sh.fragmentShader = sh.fragmentShader\r\n        .replace('#include \u003ccommon>', '#include \u003ccommon>\\nuniform float uRim;')\r\n        .replace('#include \u003clights_fragment_end>', `#include \u003clights_fragment_end>\r\n  {\r\n    // a faint rim so the edge of the glass still reads in the dark cave\r\n    float nv = abs(dot(normalize(normal), normalize(vViewPosition)));\r\n    totalEmissiveRadiance += vec3(0.85, 0.9, 1.0)*pow(1.0 - nv, 3.0)*uRim;\r\n  }`);\r\n    };\r\n    m.customProgramCacheKey = () => 'lens_glass';\r\n    return m;\r\n  };\r\n  // a shimmer over the glass while it crystallizes (additive, fades once it has formed)\r\n  const shimmer_mat = () => new THREE.ShaderMaterial({\r\n    uniforms: { uA: { value: 0 }, uTime: { value: 0 } },\r\n    vertexShader: `varying vec3 vN, vV, vP; void main(){ vec4 w = modelMatrix*vec4(position, 1.0); vN = normalize(mat3(modelMatrix)*normal); vV = normalize(cameraPosition - w.xyz); vP = position; gl_Position = projectionMatrix*viewMatrix*w; }`,\r\n    fragmentShader: `uniform float uA, uTime; varying vec3 vN, vV, vP;\r\n      void main(){\r\n        float rim = pow(1.0 - abs(dot(normalize(vN), vV)), 3.0);\r\n        vec3 h = clamp(abs(fract(atan(vP.z, vP.x)*0.16 + uTime*0.8 + vec3(0.0, 0.6667, 0.3333))*6.0 - 3.0) - 1.0, 0.0, 1.0);\r\n        gl_FragColor = vec4(mix(vec3(1.0), h, 0.6)*rim*1.1*uA, 1.0); }`,\r\n    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,\r\n  });\r\n\r\n  // the cone of gathered sunlight under the lens, and the patch it throws on the floor\r\n  const SEG = 28;\r\n  const cone_mat = new THREE.ShaderMaterial({\r\n    uniforms: { uA: { value: 1 } },\r\n    vertexShader: `attribute float aT; attribute float aA; varying float vT, vA; void main(){ vT = aT; vA = aA; gl_Position = projectionMatrix*viewMatrix*vec4(position, 1.0); }`,\r\n    fragmentShader: `varying float vT, vA; void main(){ gl_FragColor = vec4(vec3(1.0, 0.9, 0.7)*vA*(0.25 + 0.75*vT*vT), 1.0); }`,\r\n    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,\r\n  });\r\n  const patch_mat = new THREE.ShaderMaterial({\r\n    uniforms: { uA: { value: 0 } },\r\n    vertexShader: `varying vec2 vU; void main(){ vU = uv*2.0 - 1.0; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`,\r\n    fragmentShader: `uniform float uA; varying vec2 vU; void main(){ float d = length(vU); float k = smoothstep(1.0, 0.0, d); k = k*k; gl_FragColor = vec4(vec3(1.0, 0.92, 0.75)*k*uA, 1.0); }`,\r\n    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,\r\n  });\r\n  const make_cone = () => {\r\n    const g = new THREE.BufferGeometry();\r\n    const pos = new Float32Array(SEG*2*3), at = new Float32Array(SEG*2), aa = new Float32Array(SEG*2);\r\n    for (let j = 0; j \u003c SEG; j++) { at[j] = 0; at[SEG + j] = 1; }\r\n    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));\r\n    g.setAttribute('aT', new THREE.BufferAttribute(at, 1));\r\n    g.setAttribute('aA', new THREE.BufferAttribute(aa, 1));\r\n    const idx = [];\r\n    for (let j = 0; j \u003c SEG; j++) { const a = j, b = (j + 1)%SEG, c = SEG + b, d = SEG + j; idx.push(a, d, c, a, c, b); }\r\n    g.setIndex(idx);\r\n    const m = new THREE.Mesh(g, cone_mat);\r\n    m.frustumCulled = false; m.renderOrder = 11; m.visible = false;\r\n    R.world_scene.add(m);\r\n    return m;\r\n  };\r\n  const make_patch = () => {\r\n    const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), patch_mat.clone());\r\n    m.rotation.x = -Math.PI/2; m.frustumCulled = false; m.renderOrder = 11; m.visible = false;\r\n    R.world_scene.add(m);\r\n    return m;\r\n  };\r\n\r\n  const LENSES = [], LIGHTS = [];\r\n  for (let i = 0; i \u003c 5; i++) {\r\n    const m = new THREE.Mesh(geo, glass_mat());\r\n    m.castShadow = true; m.receiveShadow = false;\r\n    m.visible = false; m.frustumCulled = false; m.renderOrder = 13;\r\n    R.world_scene.add(m);\r\n    const sh = new THREE.Mesh(geo, shimmer_mat());\r\n    sh.scale.setScalar(1.02); sh.renderOrder = 14; sh.visible = false;\r\n    m.add(sh);\r\n    LENSES.push({ m, sh, cone: make_cone(), patch: make_patch(), on: false });\r\n  }\r\n  for (let i = 0; i \u003c 3; i++) {\r\n    const l = new THREE.PointLight(0xffc27a, 0, 5, 2);\r\n    R.world_scene.add(l);\r\n    LIGHTS.push({ l, lens: null });\r\n  }\r\n  const active = [];\r\n  let look = 0;\r\n  const cuts = [];                  // tests: where each cut fell (metres from the snout) and on whom\r\n\r\n  function cut_fx(s, c) {\r\n    // the body's direction at the cut, toward the head\r\n    const tan = new THREE.Vector3().subVectors(s.spine[Math.max(0, c - 3)], s.spine[Math.min(N - 1, c + 3)]).setY(0).normalize();\r\n    const side = new THREE.Vector3(-tan.z, 0, tan.x), ph = rng.float(0, 6);\r\n    const head = snakes.arc(c) \u003c 0.6;                // the head comes off: it drops and rolls a little away\r\n    const f = {\r\n      t: 0, sag: 0,\r\n      radk(i) { const d = Math.abs(i - c); return smoothstep(1.2, 3.2, d); },\r\n      shift(i, out) {\r\n        const sep = (head && i \u003c c ? 0.22 : 0.14)*(1 - Math.exp(-f.t*7));\r\n        const k = i \u003c c ? 1 : -0.6;\r\n        // the halves come apart, then twitch a few times as they die\r\n        const tw = Math.exp(-f.t*1.8)*Math.sin(f.t*18 + i*0.25 + ph)*0.05*Math.min(1, Math.abs(i - c)/12);\r\n        out[0] += tan.x*sep*k + side.x*tw; out[2] += tan.z*sep*k + side.z*tw;\r\n        if (head && i \u003c c) { out[0] += side.x*0.08*(1 - Math.exp(-f.t*4)); out[2] += side.z*0.08*(1 - Math.exp(-f.t*4)); }\r\n        if (f.t > 1.9) out[1] -= 0.34*smoothstep(1.9, 3.1, f.t);          // then into the ground\r\n      },\r\n      char(i) { return Math.exp(-Math.abs(i - c)/2.5); },\r\n      ember(i) { return Math.exp(-Math.abs(i - c)/2.0)*(1 - smoothstep(0.3, 1.8, f.t)); },\r\n      tick(dt) {\r\n        f.t += dt;\r\n        f.sag = smoothstep(0, head ? 0.25 : 0.6, f.t);\r\n        // the cut ends burn a moment and smoke\r\n        if (f.t \u003c 1.0 && rng.next() \u003c 0.6) {\r\n          const p = s.spine[c + (rng.next() \u003c 0.5 ? -3 : 3)] || s.spine[c];\r\n          fx.mote({ x: p.x + rng.spread(0.03), y: p.y + 0.03, z: p.z + rng.spread(0.03), vy: rng.float(0.4, 0.9), vx: rng.spread(0.1), vz: rng.spread(0.1),\r\n            life: rng.float(0.2, 0.4), s0: 0.08, s1: 0.02, r: 3.0, g: 1.2, b: 0.25, a: 1 - f.t });\r\n        }\r\n        if (f.t \u003c 2.0 && rng.next() \u003c 0.3) {\r\n          const p = s.spine[c];\r\n          fx.puff({ x: p.x, y: p.y + 0.05, z: p.z, vx: rng.spread(0.08), vy: rng.float(0.3, 0.5), vz: rng.spread(0.08), drag: 0.3,\r\n            life: rng.float(1.2, 2.0), s0: 0.12, s1: 0.4, r: 0.012, g: 0.011, b: 0.01, a: 0.35 });\r\n        }\r\n        if (f.t > 3.15) return 'done';\r\n      },\r\n    };\r\n    return f;\r\n  }\r\n\r\n  // the snake's frame at a ring: position, its direction (toward the head), across it\r\n  const TAN = new THREE.Vector3(), ACR = new THREE.Vector3();\r\n  function frame_at(s, c) {\r\n    TAN.subVectors(s.spine[Math.max(0, c - 3)], s.spine[Math.min(N - 1, c + 3)]).setY(0).normalize();\r\n    ACR.set(-TAN.z, 0, TAN.x);\r\n    return s.spine[c];\r\n  }\r\n\r\n  // one lens on one snake\r\n  function spawn(s, k, quick = false) {\r\n    const L = LENSES.find(q => !q.on);\r\n    if (!L) return;\r\n    // aim: the neck (the head comes off) or the middle. The body moves on while the beam\r\n    // crosses it, so it aims a little ahead of where the cut should fall.\r\n    const cut_at = rng.next() \u003c 0.5 ? 0.3 : 1.9;\r\n    const ring = Math.max(1, Math.round(snakes.ring_at(Math.max(0.05, cut_at - 0.18))));\r\n    const h = rng.float(3.8, 6.0) + k*0.4;\r\n    const pos = axis_at(h).add(new THREE.Vector3(rng.spread(0.8), 0, rng.spread(0.8)));\r\n    lich.head_pos(H);\r\n    const q = { L, s, ring, t: quick ? FORM + CONVERGE - 0.12 : 0, pos, from: H.clone(), side: rng.sign(),\r\n      spot: new THREE.Vector3(), a: new THREE.Vector3(), b: new THREE.Vector3(), fired: false, core: null, sky: null,\r\n      light: LIGHTS.find(x => !x.lens), dur: SWEEP/SPEED };\r\n    if (q.light) q.light.lens = q;\r\n    L.on = true;\r\n    L.m.position.copy(pos); L.m.scale.setScalar(0.001); L.m.visible = true; L.sh.visible = true;\r\n    active.push(q);\r\n    return pos;\r\n  }\r\n\r\n  // where the focus is before it fires: beside the snake, LEAD metres off its body at the aimed ring\r\n  const beside = (q, out) => {\r\n    if (snakes.free(q.s)) { const p = frame_at(q.s, q.ring); out.copy(p).addScaledVector(ACR, -LEAD*q.side); }\r\n    out.y = cave.ground_y(out.x, out.z) + 0.02;\r\n    return out;\r\n  };\r\n\r\n  function update(t, dt) {\r\n    for (let i = active.length - 1; i >= 0; i--) {\r\n      const q = active[i];\r\n      q.t += dt;\r\n      const L = q.L, m = L.m, U = m.material.userData.U;\r\n      const t_form = q.t/FORM, t_conv = (q.t - FORM)/CONVERGE, sweep_t = q.t - FORM - CONVERGE;\r\n      const gone = smoothstep(q.dur + OFF, q.dur + OFF + FADE, sweep_t);\r\n      // FORM: glints stream from his skull to the spot, and the glass crystallizes there\r\n      if (q.t \u003c FORM) {\r\n        lich.head_pos(H); q.from.copy(H);\r\n        const u = Math.min(1, q.t/(FORM*0.65));\r\n        const mid = q.from.clone().lerp(q.pos, 0.5).add(new THREE.Vector3(0, 1.2, 0));\r\n        const bez = (w) => q.from.clone().multiplyScalar((1 - w)*(1 - w)).addScaledVector(mid, 2*w*(1 - w)).addScaledVector(q.pos, w*w);\r\n        for (let k = 0; k \u003c 6; k++) {\r\n          const w = Math.max(0, u - rng.next()*0.3), p = bez(w);\r\n          fx.mote({ x: p.x + rng.spread(0.04), y: p.y + rng.spread(0.04), z: p.z + rng.spread(0.04), vx: rng.spread(0.15), vy: rng.spread(0.15), vz: rng.spread(0.15),\r\n            life: rng.float(0.25, 0.5), s0: 0.045, s1: 0.012, r: 2.6, g: 2.6, b: 2.8, hue: rng.next(), hr: 1, fin: 0.05 });\r\n        }\r\n        // a thin thread of his thought along the way, just behind the glints\r\n        const a0 = bez(Math.max(0, u - 0.35)), a1 = bez(u);\r\n        fx.ribbon(a0, a1, { c: [1.6, 1.6, 1.8], w: 1.2, hue: rng.next(), life: 0.08, a: 0.8 });\r\n        if (u >= 1 && !q.formed) {\r\n          q.formed = true;\r\n          for (let k = 0; k \u003c 24; k++) fx.mote({ x: q.pos.x, y: q.pos.y, z: q.pos.z, vx: rng.spread(1.2), vy: rng.spread(0.6), vz: rng.spread(1.2), drag: 3,\r\n            life: rng.float(0.2, 0.45), s0: 0.03, s1: 0.01, r: 2.4, g: 2.4, b: 2.6, hue: rng.next(), hr: 1 });\r\n        }\r\n      }\r\n      const grow = smoothstep(FORM*0.55, FORM, q.t);\r\n      const size = LENS_R*grow*(1 - 0.4*gone);\r\n      m.scale.set(size, size, size);\r\n      m.visible = size > 0.004 && gone \u003c 0.999;\r\n      L.sh.material.uniforms.uA.value = (grow*(1 - smoothstep(FORM, FORM + 0.4, q.t)) + gone*0.8)*(1 - gone*gone);\r\n      L.sh.material.uniforms.uTime.value = t;\r\n      U.uRim.value = 0.3*grow*(1 - gone);\r\n      // it drifts a little\r\n      m.position.copy(q.pos).add(new THREE.Vector3(Math.sin(t*0.9 + i)*0.04, Math.sin(t*1.3 + i*2)*0.05, Math.cos(t*0.8 + i)*0.04));\r\n      const lp = m.position.clone();\r\n      // the focus: beside the snake while it forms and converges, then the sweep across it\r\n      if (sweep_t \u003c 0) beside(q, q.spot);\r\n      else {\r\n        if (!q.fired) {\r\n          // the sweep: from LEAD beside the body, across it, and on\r\n          q.fired = true;\r\n          beside(q, q.a);\r\n          const p = frame_at(q.s, q.ring);\r\n          const dir = new THREE.Vector3().subVectors(p, q.a).setY(0).normalize();\r\n          q.b.copy(q.a).addScaledVector(dir, SWEEP);\r\n        }\r\n        const f = Math.min(1, sweep_t/q.dur);\r\n        q.spot.lerpVectors(q.a, q.b, f);\r\n        q.spot.y = cave.ground_y(q.spot.x, q.spot.z) + 0.02;\r\n      }\r\n      // it faces the focus\r\n      m.lookAt(q.spot); m.rotateX(Math.PI/2);\r\n      // CONVERGE: the cone of gathered light and its patch on the floor, tightening\r\n      const conv = t_conv \u003c 0 ? 0 : t_conv >= 1 ? 1 : t_conv;\r\n      const on_c = t_conv >= 0 && sweep_t \u003c 0.08;\r\n      L.cone.visible = on_c; L.patch.visible = on_c;\r\n      if (on_c) {\r\n        const rf = 0.03 + 0.9*Math.pow(1 - conv, 1.6);                         // the patch: wide and soft to a point\r\n        const bright = Math.min(60, (LENS_R*LENS_R)/(rf*rf));                   // the same light on less floor\r\n        const fadec = smoothstep(0, 0.2, t_conv)*(sweep_t > 0 ? 1 - sweep_t/0.08 : 1);\r\n        // the lens's rim in its own plane, and the patch's rim on the floor\r\n        const nrm = new THREE.Vector3().subVectors(q.spot, lp).normalize();\r\n        const e1 = new THREE.Vector3().crossVectors(nrm, new THREE.Vector3(0, 1, 0)); if (e1.lengthSq() \u003c 1e-6) e1.set(1, 0, 0); e1.normalize();\r\n        const e2 = new THREE.Vector3().crossVectors(nrm, e1).normalize();\r\n        const pa = L.cone.geometry.attributes.position.array, aa = L.cone.geometry.attributes.aA.array;\r\n        for (let j = 0; j \u003c SEG; j++) {\r\n          const th = j/SEG*6.2832, c = Math.cos(th), sn = Math.sin(th);\r\n          const r0 = size*0.95;\r\n          pa[j*3] = lp.x + (e1.x*c + e2.x*sn)*r0; pa[j*3 + 1] = lp.y + (e1.y*c + e2.y*sn)*r0; pa[j*3 + 2] = lp.z + (e1.z*c + e2.z*sn)*r0;\r\n          pa[(SEG + j)*3] = q.spot.x + c*rf; pa[(SEG + j)*3 + 1] = q.spot.y + 0.01; pa[(SEG + j)*3 + 2] = q.spot.z + sn*rf;\r\n          aa[j] = 0.05*fadec; aa[SEG + j] = Math.min(0.9, 0.05*Math.sqrt(bright))*fadec;\r\n        }\r\n        L.cone.geometry.attributes.position.needsUpdate = true; L.cone.geometry.attributes.aA.needsUpdate = true;\r\n        L.patch.position.set(q.spot.x, q.spot.y + 0.015, q.spot.z);\r\n        L.patch.scale.set(rf*1.6, rf*1.6, 1);\r\n        L.patch.material.uniforms.uA.value = Math.min(9, 0.35*bright)*fadec;\r\n        // dust catching the light in the cone, and smoke once the point is hot\r\n        if (rng.next() \u003c 0.6) {\r\n          const w = rng.next(), p = lp.clone().lerp(q.spot, w);\r\n          const rr = (size*0.95*(1 - w) + rf*w)*Math.sqrt(rng.next()), th = rng.float(0, 6.28);\r\n          p.addScaledVector(e1, Math.cos(th)*rr).addScaledVector(e2, Math.sin(th)*rr);\r\n          fx.mote({ x: p.x, y: p.y, z: p.z, vx: rng.spread(0.05), vy: rng.spread(0.05), vz: rng.spread(0.05), life: rng.float(0.2, 0.5), s0: 0.015, s1: 0.015, r: 1.4, g: 1.2, b: 0.9, fin: 0.3 });\r\n        }\r\n        if (conv > 0.75 && rng.next() \u003c 0.5) fx.puff({ x: q.spot.x, y: q.spot.y + 0.03, z: q.spot.z, vx: rng.spread(0.05), vy: rng.float(0.2, 0.45), vz: rng.spread(0.05), drag: 0.3,\r\n          life: rng.float(0.8, 1.4), s0: 0.05, s1: 0.3, r: 0.02, g: 0.018, b: 0.016, a: 0.4 });\r\n        if (conv > 0.6) fx.mote({ x: q.spot.x, y: q.spot.y + 0.02, z: q.spot.z, life: 0.05, s0: 0.06 + 0.1*conv, s1: 0.06, r: 5, g: 4.4, b: 3, fin: 0.01 });\r\n      }\r\n      // FIRE: the focus becomes the laser\r\n      if (sweep_t >= 0 && sweep_t \u003c= q.dur + OFF) {\r\n        const k_off = sweep_t \u003c= q.dur ? 1 : 1 - (sweep_t - q.dur)/OFF;\r\n        const pop = 1 + 0.6*Math.exp(-sweep_t*18);\r\n        const flick = 1 + 0.12*Math.sin(t*57 + i) + 0.07*Math.sin(t*83 + i*3);\r\n        const top = lp.clone().addScaledVector(S, 2.5);\r\n        if (!q.core) {\r\n          q.core = fx.ribbon(lp, q.spot, { held: true, style: look === 0 ? 2 : 3, w: 2, w0: 0.1, w1: 0.1 });\r\n          q.sky = fx.ribbon(top, lp, { held: true, style: 0, c: [1.2, 1.1, 0.8], w: 16, a: 0.12 });\r\n          fx.mote({ x: lp.x, y: lp.y, z: lp.z, life: 0.12, s0: 0.9, s1: 0.4, r: 4, g: 3.2, b: 1.8, fin: 0.01 });\r\n          fx.mote({ x: q.spot.x, y: q.spot.y + 0.05, z: q.spot.z, life: 0.14, s0: 1.0, s1: 0.5, r: 4, g: 2.4, b: 0.8, fin: 0.01 });\r\n          for (let k = 0; k \u003c 24; k++) {\r\n            const a = k/24*6.283;\r\n            fx.mote({ x: q.spot.x, y: q.spot.y + 0.04, z: q.spot.z, vx: Math.cos(a)*2.2, vy: 0.2, vz: Math.sin(a)*2.2, drag: 3, life: 0.4, s0: 0.04, s1: 0.02, r: 3.2, g: 1.4, b: 0.3, fin: 0.02 });\r\n          }\r\n        }\r\n        const w = pop*flick*k_off;\r\n        q.core.p0.copy(lp); q.core.p1.copy(q.spot);\r\n        if (look === 0) { q.core.w0 = 0.22*w; q.core.w1 = 0.16*w; } else { q.core.w0 = 0.03*w; q.core.w1 = 0.24*w; }\r\n        q.core.a = k_off; q.core.c = look === 0 ? [1, 1, 1] : [1.1, 1.0, 0.9];\r\n        q.sky.p0.copy(top); q.sky.p1.copy(lp); q.sky.a = 0.12*k_off;\r\n        // sparks shed along its length\r\n        for (let k = 0; k \u003c 2; k++) {\r\n          const e = rng.next(), p = lp.clone().lerp(q.spot, e);\r\n          fx.mote({ x: p.x + rng.spread(0.04), y: p.y, z: p.z + rng.spread(0.04), vx: rng.spread(0.7), vy: rng.float(-0.6, 0.4), vz: rng.spread(0.7), grav: 2, drag: 1.5,\r\n            life: rng.float(0.2, 0.45), s0: 0.03, s1: 0.012, r: 3.4, g: 1.5, b: 0.35, a: k_off, hue: look === 1 ? rng.next() : -1, hr: 1 });\r\n        }\r\n        if (sweep_t \u003c= q.dur) {\r\n          const sp = q.spot;\r\n          // the burning spot: a white-hot ball, sparks, smoke, and a scorch left behind\r\n          fx.mote({ x: sp.x, y: sp.y + 0.06, z: sp.z, life: 0.06, s0: 0.3*flick, s1: 0.24, r: 5, g: 3.4, b: 1.4, fin: 0.01 });\r\n          fx.mote({ x: sp.x, y: sp.y + 0.03, z: sp.z, life: 0.06, s0: 0.12, s1: 0.1, r: 6, g: 5.5, b: 4, fin: 0.01 });\r\n          for (let k = 0; k \u003c 4; k++) fx.mote({ x: sp.x, y: sp.y + 0.03, z: sp.z, vx: rng.spread(2.2), vy: rng.float(0.8, 2.6), vz: rng.spread(2.2), grav: 7, drag: 0.5,\r\n            life: rng.float(0.3, 0.7), s0: 0.03, s1: 0.012, r: 4, g: 2.2, b: 0.6, hue: look === 1 ? rng.next() : -1, hr: 1 });\r\n          if (rng.next() \u003c 0.6) fx.puff({ x: sp.x, y: sp.y + 0.05, z: sp.z, vy: rng.float(0.3, 0.6), vx: rng.spread(0.1), vz: rng.spread(0.1), drag: 0.4,\r\n            life: rng.float(1.0, 1.8), s0: 0.1, s1: 0.45, r: 0.014, g: 0.012, b: 0.011, a: 0.35 });\r\n          fx.mote({ x: sp.x + rng.spread(0.02), y: sp.y + 0.01, z: sp.z + rng.spread(0.02), life: rng.float(1.4, 2.4), s0: 0.06, s1: 0.035, r: 1.4, g: 0.4, b: 0.07, a: 0.85, fin: 0.02 });\r\n          // whatever it crosses is cut: at the neck or anywhere up to the middle, never the tail\r\n          for (const s of snakes.S) {\r\n            if (!snakes.free(s)) continue;\r\n            let best = 1e9, bi = -1;\r\n            for (let j = 2; j \u003c N - 2; j += 1) { const d = Math.hypot(s.spine[j].x - sp.x, s.spine[j].z - sp.z); if (d \u003c best) { best = d; bi = j; } }\r\n            if (best \u003c CUT_R && snakes.arc(bi) \u003c= CUT_MAX && snakes.arc(bi) >= 0.12) { s.claim = null; snakes.take(s, cut_fx(s, Math.max(3, bi))); cuts.push({ arc: +snakes.arc(bi).toFixed(2), target: s === q.s }); }\r\n          }\r\n        }\r\n      }\r\n      if (q.light) {\r\n        const lit = sweep_t \u003c 0 ? (t_conv > 0 ? 0.25 + 0.75*conv*conv : 0) : sweep_t \u003c= q.dur + OFF ? (sweep_t \u003c= q.dur ? 1 : 1 - (sweep_t - q.dur)/OFF) : 0;\r\n        q.light.l.position.set(q.spot.x, q.spot.y + 0.3, q.spot.z);\r\n        q.light.l.intensity = 2.2*lit*(0.85 + 0.15*Math.sin(t*37));\r\n      }\r\n      // END: the glass dissolves into glints\r\n      if (gone > 0 && gone \u003c 1 && rng.next() \u003c 0.5) fx.mote({ x: lp.x + rng.spread(0.3), y: lp.y + rng.spread(0.05), z: lp.z + rng.spread(0.3), vx: rng.spread(0.3), vy: rng.float(-0.2, 0.3), vz: rng.spread(0.3),\r\n        life: rng.float(0.3, 0.6), s0: 0.03, s1: 0.01, r: 2, g: 2, b: 2.2, hue: rng.next(), hr: 1 });\r\n      if (sweep_t > q.dur + OFF + FADE) {\r\n        L.on = false; m.visible = false; L.sh.visible = false; L.cone.visible = false; L.patch.visible = false;\r\n        for (const r of [q.core, q.sky]) if (r) fx.release(r);\r\n        if (q.light) { q.light.l.intensity = 0; q.light.lens = null; }\r\n        active.splice(i, 1);\r\n      }\r\n    }\r\n  }\r\n\r\n  return {\r\n    name: 'LENS', gesture: false,\r\n    cooldown: 6.5,\r\n    capacity: p => Math.ceil(p/1.5),\r\n    // returns where the lenses form (he glances up at them)\r\n    cast(targets, quick = false) { return targets.map((s, k) => spawn(s, k, quick)).filter(Boolean); },\r\n    update,\r\n    get busy() { return active.length; },\r\n    get look() { return look; },\r\n    set look(v) { look = ((v % LENS_LOOKS.length) + LENS_LOOKS.length) % LENS_LOOKS.length; },\r\n    free_lenses: () => LENSES.filter(q => !q.on).length,\r\n    cuts,\r\n  };\r\n}\r\n","game/lich.js":"// lich.js -- the lich: a realistic human skeleton (skeleton.js), all bones, no robe, floating;\r\n// prismatic gem bone (gem.js, STRONG by default: owner, round 2), lit only by the scene.\r\n//\r\n// The rig is a tree of joints (pelvis -> spine -> chest -> neck -> head -> jaw; chest ->\r\n// shoulder -> elbow -> wrist -> fingers; pelvis -> hip -> knee -> ankle). The resting float\r\n// follows Astra's lich 07 (owner, round 2: \"the more correct shape\"): the body leaning a little\r\n// forward, the legs held together and swept back on one diagonal, knees nearly touching, shins\r\n// angled back a little more than the thighs, feet pointed down, one leg a little behind the\r\n// other; one hand hanging curled before the pelvis, the other reaching forward and down.\r\n// Round 5: that pose is only where the parts rest; each one floats on a spring around it (pose()).\r\nimport * as THREE from 'three';\r\nimport { gi_dynamic } from 'game/gi.js';\r\nimport { gem_material, GEM_LEVELS, PATTERNS } from 'game/gem.js';\r\nimport { build_skeleton_geometry, RIG, FINGERS } from 'game/skeleton.js';\r\n\r\nexport function create_lich(R, opts = {}) {\r\n  const mat = gem_material({ flat: false, roughness: 0.44, color: 0xecdab2 });   // round 8: warmer ivory (owner: \"more yellow, less grey\")\r\n  if (opts.GU) gi_dynamic(mat, opts.GU);\r\n  const GU = mat.userData.gemU;\r\n  const t0 = performance.now();\r\n  const GEO = build_skeleton_geometry(opts.res || 1.45);\r\n  const build_ms = performance.now() - t0;\r\n  let tris = 0;\r\n\r\n  const root = new THREE.Group();            // world placement (position + yaw), set by the caller\r\n  const body = new THREE.Group();            // bob and lean\r\n  root.add(body);\r\n  const node = (parent, p = [0, 0, 0], s = 1) => { const g = new THREE.Group(); g.position.set(p[0]*s, p[1], p[2]); parent.add(g); return g; };\r\n  const skin = (n, key) => {\r\n    const g = GEO[key];\r\n    if (!g) return;\r\n    // a number per bone for the gem's PER BONE pattern\r\n    if (!g.attributes.aBone) { let h = 0; for (const c of key) h = (h*31 + c.charCodeAt(0)) % 9973; g.setAttribute('aBone', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count).fill(h), 1)); }\r\n    const m = new THREE.Mesh(g, mat);\r\n    m.castShadow = true; m.receiveShadow = true;\r\n    n.add(m);\r\n    tris += (g.index ? g.index.count : g.attributes.position.count)/3;\r\n  };\r\n\r\n  const pelvis = node(body); skin(pelvis, 'pelvis');\r\n  const spine = node(pelvis, RIG.spine); skin(spine, 'spine');\r\n  const chest = node(spine, RIG.chest); skin(chest, 'chest');\r\n  const neck = node(chest, RIG.neck); skin(neck, 'neck');\r\n  const head = node(neck, RIG.head); skin(head, 'head');\r\n  const jaw = node(head, RIG.jaw); skin(jaw, 'jaw');\r\n  const arms = [], legs = [];\r\n  for (const s of [-1, 1]) {\r\n    const S = s > 0 ? 'L' : 'R';\r\n    const sh = node(chest, RIG.shoulder, s); skin(sh, 'upper' + S);\r\n    const el = node(sh, RIG.elbow); skin(el, 'fore' + S);\r\n    const wr = node(el, RIG.wrist); skin(wr, 'hand' + S);\r\n    const fingers = FINGERS.map((f, i) => {\r\n      const segs = [];\r\n      let parent = node(wr, [0, -0.028 - f.meta, f.z]);\r\n      f.ph.forEach((L, j) => {\r\n        skin(parent, `finger${S}${i}_${j}`);\r\n        segs.push(parent);\r\n        parent = node(parent, [0, -L, 0]);\r\n      });\r\n      segs.tip = parent;                         // the fingertip (a beam leaves from here)\r\n      return segs;\r\n    });\r\n    const thumb = [];\r\n    let tp = node(wr, [s*0.012, -0.055, 0.046]);\r\n    [0.034, 0.026].forEach((L, j) => {\r\n      skin(tp, `thumb${S}_${j}`);\r\n      thumb.push(tp);\r\n      tp = node(tp, [0, -L, 0]);\r\n    });\r\n    arms.push({ s, sh, el, wr, fingers, thumb });\r\n    const hip = node(pelvis, RIG.hip, s); skin(hip, 'thigh' + S);\r\n    const kn = node(hip, RIG.knee, s); skin(kn, 'knee' + S); skin(kn, 'shin' + S);\r\n    const an = node(kn, RIG.ankle); skin(an, 'foot' + S);\r\n    legs.push({ s, hip, kn, an });\r\n  }\r\n\r\n  R.world_scene.add(root);\r\n  // round 5: steered into the dark he vanished (he was lit only by the scene). GLOWS: his bones\r\n  // shine on their own, faintly or clearly; NONE is round 4. The point light stays at zero.\r\n  const light = new THREE.PointLight(0xffffff, 0, 0.1, 2);   // kept at zero: the lich lights nothing around him\r\n\r\n  // round 8 (owner: out of the light \"less bright, following the surrounding's light level\"):\r\n  // the bone keeps the light it gets (lifted or dimmed in proportion to it), plus a faint warm\r\n  // floor; bone is pale, so even unlifted it reads ~4x brighter than the dark rock beside it\r\n  const GLOWS = [\r\n    { name: 'FOLLOWS THE LIGHT', lift: 0, glow: 0.0015 },\r\n    { name: 'A LITTLE BRIGHTER', lift: 0.7, glow: 0.004 },\r\n    { name: 'DIMMER', lift: -0.35, glow: 0 },\r\n  ];\r\n  let glow = 0;\r\n  const set_glow = (i) => { glow = ((i % GLOWS.length) + GLOWS.length) % GLOWS.length; GU.uGlow.value = GLOWS[glow].glow; GU.uLift.value = GLOWS[glow].lift || 0; };\r\n  set_glow(0);\r\n  const MODES = GEM_LEVELS.map(l => 'GEM, ' + l.name);\r\n  let mode = 2;                               // round 8 (owner): SUBTLE, with the SOFT pattern\r\n  mat.userData.set_level(GEM_LEVELS[mode]);\r\n\r\n  // ---------------------------------------------------------------- the float (rounds 5-6)\r\n  // Every part is a floating object on a soft spring, pushed around by the body's motion: m.a =\r\n  // the pelvis' acceleration in the body frame (x = his left, y = up, z = forward), m.v its\r\n  // velocity, m.push = where he is sent minus how he moves (big when a move starts or turns,\r\n  // gone once he is under way), m.yaw_a the turn, m.look where he is sent relative to his facing.\r\n  // Round 6 (owner: \"arms and legs need to actually move and be independent\"; arms \"very light\r\n  // and go with the flow, mostly staying down and behind as he moves, but also moving around\r\n  // lightly\"; legs \"prefer the relative position they have to each other now\" with \"a bit more\r\n  // freedom\"; head and torso \"lean towards movement direction first and then the rest of the\r\n  // body follows\"):\r\n  // - the head leads, then the chest: both lean and turn toward the push; then the whole body\r\n  //   leans into its speed, the hips turn, the legs trail;\r\n  // - arms are slow, soft pendulums: moving, they settle down and behind with the hands\r\n  //   trailing; the torso swinging above them swings them; each drifts on its own when still;\r\n  // - each leg has its own springs (thigh, knee, ankle, twist) and its own drift, plus a pull\r\n  //   toward the other leg, so the pair keeps its shape but never moves as one rigid piece.\r\n  const JUICE = [\r\n    { name: 'FLOATY', gain: 1.0, freq: 1.0, damp: 1.0 },\r\n    { name: 'LOOSE', gain: 1.6, freq: 0.8, damp: 0.72 },\r\n    { name: 'LIGHT', gain: 0.55, freq: 1.25, damp: 1.4 },\r\n    { name: 'OFF: ROUND 4, RIGID', gain: 0, freq: 1.0, damp: 1.0 },\r\n  ];\r\n  let juice = 0;\r\n  // arms in rig order (s = -1 hanging, s = +1 reaching): where each rests, and where both go moving\r\n  const ARM_REST = [{ p: -0.12, e: -1.25, w: -0.25, curl: 0.55 }, { p: -0.72, e: -0.42, w: -0.35, curl: 0.32 }];\r\n  const ARM_TRAIL = { p: 0.36, e: -0.3, w: 0.3, curl: 0.2 };\r\n  let trail = 0;                              // how far into the trailing pose the arms are: eases in, drifts out\r\n  const SP = (x = 0) => ({ x, v: 0, a: 0 });\r\n  const S = {\r\n    bp: SP(), br: SP(), py: SP(), cp: SP(), cr: SP(), cy: SP(), hp: SP(), hr: SP(), hy: SP(), jw: SP(),\r\n    legs: [0, 1].map(() => ({ p: SP(), r: SP(), k: SP(), an: SP(), tw: SP() })),\r\n    arms: ARM_REST.map(r => ({ p: SP(r.p), r: SP(), t: SP(), e: SP(r.e), w: SP(r.w), f: SP() })),\r\n  };\r\n  let fq = 1, dz = 1;\r\n  // one step of a damped spring toward `target` (radians), `f` Hz, damping ratio `z`, plus a\r\n  // force (rad/s^2); keeps its acceleration for the parts hanging below it\r\n  const spring = (s, target, f, z, force, dt) => {\r\n    const w = 6.2832*f*fq, zz = Math.min(1.2, z*dz);\r\n    s.a = w*w*(target - s.x) - 2*zz*w*s.v + force;\r\n    s.v += s.a*dt; s.x += s.v*dt;\r\n  };\r\n  // air: slow, never-repeating pushes (a force that deflects a spring by about `amp` radians)\r\n  const air = (t, k, f, amp) => { const w = 6.2832*f*fq; return w*w*amp*(Math.sin(t*0.71 + k*1.37)*0.55 + Math.sin(t*1.29 + k*2.71)*0.3 + Math.sin(t*2.17 + k*0.53)*0.15); };\r\n  const clamp = (x, a, b) => (x \u003c a ? a : x > b ? b : x);\r\n  const mix = (a, b, t) => a + (b - a)*t;\r\n  const INV = new THREE.Matrix4(), TV = new THREE.Vector3(), TIP = new THREE.Vector3();\r\n  const NO_MOTION = { a: [0, 0, 0], v: [0, 0, 0], push: [0, 0], yaw_a: 0, yaw_v: 0, look: 0, gaze: 0, gaze_p: 0, gaze_w: 0 };\r\n\r\n  const lich = {\r\n    root, body, mat, light, MODES, build_ms, tris, nodes: { pelvis, spine, chest, neck, head, jaw, arms, legs },\r\n    JUICE, springs: S, GLOWS, PATTERNS,\r\n    get pattern() { return GU.uPattern.value; },\r\n    set pattern(i) { GU.uPattern.value = ((i % PATTERNS.length) + PATTERNS.length) % PATTERNS.length; },\r\n    get glow() { return glow; },\r\n    set glow(i) { set_glow(i); },\r\n    get mode() { return mode; },\r\n    set mode(m) { mode = ((m % MODES.length) + MODES.length) % MODES.length; mat.userData.set_level(GEM_LEVELS[mode]); },\r\n    get juice() { return juice; },\r\n    set juice(j) { juice = ((j % JUICE.length) + JUICE.length) % JUICE.length; },\r\n    hover_h: 1.28,          // pelvis height above the ground; the pointed toes hang ~0.3 m above it\r\n    pose(t, dt = 1/60, m = NO_MOTION) {\r\n      const J = JUICE[juice], g = J.gain, gt = Math.min(1, g);\r\n      fq = J.freq; dz = J.damp;\r\n      const [ax, ay, az] = m.a, [vx, , vz] = m.v, [px, pz] = m.push;\r\n      const ya = m.yaw_a, speed = Math.hypot(vx, vz), still = 1 - clamp(speed/0.6, 0, 1);\r\n      const fwd = clamp(vz/2.6, 0, 1), side = clamp(vx/2.6, -1, 1);\r\n\r\n      // the upper body leads: the head first (fastest), then the chest, lean and turn toward\r\n      // the push; leaning back a little when he brakes\r\n      const idle_glance = Math.sin(t*0.33)*0.1*still;\r\n      const gz = m.gaze_w || 0;\r\n      // ... unless he is looking at a snake he means to burn (rounds 9-10): the head turns and\r\n      // tilts down to the spot first, the chest follows a little\r\n      spring(S.hp, mix(clamp((0.26*pz - 0.2*(S.bp.x + S.cp.x))*g, -0.12, 0.3), clamp((m.gaze_p || 0) - 0.27, -0.7, 0.55), gz), 2.4, 0.6, air(t, 5, 2.4, 0.03*g), dt);\r\n      spring(S.hr, clamp((-0.22*px - 0.2*(S.br.x + S.cr.x))*g, -0.25, 0.25), 2.4, 0.6, air(t, 6, 2.4, 0.025*g), dt);\r\n      const gc = clamp((m.gaze || 0)*0.3, -0.35, 0.35);\r\n      spring(S.hy, mix(clamp(m.look*0.5, -0.5, 0.5)*g + idle_glance, clamp((m.gaze || 0) - gc, -1.1, 1.1), gz), 2.2, 0.75, air(t, 8, 2.2, 0.025*g), dt);\r\n      spring(S.cp, clamp((0.24*pz + 0.05*fwd)*g, -0.1, 0.3), 1.6, 0.6, air(t, 3, 1.6, 0.02*g), dt);\r\n      spring(S.cr, clamp(-0.2*px*g, -0.22, 0.22), 1.6, 0.6, air(t, 4, 1.6, 0.018*g), dt);\r\n      spring(S.cy, mix(clamp(m.look*0.4*g, -0.45, 0.45), gc, gz), 1.6, 0.7, air(t, 9, 1.6, 0.02*g), dt);\r\n      // then the whole body leans into its speed and banks into turns; the hips turn last\r\n      spring(S.bp, clamp((0.03*vz + 0.02*az)*g, -0.2, 0.24), 0.9, 0.75, air(t, 1, 0.9, 0.012*g), dt);\r\n      spring(S.br, clamp(-0.035*ax*g, -0.24, 0.24), 0.9, 0.75, air(t, 2, 0.9, 0.012*g), dt);\r\n      spring(S.py, 0, 1.1, 0.45, -ya*0.05*g, dt);\r\n      // jaw: a hinged weight under the skull; a push up or forward drops it, a stop clacks it shut\r\n      spring(S.jw, 0, 2.3, 0.22, (ay*8 + az*3.5)*g + air(t, 7, 2.3, 0.015*g), dt);\r\n      const JAW0 = 0.07 + Math.max(0, Math.sin(t*0.45))*0.04;\r\n      if (JAW0 + S.jw.x \u003c 0.0) { S.jw.x = -JAW0; if (S.jw.v \u003c 0) S.jw.v = -S.jw.v*0.3; }\r\n      if (JAW0 + S.jw.x > 0.42) { S.jw.x = 0.42 - JAW0; if (S.jw.v > 0) S.jw.v = 0; }\r\n\r\n      // legs: + pitch = feet back, + roll = feet to his left. A push forward swings them back,\r\n      // speed trails them, a stop swings them under him; each leg drifts on its own time and is\r\n      // pulled toward the other, so the pair keeps its shape without moving as one piece.\r\n      const pull = 14*fq*fq;\r\n      S.legs.forEach((L, k) => {\r\n        const O = S.legs[1 - k];\r\n        const df = k ? 1.08 : 0.93, dd = k ? 0.9 : 1.1, sd = k ? 31 : 10, tt = t*(k ? 1.14 : 0.87);\r\n        spring(L.p, clamp(0.045*vz*g, -0.1, 0.18), 0.75*df, 0.3*dd, (az*0.75 - ay*0.4)*g + (O.p.x - L.p.x)*pull + air(tt, sd, 0.75, 0.07*g), dt);\r\n        spring(L.r, clamp(-0.04*vx*g, -0.16, 0.16), 0.7*df, 0.3*dd, (-ax*0.8 + ya*0.08)*g + (O.r.x - L.r.x)*pull + air(tt, sd + 2, 0.7, 0.05*g), dt);\r\n        // the shin hangs from the knee: it lags the thigh's swing (the whip), and drifts\r\n        spring(L.k, 0, 1.2*df, 0.3, (az*0.7 - L.p.a*0.4)*g + air(tt, sd + 4, 1.2, 0.08*g), dt);\r\n        // the foot from the ankle, a smaller whip again; the thigh turns a little on its axis\r\n        spring(L.an, 0, 1.7*df, 0.3, (az*0.4 - L.k.a*0.3)*g + air(tt, sd + 6, 1.7, 0.09*g), dt);\r\n        spring(L.tw, 0, 0.9*df, 0.4, air(tt, sd + 8, 0.9, 0.1*g) - ya*0.03*g, dt);\r\n      });\r\n      let r0 = S.legs[0].r.x, r1 = S.legs[1].r.x;\r\n      if (r0 - r1 > 0.03) { const c = (r0 + r1)/2; r0 = c + 0.015; r1 = c - 0.015; }   // the knees never pass through each other\r\n      for (const l of legs) {\r\n        const k = l.s > 0 ? 1 : 0, L = S.legs[k];\r\n        const stagger = l.s > 0 ? 0.07 : 0;\r\n        l.hip.rotation.set(clamp(0.1 + stagger + L.p.x, -0.35, 0.9), clamp(L.tw.x, -0.2, 0.2), -0.02*l.s + clamp(k ? r1 : r0, -0.4, 0.4));   // thighs ~12-16 deg back at rest\r\n        l.kn.rotation.set(clamp(0.2 + stagger*0.5 + L.k.x, 0.03, 0.9), 0, 0.015*l.s);                    // shins a little further back; knees never bend forward\r\n        l.an.rotation.set(clamp(1.0 + L.an.x, 0.55, 1.45), 0, 0);                                        // toes pointed down\r\n      }\r\n\r\n      // arms: light, slow pendulums (+ pitch = hand back, + roll = hand to his left). Moving,\r\n      // both settle down and behind with the hands trailing; the body's push and the torso\r\n      // swinging above them swing them; each drifts on its own, out of step with the other.\r\n      trail += (fwd*gt - trail)*(1 - Math.exp(-dt/(fwd*gt > trail ? 0.35 : 0.9)));\r\n      arms.forEach((A, k) => {\r\n        const Q = S.arms[k], s = A.s, R0 = ARM_REST[k];\r\n        const df = k ? 1.12 : 0.9, sd = 40 + k*17, tt = t*(k ? 1.21 : 0.79);\r\n        // pointing (round 11): the arm he casts with rises to the target, straight, the index\r\n        // finger out; the pose's springs carry it there, stiffer while it points\r\n        const pt = m.point && m.point.arm === k ? m.point.w : 0;\r\n        let aim_p = 0, aim_r = 0;\r\n        if (pt > 0) {\r\n          chest.updateWorldMatrix(true, false);\r\n          INV.copy(chest.matrixWorld).invert();\r\n          TV.set(m.point.x, m.point.y, m.point.z).applyMatrix4(INV).sub(A.sh.position).normalize();\r\n          aim_r = Math.asin(clamp(TV.x, -1, 1)); aim_p = Math.atan2(-TV.z, -TV.y);\r\n          aim_r = s*Math.max(-0.45, s*aim_r);                         // across the body only a little\r\n          aim_p = clamp(aim_p, -2.4, 0.9);\r\n        }\r\n        const base_r = (s \u003c 0 ? 0.12 : 0.22)*s;\r\n        const drive = (az*0.85 + ay*Math.sin(-Q.p.x) + (S.cp.a + S.bp.a)*0.5 - s*(S.cy.a + ya)*0.3)*(1 - pt);\r\n        spring(Q.p, mix(mix(R0.p, ARM_TRAIL.p, trail), aim_p, pt), mix(0.55*df, 2.3, pt), mix(0.34, 0.75, pt), drive*g + air(tt, sd, 0.55, 0.1*g*(1 - pt)), dt);\r\n        spring(Q.r, mix((-0.25*side + s*0.1*fwd)*gt, aim_r - base_r, pt), mix(0.6*df, 2.3, pt), mix(0.3, 0.75, pt), (-ax + (S.cr.a + S.br.a)*0.4)*g*(1 - pt) + air(tt, sd + 3, 0.6, 0.07*g*(1 - pt)), dt);\r\n        spring(Q.t, 0, 0.7*df, 0.4, air(tt, sd + 5, 0.7, 0.12*g*(1 - pt)), dt);\r\n        spring(Q.e, mix(mix(R0.e, ARM_TRAIL.e, trail), -0.1, pt), mix(1.0*df, 2.6, pt), mix(0.3, 0.75, pt), (az*0.8 - Q.p.a*0.35)*g*(1 - pt) + air(tt, sd + 7, 1.0, 0.1*g*(1 - pt)), dt);\r\n        spring(Q.w, mix(mix(R0.w, ARM_TRAIL.w, trail), 0.05, pt), mix(1.5*df, 3.0, pt), mix(0.3, 0.75, pt), (az*0.5 - Q.e.a*0.3)*g*(1 - pt) + air(tt, sd + 9, 1.5, 0.08*g*(1 - pt)), dt);\r\n        spring(Q.f, (ARM_TRAIL.curl - R0.curl)*trail, 2.0*df, 0.3, (az*0.6 - Q.w.a*0.2)*g + air(tt, sd + 11, 2.0, 0.06*g), dt);\r\n        const roll = s*Math.max(mix(-0.08, -0.45, pt), s*Q.r.x);      // never swings in through the ribs\r\n        A.sh.rotation.set(clamp(Q.p.x, -2.4, 1.0), clamp(Q.t.x, -0.35, 0.35), base_r + roll);\r\n        A.el.rotation.set(clamp(Q.e.x, -1.9, -0.05), 0, 0);\r\n        A.wr.rotation.set(clamp(Q.w.x, -0.9, 0.7), -s*(s \u003c 0 ? 0.9 : 1.25), 0);\r\n        const curl = R0.curl + clamp(Q.f.x, -0.3, 0.4);\r\n        A.fingers.forEach((segs, i) => {\r\n          // pointing: the index finger (0) straightens, the others close\r\n          const c = mix(curl, i === 0 ? -0.1 : 1.05, pt);\r\n          segs.forEach((n, j) => n.rotation.set(0, 0, -s*(c + j*(i === 0 ? 0.12*(1 - pt) : 0.12 + 0.25*pt) + i*0.03 + Math.sin(t*1.3 + i)*0.03)));\r\n        });\r\n        A.thumb[0].rotation.set(0.5, 0, -s*0.35);\r\n        A.thumb[1].rotation.set(0, 0, -s*0.3);\r\n      });\r\n\r\n      body.position.y = 0;\r\n      body.rotation.set(0.1 + S.bp.x, 0, S.br.x);\r\n      pelvis.rotation.set(0, S.py.x, 0);\r\n      spine.rotation.set(0.04 + S.cp.x*0.5, -S.py.x*0.75 + S.cy.x*0.45, S.cr.x*0.5);\r\n      chest.rotation.set(0.03 + S.cp.x*0.5, S.cy.x*0.55, S.cr.x*0.5);\r\n      neck.rotation.set(0.04 + S.hp.x*0.3, S.hy.x*0.3, S.hr.x*0.3);\r\n      head.rotation.set(-0.02 + S.hp.x*0.7, S.hy.x*0.7, S.hr.x*0.7);                  // ~15 deg down in all, as in 07\r\n      jaw.rotation.x = JAW0 + S.jw.x;\r\n    },\r\n    update(t) {\r\n      GU.uGemTime.value = t;\r\n    },\r\n    // where the index fingertip of an arm (0 = his right, 1 = his left) is, world\r\n    fingertip(k, out = new THREE.Vector3()) { const n = arms[k].fingers[0].tip; n.updateWorldMatrix(true, false); return n.getWorldPosition(out); },\r\n    head_pos(out = new THREE.Vector3()) { head.updateWorldMatrix(true, false); return head.getWorldPosition(out).add(TIP.set(0, 0.08, 0)); },\r\n  };\r\n  return lich;\r\n}\r\n","game/lift.js":"// lift.js -- LIFT AND BURST (round 11, owner): he points; the snake is lifted off the floor by\r\n// an unseen hand under its middle (head and tail hanging, the body writhing), held a moment,\r\n// swells, and bursts: dark chunks thrown out to fall and bounce, a mist of blood, dust\r\n// kicked up on the floor below. With fewer powers left one gesture lifts several at once.\r\nimport * as THREE from 'three';\r\nimport { smoothstep } from 'game/util.js';\r\n\r\nconst RISE = 0.8, HOLD = 0.4, SWELL = 0.14;\r\n\r\nexport function create_lift(ctx) {\r\n  const { snakes, fx, cave, rng } = ctx;\r\n  const N = snakes.RINGS, mid = Math.round(N*0.45), half = N*0.55;\r\n\r\n  function lift_fx(s) {\r\n    const H = rng.float(1.5, 2.0), side = new THREE.Vector2();\r\n    // the body's sideways direction (for the writhe): across its head-to-tail line\r\n    const a = s.spine[4], b = s.spine[N - 5];\r\n    side.set(-(a.z - b.z), a.x - b.x).normalize();\r\n    const ph = rng.float(0, 6.28);\r\n    const f = {\r\n      t: 0, sag: 0,\r\n      lift(i) {\r\n        const e = smoothstep(0, RISE, f.t);\r\n        const d = (i - mid)/half;\r\n        return H*e*(1 - 0.5*d*d) + (f.t > RISE ? Math.sin(f.t*31 + i*0.7)*0.012*smoothstep(RISE, RISE + HOLD, f.t) : 0);\r\n      },\r\n      shift(i, out) {\r\n        // writhing in the air, and the tremble before it bursts\r\n        const w = smoothstep(0.1, 0.5, f.t)*Math.sin(i*0.3 - f.t*7 + ph)*0.09*(1 - 0.5*smoothstep(RISE, RISE + HOLD, f.t));\r\n        out[0] += side.x*w; out[2] += side.y*w;\r\n      },\r\n      radk(i) { const sw = smoothstep(RISE + HOLD, RISE + HOLD + SWELL, f.t); return 1 + sw*0.35*(1 - Math.abs((i - mid)/half)); },\r\n      hide: false,\r\n      tick(dt) {\r\n        f.t += dt;\r\n        f.sag = smoothstep(0, RISE, f.t);\r\n        if (f.t >= RISE + HOLD + SWELL && !f.hide) { burst(s); f.hide = true; }\r\n        if (f.t >= RISE + HOLD + SWELL + 0.05) return 'done';\r\n      },\r\n    };\r\n    return f;\r\n  }\r\n\r\n  function burst(s) {\r\n    // the centre of the body, and the floor under it\r\n    const c = s.spine[mid], gy = cave.ground_y(c.x, c.z);\r\n    for (let k = 0; k \u003c 16; k++) {\r\n      const i = rng.int(2, N - 3), p = s.spine[i];\r\n      const q = fx.chunk();\r\n      const out = new THREE.Vector3(p.x - c.x, 0, p.z - c.z);\r\n      if (out.lengthSq() \u003c 1e-4) out.set(rng.spread(1), 0, rng.spread(1));\r\n      out.normalize();\r\n      const sp = rng.float(1.5, 3.8);\r\n      Object.assign(q, { life: rng.float(3.0, 4.0), x: p.x, y: p.y, z: p.z, vx: out.x*sp + rng.spread(1.2), vy: rng.float(1.0, 3.2), vz: out.z*sp + rng.spread(1.2),\r\n        rx: rng.float(0, 6), ry: rng.float(0, 6), rz: rng.float(0, 6), wx: rng.spread(12), wy: rng.spread(12), wz: rng.spread(12),\r\n        s: rng.float(0.035, 0.07)*(i \u003c 8 ? 0.8 : 1), sx: rng.float(0.8, 1.6), sy: rng.float(0.6, 1.0), sz: rng.float(0.8, 1.4) });\r\n    }\r\n    // a mist of blood, spreading and falling\r\n    for (let k = 0; k \u003c 34; k++) {\r\n      const p = s.spine[rng.int(0, N - 1)];\r\n      fx.puff({ x: p.x, y: p.y, z: p.z, vx: rng.spread(1.4), vy: rng.float(-0.2, 1.2), vz: rng.spread(1.4), grav: 1.2, drag: 1.6,\r\n        life: rng.float(0.7, 1.4), s0: rng.float(0.1, 0.2), s1: rng.float(0.35, 0.6), r: 0.028, g: 0.004, b: 0.003, a: 0.6, fin: 0.03 });\r\n    }\r\n    // droplets that fall to the floor and stay a moment\r\n    for (let k = 0; k \u003c 40; k++) {\r\n      const p = s.spine[rng.int(0, N - 1)];\r\n      fx.puff({ x: p.x, y: p.y, z: p.z, vx: rng.spread(2.6), vy: rng.float(0.2, 2.4), vz: rng.spread(2.6), grav: 9.8, drag: 0.2, floor: true,\r\n        life: rng.float(1.2, 2.2), s0: 0.03, s1: 0.045, r: 0.045, g: 0.004, b: 0.003, a: 0.9, fin: 0.01 });\r\n    }\r\n    // the pop: a brief pale flash where it was\r\n    fx.mote({ x: c.x, y: c.y, z: c.z, life: 0.12, s0: 0.9, s1: 1.4, r: 2.2, g: 2.0, b: 1.8, a: 1, fin: 0.01 });\r\n    // dust knocked up from the floor below\r\n    for (let k = 0; k \u003c 14; k++) {\r\n      const a = rng.float(0, 6.28), r = rng.float(0.1, 0.6);\r\n      fx.puff({ x: c.x + Math.cos(a)*r, y: gy + 0.05, z: c.z + Math.sin(a)*r, vx: Math.cos(a)*rng.float(0.6, 1.4), vy: rng.float(0.1, 0.4), vz: Math.sin(a)*rng.float(0.6, 1.4),\r\n        drag: 2.2, life: rng.float(0.8, 1.4), s0: 0.15, s1: 0.5, r: 0.03, g: 0.025, b: 0.018, a: 0.5 });\r\n    }\r\n  }\r\n\r\n  return {\r\n    name: 'LIFT', gesture: true,\r\n    cooldown: 6.0,\r\n    capacity: p => Math.ceil(p/1.5),\r\n    // where he points: the middle of the body\r\n    aim_ring: () => mid,\r\n    cast(targets) { for (const s of targets) snakes.take(s, lift_fx(s)); },\r\n    update() { },\r\n  };\r\n}\r\n","game/main.js":"// main.js -- round 5: the lich under the player's hand in the ending's cave. WASD / arrows move\r\n// him relative to the camera; holding the left mouse button sends him toward the point under\r\n// the cursor (a click sends him there and he stops). He floats (mover.js), and every part of\r\n// him floats on its own spring around the 07 pose (lich.js): the legs swing as one pair, the\r\n// torso and head lag and settle, the arms swing, the jaw clacks shut when he stops.\r\n//\r\n// Keys: 1-4 camera (1 = the room camera, the game's; 2-4 follow him to judge the motion),\r\n// 5-0 the six powers on/off, F fire colour, J floatiness, R prism pattern, G out-of-the-light level, P prism strength, B darkness,\r\n// H hides the text. In 4 (FREE) right-drag orbits.\r\n// Fixed 60 Hz step, rendering every animation frame. window.GAME is the harness API\r\n// (tools/shoot.mjs): ready, setManual, step(n, input), state(), cam(i), juice(i).\r\nimport * as THREE from 'three';\r\nimport { DT, clamp, make_rng } from 'game/util.js';\r\nimport { create_render } from 'game/render.js';\r\nimport { build_cave, LAYOUT } from 'game/cave.js';\r\nimport { create_lich } from 'game/lich.js';\r\nimport { create_snakes } from 'game/snakes.js';\r\nimport { create_fire } from 'game/fire.js';\r\nimport { create_fx } from 'game/fx.js';\r\nimport { create_powers } from 'game/powers.js';\r\nimport { CHAIN_MODES } from 'game/beam.js';\r\nimport { LENS_LOOKS } from 'game/lens.js';\r\nimport { build_nav } from 'game/nav.js';\r\nimport { create_mover, MOVE } from 'game/mover.js';\r\nimport { draw_text } from 'game/hud_font.js';\r\n\r\nconst R = create_render(document.body);\r\nR.canvas.style.cursor = 'default';\r\nconst cave = build_cave(R);\r\nconst lich = create_lich(R, { GU: cave.GU });\r\nconst EGG = cave.egg.position;\r\n\r\nconst G = { t: 0, tick: 0, cam: 0, manual: false, hud: true, dark: 1,\r\n  static: { eye: [-3.6, 9.8, -10.4], tgt: [0.4, 0.1, 2.4] },   // owner, round 2: lower, tilted up; the far wall just shows\r\n  free: { yaw: 200, pitch: 18, dist: 4.5 } };\r\nwindow.G = G;\r\nG.R = R; G.bake_ms = Math.round(cave.bake_ms); G.tris = cave.tris; G.cave = cave; G.gi_cached = cave.gi_cached; G.lich = lich;\r\n\r\n// ------------------------------------------------------------------ where he can go\r\n// Rock over 0.6 m blocks him, lower rock lifts him; the egg blocks him; so does anything the\r\n// room camera can't see (his whole body, toes to skull, stays in its frame).\r\nconst room_cam = new THREE.PerspectiveCamera(50, R.W/R.H, 0.1, 200);\r\nroom_cam.position.set(...G.static.eye); room_cam.lookAt(...G.static.tgt);\r\nroom_cam.updateMatrixWorld(); room_cam.updateProjectionMatrix();\r\nconst nav = build_nav({ geo: cave.rock_geo, ground_y: cave.ground_y });\r\n{\r\n  const q = new THREE.Vector3();\r\n  const in_frame = (x, y, z) => { q.set(x, y, z).project(room_cam); return q.z \u003c 1 && Math.abs(q.x) \u003c 0.92 && q.y > -0.9 && q.y \u003c 0.86; };\r\n  nav.block((x, z) => {\r\n    if ((x - EGG.x)**2 + (z - EGG.z)**2 \u003c 0.45*0.45 || x*x + z*z > 14*14) return true;\r\n    const g = cave.ground_y(x, z);\r\n    return !in_frame(x, g + 0.15, z) || !in_frame(x, g + 2.1, z);\r\n  });\r\n  nav.finish();\r\n}\r\nG.nav = nav;\r\n\r\nconst START = new THREE.Vector3(LAYOUT.hover.x, 0, LAYOUT.hover.z);\r\nconst mover = create_mover(nav, lich, START, Math.atan2(EGG.x - START.x, EGG.z - START.z));\r\nconst L = mover.p;                               // the lich's pelvis, world\r\nconst fire = create_fire(R, cave);\r\nconst snakes = create_snakes(R, cave, () => L, fire);\r\nG.mover = mover; G.snakes = snakes; G.fire = fire;\r\n\r\n// ------------------------------------------------------------------ the lich's powers\r\n// Round 11 (owner): fire, lift and burst, wind, leakage, prismatic beam, lens, all from the\r\n// start; whatever is left always stops the snakes just short of the egg (powers.js). Keys 5-0\r\n// switch each off and on (testing the removal the ending is about).\r\nconst fx = create_fx(R, cave);\r\nconst powers = create_powers({ R, cave, snakes, fx, fire, lich, mover, egg: EGG, get_L: () => L, rng: make_rng(29) });\r\nG.powers = powers; G.fx = fx;\r\nconst POWER_KEYS = ['5', '6', '7', '8', '9', '0'];\r\n\r\n// ------------------------------------------------------------------ cameras\r\nconst v = (x, y, z) => new THREE.Vector3(x, y, z);\r\nconst F = L.clone();                             // what the follow cameras track (eased)\r\n// the follow cameras look the way the room camera does (so WASD means the same), lower\r\nconst ROOM_H = new THREE.Vector2(G.static.tgt[0] - G.static.eye[0], G.static.tgt[2] - G.static.eye[2]).normalize();\r\nconst from_room = (pitch_deg, dist) => { const p = pitch_deg*Math.PI/180; return v(-ROOM_H.x*Math.cos(p)*dist, Math.sin(p)*dist, -ROOM_H.y*Math.cos(p)*dist); };\r\nconst SIDE_DIR = v(-ROOM_H.y, 0, ROOM_H.x);      // the room camera's right, flattened\r\nconst CAMS = [\r\n  // this room's camera (owner, round 1: Resident Evil-like static cameras). It never moves.\r\n  { name: 'ROOM', note: 'THE ROOM CAMERA, FIXED: THE GAME', fov: 50,\r\n    rig: () => [v(...G.static.eye), v(...G.static.tgt)] },\r\n  { name: 'CLOSE', note: 'FOLLOWS HIM, FROM THE ROOM CAMERA\\'S SIDE, LOWER', fov: 45,\r\n    rig: () => [F.clone().add(from_room(18, 4.6)), F.clone().add(v(0, -0.15, 0))] },\r\n  { name: 'SIDE', note: 'FOLLOWS HIM FROM THE SIDE: A/D TO SEE HIS PROFILE', fov: 45,\r\n    rig: () => [F.clone().addScaledVector(SIDE_DIR, 4.4).add(v(0, 0.25, 0)), F.clone().add(v(0, -0.2, 0))] },\r\n  { name: 'FREE', note: 'RIGHT-DRAG TO ORBIT, SCROLL TO ZOOM', fov: 45,\r\n    rig: () => {\r\n      const fr = G.free, y = fr.yaw*Math.PI/180, p = fr.pitch*Math.PI/180;\r\n      return [F.clone().add(v(Math.sin(y)*Math.cos(p)*fr.dist, Math.sin(p)*fr.dist, Math.cos(y)*Math.cos(p)*fr.dist)), F.clone()];\r\n    } },\r\n];\r\nconst CAM_FREE = CAMS.length - 1;\r\n// a follow camera stops short of rock between it and him (the room camera is never moved)\r\nfunction clear_eye(eye, from) {\r\n  const d = eye.clone().sub(from), n = Math.ceil(d.length()/0.1);\r\n  for (let i = 4; i \u003c= n; i++) {\r\n    const p = from.clone().addScaledVector(d, i/n);\r\n    if (nav.rock_at(p.x, p.z) > p.y - 0.3) return from.clone().addScaledVector(d, Math.max(0.2, (i - 3)/n));\r\n  }\r\n  return eye;\r\n}\r\nfunction place_camera(dt) {\r\n  const c = CAMS[G.cam];\r\n  const k = 1 - Math.exp(-3.5*dt);\r\n  F.lerp(L, k);\r\n  let [eye, tgt] = c.rig();\r\n  if (G.cam !== 0) eye = clear_eye(eye, F);\r\n  cave.set_dome_visible(c.dome !== false);\r\n  const C = R.world_camera;\r\n  C.fov = c.fov; C.updateProjectionMatrix();\r\n  C.position.copy(eye);\r\n  C.up.set(0, 1, 0);\r\n  C.lookAt(tgt);\r\n  C.updateMatrixWorld();\r\n}\r\nfunction set_cam(i) { G.cam = clamp(i | 0, 0, CAMS.length - 1); F.copy(L); }\r\n\r\n// ------------------------------------------------------------------ input\r\n// keys held, the mouse's goal. The harness can hold keys too (GAME.step(n, {keys: 'wd'})).\r\nconst held = new Set();\r\nconst KEYMAP = { KeyW: 'w', ArrowUp: 'w', KeyS: 's', ArrowDown: 's', KeyA: 'a', ArrowLeft: 'a', KeyD: 'd', ArrowRight: 'd' };\r\nconst mouse = { down: false, px: 0, py: 0 };\r\nlet goal = null, best = Infinity, stall = 0, script_keys = null;\r\nconst ray = new THREE.Raycaster(), ndc = new THREE.Vector2();\r\n\r\n// the floor point under a game pixel, marching the view ray over the height field\r\nfunction floor_at_px(gx, gy) {\r\n  ndc.set(gx/R.W*2 - 1, 1 - gy/R.H*2);\r\n  ray.setFromCamera(ndc, R.world_camera);\r\n  const o = ray.ray.origin, d = ray.ray.direction;\r\n  let t0 = 0, t1 = 0;\r\n  for (let t = 0.3; t \u003c 60; t += 0.08) {\r\n    const x = o.x + d.x*t, y = o.y + d.y*t, z = o.z + d.z*t;\r\n    if (y \u003c cave.ground_y(x, z)) { t1 = t; break; }\r\n    t0 = t;\r\n  }\r\n  if (!t1) return null;\r\n  for (let i = 0; i \u003c 8; i++) {\r\n    const t = (t0 + t1)/2, x = o.x + d.x*t, y = o.y + d.y*t, z = o.z + d.z*t;\r\n    if (y \u003c cave.ground_y(x, z)) t1 = t; else t0 = t;\r\n  }\r\n  const t = (t0 + t1)/2;\r\n  return v(o.x + d.x*t, o.y + d.y*t, o.z + d.z*t);\r\n}\r\n\r\n// a goal inside rock moves back toward him until it is open floor\r\nfunction set_goal(p) {\r\n  if (!p) return;\r\n  const dx = L.x - p.x, dz = L.z - p.z, d = Math.hypot(dx, dz);\r\n  for (let s = 0; s \u003c d && nav.is_blocked(p.x, p.z); s += 0.1) { p.x += dx/d*0.1; p.z += dz/d*0.1; }\r\n  p.y = cave.ground_y(p.x, p.z);\r\n  best = Infinity; stall = 0;\r\n  goal = p;\r\n}\r\nconst pick_goal = () => { const [gx, gy] = R.to_game_px(mouse.px, mouse.py); set_goal(floor_at_px(gx, gy)); };\r\n\r\n// camera-relative: W is up the screen, D is right\r\nconst cf = new THREE.Vector3();\r\nfunction wanted_velocity() {\r\n  const keys = script_keys ?? [...held].join('');\r\n  let ix = 0, iz = 0;\r\n  if (keys.includes('w')) iz += 1;\r\n  if (keys.includes('s')) iz -= 1;\r\n  if (keys.includes('d')) ix += 1;\r\n  if (keys.includes('a')) ix -= 1;\r\n  if (ix || iz) {\r\n    goal = null;\r\n    R.world_camera.getWorldDirection(cf); cf.y = 0; cf.normalize();\r\n    const rx = -cf.z, rz = cf.x;                  // the camera's right on the floor\r\n    let wx = cf.x*iz + rx*ix, wz = cf.z*iz + rz*ix;\r\n    const l = Math.hypot(wx, wz);\r\n    return { x: wx/l*MOVE.speed, z: wz/l*MOVE.speed };\r\n  }\r\n  if (mouse.down) pick_goal();\r\n  if (goal) {\r\n    const dx = goal.x - L.x, dz = goal.z - L.z, d = Math.hypot(dx, dz);\r\n    // stop when there, or when he stops getting closer (rock holds him short of it)\r\n    if (mouse.down || d \u003c best - 0.05) { best = d; stall = 0; } else stall += DT;\r\n    if ((d \u003c 0.12 || stall > 0.5) && !mouse.down) { goal = null; return { x: 0, z: 0 }; }\r\n    if (d \u003c 0.12) return { x: 0, z: 0 };\r\n    const s = Math.min(MOVE.speed, Math.sqrt(2*MOVE.dec*Math.max(0, d - 0.08))*0.9);\r\n    return { x: dx/d*s, z: dz/d*s };\r\n  }\r\n  return { x: 0, z: 0 };\r\n}\r\n\r\naddEventListener('keydown', (e) => {\r\n  if (KEYMAP[e.code]) { held.add(KEYMAP[e.code]); e.preventDefault(); }\r\n  const d = /^(Digit|Numpad)([1-4])$/.exec(e.code);\r\n  if (d) set_cam(+d[2] - 1);\r\n  if (e.code === 'KeyH') G.hud = !G.hud;\r\n  if (e.code === 'KeyP') lich.mode = lich.mode + 1;\r\n  if (e.code === 'KeyJ') lich.juice = lich.juice + 1;\r\n  if (e.code === 'KeyG') lich.glow = lich.glow + 1;\r\n  if (e.code === 'KeyR') lich.pattern = lich.pattern + 1;\r\n  if (e.code === 'KeyF') fire.look = fire.look + 1;\r\n  if (e.code === 'KeyC') powers.beam.mode = powers.beam.mode + 1;\r\n  if (e.code === 'KeyL') powers.lens.look = powers.lens.look + 1;\r\n  const pk = /^(Digit|Numpad)([0-9])$/.exec(e.code);\r\n  if (pk && POWER_KEYS.includes(pk[2])) powers.toggle(POWER_KEYS.indexOf(pk[2]));\r\n  if (e.code === 'KeyB') { G.dark = (G.dark + 1) % cave.DARK.length; cave.set_darkness(G.dark); }\r\n});\r\naddEventListener('keyup', (e) => { if (KEYMAP[e.code]) held.delete(KEYMAP[e.code]); });\r\naddEventListener('blur', () => { held.clear(); mouse.down = false; });\r\nlet drag = null;\r\nR.canvas.addEventListener('contextmenu', (e) => e.preventDefault());\r\nR.canvas.addEventListener('pointerdown', (e) => {\r\n  try { R.canvas.setPointerCapture(e.pointerId); } catch { }\r\n  if (e.button === 0) { mouse.down = true; mouse.px = e.clientX; mouse.py = e.clientY; pick_goal(); }   // picked now: a quick click never falls between ticks\r\n  if (e.button === 2 && G.cam === CAM_FREE) drag = [e.clientX, e.clientY];\r\n});\r\nR.canvas.addEventListener('pointerup', (e) => { if (e.button === 0) mouse.down = false; if (e.button === 2) drag = null; });\r\nR.canvas.addEventListener('pointermove', (e) => {\r\n  mouse.px = e.clientX; mouse.py = e.clientY;\r\n  if (!drag || G.cam !== CAM_FREE) return;\r\n  G.free.yaw -= (e.clientX - drag[0])*0.3;\r\n  G.free.pitch = clamp(G.free.pitch + (e.clientY - drag[1])*0.25, -10, 88);\r\n  drag = [e.clientX, e.clientY];\r\n});\r\nR.canvas.addEventListener('wheel', (e) => { if (G.cam === CAM_FREE) G.free.dist = clamp(G.free.dist*Math.exp(e.deltaY*0.001), 1.5, 30); }, { passive: true });\r\n\r\n// ------------------------------------------------------------------ hud\r\nconst hud = R.hud_canvas.getContext('2d');\r\nconst gp = new THREE.Vector3();\r\nfunction draw_hud() {\r\n  hud.clearRect(0, 0, R.W, R.H);\r\n  // where the mouse sent him: a small pale cross on the floor\r\n  if (goal) {\r\n    gp.copy(goal).project(R.world_camera);\r\n    if (gp.z \u003c 1) {\r\n      const x = Math.round((gp.x*0.5 + 0.5)*R.W), y = Math.round((0.5 - gp.y*0.5)*R.H);\r\n      hud.fillStyle = 'rgba(242,227,194,0.7)';\r\n      for (const [dx, dy] of [[0, 0], [-2, 0], [2, 0], [0, -1], [0, 1]]) hud.fillRect(x + dx, y + dy, 1, 1);\r\n    }\r\n  }\r\n  if (!G.hud) return;\r\n  const c = CAMS[G.cam];\r\n  const ink = 'rgba(8,6,5,0.85)';\r\n  draw_text(hud, `${G.cam + 1} ${c.name}`, 8, 8, '#f2e3c2', 1, 'left', null, ink);\r\n  draw_text(hud, c.note, 8, 19, '#a8987c', 1, 'left', null, ink);\r\n  draw_text(hud, `C BEAM CHAIN: ${CHAIN_MODES[powers.beam.mode]}`, 8, R.H - 92, '#f2e3c2', 1, 'left', null, ink);\r\n  draw_text(hud, `L LENS BEAM: ${LENS_LOOKS[powers.lens.look]}`, 8, R.H - 81, '#f2e3c2', 1, 'left', null, ink);\r\n  draw_text(hud, `F FIRE: ${fire.LOOKS[fire.look].name}`, 8, R.H - 70, '#a8987c', 1, 'left', null, ink);\r\n  draw_text(hud, `J FLOATINESS: ${lich.JUICE[lich.juice].name}`, 8, R.H - 59, '#a8987c', 1, 'left', null, ink);\r\n  draw_text(hud, `R PRISM PATTERN: ${lich.PATTERNS[lich.pattern]}`, 8, R.H - 48, '#a8987c', 1, 'left', null, ink);\r\n  draw_text(hud, `G OUT OF THE LIGHT: ${lich.GLOWS[lich.glow].name}`, 8, R.H - 37, '#a8987c', 1, 'left', null, ink);\r\n  draw_text(hud, `P PRISM STRENGTH: ${lich.MODES[lich.mode]}`, 8, R.H - 26, '#a8987c', 1, 'left', null, ink);\r\n  draw_text(hud, `B DARKNESS: ${cave.DARK[G.dark].name}`, 8, R.H - 15, '#a8987c', 1, 'left', null, ink);\r\n  // the powers he has (5-0), how strong each is, and how many snakes got to the egg\r\n  powers.ALL.forEach((a, i) => {\r\n    const on = powers.is_on(a);\r\n    draw_text(hud, `${POWER_KEYS[i]} ${a.name}${on ? '' : ': REMOVED'}`, R.W - 8, 8 + i*11, on ? '#f2e3c2' : '#6a5e4e', 1, 'right', null, ink);\r\n  });\r\n  draw_text(hud, `EACH POWER X${powers.power.toFixed(1)}`, R.W - 8, 8 + 6*11 + 3, '#a8987c', 1, 'right', null, ink);\r\n  draw_text(hud, `REACHED THE EGG: ${snakes.reached}`, R.W - 8, 8 + 7*11 + 3, snakes.reached ? '#e0a070' : '#a8987c', 1, 'right', null, ink);\r\n  draw_text(hud, 'WASD OR HOLD LEFT MOUSE: MOVE', R.W - 8, R.H - 26, '#8a7c66', 1, 'right', null, ink);\r\n  draw_text(hud, '1-4 CAMERA   5-0 POWERS   C L F J R G P B   H HIDE', R.W - 8, R.H - 15, '#8a7c66', 1, 'right', null, ink);\r\n}\r\n\r\n// ------------------------------------------------------------------ sim + render\r\nfunction tick() {\r\n  G.tick++;\r\n  G.t += DT;\r\n  mover.tick(G.t, DT, wanted_velocity());\r\n  powers.tick(G.t, DT);\r\n  lich.pose(G.t, DT, mover.motion);\r\n  lich.update(G.t);\r\n  cave.update(G.t, DT);\r\n  snakes.set_ember(fire.ember_colour());\r\n  snakes.update(G.t, DT);\r\n  fire.update(G.t, DT);\r\n  fx.update(G.t, DT);\r\n}\r\nfunction render(dt) {\r\n  place_camera(0);\r\n  fire.set_camera(R.world_camera, R.H);\r\n  fx.set_camera(R.world_camera, R.H);\r\n  draw_hud();\r\n  R.render(dt);\r\n}\r\n\r\nlet last = performance.now(), acc = 0;\r\nfunction frame(now) {\r\n  requestAnimationFrame(frame);\r\n  let dt = (now - last)/1000; last = now;\r\n  if (G.manual) return;\r\n  if (!(dt >= 0)) dt = 0;\r\n  if (dt > 0.25) dt = 0.25;\r\n  acc += dt;\r\n  let n = 0;\r\n  while (acc >= DT && n \u003c 8) { tick(); place_camera(DT); acc -= DT; n++; }\r\n  if (n >= 8) acc = 0;\r\n  render(dt);\r\n}\r\n\r\n// ------------------------------------------------------------------ harness API\r\nconst r3 = x => +x.toFixed(3);\r\nwindow.GAME = {\r\n  ready: false,\r\n  setManual(on) { G.manual = !!on; return G.manual; },\r\n  // input: { keys: 'wd' } holds those keys for the n ticks; { goto: [x, z] } sends him there\r\n  step(n = 1, input = {}) {\r\n    if (input.goto) set_goal(v(input.goto[0], 0, input.goto[1]));\r\n    script_keys = input.keys ?? null;\r\n    for (let i = 0; i \u003c (n | 0); i++) { tick(); place_camera(DT); }\r\n    script_keys = null;\r\n    render(n*DT);\r\n    return G.tick;\r\n  },\r\n  cam(i, free) { set_cam(i); if (free) Object.assign(G.free, free); render(0); return CAMS[G.cam].name; },\r\n  hud(on) { G.hud = !!on; render(0); return G.hud; },\r\n  // inspection: camera 4 looks at a fixed point from a direction (degrees) and distance\r\n  view_at(x, y, z, yaw, pitch, dist, fov = 45) {\r\n    const p = v(x, y, z), a = yaw*Math.PI/180, b = pitch*Math.PI/180;\r\n    CAMS[CAM_FREE].rig = () => [p.clone().add(v(Math.sin(a)*Math.cos(b)*dist, Math.sin(b)*dist, Math.cos(a)*Math.cos(b)*dist)), p.clone()];\r\n    CAMS[CAM_FREE].fov = fov; G.cam = CAM_FREE; render(0); return [x, y, z];\r\n  },\r\n  place(x, z, yaw) { mover.place(x, z, yaw); F.copy(L); render(0); return [x, z]; },\r\n  juice(i) { lich.juice = i; return lich.JUICE[lich.juice].name; },\r\n  // the light arriving on his bones (per unit albedo), read back from the linear world target:\r\n  // [direct, bounce] medians and 90th percentiles over his visible pixels\r\n  gem_probe() {\r\n    const U = lich.mat.userData.gemU;\r\n    U.uGemDebug.value = 1; render(0);\r\n    const rt = R.targets.rt_world, buf = new Uint16Array(R.W*R.H*4);\r\n    R.renderer.readRenderTargetPixels(rt, 0, 0, R.W, R.H, buf);\r\n    U.uGemDebug.value = 0; render(0);\r\n    // and what the screen shows there (the final 8-bit image): mean brightness and colourfulness\r\n    const fin = new Uint8Array(R.W*R.H*4);\r\n    R.renderer.readRenderTargetPixels(R.targets.rt_final, 0, 0, R.W, R.H, fin);\r\n    const f16 = h => { const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 31, m = h & 1023; return e === 0 ? s*m*Math.pow(2, -24) : e === 31 ? NaN : s*(1 + m/1024)*Math.pow(2, e - 15); };\r\n    const d = [], b = [];\r\n    for (let i = 0; i \u003c R.W*R.H; i++) if (f16(buf[i*4 + 2]) > 700) { d.push(f16(buf[i*4])); b.push(f16(buf[i*4 + 1])); }\r\n    const q = (a, t) => { a.sort((x, y) => x - y); return +(a[Math.floor((a.length - 1)*t)] || 0).toFixed(4); };\r\n    let lum = 0, sat = 0, n = 0, hx = 0, hy = 0, x0 = R.W, x1 = 0, y0 = R.H, y1 = 0;\r\n    for (let i = 0; i \u003c R.W*R.H; i++) if (f16(buf[i*4 + 2]) > 700) {\r\n      const r = fin[i*4]/255, g = fin[i*4 + 1]/255, bb = fin[i*4 + 2]/255, mx = Math.max(r, g, bb), mn = Math.min(r, g, bb);\r\n      const sv = mx > 0.02 ? (mx - mn)/mx : 0;\r\n      const px_ = i % R.W, py_ = Math.floor(i/R.W);\r\n      x0 = Math.min(x0, px_); x1 = Math.max(x1, px_); y0 = Math.min(y0, py_); y1 = Math.max(y1, py_);\r\n      lum += 0.2126*r + 0.7152*g + 0.0722*bb; sat += sv; n++;\r\n      // hue as an angle, weighted by saturation: a rainbow spreads, one tint doesn't\r\n      if (mx - mn > 1e-3) {\r\n        let h = mx === r ? (g - bb)/(mx - mn) : mx === g ? 2 + (bb - r)/(mx - mn) : 4 + (r - g)/(mx - mn);\r\n        h *= Math.PI/3; hx += sv*Math.cos(h); hy += sv*Math.sin(h);\r\n      }\r\n    }\r\n    // what surrounds him on screen: the rest of his box, grown by a quarter of his height\r\n    const gpad = Math.round((y1 - y0)*0.25);\r\n    let al = 0, an = 0;\r\n    for (let y = Math.max(0, y0 - gpad); y \u003c= Math.min(R.H - 1, y1 + gpad); y++) for (let x = Math.max(0, x0 - gpad); x \u003c= Math.min(R.W - 1, x1 + gpad); x++) {\r\n      const i = y*R.W + x;\r\n      if (f16(buf[i*4 + 2]) > 700) continue;\r\n      al += (0.2126*fin[i*4] + 0.7152*fin[i*4 + 1] + 0.0722*fin[i*4 + 2])/255; an++;\r\n    }\r\n    return { around_lum: +(al/Math.max(an, 1)).toFixed(3), px: d.length, direct: [q(d, 0.5), q(d, 0.9)], bounce: [q(b, 0.5), q(b, 0.9)], screen_lum: +(lum/n).toFixed(3), screen_sat: +(sat/n).toFixed(3), hue_spread: +(1 - Math.hypot(hx, hy)/Math.max(sat, 1e-6)).toFixed(3) };\r\n  },\r\n  glow(i) { lich.glow = i; render(0); return lich.GLOWS[lich.glow].name; },\r\n  pattern(i) { lich.pattern = i; render(0); return lich.PATTERNS[lich.pattern]; },\r\n  fire_look(i) { fire.look = i; return fire.LOOKS[fire.look].name; },\r\n  // powers: set which are on (a list of 6 booleans), read the director, force one now\r\n  powers(list) { if (list) list.forEach((v, i) => powers.set(i, v)); return powers.state(); },\r\n  force(i, x, z) { return powers.force(i, x, z); },\r\n  beam_mode(m) { powers.beam.mode = m; return CHAIN_MODES[powers.beam.mode]; },\r\n  lens_look(m) { powers.lens.look = m; return LENS_LOOKS[powers.lens.look]; },\r\n  reached() { return snakes.reached; },\r\n  // tests: advance (no rendering) until a condition holds, at most `max` ticks; returns ticks run\r\n  until(src, max = 3600) { const f = new Function('G', 'return (' + src + ');'); let n = 0; while (n \u003c max && !f(G)) { tick(); place_camera(DT); n++; } render(n*DT); return n; },\r\n  // set the snake nearest (x, z) alight now; returns its index\r\n  ignite_near(x, z) {\r\n    const live = snakes.live(); if (!live.length) return -1;\r\n    live.sort((a, b) => Math.hypot(a.x - x, a.z - z) - Math.hypot(b.x - x, b.z - z));\r\n    snakes.ignite(live[0], 30);\r\n    return snakes.S.indexOf(live[0]);\r\n  },\r\n  snake_at(i) { const s = snakes.S[i]; const c = s.spine[20]; return { x: +c.x.toFixed(2), z: +c.z.toFixed(2), burning: !!s.burn, sink: +s.sink.toFixed(2), burnt: s.burnt, fire: fire.burning }; },\r\n  mode(m) { lich.mode = m; render(0); return lich.MODES[lich.mode]; },\r\n  dark(i) { G.dark = i; const n = cave.set_darkness(i); render(0); return n; },\r\n  snakes() { return snakes.S.map(s => [+s.x.toFixed(2), +s.z.toFixed(2), s.dying, +s.delay.toFixed(2)]); },\r\n  springs() {\r\n    const S = lich.springs;\r\n    return { body: [r3(S.bp.x), r3(S.br.x)], chest: [r3(S.cp.x), r3(S.cr.x)], head: [r3(S.hp.x), r3(S.hr.x), r3(S.hy.x)], jaw: r3(S.jw.x),\r\n      legs: S.legs.map(l => [r3(l.p.x), r3(l.r.x), r3(l.k.x)]), arms: S.arms.map(a => [r3(a.p.x), r3(a.r.x), r3(a.e.x)]) };\r\n  },\r\n  state() {\r\n    return { t: r3(G.t), tick: G.tick, cam: CAMS[G.cam].name, juice: lich.JUICE[lich.juice].name, lich: L.toArray().map(r3),\r\n      speed: r3(mover.speed), yaw: r3(mover.yaw), goal: goal ? [r3(goal.x), r3(goal.z)] : null, motion: { a: mover.motion.a.map(r3), v: mover.motion.v.map(r3) } };\r\n  },\r\n  nav_map() {\r\n    // the walkable map as rows of characters ('#' blocked, '.' open), every 2nd cell\r\n    const out = [];\r\n    for (let j = nav.nz - 1; j >= 0; j -= 2) { let s = ''; for (let i = 0; i \u003c nav.nx; i += 2) s += nav.blocked[j*nav.nx + i] ? '#' : '.'; out.push(s); }\r\n    return out;\r\n  },\r\n};\r\ncave.set_darkness(G.dark);\r\ntick();\r\nrender(0);\r\nwindow.GAME.ready = true;\r\nrequestAnimationFrame(frame);\r\n","game/mover.js":"// mover.js -- the lich's body through the room (round 5). He floats: he eases into motion,\r\n// drifts a little out of it, turns to face where he is sent, rides up over stones and rubble,\r\n// and is stopped by rock, the egg, and the edge of what the room camera sees (nav.js).\r\n// Each tick hands lich.pose() the pelvis' real acceleration and velocity in his own frame,\r\n// which is what swings his parts.\r\nimport * as THREE from 'three';\r\nimport { clamp } from 'game/util.js';\r\n\r\nexport const MOVE = {\r\n  speed: 2.6,            // m/s; the snakes crawl at 1.0-1.35\r\n  acc: 7.0, tau_acc: 0.3,   // pushing: at most 7 m/s^2, closing the gap to the wanted velocity in ~0.3 s\r\n  dec: 5.0, tau_dec: 0.38,  // letting go: a softer stop, he drifts ~0.6 m\r\n  jerk: 11,              // how fast the push itself changes (1/s): no instant jolts\r\n  radius: 0.34,          // his body, for rock\r\n  turn_f: 0.8, turn_z: 0.85, turn_amax: 22, turn_vmax: 5.5,   // facing spring (Hz, damping, limits)\r\n  bob: 0.05,             // the breathing float, metres\r\n};\r\n\r\nconst wrap = a => Math.atan2(Math.sin(a), Math.cos(a));\r\n\r\nexport function create_mover(nav, lich, start, yaw0) {\r\n  const p = start.clone();                     // the pelvis, world\r\n  const v = new THREE.Vector3();               // horizontal velocity (y unused)\r\n  const push = new THREE.Vector2();            // the applied horizontal acceleration\r\n  let vy = 0, yaw = yaw0, yaw_v = 0, yaw_a = 0, want_yaw = yaw0;\r\n  const prev_p = p.clone(), prev_vel = new THREE.Vector3(), vel = new THREE.Vector3(), acc = new THREE.Vector3();\r\n  const motion = { a: [0, 0, 0], v: [0, 0, 0], push: [0, 0], yaw_a: 0, yaw_v: 0, look: 0 };\r\n  const height_at = (t) => nav.floor(p.x, p.z) + lich.hover_h + MOVE.bob*Math.sin(t*1.1) + 0.015*Math.sin(t*0.63 + 1.0);\r\n  p.y = height_at(0);\r\n  prev_p.copy(p);\r\n\r\n  function tick(t, dt, want) {\r\n    const wl = Math.hypot(want.x, want.z);\r\n    const pushing = wl > 0.01;\r\n    // steer toward the wanted velocity with a bounded push, harder when sent than when let go\r\n    const tau = pushing ? MOVE.tau_acc : MOVE.tau_dec, amax = pushing ? MOVE.acc : MOVE.dec;\r\n    let cx = (want.x - v.x)/tau, cz = (want.z - v.z)/tau;\r\n    const cl = Math.hypot(cx, cz);\r\n    if (cl > amax) { cx *= amax/cl; cz *= amax/cl; }\r\n    const k = 1 - Math.exp(-MOVE.jerk*dt);\r\n    push.x += (cx - push.x)*k; push.y += (cz - push.y)*k;\r\n    v.x += push.x*dt; v.z += push.y*dt;\r\n    if (!pushing && Math.hypot(v.x, v.z) \u003c 0.02 && Math.hypot(push.x, push.y) \u003c 0.05) { v.x = v.z = 0; push.set(0, 0); }\r\n    p.x += v.x*dt; p.z += v.z*dt;\r\n    if (nav.resolve(p, v, MOVE.radius)) {\r\n      // against rock: the push along the wall survives, the push into it doesn't\r\n      const s = Math.hypot(v.x, v.z), ps = Math.hypot(push.x, push.y);\r\n      if (s > 1e-4 && ps > 1e-4) { const along = (push.x*v.x + push.y*v.z)/s; push.set(v.x/s*along, v.z/s*along); }\r\n    }\r\n    // height: a soft spring to the floor under his legs, plus the bob\r\n    const wv = 6.2832*1.0;\r\n    vy += (wv*wv*(height_at(t) - p.y) - 2*0.65*wv*vy)*dt;\r\n    p.y += vy*dt;\r\n    // facing: a spring toward where he is sent\r\n    if (pushing) want_yaw = Math.atan2(want.x, want.z);\r\n    const wy = 6.2832*MOVE.turn_f;\r\n    yaw_a = clamp(wy*wy*wrap(want_yaw - yaw) - 2*MOVE.turn_z*wy*yaw_v, -MOVE.turn_amax, MOVE.turn_amax);\r\n    yaw_v = clamp(yaw_v + yaw_a*dt, -MOVE.turn_vmax, MOVE.turn_vmax);\r\n    yaw = wrap(yaw + yaw_v*dt);\r\n    // what the body felt this tick, in his frame (x = his left, z = forward)\r\n    vel.subVectors(p, prev_p).divideScalar(dt);\r\n    acc.subVectors(vel, prev_vel).divideScalar(dt);\r\n    if (acc.length() > 20) acc.setLength(20);\r\n    prev_p.copy(p); prev_vel.copy(vel);\r\n    const sy = Math.sin(yaw), cy = Math.cos(yaw);\r\n    motion.a[0] = acc.x*cy - acc.z*sy; motion.a[1] = acc.y; motion.a[2] = acc.x*sy + acc.z*cy;\r\n    motion.v[0] = vel.x*cy - vel.z*sy; motion.v[1] = vel.y; motion.v[2] = vel.x*sy + vel.z*cy;\r\n    // the push: where he is sent minus how he moves, in his frame, as a fraction of full speed\r\n    let qx = ((want.x - vel.x)*cy - (want.z - vel.z)*sy)/MOVE.speed, qz = ((want.x - vel.x)*sy + (want.z - vel.z)*cy)/MOVE.speed;\r\n    const ql = Math.hypot(qx, qz);\r\n    if (ql > 1) { qx /= ql; qz /= ql; }\r\n    motion.push[0] = qx; motion.push[1] = qz;\r\n    motion.yaw_a = yaw_a; motion.yaw_v = yaw_v;\r\n    motion.look = pushing ? wrap(want_yaw - yaw) : 0;\r\n    lich.root.position.copy(p);\r\n    lich.root.rotation.y = yaw;\r\n  }\r\n\r\n  return {\r\n    p, v, motion, tick,\r\n    get yaw() { return yaw; },\r\n    get speed() { return Math.hypot(v.x, v.z); },\r\n    place(x, z, y_ = yaw) {\r\n      p.x = x; p.z = z; v.set(0, 0, 0); push.set(0, 0); yaw = want_yaw = y_; yaw_v = 0;\r\n      p.y = height_at(0); vy = 0; prev_p.copy(p); prev_vel.set(0, 0, 0);\r\n      lich.root.position.copy(p); lich.root.rotation.y = yaw;\r\n    },\r\n  };\r\n}\r\n","game/nav.js":"// nav.js -- where the lich can float (round 5). A 0.2 m grid over the chamber, rasterized from\r\n// the rock meshes: a cell whose rock rises more than BLOCK_H above the ground blocks him; lower\r\n// rock (stones, rubble) only lifts his float so his toes pass over it. Anything else the caller\r\n// marks (the egg, what the room camera can't see) blocks too. The distance to the nearest\r\n// blocking cell pushes him out and lets him slide along an edge.\r\nexport function build_nav({ geo, ground_y, x0 = -16, x1 = 16, z0 = -16, z1 = 16, cell = 0.2, block_h = 0.6 }) {\r\n  const nx = Math.round((x1 - x0)/cell), nz = Math.round((z1 - z0)/cell), N = nx*nz;\r\n  const top = new Float32Array(N).fill(-1e9);\r\n  const gy = new Float32Array(N);\r\n  const cx = i => x0 + (i + 0.5)*cell, cz = j => z0 + (j + 0.5)*cell;\r\n  for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) gy[j*nx + i] = ground_y(cx(i), cz(j));\r\n\r\n  // rock tops: every triangle's surface over the cell centres it covers, and its corners\r\n  const p = geo.attributes.position.array;\r\n  const mark = (x, z, y) => {\r\n    const i = Math.floor((x - x0)/cell), j = Math.floor((z - z0)/cell);\r\n    if (i >= 0 && j >= 0 && i \u003c nx && j \u003c nz && y > top[j*nx + i]) top[j*nx + i] = y;\r\n  };\r\n  for (let t = 0; t \u003c p.length; t += 9) {\r\n    const ax = p[t], ay = p[t + 1], az = p[t + 2], bx = p[t + 3], by = p[t + 4], bz = p[t + 5], qx = p[t + 6], qy = p[t + 7], qz = p[t + 8];\r\n    mark(ax, az, ay); mark(bx, bz, by); mark(qx, qz, qy);\r\n    const det = (bz - qz)*(ax - qx) + (qx - bx)*(az - qz);\r\n    if (Math.abs(det) \u003c 1e-9) continue;\r\n    const i0 = Math.max(0, Math.floor((Math.min(ax, bx, qx) - x0)/cell)), i1 = Math.min(nx - 1, Math.floor((Math.max(ax, bx, qx) - x0)/cell));\r\n    const j0 = Math.max(0, Math.floor((Math.min(az, bz, qz) - z0)/cell)), j1 = Math.min(nz - 1, Math.floor((Math.max(az, bz, qz) - z0)/cell));\r\n    for (let j = j0; j \u003c= j1; j++) for (let i = i0; i \u003c= i1; i++) {\r\n      const x = cx(i), z = cz(j);\r\n      const l1 = ((bz - qz)*(x - qx) + (qx - bx)*(z - qz))/det;\r\n      const l2 = ((qz - az)*(x - qx) + (ax - qx)*(z - qz))/det;\r\n      const l3 = 1 - l1 - l2;\r\n      if (l1 \u003c -1e-4 || l2 \u003c -1e-4 || l3 \u003c -1e-4) continue;\r\n      const y = l1*ay + l2*by + l3*qy;\r\n      if (y > top[j*nx + i]) top[j*nx + i] = y;\r\n    }\r\n  }\r\n  const blocked = new Uint8Array(N);\r\n  const floor = new Float32Array(N);\r\n  for (let k = 0; k \u003c N; k++) {\r\n    const h = top[k] - gy[k];\r\n    if (h > block_h) blocked[k] = 1;\r\n    floor[k] = Math.max(gy[k], h > 0 && h \u003c= block_h ? top[k] : gy[k]);\r\n  }\r\n  const rock = blocked.slice();                   // rock alone (block() adds the rest to `blocked`)\r\n\r\n  // what the float clears: the highest floor under his legs (a disc around the pelvis)\r\n  const lift = new Float32Array(N);\r\n  const LR = Math.ceil(0.35/cell);\r\n  for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) {\r\n    let m = floor[j*nx + i];\r\n    for (let dj = -LR; dj \u003c= LR; dj++) for (let di = -LR; di \u003c= LR; di++) {\r\n      if (di*di + dj*dj > LR*LR) continue;\r\n      const ii = i + di, jj = j + dj;\r\n      if (ii \u003c 0 || jj \u003c 0 || ii >= nx || jj >= nz || blocked[jj*nx + ii]) continue;\r\n      m = Math.max(m, floor[jj*nx + ii]);\r\n    }\r\n    lift[j*nx + i] = m;\r\n  }\r\n\r\n  // bilinear read of a cell field at a world point\r\n  const sample = (F, x, z) => {\r\n    const fx = (x - x0)/cell - 0.5, fz = (z - z0)/cell - 0.5;\r\n    let i = Math.floor(fx), j = Math.floor(fz);\r\n    const u = fx - i, v = fz - j;\r\n    const at = (a, b) => F[Math.min(nz - 1, Math.max(0, b))*nx + Math.min(nx - 1, Math.max(0, a))];\r\n    return (at(i, j)*(1 - u) + at(i + 1, j)*u)*(1 - v) + (at(i, j + 1)*(1 - u) + at(i + 1, j + 1)*u)*v;\r\n  };\r\n\r\n  let dist = null;\r\n  const MAXD = 1.6;\r\n  const nav = {\r\n    nx, nz, cell, x0, z0, blocked,\r\n    // block every cell whose centre `fn(x, z)` says so; call finish() after the last one\r\n    block(fn) { for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) if (fn(cx(i), cz(j))) blocked[j*nx + i] = 1; },\r\n    finish() {\r\n      // distance from each cell centre to the edge of the nearest blocking cell (brute force in a window)\r\n      dist = new Float32Array(N);\r\n      const R = Math.ceil(MAXD/cell);\r\n      for (let j = 0; j \u003c nz; j++) for (let i = 0; i \u003c nx; i++) {\r\n        if (blocked[j*nx + i]) { dist[j*nx + i] = -cell*0.5; continue; }\r\n        let best = MAXD*MAXD;\r\n        for (let dj = -R; dj \u003c= R; dj++) for (let di = -R; di \u003c= R; di++) {\r\n          const ii = i + di, jj = j + dj;\r\n          const out = ii \u003c 0 || jj \u003c 0 || ii >= nx || jj >= nz;\r\n          if (!out && !blocked[jj*nx + ii]) continue;\r\n          const d2 = (di*di + dj*dj)*cell*cell;\r\n          if (d2 \u003c best) best = d2;\r\n        }\r\n        dist[j*nx + i] = Math.sqrt(best) - cell*0.5;\r\n      }\r\n      return nav;\r\n    },\r\n    floor: (x, z) => sample(lift, x, z),\r\n    dist: (x, z) => sample(dist, x
