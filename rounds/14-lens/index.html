, z),\r\n    // rock at a point, and how high it rises there (for cameras to stop short of it)\r\n    rock_at(x, z) {\r\n      const i = Math.floor((x - x0)/cell), j = Math.floor((z - z0)/cell);\r\n      if (i \u003c 0 || j \u003c 0 || i >= nx || j >= nz) return Infinity;\r\n      return rock[j*nx + i] ? top[j*nx + i] : -Infinity;\r\n    },\r\n    is_blocked(x, z) {\r\n      const i = Math.floor((x - x0)/cell), j = Math.floor((z - z0)/cell);\r\n      return i \u003c 0 || j \u003c 0 || i >= nx || j >= nz || blocked[j*nx + i] === 1;\r\n    },\r\n    // push a body of radius r at (p.x, p.z) out of blocking cells; slide v along the edge.\r\n    // Returns true on contact.\r\n    resolve(pos, vel, r) {\r\n      let hit = false;\r\n      for (let it = 0; it \u003c 3; it++) {\r\n        const d = sample(dist, pos.x, pos.z);\r\n        if (d >= r) break;\r\n        const e = cell*0.5;\r\n        let gx = sample(dist, pos.x + e, pos.z) - sample(dist, pos.x - e, pos.z);\r\n        let gz = sample(dist, pos.x, pos.z + e) - sample(dist, pos.x, pos.z - e);\r\n        const gl = Math.hypot(gx, gz);\r\n        if (gl \u003c 1e-6) break;\r\n        gx /= gl; gz /= gl;\r\n        pos.x += gx*(r - d); pos.z += gz*(r - d);\r\n        const into = vel.x*gx + vel.z*gz;\r\n        if (into \u003c 0) { vel.x -= gx*into; vel.z -= gz*into; }\r\n        hit = true;\r\n      }\r\n      return hit;\r\n    },\r\n  };\r\n  return nav;\r\n}\r\n","game/powers.js":"// powers.js -- the lich's six powers and what decides when they act (round 11).\r\n//\r\n// Owner, 2026-09-28: fire, lift and burst, wind, leakage, prismatic beam, lens. \"The player\r\n// starts with all abilities and the cooldowns of abilities are such that snakes always almost\r\n// reach the egg but never do, regardless of where the lich is in the cave. As attacks are\r\n// removed by the player, the remaining attacks increase in frequency to make sure that snakes\r\n// don't reach.\" Fire, lift, wind and beam are cast with a hand pointing at the target; the lens\r\n// is a floating object; leakage happens by itself.\r\n//\r\n// How that is kept:\r\n// - A snake becomes a target only when its head comes within ENGAGE of the egg (so they always\r\n//   get close), wherever the lich is: no power has a range limit, except leakage, which is\r\n//   about what is near him.\r\n// - He casts one gestured power at a time: head turns to the spot, the arm rises and points,\r\n//   the power goes off when both are on it, he holds a moment, lowers. Among the powers that\r\n//   are ready he uses the one he has used least recently, so all of them show.\r\n// - With fewer powers, each one left grows by power = 6 / (powers left): cooldowns divide by\r\n//   it, and what one cast takes multiplies (fire lights several, lift raises several, wind\r\n//   blows several away, the beam chains through many, several lenses form, leakage reaches\r\n//   further and works faster).\r\n// - A snake that gets within URGENT of the egg with nothing on it forces a cast now (cooldown\r\n//   ignored, a quicker aim), whichever power is left. With no powers left, they reach the egg.\r\nimport * as THREE from 'three';\r\nimport { create_lift } from 'game/lift.js';\r\nimport { create_wind } from 'game/wind.js';\r\nimport { create_beam } from 'game/beam.js';\r\nimport { create_lens } from 'game/lens.js';\r\nimport { create_leak } from 'game/leak.js';\r\n\r\nexport const ENGAGE = 3.4, URGENT = 2.2, LENS_ENGAGE = 6.0;             // the lens takes ~1.5 s from forming to cutting\r\nconst AIM_MIN = 0.3, AIM_MAX = 0.55, QUICK_MIN = 0.12, QUICK_MAX = 0.28, ON_T = 0.08, HOLD = 0.45, LOWER = 0.3;\r\n\r\nexport function create_powers(ctx) {\r\n  const { snakes, fire, lich, mover, egg, get_L, rng } = ctx;\r\n  const N = snakes.RINGS;\r\n  const FIRE = {\r\n    name: 'FIRE', gesture: true, cooldown: 5.0,\r\n    capacity: p => Math.ceil(p/2),\r\n    aim_ring: () => Math.round(N*rng.float(0.15, 0.75)),\r\n    cast(targets, from, ring) {\r\n      // the first catches where he points; any others a beat after, one by one\r\n      targets.forEach((s, k) => { if (k === 0) snakes.ignite(s, ring); else later.push({ at: clock + k*0.12, s }); });\r\n    },\r\n    update() { },\r\n  };\r\n  const later = [];\r\n  const lift = create_lift(ctx), wind = create_wind(ctx), beam = create_beam(ctx), lens = create_lens(ctx), leak = create_leak(ctx);\r\n  const ALL = [FIRE, lift, wind, leak, beam, lens];\r\n  const on = new Map(ALL.map(a => [a, true]));\r\n  const next = new Map(ALL.map(a => [a, 1.0])), last = new Map(ALL.map((a, i) => [a, -10 + i]));\r\n  let clock = 0, power = 1;\r\n  const G = { phase: 'idle', ab: null, targets: [], t: 0, on_t: 0, arm: 1, ring: 0, primary: null, quick: false, w: 0, pw: 0, point: new THREE.Vector3() };\r\n  const TIP = new THREE.Vector3();\r\n  // a lens forms from his mind: when his hands are free he glances up at it while it forms\r\n  const LOOK = { p: new THREE.Vector3(), t: 9 };\r\n\r\n  const d_egg = s => Math.hypot(s.x - egg.x, s.z - egg.z);\r\n  const unclaimed = s => snakes.free(s) && !(s.claim && s.claim_until > clock);\r\n  const claim = (s, who, secs) => { s.claim = who; s.claim_until = clock + secs; };\r\n  const threats = (R) => snakes.S.filter(s => unclaimed(s) && d_egg(s) \u003c R).sort((a, b) => d_egg(a) - d_egg(b));\r\n\r\n  // where he looks from his facing (yaw) and down (pitch), toward a point\r\n  const gaze_to = (c) => {\r\n    const L = get_L();\r\n    const a = Math.atan2(c.x - L.x, c.z - L.z) - mover.yaw;\r\n    return [Math.atan2(Math.sin(a), Math.cos(a)), Math.atan2(L.y + 0.75 - c.y, Math.max(0.3, Math.hypot(c.x - L.x, c.z - L.z)))];\r\n  };\r\n  // the arm on the target's side (his left arm, the reaching one, when it's ahead)\r\n  const pick_arm = (c) => {\r\n    const L = get_L(), yw = mover.yaw;\r\n    const x = (c.x - L.x)*Math.cos(yw) - (c.z - L.z)*Math.sin(yw);\r\n    const z = (c.x - L.x)*Math.sin(yw) + (c.z - L.z)*Math.cos(yw);\r\n    return x > -0.25*Math.abs(z) ? 1 : 0;\r\n  };\r\n\r\n  function start_gesture(ab, targets, quick) {\r\n    for (const s of targets) claim(s, ab.name, 2.0);\r\n    G.phase = 'aim'; G.ab = ab; G.targets = targets; G.t = 0; G.on_t = 0; G.quick = quick;\r\n    G.primary = targets[0]; G.ring = ab.aim_ring();\r\n    G.point.copy(G.primary.spine[G.ring]);\r\n    G.arm = pick_arm(G.point);\r\n  }\r\n\r\n  function tick(t, dt) {\r\n    clock += dt;\r\n    const actives = ALL.filter(a => on.get(a));\r\n    power = actives.length ? 6/actives.length : 1;\r\n    leak.scale(power, ENGAGE);\r\n    for (const a of ALL) next.set(a, next.get(a) - dt);\r\n    // fire's second and later catches\r\n    for (let i = later.length - 1; i >= 0; i--) if (clock >= later[i].at) { snakes.ignite(later[i].s); later.splice(i, 1); }\r\n\r\n    // about to reach the egg with nothing on it yet (claimed or not: a claim can be too slow)\r\n    const urgent = new Set(snakes.S.filter(s => snakes.free(s) && d_egg(s) \u003c URGENT));\r\n    const gestured = actives.filter(a => a.gesture);\r\n\r\n    // --- the gestured powers, one at a time\r\n    if (G.phase === 'idle') {\r\n      const th = threats(ENGAGE);\r\n      if ((th.length || urgent.size) && gestured.length) {\r\n        let ready = gestured.filter(a => next.get(a) \u003c= 0);\r\n        const quick = urgent.size > 0;\r\n        if (!ready.length && quick) {\r\n          // something is about to reach the egg: whichever power is soonest goes now\r\n          const a = gestured.reduce((x, y) => (next.get(x) \u003c= next.get(y) ? x : y));\r\n          next.set(a, 0); ready = [a];\r\n        }\r\n        if (ready.length) {\r\n          const ab = ready.reduce((x, y) => (last.get(x) \u003c= last.get(y) ? x : y));\r\n          const first = quick ? [...urgent].sort((a, b) => d_egg(a) - d_egg(b)) : [];\r\n          const pick = [...first, ...th.filter(s => !urgent.has(s))];\r\n          start_gesture(ab, pick.slice(0, Math.max(1, ab.capacity(power))), quick);\r\n        }\r\n      }\r\n    } else if (G.phase === 'aim') {\r\n      G.t += dt;\r\n      const s = G.primary;\r\n      if (!snakes.free(s)) {\r\n        // it's gone (another power took it): let go, try again\r\n        for (const q of G.targets) q.claim = null;\r\n        G.phase = 'lower'; G.t = 0;\r\n      } else {\r\n        G.point.copy(s.spine[G.ring]);\r\n        const [gy] = gaze_to(G.point);\r\n        const S = lich.springs, reach = Math.max(-1.45, Math.min(1.45, gy));\r\n        G.on_t = Math.abs(reach - (S.hy.x + S.cy.x)) \u003c 0.12 ? G.on_t + dt : 0;\r\n        const mn = G.quick ? QUICK_MIN : AIM_MIN, mx = G.quick ? QUICK_MAX : AIM_MAX;\r\n        if ((G.t >= mn && G.on_t >= ON_T) || G.t >= mx) {\r\n          const targets = G.targets.filter(q => snakes.free(q));\r\n          lich.fingertip(G.arm, TIP);\r\n          G.ab.cast(targets, TIP, G.ring, G.arm);\r\n          next.set(G.ab, G.ab.cooldown/power); last.set(G.ab, clock);\r\n          G.phase = 'hold'; G.t = 0;\r\n        }\r\n      }\r\n    } else if (G.phase === 'hold') {\r\n      G.t += dt;\r\n      // a channelled power (the beam) keeps his hand up, following its head, until it ends\r\n      if (G.ab.busy && G.ab.busy()) { G.t = 0; const p = G.ab.aim_point(); if (p) G.point.copy(p); }\r\n      if (G.t >= HOLD) { G.phase = 'lower'; G.t = 0; }\r\n    } else if (G.phase === 'lower') {\r\n      G.t += dt;\r\n      // lowering his arm gives way at once to something about to reach the egg\r\n      if (G.t >= LOWER || urgent.size) { G.phase = 'idle'; G.t = 0; G.ab = null; }\r\n    }\r\n    // head and hand\r\n    if (G.phase === 'aim') { G.w = Math.min(1, G.w + dt/0.12); G.pw = Math.min(1, G.pw + dt/(G.quick ? 0.12 : 0.22)); }\r\n    else if (G.phase === 'hold') { G.w = 1; G.pw = 1; }\r\n    else { G.w = Math.max(0, G.w - dt/LOWER); G.pw = Math.max(0, G.pw - dt/LOWER); }\r\n    const m = mover.motion;\r\n    m.gaze_w = G.w;\r\n    if (G.w > 0) [m.gaze, m.gaze_p] = gaze_to(G.point);\r\n    LOOK.t += dt;\r\n    if (G.w \u003c 0.05 && LOOK.t \u003c 1.1) {\r\n      m.gaze_w = 0.85*Math.min(1, LOOK.t/0.15)*(1 - Math.max(0, (LOOK.t - 0.8)/0.3));\r\n      [m.gaze, m.gaze_p] = gaze_to(LOOK.p);\r\n    }\r\n    m.point = G.pw > 0 ? { w: G.pw*G.pw*(3 - 2*G.pw), arm: G.arm, x: G.point.x, y: G.point.y, z: G.point.z } : null;\r\n\r\n    // --- the lens: no gesture; it forms when a snake comes close\r\n    if (on.get(lens)) {\r\n      const lone = !gestured.length;\r\n      const rush = lone && [...urgent].filter(s => !(s.claim === 'LENS-QUICK' && s.claim_until > clock));\r\n      if (rush && rush.length) {\r\n        // alone and something is about to reach the egg: a lens that fires at once\r\n        const targets = rush.slice(0, lens.free_lenses());\r\n        for (const s of targets) claim(s, 'LENS-QUICK', 1.2);\r\n        lens.cast(targets, true);\r\n      } else if (next.get(lens) \u003c= 0) {\r\n        const th = threats(LENS_ENGAGE);\r\n        const n = Math.min(lens.capacity(power), lens.free_lenses(), th.length);\r\n        if (n > 0) {\r\n          const targets = th.slice(0, n);\r\n          for (const s of targets) claim(s, 'LENS', 2.6);\r\n          const at = lens.cast(targets);\r\n          if (at.length) { LOOK.p.copy(at[0]); LOOK.t = 0; }\r\n          next.set(lens, lens.cooldown/power); last.set(lens, clock);\r\n        }\r\n      }\r\n    }\r\n    // --- leakage: always, if he has it; when it is all he has, it takes the urgent ones fast\r\n    leak.update(t, dt, on.get(leak), gestured.length || on.get(lens) ? null : urgent);\r\n    beam.update(t, dt);\r\n    lens.update(t, dt);\r\n  }\r\n\r\n  return {\r\n    ALL, tick, beam, lens,\r\n    get power() { return power; },\r\n    is_on: a => on.get(a),\r\n    toggle(i) { const a = ALL[i]; if (a) on.set(a, !on.get(a)); return a && on.get(a); },\r\n    set(i, v) { const a = ALL[i]; if (a) on.set(a, !!v); },\r\n    state: () => ({ phase: G.phase, ab: G.ab && G.ab.name, t: +G.t.toFixed(2), power: +power.toFixed(2), on: ALL.filter(a => on.get(a)).map(a => a.name), next: ALL.map(a => +next.get(a).toFixed(2)), leak_reach: +leak.reach.toFixed(1) }),\r\n    // tests: cast one power now at the snake nearest a point, skipping cooldowns\r\n    force(i, x, z) {\r\n      const a = ALL[i];\r\n      const live = snakes.S.filter(unclaimed).sort((p, q) => Math.hypot(p.x - x, p.z - z) - Math.hypot(q.x - x, q.z - z));\r\n      if (!live.length || !a) return -1;\r\n      if (a === lens) { lens.cast([live[0]]); return snakes.S.indexOf(live[0]); }\r\n      if (a.gesture && G.phase === 'idle') { start_gesture(a, live.slice(0, Math.max(1, a.capacity(power))), false); return snakes.S.indexOf(live[0]); }\r\n      return -1;\r\n    },\r\n  };\r\n}\r\n","game/render.js":"// render.js -- renderer, the 640x360 targets, post-processing and the upscale to the window.\r\n//\r\n// Frame:  world scene  -> rt_world (HalfFloat linear, + depth texture)\r\n//         view scene   -> rt_view  (HalfFloat, alpha = coverage; the viewmodel never clips walls)\r\n//         bright pass  -> rt_bloom (160x90) -> separable blur          (skipped when bloom = 0)\r\n//         final pass   -> rt_final (640x360 8-bit): fog on the world, viewmodel over it, bloom,\r\n//                         exposure, soft shoulder, sRGB encode, grade, flash/hurt, ordered dither +\r\n//                         quantize, HUD canvas composited last (never graded or dithered)\r\n//         upscale      -> canvas, largest 16:9 rect, 'sharp' (integer nearest + 1px blend at the\r\n//                         seams, identical to nearest at integer scales) or 'nearest'\r\n//\r\n// Everything tweakable is on R.params (read every frame). Custom GLSL goes in R.hooks and takes\r\n// effect after R.rebuild(): hooks.decl (uniforms / functions), hooks.world (body of\r\n// `vec3 hook_world(vec3 c, vec3 wpos, float dist, float sky)`, linear, before fog) and\r\n// hooks.grade (body of `vec3 hook_grade(vec3 c, vec2 px)`, display space, before dither).\r\n// Extra uniforms for hooks: put them in R.hook_uniforms before rebuild().\r\nimport * as THREE from 'three';\r\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\r\n\r\nexport const W = 640, H = 360;\r\n\r\n// Merge a rigid group's leaf meshes by material (one draw call per material). Children with\r\n// userData.keep, or with children of their own, are left alone. Returns the new meshes.\r\nexport function merge_static(group, cast_shadow = true) {\r\n  const by = new Map();\r\n  for (const c of group.children.slice()) {\r\n    if (!c.isMesh || c.children.length || c.userData.keep) continue;\r\n    c.updateMatrix();\r\n    const g = c.geometry.index ? c.geometry.toNonIndexed() : c.geometry.clone();\r\n    g.applyMatrix4(c.matrix);\r\n    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2), 2));\r\n    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);\r\n    if (!by.has(c.material)) by.set(c.material, []);\r\n    by.get(c.material).push(g);\r\n    group.remove(c);\r\n  }\r\n  const out = [];\r\n  for (const [mat, geos] of by) {\r\n    const m = new THREE.Mesh(mergeGeometries(geos, false), mat);\r\n    m.castShadow = cast_shadow;\r\n    group.add(m);\r\n    out.push(m);\r\n    for (const g of geos) g.dispose();\r\n  }\r\n  return out;\r\n}\r\n\r\nconst FULL_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;\r\n\r\nfunction fullscreen_triangle() {\r\n  const g = new THREE.BufferGeometry();\r\n  g.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));\r\n  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));\r\n  return g;\r\n}\r\n\r\nconst COMMON = /* glsl */`\r\nfloat bayer4(vec2 p){\r\n  ivec2 q = ivec2(mod(p, 4.0));\r\n  int i = q.x + q.y*4;\r\n  float m[16];\r\n  m[0]=0.;m[1]=8.;m[2]=2.;m[3]=10.;m[4]=12  az, bx, by, bz, r, r);\r\n\r\nexport function rbox(x, y, z, cx, cy, cz, hx, hy, hz, r) {\r\n  const qx = Math.abs(x - cx) - hx + r, qy = Math.abs(y - cy) - hy + r, qz = Math.abs(z - cz) - hz + r;\r\n  const ox = Math.max(qx, 0), oy = Math.max(qy, 0), oz = Math.max(qz, 0);\r\n  return Math.hypot(ox, oy, oz) + Math.min(Math.max(qx, qy, qz), 0) - r;\r\n}\r\n\r\n// a chain of round cones through points [[x,y,z,r], ...] (smooth-unioned with k)\r\nexport function chain(x, y, z, P, k = 0) {\r\n  let d = Infinity;\r\n  for (let i = 0; i \u003c P.length - 1; i++) {\r\n    const a = P[i], b = P[i + 1];\r\n    const e = cone(x, y, z, a[0], a[1], a[2], b[0], b[1], b[2], a[3], b[3]);\r\n    d = k > 0 ? smin(d, e, k) : Math.min(d, e);\r\n  }\r\n  return d;\r\n}\r\n\r\n// ---------------------------------------------------------------- combinators\r\nexport function smin(a, b, k) {\r\n  if (!isFinite(a)) return b;\r\n  const h = Math.max(k - Math.abs(a - b), 0)/k;\r\n  return Math.min(a, b) - h*h*k*0.25;\r\n}\r\nexport function smax(a, b, k) { return -smin(-a, -b, k); }\r\nexport const sub = (a, b, k = 0) => (k > 0 ? smax(a, -b, k) : Math.max(a, -b));\r\n\r\n// ---------------------------------------------------------------- meshing\r\n// f: the field; box: [x0, y0, z0, x1, y1, z1]; h: voxel size. Returns a BufferGeometry (indexed)\r\nexport function mesh_sdf(f, box, h) {\r\n  const pad = 2*h;\r\n  const x0 = box[0] - pad, y0 = box[1] - pad, z0 = box[2] - pad;\r\n  const nx = Math.ceil((box[3] + pad - x0)/h) + 1, ny = Math.ceil((box[4] + pad - y0)/h) + 1, nz = Math.ceil((box[5] + pad - z0)/h) + 1;\r\n  const F = new Float32Array(nx*ny*nz);\r\n  const I = (i, j, k) => (k*ny + j)*nx + i;\r\n  // narrow band: sample a lattice 4x coarser first; a fine point is evaluated only when the\r\n  // nearest coarse sample is close to the surface (the fields here are only roughly metric, so\r\n  // the band is generous); elsewhere the coarse value stands in (its sign is all that matters)\r\n  const Q = 4, cq = Q*h, band = cq*2.2;\r\n  const mx = Math.ceil((nx - 1)/Q) + 1, my = Math.ceil((ny - 1)/Q) + 1, mz = Math.ceil((nz - 1)/Q) + 1;\r\n  const Cs = new Float32Array(mx*my*mz);\r\n  for (let k = 0; k \u003c mz; k++) for (let j = 0; j \u003c my; j++) for (let i = 0; i \u003c mx; i++) Cs[(k*my + j)*mx + i] = f(x0 + i*cq, y0 + j*cq, z0 + k*cq);\r\n  for (let k = 0; k \u003c nz; k++) for (let j = 0; j \u003c ny; j++) for (let i = 0; i \u003c nx; i++) {\r\n    const c = Cs[(Math.min(mz - 1, Math.round(k/Q))*my + Math.min(my - 1, Math.round(j/Q)))*mx + Math.min(mx - 1, Math.round(i/Q))];\r\n    F[I(i, j, k)] = Math.abs(c) > band ? c : f(x0 + i*h, y0 + j*h, z0 + k*h);\r\n  }\r\n  const vid = new Int32Array((nx - 1)*(ny - 1)*(nz - 1)).fill(-1);\r\n  const C = (i, j, k) => (k*(ny - 1) + j)*(nx - 1) + i;\r\n  const pos = [];\r\n  const EDGES = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];\r\n  const corner = new Float32Array(8);\r\n  for (let k = 0; k \u003c nz - 1; k++) for (let j = 0; j \u003c ny - 1; j++) for (let i = 0; i \u003c nx - 1; i++) {\r\n    let mask = 0;\r\n    for (let c = 0; c \u003c 8; c++) {\r\n      const v = F[I(i + (c & 1), j + ((c >> 1) & 1), k + ((c >> 2) & 1))];\r\n      corner[c] = v;\r\n      if (v \u003c 0) mask |= 1 \u003c\u003c c;\r\n    }\r\n    if (mask === 0 || mask === 255) continue;\r\n    let sx = 0, sy = 0, sz = 0, n = 0;\r\n    for (const [a, b] of EDGES) {\r\n      const va = corner[a], vb = corner[b];\r\n      if ((va \u003c 0) === (vb \u003c 0)) continue;\r\n      const t = va/(va - vb);\r\n      sx += (a & 1) + (((b & 1) - (a & 1))*t);\r\n      sy += ((a >> 1) & 1) + ((((b >> 1) & 1) - ((a >> 1) & 1))*t);\r\n      sz += ((a >> 2) & 1) + ((((b >> 2) & 1) - ((a >> 2) & 1))*t);\r\n      n++;\r\n    }\r\n    vid[C(i, j, k)] = pos.length/3;\r\n    pos.push(x0 + (i + sx/n)*h, y0 + (j + sy/n)*h, z0 + (k + sz/n)*h);\r\n  }\r\n  const idx = [];\r\n  const quad = (a, b, c, d, flip) => {\r\n    if (a \u003c 0 || b \u003c 0 || c \u003c 0 || d \u003c 0) return;\r\n    if (flip) idx.push(a, c, b, a, d, c); else idx.push(a, b, c, a, c, d);\r\n  };\r\n  for (let k = 1; k \u003c nz - 1; k++) for (let j = 1; j \u003c ny - 1; j++) for (let i = 1; i \u003c nx - 1; i++) {\r\n    const v0 = F[I(i, j, k)] \u003c 0;\r\n    // x edge (i,j,k)-(i+1,j,k): cells around it share j-1..j, k-1..k\r\n    if (i \u003c nx - 1 && v0 !== (F[I(i + 1, j, k)] \u003c 0)) quad(vid[C(i, j - 1, k - 1)], vid[C(i, j, k - 1)], vid[C(i, j, k)], vid[C(i, j - 1, k)], !v0);\r\n    if (j \u003c ny - 1 && v0 !== (F[I(i, j + 1, k)] \u003c 0)) quad(vid[C(i - 1, j, k - 1)], vid[C(i - 1, j, k)], vid[C(i, j, k)], vid[C(i, j, k - 1)], !v0);\r\n    if (k \u003c nz - 1 && v0 !== (F[I(i, j, k + 1)] \u003c 0)) quad(vid[C(i - 1, j - 1, k)], vid[C(i, j - 1, k)], vid[C(i, j, k)], vid[C(i - 1, j, k)], !v0);\r\n  }\r\n  const g = new THREE.BufferGeometry();\r\n  const P = new Float32Array(pos);\r\n  g.setAttribute('position', new THREE.BufferAttribute(P, 3));\r\n  g.setIndex(idx);\r\n  // normals from the field's gradient\r\n  const N = new Float32Array(P.length), e = h*0.5;\r\n  for (let v = 0; v \u003c P.length; v += 3) {\r\n    const x = P[v], y = P[v + 1], z = P[v + 2];\r\n    let gx = f(x + e, y, z) - f(x - e, y, z), gy = f(x, y + e, z) - f(x, y - e, z), gz = f(x, y, z + e) - f(x, y, z - e);\r\n    const l = Math.hypot(gx, gy, gz) || 1;\r\n    N[v] = gx/l; N[v + 1] = gy/l; N[v + 2] = gz/l;\r\n  }\r\n  g.setAttribute('normal', new THREE.BufferAttribute(N, 3));\r\n  return g;\r\n}\r\n\r\n// ---------------------------------------------------------------- swept tubes\r\n// A tube along a polyline of points [[x,y,z], ...] with an elliptical section (w across the\r\n// curve's `up` side, t across the other), radii scaled per point by prof(s) (s = 0..1).\r\n// `up` is a fixed direction the section's wide axis aligns to (a rib's flat side faces it).\r\nexport function sweep(pts, w, t, prof, up, sides = 8) {\r\n  const n = pts.length;\r\n  const P = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));\r\n  const pos = [], nor = [], idx = [];\r\n  const U = new THREE.Vector3(...up).normalize();\r\n  for (let i = 0; i \u003c n; i++) {\r\n    const T = new THREE.Vector3().subVectors(P[Math.min(n - 1, i + 1)], P[Math.max(0, i - 1)]).normalize();\r\n    const B = new THREE.Vector3().crossVectors(T, U).normalize();\r\n    const Nn = new THREE.Vector3().crossVectors(B, T).normalize();\r\n    const s = i/(n - 1), k = prof(s);\r\n    for (let j = 0; j \u003c sides; j++) {\r\n      const a = j/sides*Math.PI*2;\r\n      const ca = Math.cos(a), sa = Math.sin(a);\r\n      const ox = Nn.x*ca*w*k + B.x*sa*t*k, oy = Nn.y*ca*w*k + B.y*sa*t*k, oz = Nn.z*ca*w*k + B.z*sa*t*k;\r\n      pos.push(P[i].x + ox, P[i].y + oy, P[i].z + oz);\r\n      const nx = Nn.x*ca/w + B.x*sa/t, ny = Nn.y*ca/w + B.y*sa/t, nz = Nn.z*ca/w + B.z*sa/t;\r\n      const l = Math.hypot(nx, ny, nz) || 1;\r\n      nor.push(nx/l, ny/l, nz/l);\r\n    }\r\n  }\r\n  for (let i = 0; i \u003c n - 1; i++) for (let j = 0; j \u003c sides; j++) {\r\n    const a = i*sides + j, b = i*sides + (j + 1)%sides, c = (i + 1)*sides + (j + 1)%sides, d = (i + 1)*sides + j;\r\n    idx.push(a, b, c, a, c, d);\r\n  }\r\n  // caps\r\n  for (const end of [0, n - 1]) {\r\n    const c = pos.length/3;\r\n    const p = P[end], T = new THREE.Vector3().subVectors(P[end === 0 ? 1 : n - 1], P[end === 0 ? 0 : n - 2]).normalize();\r\n    pos.push(p.x, p.y, p.z); nor.push(end === 0 ? -T.x : T.x, end === 0 ? -T.y : T.y, end === 0 ? -T.z : T.z);\r\n    for (let j = 0; j \u003c sides; j++) {\r\n      const a = end*sides + j, b = end*sides + (j + 1)%sides;\r\n      if (end === 0) idx.push(c, b, a); else idx.push(c, a, b);\r\n    }\r\n  }\r\n  const g = new THREE.BufferGeometry();\r\n  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));\r\n  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));\r\n  g.setIndex(idx);\r\n  return g;\r\n}\r\n","game/skeleton.js":"// skeleton.js -- a realistic human skeleton, sculpted (round 3; owner: \"the lich model itself\r\n// should be way more realistic\"; target: Astra's lich 07, reference/astra-r02/lich/07.png).\r\n//\r\n// Every bone is built in the frame of the joint it hangs from (see RIG below), so the lich can\r\n// be posed by rotating joints. Rounded bones (skull, jaw, pelvis, vertebrae, scapulae, sternum,\r\n// long bones, carpals, tarsals) are signed distance fields meshed by sdf.js; the thin flat ones\r\n// (ribs, costal cartilage, clavicles) are swept tubes with a flattened section.\r\n//\r\n// Units: metres. Frame: +y up, +z forward (the way the lich faces), s = +1 / -1 for the two\r\n// sides (x). A 1.8 m adult.\r\nimport * as THREE from 'three';\r\nimport { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';\r\nimport { sphere, ellipsoid, cone, capsule, rbox, chain, smin, smax, sub, mesh_sdf, sweep } from 'game/sdf.js';\r\n\r\nconst cyl = (x, y, z, cx, cy, cz, r, hh, k) => {\r\n  const dx = Math.hypot(x - cx, z - cz) - r + k, dy = Math.abs(y - cy) - hh + k;\r\n  return Math.min(Math.max(dx, dy), 0) + Math.hypot(Math.max(dx, 0), Math.max(dy, 0)) - k;\r\n};\r\nconst lerp = (a, b, t) => a + (b - a)*t;\r\n\r\n// ------------------------------------------------------------------ the rig (joint offsets)\r\n// parent-relative positions of every joint; the skeleton hangs from them\r\nexport const RIG = {\r\n  spine: [0, 0.10, -0.062],        // from the pelvis (hip-joint line) to the top of the sacrum\r\n  chest: [0, 0.18, 0.0],           // from the spine node to T12\r\n  neck: [0, 0.285, 0.004],         // from the chest node to C7\r\n  head: [0, 0.118, 0.014],         // from the neck node to the atlas\r\n  jaw: [0, 0.004, 0.008],          // from the head node to the jaw hinge\r\n  shoulder: [0.172, 0.248, -0.006],  // from the chest node (x times s)\r\n  elbow: [0, -0.305, 0],\r\n  wrist: [0, -0.262, 0.004],\r\n  hip: [0.088, 0, 0],              // from the pelvis (x times s)\r\n  knee: [-0.03, -0.44, 0.004],     // the femur angles in: knees closer than hips (x times s)\r\n  ankle: [0, -0.405, -0.004],\r\n};\r\n\r\n// ------------------------------------------------------------------ bone fields\r\nfunction skull(x, y, z) {\r\n  // proportions from the foramen magnum (origin): orbits ~4 cm above it and ~8 cm in front,\r\n  // the vertex ~14 cm up, the occiput ~10 cm behind\r\n  let d = ellipsoid(x, y, z, 0, 0.072, -0.016, 0.067, 0.07, 0.097);                      // cranium\r\n  d = smin(d, ellipsoid(x, y, z, 0, 0.078, 0.03, 0.056, 0.052, 0.06), 0.018);             // forehead\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.008, 0.064, 0.037, 0.036, 0.036), 0.014);        // maxilla, taller\r\n  for (const s of [-1, 1]) {\r\n    d = smin(d, ellipsoid(x, y, z, s*0.05, 0.018, 0.064, 0.02, 0.016, 0.019), 0.009);   // cheekbone\r\n    d = smin(d, capsule(x, y, z, s*0.055, 0.018, 0.058, s*0.064, 0.022, 0.0, 0.006), 0.007);  // arch\r\n    d = smin(d, ellipsoid(x, y, z, s*0.056, -0.012, -0.024, 0.011, 0.016, 0.013), 0.009); // mastoid\r\n  }\r\n  d = smin(d, capsule(x, y, z, -0.045, 0.058, 0.08, 0.045, 0.058, 0.08, 0.0095), 0.012);  // brow ridge\r\n  for (const s of [-1, 1]) {\r\n    d = smax(d, -ellipsoid(x, y, z, s*0.032, 0.037, 0.094, 0.0165, 0.0155, 0.03), 0.004);  // orbit: smaller, deep\r\n    d = smax(d, -ellipsoid(x, y, z, s*0.073, 0.045, 0.018, 0.011, 0.02, 0.026), 0.009);  // temple\r\n  }\r\n  d = smax(d, -ellipsoid(x, y, z, 0, 0.004, 0.099, 0.0095, 0.018, 0.02), 0.003);       // nasal opening\r\n  d = smax(d, -ellipsoid(x, y, z, 0, -0.045, -0.03, 0.05, 0.03, 0.05), 0.012);         // skull base\r\n  for (let i = 0; i \u003c 12; i++) {                                                        // upper teeth\r\n    const a = lerp(-1.25, 1.25, i/11);\r\n    const tx = Math.sin(a)*0.033, tz = 0.052 + Math.cos(a)*0.035;\r\n    d = smin(d, capsule(x, y, z, tx, -0.03, tz, tx, -0.043, tz, 0.0042 - Math.abs(a)*0.0006), 0.002);\r\n  }\r\n  return d;\r\n}\r\nfunction mandible(x, y, z) {\r\n  // jaw-hinge frame: condyles at the origin's sides, the chin ~7.5 cm down-forward\r\n  const P = [];\r\n  for (let i = 0; i \u003c= 10; i++) {\r\n    const a = lerp(-1.5, 1.5, i/10);\r\n    P.push([Math.sin(a)*0.046, -0.072 + Math.abs(Math.sin(a))*0.01, 0.018 + Math.cos(a)*0.05, 0.0088]);\r\n  }\r\n  let d = chain(x, y, z, P, 0.006);\r\n  for (const s of [-1, 1]) {\r\n    d = smin(d, cone(x, y, z, s*0.046, -0.066, 0.004, s*0.05, -0.004, -0.004, 0.011, 0.008), 0.008);   // ramus\r\n    d = smin(d, sphere(x, y, z, s*0.05, -0.002, -0.005, 0.0075), 0.004);                 // condyle\r\n    d = smin(d, cone(x, y, z, s*0.049, -0.03, 0.004, s*0.046, 0.002, 0.016, 0.006, 0.003), 0.005);   // coronoid\r\n  }\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.08, 0.064, 0.014, 0.012, 0.009), 0.008);           // chin\r\n  for (let i = 0; i \u003c 12; i++) {                                                         // lower teeth\r\n    const a = lerp(-1.2, 1.2, i/11);\r\n    const tx = Math.sin(a)*0.039, tz = 0.018 + Math.cos(a)*0.044;\r\n    d = smin(d, capsule(x, y, z, tx, -0.061, tz, tx, -0.049, tz, 0.0042), 0.002);\r\n  }\r\n  return d;\r\n}\r\n// a vertebra at height yc, depth zc: body, pedicles, spinous and transverse processes\r\nfunction vertebra(x, y, z, yc, zc, R, hh, spL, spDrop, trL) {\r\n  let d = cyl(x, y, z, 0, yc, zc + R*0.1, R, hh, hh*0.6);\r\n  d = smin(d, capsule(x, y, z, -R*0.5, yc + hh*0.3, zc - R*0.8, R*0.5, yc + hh*0.3, zc - R*0.8, R*0.28), R*0.3);\r\n  d = smin(d, cone(x, y, z, 0, yc + hh*0.3, zc - R*0.9, 0, yc - spDrop, zc - R - spL, R*0.32, R*0.2), R*0.25);\r\n  for (const s of [-1, 1]) d = smin(d, cone(x, y, z, s*R*0.5, yc + hh*0.4, zc - R*0.8, s*(R*0.5 + trL), yc + hh*0.5, zc - R*0.95, R*0.25, R*0.16), R*0.2);\r\n  return d;\r\n}\r\nfunction pelvis(x, y, z) {\r\n  let d = Infinity;\r\n  for (const s of [-1, 1]) {\r\n    // iliac blade: a thin broad fan facing out and forward, thick at its crest\r\n    const cx = s*0.088, cy = 0.085, cz = -0.012;\r\n    const a = s*0.55, ca = Math.cos(a), sa = Math.sin(a);\r\n    const lx = (x - cx)*ca - (z - cz)*sa, lz = (x - cx)*sa + (z - cz)*ca, ly = y - cy;\r\n    // bent so its edges curl medially: the iliac fossa is a bowl, the gluteal side convex\r\n    let blade = ellipsoid(lx + 3.2*(lz*lz + (ly - 0.01)*(ly - 0.01)), ly, lz, 0, 0, 0, 0.0075, 0.07, 0.078);\r\n    blade = smax(blade, -(ly + 0.045), 0.01);\r\n    d = smin(d, blade, 0.01);\r\n    const crest = [];\r\n    for (let i = 0; i \u003c= 8; i++) {\r\n      const t = lerp(-1.25, 1.25, i/8);\r\n      const px = Math.sin(t)*0.077, py = Math.cos(t)*0.064;\r\n      // the crest traced in the blade's plane, back in pelvis space\r\n      const bend = -3.2*(px*px + (py - 0.014)*(py - 0.014));      // follow the blade's curl\r\n      crest.push([cx + bend*ca + px*sa, cy + py - 0.004, cz - bend*sa + px*ca, 0.0075]);\r\n    }\r\n    d = smin(d, chain(x, y, z, crest, 0.006), 0.008);\r\n    // body of the ilium down to the socket, the socket, the ischium and its tuberosity\r\n    d = smin(d, cone(x, y, z, s*0.084, 0.05, -0.012, s*0.08, 0.004, -0.002, 0.021, 0.024), 0.014);\r\n    const sock = sphere(x, y, z, s*0.078, 0, 0, 0.029);\r\n    d = smin(d, sock, 0.012);\r\n    d = smax(d, -sphere(x, y, z, s*0.093, 0, 0, 0.025), 0.004);                      // acetabulum\r\n    d = smin(d, cone(x, y, z, s*0.072, -0.02, -0.012, s*0.058, -0.085, -0.03, 0.017, 0.014), 0.01);\r\n    // the pelvic ring: arcuate line to the pubis, pubic rami, the obturator loop\r\n    d = smin(d, chain(x, y, z, [[s*0.035, 0.07, -0.062, 0.011], [s*0.062, 0.04, -0.03, 0.01], [s*0.066, 0.008, 0.022, 0.011], [s*0.036, -0.018, 0.058, 0.011], [s*0.012, -0.03, 0.066, 0.012]], 0.006), 0.008);\r\n    d = smin(d, chain(x, y, z, [[s*0.012, -0.056, 0.058, 0.009], [s*0.034, -0.078, 0.028, 0.008], [s*0.056, -0.088, -0.018, 0.011]], 0.005), 0.006);\r\n    d = smin(d, capsule(x, y, z, s*0.012, -0.03, 0.066, s*0.012, -0.058, 0.058, 0.01), 0.006);\r\n  }\r\n  // sacrum: a curved wedge between the blades at the back, and the coccyx\r\n  const sac = [];\r\n  for (let i = 0; i \u003c= 5; i++) { const t = i/5; sac.push([0, lerp(0.1, -0.02, t), -0.066 - Math.sin(t*2.6)*0.016 + t*0.01, lerp(0.034, 0.012, t)]); }\r\n  let sd = chain(x, y, z, sac, 0.01);\r\n  sd = smax(sd, Math.abs(z + 0.07 + (y - 0.04)*0.25) - 0.022, 0.008);          // flatten front-to-back\r\n  d = smin(d, sd, 0.012);\r\n  d = smin(d, chain(x, y, z, [[0, -0.02, -0.06, 0.009], [0, -0.042, -0.05, 0.006], [0, -0.056, -0.038, 0.004]], 0.003), 0.004);\r\n  return d;\r\n}\r\n// long bones, each hanging from its joint (local y down)\r\nfunction humerus(x, y, z, s) {\r\n  let d = sphere(x, y, z, -s*0.006, -0.012, -0.006, 0.024);\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.018, 0.004, 0.016), 0.01);                   // tubercles\r\n  d = smin(d, chain(x, y, z, [[0, -0.03, 0, 0.014], [s*0.004, -0.1, 0.002, 0.012], [s*0.002, -0.2, 0, 0.010], [0, -0.27, 0, 0.011]], 0.01), 0.012);\r\n  d = smin(d, ellipsoid(x, y, z, 0, -0.288, -0.002, 0.031, 0.012, 0.014), 0.01);          // epicondyles\r\n  d = smin(d, sphere(x, y, z, -s*0.01, -0.298, 0.006, 0.011), 0.006);\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.297, 0.006, 0.01), 0.006);\r\n  return d;\r\n}\r\nfunction forearm(x, y, z, s) {\r\n  // ulna (inner, with the olecranon hooked up behind the elbow) and radius (outer)\r\n  let d = cone(x, y, z, -s*0.009, 0.014, -0.012, -s*0.01, -0.03, -0.004, 0.012, 0.011);\r\n  d = smin(d, chain(x, y, z, [[-s*0.01, -0.03, -0.004, 0.0105], [-s*0.011, -0.14, -0.002, 0.008], [-s*0.012, -0.245, 0, 0.0065]], 0.006), 0.008);\r\n  d = smin(d, sphere(x, y, z, -s*0.012, -0.25, 0.0, 0.0085), 0.004);\r\n  let r = cyl(x, y, z, s*0.012, -0.012, 0.004, 0.01, 0.006, 0.003);\r\n  r = smin(r, chain(x, y, z, [[s*0.012, -0.016, 0.004, 0.007], [s*0.016, -0.13, 0.006, 0.0075], [s*0.016, -0.235, 0.006, 0.011], [s*0.012, -0.252, 0.006, 0.013]], 0.006), 0.006);\r\n  return Math.min(d, r);\r\n}\r\nfunction femur(x, y, z, s) {\r\n  let d = sphere(x, y, z, 0, 0, 0, 0.025);                                             // head\r\n  d = smin(d, cone(x, y, z, 0, 0, 0, s*0.038, -0.036, -0.002, 0.016, 0.018), 0.01);     // neck\r\n  d = smin(d, sphere(x, y, z, s*0.046, -0.028, -0.008, 0.019), 0.012);                   // greater trochanter\r\n  d = smin(d, sphere(x, y, z, s*0.012, -0.065, -0.012, 0.01), 0.008);                    // lesser\r\n  d = smin(d, chain(x, y, z, [[s*0.036, -0.05, -0.002, 0.016], [s*0.022, -0.16, 0.008, 0.0145], [s*0.004, -0.3, 0.008, 0.0145], [-s*0.022, -0.405, 0.0, 0.019]], 0.012), 0.014);\r\n  for (const k of [-1, 1]) d = smin(d, ellipsoid(x, y, z, -s*0.03 + k*0.021, -0.425, -0.006, 0.019, 0.021, 0.028), 0.012);\r\n  return d;\r\n}\r\nfunction shin(x, y, z, s) {\r\n  let d = ellipsoid(x, y, z, 0, -0.016, -0.002, 0.037, 0.016, 0.03);                    // plateau\r\n  d = smin(d, sphere(x, y, z, 0, -0.05, 0.022, 0.011), 0.01);                            // tuberosity\r\n  d = smin(d, chain(x, y, z, [[0, -0.035, 0.004, 0.019], [0, -0.14, 0.008, 0.0135], [-s*0.002, -0.3, 0.004, 0.012], [-s*0.004, -0.38, 0, 0.016]], 0.012), 0.014);\r\n  d = smin(d, sphere(x, y, z, -s*0.016, -0.397, 0.001, 0.0115), 0.008);                  // medial malleolus\r\n  let f = chain(x, y, z, [[s*0.03, -0.035, -0.012, 0.01], [s*0.03, -0.2, -0.01, 0.0065], [s*0.028, -0.38, -0.008, 0.008]], 0.004);\r\n  f = smin(f, sphere(x, y, z, s*0.029, -0.405, -0.006, 0.011), 0.006);                   // lateral malleolus\r\n  return Math.min(d, f);\r\n}\r\nfunction patella(x, y, z) { return ellipsoid(x, y, z, 0, 0.018, 0.036, 0.021, 0.025, 0.011); }\r\nfunction foot(x, y, z, s) {\r\n  let d = ellipsoid(x, y, z, 0, -0.016, 0.0, 0.02, 0.016, 0.022);                        // talus\r\n  d = smin(d, ellipsoid(x, y, z, s*0.004, -0.038, -0.038, 0.017, 0.022, 0.034), 0.012);  // calcaneus\r\n  d = smin(d, ellipsoid(x, y, z, -s*0.004, -0.032, 0.03, 0.028, 0.014, 0.02), 0.01);     // tarsals\r\n  const toes = [[-s*0.022, 1.0], [-s*0.006, 0.82], [s*0.008, 0.78], [s*0.02, 0.72], [s*0.031, 0.64]];\r\n  for (let i = 0; i \u003c 5; i++) {\r\n    const [tx, L] = toes[i], r = i === 0 ? 0.009 : 0.0058;\r\n    const bx = tx*0.8, bz = 0.045;\r\n    const mz = bz + 0.072*L, tz = mz + (i === 0 ? 0.052 : 0.045)*L;\r\n    d = smin(d, chain(x, y, z, [[bx, -0.036, bz, r*1.1], [tx, -0.05, mz, r], [tx, -0.055, mz + 0.01, r*0.95], [tx, -0.056, tz, r*0.75]], 0.004), 0.006);\r\n  }\r\n  return d;\r\n}\r\nfunction carpals(x, y, z, s) {\r\n  let d = Infinity;\r\n  for (let i = 0; i \u003c 4; i++) for (let row = 0; row \u003c 2; row++) {\r\n    const zz = lerp(0.016, -0.018, i/3), yy = -0.008 - row*0.013;\r\n    d = smin(d, sphere(x, y, z, 0, yy, zz, 0.0082 - row*0.0006), 0.006);\r\n  }\r\n  return d;\r\n}\r\n// fingers: z offsets across the hanging hand (palm toward the body), index at the front\r\nconst FINGERS = [\r\n  { z: 0.018, meta: 0.064, ph: [0.04, 0.024, 0.018] },\r\n  { z: 0.005, meta: 0.062, ph: [0.044, 0.027, 0.019] },\r\n  { z: -0.008, meta: 0.058, ph: [0.041, 0.026, 0.018] },\r\n  { z: -0.02, meta: 0.052, ph: [0.033, 0.019, 0.016] },\r\n];\r\n\r\n// ------------------------------------------------------------------ ribs (swept)\r\n// chest-node frame. Rib k (0 = first) hangs from thoracic vertebra T(k+1).\r\nconst T_Y = k => 0.268 - k*0.0223;                           // thoracic vertebra heights (T1 top)\r\nconst T_Z = y => -0.026*Math.sin(Math.PI*y/0.29);            // the thoracic curve (kyphosis)\r\nconst RIB = {\r\n  halfw: [0.058, 0.082, 0.098, 0.11, 0.12, 0.127, 0.131, 0.132, 0.128, 0.12, 0.104, 0.086],\r\n  depth: [0.118, 0.148, 0.168, 0.182, 0.192, 0.196, 0.196, 0.188, 0.172, 0.148, 0.098, 0.066],\r\n  drop: [0.028, 0.048, 0.066, 0.082, 0.092, 0.098, 0.102, 0.102, 0.098, 0.088, 0.06, 0.04],\r\n  end: [0.84, 0.86, 0.86, 0.86, 0.85, 0.84, 0.83, 0.79, 0.75, 0.71, 0.55, 0.47],\r\n};\r\nconst STERNUM = { top: [0, 0.228, 0.118], bot: [0, 0.07, 0.186] };\r\nconst sternum_at = t => [0, lerp(STERNUM.top[1], STERNUM.bot[1], t), lerp(STERNUM.top[2], STERNUM.bot[2], t)];\r\n\r\nfunction rib_points(k, s) {\r\n  const y0 = T_Y(k), z0 = T_Z(y0);\r\n  const hw = RIB.halfw[k], dp = RIB.depth[k], dr = RIB.drop[k];\r\n  const pts = [[s*0.024, y0, z0 - 0.012]];\r\n  const back = 0.035;                                         // the rib's angle, behind the spine\r\n  const N = 18;\r\n  for (let i = 0; i \u003c= N; i++) {\r\n    const th = lerp(0.16, RIB.end[k]*Math.PI, i/N);\r\n    const x = s*hw*Math.sin(th)*(1 - 0.08*Math.sin(th*2));\r\n    const z = z0 - back + (dp*0.5 + back)*(1 - Math.cos(th)) - 0.01;\r\n    const y = y0 - dr*(1 - Math.cos(th))/2;\r\n    pts.push([x, y, z]);\r\n  }\r\n  return pts;\r\n}\r\nfunction cartilage_points(k, s, rib_end) {\r\n  // ribs 1-7 reach the sternum; 8-10 join the cartilage above; 11-12 float\r\n  if (k >= 10) return null;\r\n  const e = rib_end;\r\n  let tgt;\r\n  if (k \u003c 7) tgt = sternum_at([0.02, 0.1, 0.25, 0.4, 0.55, 0.7, 0.82][k]);\r\n  else tgt = [s*(0.06 - (k - 7)*0.004), T_Y(6) - RIB.drop[6] - 0.012 - (k - 7)*0.018, 0.17 - (k - 7)*0.012];\r\n  const tx = k \u003c 7 ? s*0.016 : tgt[0];\r\n  const pts = [];\r\n  for (let i = 0; i \u003c= 8; i++) {\r\n    const t = i/8;\r\n    // bend upward toward the sternum (the costal margin), more for the lower ribs\r\n    const lift = Math.sin(t*Math.PI*0.5)*(k > 4 ? 0.025 + (k - 4)*0.006 : 0.004);\r\n    pts.push([lerp(e[0], tx, t), lerp(e[1], tgt[1], t) + lift*(1 - t)*0.8, lerp(e[2], tgt[2], t)]);\r\n  }\r\n  return pts;\r\n}\r\n\r\n// ------------------------------------------------------------------ build all meshes\r\n// Returns { node_name: [geometries...] } in each node's own frame, plus the finger segments.\r\nexport function build_skeleton_geometry(res = 1, grow = 0.0032) {\r\n  // owner, round 3: \"the lich is almost invisible ... he should be a bit more solid\". At the room\r\n  // camera a real bone is under a pixel wide; every surface is pushed out by `grow` metres.\r\n  const H = h => h*res;\r\n  const GROW = grow;\r\n  const mesh_sdf_g = (f, box, h) => mesh_sdf((x, y, z) => f(x, y, z) - GROW, [box[0] - GROW, box[1] - GROW, box[2] - GROW, box[3] + GROW, box[4] + GROW, box[5] + GROW], h);\r\n  const sweep_g = (pts, w, t, prof, up, sides) => sweep(pts, w + GROW*0.8, t + GROW*0.8, prof, up, sides);\r\n  const G = {};\r\n  const add = (node, g) => { (G[node] = G[node] || []).push(g); };\r\n  // skull and jaw (head / jaw nodes)\r\n  add('head', mesh_sdf_g(skull, [-0.085, -0.06, -0.125, 0.085, 0.155, 0.13], H(0.0028)*0.8));\r\n  add('jaw', mesh_sdf_g(mandible, [-0.065, -0.1, -0.025, 0.065, 0.015, 0.09], H(0.0024)*0.85));\r\n  // spine: lumbar (spine node), thoracic (chest), cervical (neck)\r\n  add('spine', mesh_sdf_g((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let i = 0; i \u003c 5; i++) { const yc = 0.015 + i*0.034; d = Math.min(d, vertebra(x, y, z, yc, 0.014*Math.sin(Math.PI*yc/0.18), 0.021 - i*0.0008, 0.0115, 0.028, 0.004, 0.028)); }\r\n    return d;\r\n  }, [-0.06, -0.01, -0.075, 0.06, 0.2, 0.04], H(0.0024)));\r\n  add('chest', mesh_sdf_g((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let k = 0; k \u003c 12; k++) { const yc = T_Y(k); d = Math.min(d, vertebra(x, y, z, yc, T_Z(yc), 0.0125 + k*0.0006, 0.0085, 0.03, 0.02 - Math.abs(k - 6)*0.001, 0.024)); }\r\n    return d;\r\n  }, [-0.05, -0.03, -0.1, 0.05, 0.29, 0.03], H(0.0022)));\r\n  add('neck', mesh_sdf_g((x, y, z) => {\r\n    let d = Infinity;\r\n    for (let i = 0; i \u003c 7; i++) { const yc = 0.008 + i*0.0165; d = Math.min(d, vertebra(x, y, z, yc, 0.012*Math.sin(Math.PI*yc/0.12), 0.0105 - i*0.0003, 0.006, i === 0 ? 0.03 : 0.014, 0.006, 0.02)); }\r\n    return d;\r\n  }, [-0.045, -0.01, -0.07, 0.045, 0.13, 0.03], H(0.002)));\r\n  // pelvis and sacrum\r\n  add('pelvis', mesh_sdf_g(pelvis, [-0.18, -0.11, -0.12, 0.18, 0.17, 0.09], H(0.0028)*1.15));\r\n  // ribcage: ribs, costal cartilage, sternum, scapulae, clavicles (chest node)\r\n  for (const s of [-1, 1]) for (let k = 0; k \u003c 12; k++) {\r\n    const rp = rib_points(k, s);\r\n    add('chest', sweep_g(rp, 0.0062, 0.0031, t => (t \u003c 0.08 ? 0.75 + t*3 : 1 - Math.max(0, t - 0.7)*0.6), [0, 1, 0], 8));\r\n    const cp = cartilage_points(k, s, rp[rp.length - 1]);\r\n    if (cp) add('chest', sweep_g(cp, 0.0048, 0.0028, () => 1, [0, 1, 0], 6));\r\n  }\r\n  add('chest', mesh_sdf_g((x, y, z) => {\r\n    // sternum: manubrium, body, xiphoid, tilted with the chest\r\n    let d = Infinity;\r\n    const P = [0, 0.08, 0.3, 0.55, 0.8, 0.95, 1.05].map(t => { const p = sternum_at(Math.min(t, 1)); return [p[0], p[1] - (t > 1 ? 0.012 : 0), p[2] + (t > 1 ? 0.005 : 0), t \u003c 0.15 ? 0.022 : t > 1 ? 0.006 : 0.014]; });\r\n    d = chain(x, y, z, P, 0.01);\r\n    d = smax(d, Math.abs((z - lerp(0.118, 0.186, (0.228 - y)/0.158))) - 0.0065, 0.004);   // flatten front-to-back\r\n    // scapulae: thin triangular blades on the back, the spine ridge, the acromion\r\n    for (const s of [-1, 1]) {\r\n      const cx = s*0.095, cy = 0.165, cz = -0.078;\r\n      const a = s*0.42, ca = Math.cos(a), sa = Math.sin(a);\r\n      const lx = (x - cx)*ca + (z - cz)*sa, lz = -(x - cx)*sa + (z - cz)*ca, ly = y - cy;\r\n      let b = ellipsoid(lx, ly, lz, 0, 0, 0, 0.052, 0.072, 0.006);\r\n      b = smax(b, (ly + 0.9*(Math.abs(lx) - 0.01)*s*0) - 0.06, 0.01);\r\n      b = smin(b, chain(lx, ly, lz, [[-0.045, 0.035, -0.004, 0.005], [0.03, 0.05, -0.012, 0.007], [0.065, 0.06, 0.005, 0.009]], 0.004), 0.006);\r\n      d = smin(d, b, 0.004);\r\n      d = smin(d, sphere(x, y, z, s*0.168, 0.248, -0.012, 0.014), 0.012);                  // glenoid rim / acromion\r\n    }\r\n    return d;\r\n  }, [-0.22, 0.03, -0.12, 0.22, 0.29, 0.21], H(0.0026)));\r\n  for (const s of [-1, 1]) {\r\n    const cl = [[s*0.016, 0.232, 0.118], [s*0.06, 0.242, 0.122], [s*0.11, 0.25, 0.09], [s*0.15, 0.256, 0.03], [s*0.166, 0.255, -0.004]];\r\n    const pts = [];\r\n    for (let i = 0; i \u003c= 12; i++) {\r\n      const t = i/12*(cl.length - 1), a = Math.floor(Math.min(t, cl.length - 2)), f = t - a;\r\n      pts.push([0, 1, 2].map(c => lerp(cl[a][c], cl[a + 1][c], f)));\r\n    }\r\n    add('chest', sweep_g(pts, 0.0075, 0.0055, t => 1 + 0.25*Math.abs(t - 0.5)*2, [0, 1, 0], 8));\r\n  }\r\n  // limbs, per side\r\n  for (const s of [-1, 1]) {\r\n    const S = s > 0 ? 'L' : 'R';\r\n    add('upper' + S, mesh_sdf_g((x, y, z) => humerus(x, y, z, s), [-0.045, -0.32, -0.04, 0.045, 0.02, 0.04], H(0.0026)*1.3));\r\n    add('fore' + S, mesh_sdf_g((x, y, z) => forearm(x, y, z, s), [-0.035, -0.27, -0.03, 0.035, 0.03, 0.03], H(0.0022)*1.25));\r\n    add('hand' + S, mesh_sdf_g((x, y, z) => carpals(x, y, z, s), [-0.015, -0.035, -0.03, 0.015, 0.005, 0.03], H(0.0016)));\r\n    add('thigh' + S, mesh_sdf_g((x, y, z) => femur(x, y, z, s), [-0.08, -0.46, -0.05, 0.08, 0.035, 0.05], H(0.003)*1.3));\r\n    add('shin' + S, mesh_sdf_g((x, y, z) => shin(x, y, z, s), [-0.055, -0.42, -0.04, 0.055, 0.005, 0.045], H(0.0027)*1.3));\r\n    add('knee' + S, mesh_sdf_g(patella, [-0.025, -0.01, 0.02, 0.025, 0.045, 0.05], H(0.002)));\r\n    add('foot' + S, mesh_sdf_g((x, y, z) => foot(x, y, z, s), [-0.05, -0.07, -0.08, 0.05, 0.005, 0.17], H(0.0021)));\r\n    // metacarpals (rigid with the hand) and the finger segments (each its own joint)\r\n    add('hand' + S, mesh_sdf_g((x, y, z) => {\r\n      let d = Infinity;\r\n      for (const f of FINGERS) d = Math.min(d, cone(x, y, z, 0, -0.028, f.z*0.8, 0, -0.028 - f.meta, f.z, 0.0058, 0.0052), smin(d, sphere(x, y, z, 0, -0.028 - f.meta, f.z, 0.0064), 0.003));\r\n      // thumb metacarpal, angled out toward the front\r\n      d = Math.min(d, cone(x, y, z, 0, -0.02, 0.022, s*0.012, -0.055, 0.046, 0.0065, 0.0058));\r\n      return d;\r\n    }, [-0.02, -0.1, -0.03, 0.02, -0.01, 0.06], H(0.0016)));\r\n    FINGERS.forEach((f, i) => f.ph.forEach((L, j) => {\r\n      const r = (0.0052 - j*0.0009)*(i === 3 ? 0.85 : 1);\r\n      add(`finger${S}${i}_${j}`, mesh_sdf_g((x, y, z) => smin(cone(x, y, z, 0, 0, 0, 0, -L, 0, r, r*0.82), sphere(x, y, z, 0, -L, 0, r*0.95), 0.002), [-0.009, -L - 0.008, -0.009, 0.009, 0.008, 0.009], H(0.0014)));\r\n    }));\r\n    [0.034, 0.026].forEach((L, j) => {\r\n      const r = 0.006 - j*0.001;\r\n      add(`thumb${S}_${j}`, mesh_sdf_g((x, y, z) => smin(cone(x, y, z, 0, 0, 0, 0, -L, 0, r, r*0.85), sphere(x, y, z, 0, -L, 0, r), 0.002), [-0.01, -L - 0.008, -0.01, 0.01, 0.008, 0.01], H(0.0014)));\r\n    });\r\n  }\r\n  // merge each node's pieces\r\n  const out = {};\r\n  for (const k in G) {\r\n    const gs = G[k].map(g => { const n = g.index ? g : g; if (!n.attributes.uv) n.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(n.attributes.position.count*2), 2)); return n; });\r\n    out[k] = gs.length === 1 ? gs[0] : mergeGeometries(gs, false);\r\n  }\r\n  return out;\r\n}\r\nexport { FINGERS };\r\n","game/snakes.js":"// snakes.js -- the snakes (round 3; owner: \"the ones in the game have the wrong shape ... snake\r\n// 03 feels fine, it's not an issue of species, it's just general shape\"). Astra's snake 03 (a\r\n// mamba-like build): long and slender, one continuous body lying in wide smooth S-curves, the\r\n// neck lifted off the ground in a curve so the narrow, elongated head rides level above it, a\r\n// long thin tail.\r\n//\r\n// Each snake is one tube mesh rebuilt every frame along its head's trail (serpentine\r\n// locomotion: the body follows exactly where the head went). The front of the body rises\r\n// off the ground; the head is part of the same tube, shaped by the radius profile and a\r\n// flatter section. Glossy scales, a paler belly, dark glassy eyes.\r\n//\r\n// Behaviour: they come out of the dark toward the egg (reaching it they shrink away: a\r\n// placeholder). Round 9: set on fire (fire.js) a snake stops where it is, its lifted neck sinks\r\n// as it dies, its scales char black with glowing cracks that cool; then the black corpse sinks\r\n// into the ground in a puff of ash, and another comes.\r\nimport * as THREE from 'three';\r\nimport { make_rng, clamp, smoothstep, lerp } from 'game/util.js';\r\nimport { gi_dynamic } from 'game/gi.js';\r\n\r\nconst LEN = 4.4, R0 = 0.08;                   // body length and body radius, metres (03 build, dream-sized: readable from the room camera)\r\nconst RINGS = 72, SIDES = 12;\r\nconst RAISE = 0.34, RAISE_LEN = 1.1;           // the head rides this high; the neck curve spans this much body\r\n// rings crowd toward the snout (about 14 in the first 20 cm) so the head has a shape\r\nconst S_AT = i => LEN*Math.pow(i/(RINGS - 1), 1.6);\r\nconst I_AT = sl => (RINGS - 1)*Math.pow(sl/LEN, 1/1.6);\r\n\r\n// radius profile along the body, s = 0 at the snout, in body radii; and the section's height\r\nfunction radius_at(s) {\r\n  if (s \u003c 0.012) return lerp(0.18, 0.45, s/0.012);\r\n  if (s \u003c 0.05) return lerp(0.45, 0.82, (s - 0.012)/0.038);\r\n  if (s \u003c 0.085) return lerp(0.82, 0.95, (s - 0.05)/0.035);        // the head's widest, at the jaw\r\n  if (s \u003c 0.115) return lerp(0.95, 0.68, (s - 0.085)/0.03);        // the neck\r\n  if (s \u003c 0.3) return lerp(0.68, 0.98, smoothstep(0.115, 0.3, s));\r\n  const tail0 = LEN*0.62;\r\n  if (s \u003c tail0) return 1.0;\r\n  return lerp(1.0, 0.07, Math.pow((s - tail0)/(LEN - tail0), 0.85));\r\n}\r\n// the corpse sinking: how far below its bed it is, eased\r\nconst SINK_T = 1.5, SINK_D = 0.34;\r\nconst RESPAWN = [2.0, 5.0];                  // seconds in the dark before a gone snake comes back\r\nconst sink_depth = s => (s.sink \u003c 0 ? 0 : SINK_D*smoothstep(0, SINK_T, s.sink));\r\nconst flat_at = s => (s \u003c 0.11 ? 0.62 : lerp(0.62, 0.84, smoothstep(0.11, 0.3, s)));   // head flatter than body\r\n\r\n// scale texture: dark olive-bronze back with overlapping scale rows, pale belly\r\nfunction scale_texture() {\r\n  const W = 64, H = 256;\r\n  const c = document.createElement('canvas'); c.width = W; c.height = H;\r\n  const g = c.getContext('2d');\r\n  const img = g.createImageData(W, H), d = img.data;\r\n  for (let y = 0; y \u003c H; y++) for (let x = 0; x \u003c W; x++) {\r\n    const u = x/W;                                                // around: 0.5 = back, 0/1 = belly\r\n    const back = Math.cos((u - 0.5)*Math.PI*2)*0.5 + 0.5;         // 1 on the back, 0 on the belly\r\n    const row = (y + (Math.floor(x/4) % 2)*2) % 4, col = x % 4;\r\n    const dia = Math.abs(col - 1.5) + Math.abs(row - 1.5);\r\n    let k = dia \u003c 1.4 ? 1.0 : dia \u003c 2.4 ? 0.86 : 0.7;\r\n    const belly = smoothstep(0.35, 0.1, back);\r\n    const top = [60, 56, 44], side = [84, 78, 59], bel = [140, 130, 100];      // dark olive-bronze: a silhouette on the brown floor\r\n    let col3 = back > 0.6 ? top : side;\r\n    col3 = col3.map((v, i) => lerp(v, bel[i], belly));\r\n    if (belly > 0.5) k = (y % 6 === 0) ? 0.78 : 1.0;             // belly plates\r\n    const i = (y*W + x)*4;\r\n    d[i] = col3[0]*k; d[i + 1] = col3[1]*k; d[i + 2] = col3[2]*k; d[i + 3] = 255;\r\n  }\r\n  g.putImageData(img, 0, 0);\r\n  const t = new THREE.CanvasTexture(c);\r\n  t.colorSpace = THREE.SRGBColorSpace;\r\n  t.wrapS = t.wrapT = THREE.RepeatWrapping;\r\n  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;\r\n  return t;\r\n}\r\n\r\nexport function create_snakes(R, cave, get_lich_pos, fire, count = 8, seed = 5) {\r\n  const rng = make_rng(seed);\r\n  const mat = new THREE.MeshStandardMaterial({ map: scale_texture(), roughness: 0.3, metalness: 0.0 });\r\n  if (cave.GU) gi_dynamic(mat, cave.GU);\r\n  // scales are glossy: their edges catch whatever light is around (the bounce light included),\r\n  // which draws the body's outline against the floor\r\n  // burning (round 9): aBurn per vertex = (how charred, how brightly its cracks glow, how much\r\n  // prismatic light shines in it: the beam and the leakage, round 11)\r\n  const uEmber = { value: new THREE.Color(3.2, 0.75, 0.1) }, uSnakeT = { value: 0 };\r\n  {\r\n    const prev = mat.onBeforeCompile;\r\n    mat.onBeforeCompile = (sh, r) => {\r\n      prev(sh, r);\r\n      sh.uniforms.uEmber = uEmber; sh.uniforms.uSnakeT = uSnakeT;\r\n      sh.vertexShader = sh.vertexShader\r\n        .replace('#include \u003ccommon>', `#include \u003ccommon>\r\nattribute vec3 aBurn;\r\nvarying vec3 vBurn;`)\r\n        .replace('#include \u003cbegin_vertex>', `#include \u003cbegin_vertex>\r\n  vBurn = aBurn;`);\r\n      sh.fragmentShader = sh.fragmentShader\r\n        .replace('#include \u003ccommon>', `#include \u003ccommon>\r\nvarying vec3 vBurn;\r\nuniform vec3 uEmber;\r\nuniform float uSnakeT;`)\r\n        .replace('#include \u003cmap_fragment>', `#include \u003cmap_fragment>\r\n  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.02, 0.018, 0.016), vBurn.x);`)\r\n        .replace('#include \u003croughnessmap_fragment>', `#include \u003croughnessmap_fragment>\r\n  roughnessFactor = mix(roughnessFactor, 0.85, vBurn.x);`)\r\n        .replace('#include \u003cemissivemap_fragment>', `#include \u003cemissivemap_fragment>\r\n  {\r\n    // cracks between the charred scales, glowing while the body is hot\r\n    vec2 cu = vMapUv;\r\n    float c1 = abs(sin(cu.y*9.0 + sin(cu.x*18.85)*1.3));\r\n    float c2 = abs(sin(cu.x*12.57 + cu.y*3.1 + sin(cu.y*5.0)));\r\n    float crack = smoothstep(0.24, 0.0, min(c1, c2));\r\n    totalEmissiveRadiance += uEmber*vBurn.y*(0.03 + 0.8*crack);\r\n    // prismatic light inside it (beam, leakage): a pale shimmer running with a rainbow\r\n    vec3 hue = clamp(abs(fract(cu.y*0.35 + cu.x + uSnakeT*0.3 + vec3(0.0, 0.6667, 0.3333))*6.0 - 3.0) - 1.0, 0.0, 1.0);\r\n    totalEmissiveRadiance += mix(vec3(1.0), hue, 0.6)*vBurn.z*vBurn.z*1.6;\r\n  }`)\r\n        .replace('#include \u003clights_fragment_end>', `#include \u003clights_fragment_end>\r\n  {\r\n    float rim = pow(1.0 - abs(dot(normalize(normal), normalize(vViewPosition))), 2.6);\r\n    vec3 amb = reflectedLight.indirectDiffuse/max(diffuseColor.rgb, vec3(0.05)) + reflectedLight.directDiffuse/max(diffuseColor.rgb, vec3(0.05));\r\n    reflectedLight.indirectSpecular += rim*amb*0.55*(1.0 - 0.85*vBurn.x);\r\n  }`);\r\n    };\r\n    mat.customProgramCacheKey = () => 'snake_gi_rim_burn';\r\n  }\r\n  const eye_mat = new THREE.MeshStandardMaterial({ color: 0x0b0a08, roughness: 0.08, metalness: 0.0 });\r\n  const eye_geo = new THREE.SphereGeometry(1, 8, 6);\r\n  const egg = cave.egg.position;\r\n  const S = [];\r\n\r\n  // one tube geometry per snake, rewritten each frame\r\n  const make_mesh = () => {\r\n    const n = RINGS*SIDES + 2;\r\n    const g = new THREE.BufferGeometry();\r\n    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3), 3));\r\n    g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(n*3), 3));\r\n    const uv = new Float32Array(n*2);\r\n    for (let i = 0; i \u003c RINGS; i++) for (let j = 0; j \u003c SIDES; j++) { const o = (i*SIDES + j)*2; uv[o] = j/SIDES; uv[o + 1] = S_AT(i)*4; }\r\n    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));\r\n    g.setAttribute('aBurn', new THREE.BufferAttribute(new Float32Array(n*3), 3));\r\n    const idx = [];\r\n    for (let i = 0; i \u003c RINGS - 1; i++) for (let j = 0; j \u003c SIDES; j++) {\r\n      const a = i*SIDES + j, b = i*SIDES + (j + 1)%SIDES, c = (i + 1)*SIDES + (j + 1)%SIDES, d = (i + 1)*SIDES + j;\r\n      idx.push(a, d, c, a, c, b);\r\n    }\r\n    const tip = RINGS*SIDES, end = tip + 1;\r\n    for (let j = 0; j \u003c SIDES; j++) { idx.push(tip, (j + 1)%SIDES, j); idx.push(end, (RINGS - 1)*SIDES + j, (RINGS - 1)*SIDES + (j + 1)%SIDES); }\r\n    g.setIndex(idx);\r\n    const m = new THREE.Mesh(g, mat);\r\n    m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;\r\n    R.world_scene.add(m);\r\n    const eyes = [0, 1].map(() => { const e = new THREE.Mesh(eye_geo, eye_mat); e.castShadow = false; R.world_scene.add(e); return e; });\r\n    const spine = [], radii = new Float32Array(RINGS);\r\n    for (let i = 0; i \u003c RINGS; i++) spine.push(new THREE.Vector3());\r\n    return { m, eyes, spine, radii };\r\n  };\r\n\r\n  const spawn = (s, delay) => {\r\n    let th;\r\n    do th = rng.float(0, Math.PI*2); while (Math.abs(Math.atan2(Math.sin(th + Math.PI/2), Math.cos(th + Math.PI/2))) \u003c 0.5);\r\n    const r = rng.float(14.0, 15.8);\r\n    s.x = Math.cos(th)*r; s.z = Math.sin(th)*r;\r\n    s.dir = Math.atan2(-s.z, -s.x) + rng.spread(0.3);\r\n    s.phase = rng.float(0, 6.28); s.speed = rng.float(1.0, 1.35);\r\n    s.wave = rng.float(0.95, 1.2);                               // wavelength of the S, metres\r\n    s.amp = rng.float(0.55, 0.75);                                // heading swing, radians\r\n    s.trail = [];\r\n    for (let i = 0; i \u003c 400; i++) s.trail.push([s.x - Math.cos(s.dir)*i*0.01, s.z - Math.sin(s.dir)*i*0.01]);\r\n    s.dying = -1; s.delay = delay; s.scale = 1; s.dist = 0;\r\n    s.burn = null; s.sag = 0; s.sink = -1; s.burnt = false;\r\n    s.fx = null; s.leak = 0; s.claim = null;\r\n    s.m.geometry.attributes.aBurn.array.fill(0); s.m.geometry.attributes.aBurn.needsUpdate = true;\r\n  };\r\n  for (let i = 0; i \u003c count; i++) { const s = make_mesh(); spawn(s, i*1.6); S.push(s); }\r\n  // gone (burst, shattered, dissolved, ...): out of sight until it comes back out of the dark\r\n  const respawn = (s) => spawn(s, rng.float(RESPAWN[0], RESPAWN[1]));\r\n  let reached = 0;\r\n  const reach_log = [];               // tests: what each one that got through was doing\r\n\r\n  const P = [], T = new THREE.Vector3(), Nn = new THREE.Vector3(), Bn = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);\r\n  const RK = new Float32Array(RINGS), GL = new Float32Array(RINGS), SH = [0, 0, 0];\r\n  for (let i = 0; i \u003c RINGS; i++) P.push(new THREE.Vector3());\r\n\r\n  function update(t, dt) {\r\n    uSnakeT.value = t;\r\n    for (const s of S) {\r\n      if (s.delay > 0) { s.delay -= dt; s.m.visible = false; s.eyes.forEach(e => (e.visible = false)); continue; }\r\n      const hide = !!(s.fx && s.fx.hide);\r\n      s.m.visible = !hide; s.eyes.forEach(e => (e.visible = !hide));\r\n      if (s.sink >= 0) {\r\n        // the black corpse goes into the ground\r\n        s.sink += dt;\r\n        if (s.sink > SINK_T) { respawn(s); continue; }\r\n      } else if (s.burn) {\r\n        // on fire: it stops where it is; its neck sinks to the ground as it dies\r\n        s.sag = Math.min(1, s.sag + dt/1.6);\r\n        if (s.burn.done) { s.burn = null; s.burnt = true; s.sink = 0; build(s); fire.ash(s.spine, RINGS); }\r\n      } else if (s.dying >= 0) {\r\n        s.dying += dt;\r\n        s.scale = clamp(1 - s.dying/0.5, 0, 1);\r\n        if (s.dying > 0.5) respawn(s);\r\n      } else if (s.fx) {\r\n        // another power has it (lifted, blown, cut, pierced): that power moves it\r\n        const r = s.fx.tick ? s.fx.tick(dt, s) : undefined;\r\n        if (r === 'done') { respawn(s); continue; }\r\n        if (r === 'free') s.fx = null;\r\n      } else {\r\n        // serpentine: steer at the egg, swinging the heading so the path is a steady S; a\r\n        // dissolving snake (leakage) slows as it goes\r\n        const sp = s.speed*(1 - 0.85*smoothstep(0, 0.8, s.leak));\r\n        s.dist += sp*dt;\r\n        const want = Math.atan2(egg.z - s.z, egg.x - s.x) + Math.sin(s.dist/s.wave*Math.PI*2 + s.phase)*s.amp;\r\n        let d = want - s.dir; d = Math.atan2(Math.sin(d), Math.cos(d));\r\n        s.dir += clamp(d, -5*dt, 5*dt);\r\n        s.x += Math.cos(s.dir)*sp*dt; s.z += Math.sin(s.dir)*sp*dt;\r\n        const last = s.trail[0];\r\n        if (Math.hypot(s.x - last[0], s.z - last[1]) > 0.01) s.trail.unshift([s.x, s.z]);\r\n        if (s.trail.length > 600) s.trail.length = 600;\r\n        if (Math.hypot(s.x - egg.x, s.z - egg.z) \u003c 1.1) { s.dying = 0; reached++; reach_log.push({ t: +t.toFixed(2), claim: s.claim, until: s.claim_until, leak: +s.leak.toFixed(2), speed: s.speed }); }   // it reached the egg (placeholder: it shrinks away)\r\n      }\r\n      if (s.leak >= 1.12 && !s.burn && s.sink \u003c 0) { respawn(s); continue; }   // dissolved into nothing\r\n      build(s);\r\n    }\r\n  }\r\n\r\n  // the spine: points along the trail by arc length, the front raised into a neck curve\r\n  function build(s) {\r\n    let acc = 0, ti = 0;\r\n    const sc = s.scale, fx = s.fx;\r\n    // per ring: radius factor (cuts, dissolving, swelling) and prismatic glow\r\n    const f = s.leak*1.12;\r\n    for (let i = 0; i \u003c RINGS; i++) {\r\n      const u = (RINGS - 1 - i)/(RINGS - 1);                     // 0 at the tail: it dissolves tail first\r\n      RK[i] = s.leak > 0 ? smoothstep(f, f + 0.12, u) : 1;\r\n      GL[i] = s.leak > 0 ? Math.max(s.leak*0.45, Math.exp(-(((u - f)/0.07)**2))) : 0;\r\n      if (fx) { if (fx.radk) RK[i] *= fx.radk(i); if (fx.glow) GL[i] = Math.max(GL[i], fx.glow(i)); }\r\n    }\r\n    for (let i = 0; i \u003c RINGS; i++) {\r\n      const target = S_AT(i);\r\n      let x = s.trail[s.trail.length - 1][0], z = s.trail[s.trail.length - 1][1];\r\n      while (ti \u003c s.trail.length - 1) {\r\n        const a = s.trail[ti], b = s.trail[ti + 1];\r\n        const l = Math.hypot(b[0] - a[0], b[1] - a[1]);\r\n        if (acc + l >= target) { const f = (target - acc)/(l || 1); x = a[0] + (b[0] - a[0])*f; z = a[1] + (b[1] - a[1])*f; break; }\r\n        acc += l; ti++;\r\n      }\r\n      const r = R0*radius_at(target)*sc*RK[i];\r\n      // the neck lifts the head: a smooth rise over the front RAISE_LEN metres (it sinks as a\r\n      // burning snake dies); a sinking corpse goes down through the floor; other powers lift\r\n      // and shift it\r\n      let lift = RAISE*smoothstep(RAISE_LEN, 0.05, target)*sc*(1 - smoothstep(0, 1, s.sag));\r\n      SH[0] = SH[1] = SH[2] = 0;\r\n      if (fx) { if (fx.sag !== undefined) lift *= 1 - fx.sag; if (fx.lift) lift += fx.lift(i); if (fx.shift) fx.shift(i, SH); }\r\n      P[i].set(x + SH[0], cave.ground_y(x, z) + R0*radius_at(target)*sc*flat_at(target) + lift + SH[1] - sink_depth(s), z + SH[2]);\r\n      s.spine[i].copy(P[i]); s.radii[i] = r;\r\n    }\r\n    // how burnt each ring is, how its cracks glow, how it glows with prismatic light\r\n    const glowing = s.leak > 0 || (fx && fx.glow);\r\n    const charred = s.burn || s.burnt || (fx && fx.char);\r\n    if (charred || glowing || s.fxw) {\r\n      const ab = s.m.geometry.attributes.aBurn, a = ab.array;\r\n      for (let i = 0; i \u003c RINGS; i++) {\r\n        let c = s.burn ? fire.char(s.burn, i) : s.burnt ? 1 : 0, e = s.burn ? fire.ember(s.burn, i) : 0;\r\n        if (fx && fx.char) { c = Math.max(c, fx.char(i)); e = Math.max(e, fx.ember ? fx.ember(i) : 0); }\r\n        for (let j = 0; j \u003c SIDES; j++) { const o = (i*SIDES + j)*3; a[o] = c; a[o + 1] = e; a[o + 2] = GL[i]; }\r\n      }\r\n      const tip = RINGS*SIDES*3, last = (RINGS - 1)*SIDES*3;\r\n      for (let k = 0; k \u003c 3; k++) { a[tip + k] = a[k]; a[tip + 3 + k] = a[last + k]; }\r\n      ab.needsUpdate = true;\r\n      s.fxw = charred || glowing;                                // wrote something: clear it once the effect ends\r\n    }\r\n    const pos = s.m.geometry.attributes.position.array, nor = s.m.geometry.attributes.normal.array;\r\n    for (let i = 0; i \u003c RINGS; i++) {\r\n      const a = P[Math.max(0, i - 1)], b = P[Math.min(RINGS - 1, i + 1)];\r\n      T.subVectors(a, b).normalize();                             // pointing toward the head\r\n      Bn.crossVectors(T, UP).normalize();                         // sideways\r\n      Nn.crossVectors(Bn, T).normalize();                         // up, square to the body\r\n      const target = S_AT(i);\r\n      const r = R0*radius_at(target)*sc*RK[i], fl = flat_at(target);\r\n      for (let j = 0; j \u003c SIDES; j++) {\r\n        const ang = j/SIDES*Math.PI*2;                            // 0 = belly, pi = back\r\n        const cx = Math.sin(ang), cy = -Math.cos(ang);\r\n        const fy = cy \u003c 0 ? fl*0.8 : fl;                          // a flatter belly\r\n        const o = (i*SIDES + j)*3;\r\n        pos[o] = P[i].x + Bn.x*cx*r + Nn.x*cy*r*fy;\r\n        pos[o + 1] = P[i].y + Bn.y*cx*r + Nn.y*cy*r*fy;\r\n        pos[o + 2] = P[i].z + Bn.z*cx*r + Nn.z*cy*r*fy;\r\n        const nx = Bn.x*cx + Nn.x*cy/fy, ny = Bn.y*cx + Nn.y*cy/fy, nz = Bn.z*cx + Nn.z*cy/fy;\r\n        const l = Math.hypot(nx, ny, nz) || 1;\r\n        nor[o] = nx/l; nor[o + 1] = ny/l; nor[o + 2] = nz/l;\r\n      }\r\n    }\r\n    // snout tip and tail tip\r\n    const tip = RINGS*SIDES*3, end = tip + 3;\r\n    T.subVectors(P[0], P[1]).normalize();\r\n    const tr = R0*0.25*sc*RK[0];\r\n    pos[tip] = P[0].x + T.x*tr; pos[tip + 1] = P[0].y + T.y*tr; pos[tip + 2] = P[0].z + T.z*tr;\r\n    nor[tip] = T.x; nor[tip + 1] = T.y; nor[tip + 2] = T.z;\r\n    pos[end] = P[RINGS - 1].x; pos[end + 1] = P[RINGS - 1].y; pos[end + 2] = P[RINGS - 1].z;\r\n    nor[end] = -T.x; nor[end + 1] = 0; nor[end + 2] = -T.z;\r\n    s.m.geometry.attributes.position.needsUpdate = true;\r\n    s.m.geometry.attributes.normal.needsUpdate = true;\r\n    // eyes: on the sides of the head, a little up, near the front of the widest part\r\n    const ei = Math.round(I_AT(0.055));\r\n    const a = P[Math.max(0, ei - 1)], b = P[ei + 1];\r\n    T.subVectors(a, b).normalize(); Bn.crossVectors(T, UP).normalize(); Nn.crossVectors(Bn, T).normalize();\r\n    const rr = R0*radius_at(0.055)*sc*RK[ei];\r\n    s.eyes.forEach((e, k) => {\r\n      const side = k ? 1 : -1;\r\n      e.position.copy(P[ei]).addScaledVector(Bn, side*rr*0.8).addScaledVector(Nn, rr*0.18);   // set into the side of the head\r\n      e.scale.setScalar(R0*0.12*sc*RK[ei]);\r\n    });\r\n  }\r\n  // set one on fire (the lich's attack): it stops, and burns from a point along its body\r\n  function ignite(s, at = Math.round(RINGS*rng.float(0.15, 0.75))) {\r\n    if (!free(s)) return false;\r\n    at = Math.max(0, Math.min(RINGS - 1, at));\r\n    s.burn = fire.start(RINGS, s.spine, s.radii, at);\r\n    return true;\r\n  }\r\n  // give it to another power (lift, wind, beam, lens): `fx` drives it from now on (see build())\r\n  function take(s, fx) { if (!free(s)) return false; s.fx = fx; return true; }\r\n  // out of the dark and crawling (a dissolving one still counts)\r\n  const free = s => s.delay \u003c= 0 && s.dying \u003c 0 && !s.burn && s.sink \u003c 0 && !s.fx;\r\n  const live = () => S.filter(free);\r\n  function set_ember(c) { uEmber.value.setRGB(c[0], c[1], c[2]); }\r\n  return { update, S, ignite, take, live, free, set_ember, respawn, RINGS, egg, reach_log, arc: S_AT, ring_at: I_AT, get reached() { return reached; } };\r\n}\r\n","game/soft_shadows.js":"// soft_shadows.js -- sun shadows whose softness grows with the distance to what casts them\n// (percentage-closer soft shadows), replacing three.js's PCF shadow filter.\n//\n// Owner, round 3: the light should come from further above, and \"the edges of the light circle\n// ... more soft\". The sun is a disc about half a degree across, so a shadow edge blurs by\n// (distance to the caster) x (the sun's angular size): the rim of a shaft 40 m up blurs the\n// pool's edge over tens of centimetres while a rock beside the pool stays crisp. For each\n// point: search the shadow map around it for casters, average their depth, turn the gap into a\n// penumbra width, then filter over that width. The shadow map is orthographic, so its depth is\n// linear: metres = depth x (far - near).\n//\n// Call install_soft_shadows(params) BEFORE any material compiles; the renderer must use\n// THREE.PCFShadowMap (this replaces that branch).\nimport * as THREE from 'three';\n\nexport const SOFT = { depth_range: 89, texel_m: 0.034, sun_angle: 0.0093, max_texels: 22 };\n\nexport function install_soft_shadows(p = {}) {\n  Object.assign(SOFT, p);\n  const chunk = THREE.ShaderChunk.shadowmap_pars_fragment;\n  const start = chunk.indexOf('#if defined( SHADOWMAP_TYPE_PCF )');\n  const end = chunk.indexOf('#elif defined( SHADOWMAP_TYPE_PCF_SOFT )');\n  if (start \u003c 0 || end \u003c 0) throw new Error('soft_shadows: shadow chunk changed shape');\n  const f = v => (Number.isInteger(v) ? v.toFixed(1) : String(v));\n  const pcss = `#if defined( SHADOWMAP_TYPE_PCF )\n\t\t\t// lich-survivors: percentage-closer soft shadows (soft_shadows.js)\n\t\t\tvec2 texel = vec2( 1.0 ) / shadowMapSize;\n\t\t\tfloat zr = shadowCoord.z;\n\t\t\tfloat bsum = 0.0, bn = 0.0;\n\t\t\tfor ( int i = 0; i \u003c 16; i ++ ) {\n\t\t\t\tfloat fi = float( i );\n\t\t\t\tfloat r = sqrt( ( fi + 0.5 ) / 16.0 ) * ${f(SOFT.max_texels)};\n\t\t\t\tvec2 o = vec2( cos( fi*2.39996 ), sin( fi*2.39996 ) )*r*texel;\n\t\t\t\tfloat bz = unpackRGBAToDepth( texture2D( shadowMap, shadowCoord.xy + o ) );\n\t\t\t\tif ( bz \u003c zr ) { bsum += bz; bn += 1.0; }\n\t\t\t}\n\t\t\tif ( bn \u003c 0.5 ) {\n\t\t\t\tshadow = 1.0;\n\t\t\t} else {\n\t\t\t\tfloat gap = ( zr - bsum/bn )*${f(SOFT.depth_range)};\n\t\t\t\tfloat pen = clamp( gap*${f(SOFT.sun_angle)}/${f(SOFT.texel_m)}*0.5, 0.75, ${f(SOFT.max_texels)} );\n\t\t\t\tfloat rot = fract( 52.9829189*fract( dot( gl_FragCoord.xy, vec2( 0.06711056, 0.00583715 ) ) ) )*6.2831853;\n\t\t\t\tfloat lit = 0.0;\n\t\t\t\tfor ( int i = 0; i \u003c 24; i ++ ) {\n\t\t\t\t\tfloat fi = float( i );\n\t\t\t\t\tfloat r = sqrt( ( fi + 0.5 ) / 24.0 )*pen;\n\t\t\t\t\tfloat a = fi*2.39996 + rot;\n\t\t\t\t\tlit += texture2DCompare( shadowMap, shadowCoord.xy + vec2( cos( a ), sin( a ) )*r*texel, zr );\n\t\t\t\t}\n\t\t\t\tshadow = lit/24.0;\n\t\t\t}\n\t\t`;\n  THREE.ShaderChunk.shadowmap_pars_fragment = chunk.slice(0, start) + pcss + chunk.slice(end);\n}\n","game/textures.js":"// textures.js -- every texture is generated here (canvas), no files.\r\n//\r\n// TEXEL DENSITY RULE (Sun Court, retro-shooter/STYLE.md): world surfaces use 32 texels per metre,\r\n// world-space UVs (cave.js projects every face onto its dominant axis), NearestMipmapNearest.\r\n// Tones are quantized into a few flat steps so surfaces read as painted pixels, never noise.\r\n//\r\n// Palette: the It Follows egg cover (/artifacts, it-follows-3.jpg) -- near-black cool rock,\r\n// brown-grey slabs whose edges catch warm bronze, a cream-yellow pool of light, a pale egg,\r\n// dark bronze snakes.\r\nimport * as THREE from 'three';\r\n\r\nexport const TEXELS_PER_METER = 32;\r\n\r\nexport function finish(canvas, { srgb = true, repeat = true, mips = true } = {}) {\r\n  const t = new THREE.CanvasTexture(canvas);\r\n  t.magFilter = THREE.NearestFilter;\r\n  t.minFilter = mips ? THREE.NearestMipmapNearestFilter : THREE.NearestFilter;\r\n  t.generateMipmaps = mips;\r\n  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;\r\n  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;\r\n  t.anisotropy = 1;\r\n  t.needsUpdate = true;\r\n  return t;\r\n}\r\n\r\nfunction painter(w, h) {\r\n  const c = document.createElement('canvas');\r\n  c.width = w; c.height = h;\r\n  const g = c.getContext('2d');\r\n  const img = g.createImageData(w, h);\r\n  const d = img.data;\r\n  const cl = v => (v \u003c 0 ? 0 : v > 255 ? 255 : v | 0);\r\n  return {\r\n    w, h,\r\n    set(x, y, rgb) {\r\n      x = ((x % w) + w) % w; y = ((y % h) + h) % h;\r\n      const i = (y*w + x)*4;\r\n      d[i] = cl(rgb[0]); d[i + 1] = cl(rgb[1]); d[i + 2] = cl(rgb[2]); d[i + 3] = 255;\r\n    },\r\n    get(x, y) {\r\n      x = ((x % w) + w) % w; y = ((y % h) + h) % h;\r\n      const i = (y*w + x)*4;\r\n      return [d[i], d[i + 1], d[i + 2]];\r\n    },\r\n    done(opts) { g.putImageData(img, 0, 0); return finish(c, opts); },\r\n  };\r\n}\r\n\r\nconst mix = (a, b, t) => [a[0] + (b[0] - a[0])*t, a[1] + (b[1] - a[1])*t, a[2] + (b[2] - a[2])*t];\r\nconst mul = (a, k) => [a[0]*k, a[1]*k, a[2]*k];\r\n\r\nfunction lattice_hash(ix, iy, seed) {\r\n  let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(seed | 0, 1442695041);\r\n  h = Math.imul(h ^ (h >>> 13), 1274126177);\r\n  h ^= h >>> 16;\r\n  return (h >>> 0)/4294967296;\r\n}\r\nfunction vnoise(x, y, px, py, seed) {\r\n  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;\r\n  const u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy);\r\n  const m = (a, p) => ((a % p) + p) % p;\r\n  const a = lattice_hash(m(ix, px), m(iy, py), seed), b = lattice_hash(m(ix + 1, px), m(iy, py), seed);\r\n  const c = lattice_hash(m(ix, px), m(iy + 1, py), seed), d = lattice_hash(m(ix + 1, px), m(iy + 1, py), seed);\r\n  return (a + (b - a)*u) + ((c + (d - c)*u) - (a + (b - a)*u))*v;\r\n}\r\n// tileable fbm over a w x h texture; cells = lattice cells across the width at octave 0\r\nfunction fbm(x, y, w, h, cells, seed, oct = 3) {\r\n  let s = 0, amp = 1, tot = 0, f = 1;\r\n  for (let o = 0; o \u003c oct; o++) {\r\n    const cx = cells*f, cy = Math.max(1, Math.round(cells*f*h/w));\r\n    s += amp*vnoise(x/w*cx, y/h*cy, cx, cy, seed + o*101);\r\n    tot += amp; amp *= 0.5; f *= 2;\r\n  }\r\n  return s/tot;\r\n}\r\n// tileable cellular (nearest point) noise: returns [d1, d2, cell id]\r\nfunction cells2(x, y, w, h, n, seed) {\r\n  const gx = x/w*n, gy = y/h*n;\r\n  const ix = Math.floor(gx), iy = Math.floor(gy);\r\n  let d1 = 9, d2 = 9, id = 0;\r\n  for (let j = -1; j \u003c= 1; j++) for (let i = -1; i \u003c= 1; i++) {\r\n    const cx = ix + i, cy = iy + j;\r\n    const wx = ((cx % n) + n) % n, wy = ((cy % n) + n) % n;\r\n    const px = cx + lattice_hash(wx, wy, seed), py = cy + lattice_hash(wx, wy, seed + 7);\r\n    const d = Math.hypot(gx - px, gy - py);\r\n    if (d \u003c d1) { d2 = d1; d1 = d; id = lattice_hash(wx, wy, seed + 13); } else if (d \u003c d2) d2 = d;\r\n  }\r\n  return [d1, d2, id];\r\n}\r\n\r\nexport const PAL = {\r\n  // albedo of real cave rock (the darkness comes from the light, round 2): ~0.12-0.35 linear\r\n  rock_hi: [168, 150, 126], rock: [136, 121, 103], rock_mid: [114, 102, 89], rock_lo: [90, 81, 72], rock_deep: [64, 58, 53],\r\n  bronze: [186, 146, 96],\r\n  floor_hi: [164, 142, 110], floor: [132, 114, 90], floor_lo: [104, 90, 74], floor_deep: [76, 67, 57],\r\n  egg_hi: [196, 186, 164], egg: [180, 168, 144], egg_lo: [156, 144, 118], egg_spot: [112, 94, 72],\r\n  bone: [236, 228, 212],\r\n  scale_hi: [104, 84, 56], scale: [62, 50, 36], scale_lo: [38, 31, 24], scale_belly: [120, 100, 70],\r\n};\r\n\r\n// Rock: broad chipped facets (cellular patches), each a flat tone, a pale chip edge where two\r\n// patches meet on the lit side -- the cover's palette-knife slabs, at 32 texels/m.\r\nexport function rock(seed = 11, S = 64) {\r\n  const P = painter(S, S);\r\n  const tones = [PAL.rock_deep, PAL.rock_lo, PAL.rock_mid, PAL.rock, PAL.rock_hi];\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const [d1, d2, id] = cells2(x + 0.5, y + 0.5, S, S, 5, seed);\r\n    const n = fbm(x, y, S, S, 4, seed + 3, 2);\r\n    let k = Math.floor(id*3.2 + n*1.6);               // 0..4 flat tone per patch\r\n    k = Math.max(0, Math.min(4, k));\r\n    let c = tones[k];\r\n    const edge = d2 - d1;\r\n    if (edge \u003c 0.07) c = tones[Math.max(0, k - 2)];    // dark crack between facets\r\n    else if (edge \u003c 0.13 && ((x + y) & 1) === 0 && id > 0.55) c = mix(tones[Math.min(4, k + 1)], PAL.bronze, 0.25);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n\r\n// Floor: packed grit and flat stones, darker, one or two tones per stone, gritty speckle.\r\nexport function floor(seed = 21, S = 64) {\r\n  const P = painter(S, S);\r\n  const tones = [PAL.floor_deep, PAL.floor_lo, PAL.floor, PAL.floor_hi];\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const [d1, d2, id] = cells2(x + 0.5, y + 0.5, S, S, 8, seed);\r\n    const n = fbm(x, y, S, S, 6, seed + 5, 3);\r\n    let k = Math.floor(n*2.4 + id*1.4);\r\n    k = Math.max(0, Math.min(3, k));\r\n    let c = tones[k];\r\n    if (d2 - d1 \u003c 0.08) c = PAL.floor_deep;\r\n    const grit = lattice_hash(x, y, seed + 99);\r\n    if (grit > 0.93) c = tones[Math.min(3, k + 1)];\r\n    else if (grit \u003c 0.06) c = PAL.floor_deep;\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n\r\n// Egg shell: pale cream, a few sparse brown speckles, slightly cooler toward one pole.\r\nexport function egg_shell(seed = 31, S = 64) {\r\n  const P = painter(S, S);\r\n  for (let y = 0; y \u003c S; y++) for (let x = 0; x \u003c S; x++) {\r\n    const n = fbm(x, y, S, S, 4, seed, 2);\r\n    let c = n > 0.62 ? PAL.egg_hi : n \u003c 0.4 ? PAL.egg_lo : PAL.egg;\r\n    const h = lattice_hash(x, y, seed + 17);\r\n    if (h > 0.985) c = PAL.egg_spot;\r\n    else if (h > 0.97) c = mix(PAL.egg_lo, PAL.egg_spot, 0.4);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done({ repeat: true });\r\n}\r\n\r\n// Snake: overlapping diamond scales along the body (u = around, v = along), a paler belly band,\r\n// dark seams. The texture wraps around one body segment.\r\nexport function scales(seed = 41, W = 32, H = 16) {\r\n  const P = painter(W, H);\r\n  for (let y = 0; y \u003c H; y++) for (let x = 0; x \u003c W; x++) {\r\n    const u = x/W, v = y/H;\r\n    const sx = (x + (Math.floor(y/4) % 2)*2) % 4, sy = y % 4;\r\n    const dia = Math.abs(sx - 1.5) + Math.abs(sy - 1.5);\r\n    let c = dia \u003c 1.2 ? PAL.scale_hi : dia \u003c 2.2 ? PAL.scale : PAL.scale_lo;\r\n    const belly = Math.abs(u - 0.75) \u003c 0.12;\r\n    if (belly) c = (y % 3 === 0) ? PAL.scale_lo : PAL.scale_belly;\r\n    if (lattice_hash(x, y, seed) > 0.9 && !belly) c = mul(c, 0.8);\r\n    P.set(x, y, c);\r\n  }\r\n  return P.done();\r\n}\r\n","game/util.js":"// util.js -- seeded rng, math helpers, springs, and the collision / raycast geometry that\r\n// player, enemy and weapon all share. Pure functions over plain numbers; no three.js here.\r\n//\r\n// COLLIDER FORMAT (what room.js exports as room.colliders):\r\n//   { x0, y0, z0, x1, y1, z1 }                  solid axis-aligned box, x0\u003cx1 etc (use box())\r\n//   { ..., ramp: '+x'|'-x'|'+z'|'-z' }           wedge inside that box whose top rises from y0 at\r\n//                                                 the low edge to y1 at the edge named by `ramp`\r\n//                                                 (use ramp()); walkable, blocks from the sides\r\n//   optional flags: no_ray (bullets pass), no_walk (bodies pass), no_floor (never chosen as a\r\n//                   spawn/teleport floor or nav surface: lids, clip ceilings), color (hex, used for\r\n//                   impact debris), tag (any string)\r\n// Bodies (player, enemy) are vertical capsules: feet at y, radius r, height h.\r\n\r\nexport const DT = 1 / 60;\r\nexport const DEG = Math.PI / 180;\r\n\r\n// ---------------------------------------------------------------- rng\r\nfunction splitmix(seed) {\r\n  let s = seed >>> 0;\r\n  return () => {\r\n    s = (s + 0x9e3779b9) >>> 0;\r\n    let z = s;\r\n    z = Math.imul(z ^ (z >>> 16), 0x85ebca6b);\r\n    z = Math.imul(z ^ (z >>> 13), 0xc2b2ae35);\r\n    return (z ^ (z >>> 16)) >>> 0;\r\n  };\r\n}\r\n\r\nexport function hash_str(str) {\r\n  let h = 2166136261 >>> 0;\r\n  for (let i = 0; i \u003c str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);\r\n  return h >>> 0;\r\n}\r\n\r\n// sfc32 seeded through splitmix32. rng.next() in [0,1).\r\nexport function make_rng(seed = 1) {\r\n  const sm = splitmix(seed);\r\n  let a = sm(), b = sm(), c = sm(), d = sm();\r\n  const next = () => {\r\n    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;\r\n    let t = (a + b) | 0;\r\n    a = b ^ (b >>> 9);\r\n    b = (c + (c \u003c\u003c 3)) | 0;\r\n    c = (c \u003c\u003c 21) | (c >>> 11);\r\n    d = (d + 1) | 0;\r\n    t = (t + d) | 0;\r\n    c = (c + t) | 0;\r\n    return (t >>> 0) / 4294967296;\r\n  };\r\n  for (let i = 0; i \u003c 12; i++) next();\r\n  const rng = {\r\n    seed,\r\n    next,\r\n    float: (lo = 0, hi = 1) => lo + (hi - lo)*next(),\r\n    int: (lo, hi) => lo + Math.floor(next()*(hi - lo + 1)),     // inclusive\r\n    chance: p => next() \u003c p,\r\n    sign: () => (next() \u
